apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-spire-bootstrap
  annotations:
    # SLAAT-P2-3 (Forge review finding): this card's F1 fix edits the Job's
    # pod template (the embedded bao write command), which is an immutable
    # field once the Job exists. Without `force`, Flux's apply fails with
    # "field is immutable" on any cluster where this Job already ran — and
    # because inf-bao/infra-configs is `wait: true`, that failure blocks
    # every Kustomization that depends on it (agent-trust, apps, olly,
    # agent-swarm). Matches the sibling annotation already present on
    # openbao-supercred-bootstrap.yaml and openbao-fleet-bootstrap.yaml.
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.1.1
          env:
            - name: BAO_ADDR
              value: http://openbao.inf-bao.svc.cluster.local:8200
            - name: BAO_TOKEN
              value: signalloom-demo-root-token
          command:
            - sh
            - -ec
            - |
              until bao status >/dev/null 2>&1; do sleep 2; done
              bao secrets enable -path=kv kv-v2 || true
              cat >/tmp/policy.hcl <<'POLICY'
              path "kv/data/signalloom/fe-signalloom" { capabilities = ["read"] }
              POLICY
              bao policy write signalloom-fe-signalloom /tmp/policy.hcl
              bao auth enable jwt || true
              bao write auth/jwt/config jwks_url="http://spire-oidc.inf-bao.svc.cluster.local:8008/keys" || true
              # SLAAT-P1-3-F1 (CRITICAL, fixed by SLAAT-P2-3): this role
              # previously declared no token_ttl/token_max_ttl, so it
              # inherited the auth/jwt mount's default_lease_ttl=768h — a
              # captured token stayed valid for 32 days against the
              # mission's 5-minute hard cap. token_type=batch matches the
              # non-renewable pattern used by agent-trust-planner/triage.
              bao write auth/jwt/role/signalloom-fe-signalloom \
                role_type=jwt bound_audiences=openbao \
                bound_subject=spiffe://signalloom.demo/ns/fe-signalloom/sa/fe-signalloom \
                user_claim=sub policies=signalloom-fe-signalloom \
                token_ttl=5m token_max_ttl=5m token_type=batch
              bao kv put kv/signalloom/fe-signalloom value=non-production-demo-secret
