apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kagent-compliance-checker
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: kagent-compliance-checker
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/agent: "true"
    signalloom.ai/role: compliance
    signalloom.ai/harness: kagent
spec:
  description: Audits cluster policies and CIS compliance benchmarks
  type: Declarative
  declarative:
    modelConfig: anthropic-claude
    runtime: go
    systemMessage: "You are a compliance auditor. Verify Kyverno policies and CIS benchmarks."
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames:
            - compliance_check_policies
            - compliance_audit_cis
