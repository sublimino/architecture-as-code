# FLUX ENVSUBST: NO — no postBuild on the Flux Kustomization that reconciles
# this directory. Flux does NOT run envsubst here.
#
# SPIRE registration entries for the agent swarm. Uses the k8s workload
# attestor's pod-label selector so any pod in fe-signalloom-agents with
# `signalloom.ai/agent: "true"` automatically receives a SPIFFE SVID
# scoped to its service account.
#
# ── This Job had never run. Four compounding defects, all fixed here. ──────
#
# It was authored to invoke the spire-server binary directly, inside its own
# pod, against a socket it mounted from the node. Every part of that was wrong:
#
#   1. `command: ["/bin/sh", "-c"]` on ghcr.io/spiffe/spire-server:1.11.1. That
#      image is DISTROLESS — there is no /bin/sh, so the container could not
#      start at all: "exec: \"/bin/sh\": stat /bin/sh: no such file or
#      directory". Nothing downstream of this ever executed.
#   2. `-registrationUDSPath` is a REMOVED spire-server flag.
#   3. It pointed that flag at /run/spire/sockets, mounted by hostPath. That is
#      the AGENT's socket directory (agent.sock, the Workload API). The server's
#      admin socket lives INSIDE the spire-server pod at
#      /tmp/spire-server/private/api.sock and is not on the node at all, so no
#      mount from here could ever have reached it.
#   4. `2>/dev/null || echo "  (entry may already exist, continuing)"` swallowed
#      every error. A container that cannot start printed nothing, but had it
#      started, a total failure would have printed reassurance and exited 0.
#
# The fix uses the mechanism this repo already has for talking to spire-server:
# `kubectl exec` into the Deployment from a kubectl image, exactly as
# scripts/lib/spire-trust-anchor.sh and the spire-openbao-sync CronJob do. That
# reaches the DEFAULT admin socket with no flag and no volume.
#
# ── The RBAC is NOT in this file. Do not move it here. ─────────────────────
#
# The ServiceAccount, Role and RoleBinding live in the `signalloom-spire-rbac`
# ResourceSet (d2-osramp-fleet/tenants/local/signalloom.yaml). This slice
# reconciles as the namespace-scoped `flux` ServiceAccount, which lacks
# `escalate` on roles, and kustomize-controller server-dry-runs the entire
# object set before applying any of it — so a RoleBinding whose Role is created
# in the same set fails its roleRef lookup and deadlocks the WHOLE slice. That
# is not hypothetical; it is what froze inf-bao. See the long comment in
# spire-openbao-sync-cronjob.yaml, and d2-signalloom/test/
# spire-openbao-sync-rbac-placement.bats which fails if it is moved back.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-swarm-entries-config
data:
  register-entries.sh: |
    #!/usr/bin/env bash
    # Register one SPIRE entry per agent service account, then PROVE they exist.
    #
    # errexit is the point: this Job's predecessor swallowed every error and
    # reported success. Anything unexpected here must fail the Job so Flux's
    # health check goes red, rather than leaving the swarm without identities
    # while the Kustomization reports Ready.
    set -euo pipefail

    NAMESPACE="${NAMESPACE:-inf-bao}"
    TRUST_DOMAIN="${TRUST_DOMAIN:-signalloom.demo}"
    AGENT_NAMESPACE="${AGENT_NAMESPACE:-fe-signalloom-agents}"
    # Workload entries are parented to the node alias the agent attests as, NOT
    # to a join_token prefix. scripts/demo-lifecycle.sh registers the
    # fe-signalloom identity against exactly this parent; a mismatch produces
    # entries that exist and are never issued to anything.
    PARENT_ID="${PARENT_ID:-spiffe://${TRUST_DOMAIN}/agent/kind}"

    AGENTS=(
      prompt-commit-summarizer
      triage-ci-worker
      zulip-chat-agent
      cpai-engineer
      hosted-daytona-coder
      swarm-governor
      prod-deploy-gate
      agent-cardvault
      nono-containment-probe
      signalloom-stun-sentinel
      kagent-k8s-reader
      kagent-commit-summariser
      kagent-security-analyst
      kagent-network-auditor
      kagent-incident-responder
      kagent-compliance-checker
      kagent-finops-optimizer
      kagent-chaos-prober
      agent-nono-evidenced
      agent-standard-baseline
    )

    # One derivation of the server call, so nothing below can disagree about
    # which socket or which pod it means. No -registrationUDSPath: exec'ing into
    # the server pod reaches SPIRE's default admin socket, and setting the flag
    # explicitly is what broke every CLI call in this repo once already.
    spire() {
      kubectl -n "$NAMESPACE" exec deployment/spire-server -- \
        /opt/spire/bin/spire-server "$@"
    }

    spiffe_id_for() { printf 'spiffe://%s/ns/%s/sa/%s' "$TRUST_DOMAIN" "$AGENT_NAMESPACE" "$1"; }

    echo "--- Waiting for spire-server to be available ---"
    kubectl -n "$NAMESPACE" wait --for=condition=available \
      deployment/spire-server --timeout=300s

    for sa in "${AGENTS[@]}"; do
      id="$(spiffe_id_for "$sa")"
      # Idempotent by construction: `entry create` on a duplicate is an error,
      # and this Job is re-run on every reconcile. Read into a variable rather
      # than piping into `grep -q` — under pipefail an early match makes grep
      # exit on SIGPIPE and the condition inverts non-deterministically.
      existing="$(spire entry show -spiffeID "$id")"
      if grep -Fq "$id" <<<"$existing"; then
        echo "--- Already registered: ${id}"
        continue
      fi
      echo "--- Registering: ${id}"
      spire entry create \
        -spiffeID "$id" \
        -parentID "$PARENT_ID" \
        -selector "k8s:ns:${AGENT_NAMESPACE}" \
        -selector "k8s:sa:${sa}" \
        -selector "k8s:pod-label:signalloom.ai/agent:true" \
        -dns "${sa}.${AGENT_NAMESPACE}.svc.cluster.local"
    done

    # ── Assert the OUTCOME, not the exit code ────────────────────────────────
    #
    # Every command above already fails the Job under errexit. This is a
    # different question: after all of them succeeded, are the entries actually
    # there? A Job that exits 0 having created nothing is precisely how this
    # file's predecessor read as working for as long as it did.
    echo "--- Verifying every entry is present ---"
    shown="$(spire entry show)"
    missing=()
    for sa in "${AGENTS[@]}"; do
      id="$(spiffe_id_for "$sa")"
      grep -Fq "$id" <<<"$shown" || missing+=("$id")
    done
    if ((${#missing[@]} > 0)); then
      printf 'FAILED: %d of %d swarm entries are absent after registration:\n' \
        "${#missing[@]}" "${#AGENTS[@]}" >&2
      printf '  %s\n' "${missing[@]}" >&2
      printf 'The agent swarm has no SPIFFE identities; every SVID fetch will fail.\n' >&2
      exit 1
    fi
    printf 'OK: all %d swarm entries present.\n' "${#AGENTS[@]}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spire-agent-swarm-entries-setup
  labels:
    app.kubernetes.io/name: spire-agent-swarm-entries
    app.kubernetes.io/part-of: signalloom-bao-proof
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-agent-swarm-entries
    spec:
      # Declared by the signalloom-spire-rbac ResourceSet, not by this slice.
      serviceAccountName: spire-agent-swarm-entries
      restartPolicy: Never
      containers:
        - name: register
          # kubectl, not the spire-server image: the server binary is reached by
          # exec'ing into its pod. The spire-server image is distroless and
          # cannot run a shell script at all.
          #
          # bitnamiLEGACY, not bitnami. Bitnami removed the versioned tags from
          # docker.io/bitnami in 2025 and relocated them, so `bitnami/kubectl:1.31`
          # now resolves to NotFound — not a network error, the tag is simply
          # gone. Same image content, relocated repository.
          #
          # registry.k8s.io/kubectl was the obvious vendor-neutral alternative
          # and is WRONG here: it is distroless, so `command: ["bash", ...]`
          # dies with `exec: "sh": executable file not found in $PATH` — the
          # exact defect this file exists to fix, reintroduced. Verified both by
          # running them: bitnamilegacy gives SH_OK/BASH_OK/v1.31.4,
          # registry.k8s.io gives StartError. Any replacement image must be
          # checked for a shell before it is pinned here.
          image: docker.io/bitnamilegacy/kubectl:1.31
          command: ["bash", "/scripts/register-entries.sh"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: register-script
              mountPath: /scripts/register-entries.sh
              subPath: register-entries.sh
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: register-script
          configMap:
            name: spire-agent-swarm-entries-config
            defaultMode: 0755
