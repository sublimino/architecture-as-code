# Agent inventory namespace and cross-namespace RBAC.
#
# Deployed by signalloom-infra (runs BEFORE signalloom-apps) so the namespace
# and its Roles exist when the fe-signalloom apps kustomization applies. This
# avoids a Flux server-side dry-run deadlock where RoleBindings targeting
# fe-signalloom-agents fail validation because the namespace doesn't exist yet.
apiVersion: v1
kind: Namespace
metadata:
  name: fe-signalloom-agents
  labels:
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/purpose: agent-inventory
---
# Read + patch access for the fake-integration-proxy (inf-signalloom default SA)
# to discover and stun agents in the agent-inventory namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-inventory-reader
  namespace: fe-signalloom-agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fake-proxy-agent-inventory-reader
  namespace: fe-signalloom-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-inventory-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: inf-signalloom
