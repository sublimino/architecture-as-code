# FLUX ENVSUBST: YES — postBuild.substituteFrom is configured on the Flux
# Kustomization that reconciles this directory. Flux runs envsubst over all
# rendered manifests: use $${VAR} to pass a literal $ through to the container,
# and ${VAR} for values Flux should substitute from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - bao-spire-proof.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - api-service.yaml
  - dashboard-deployment.yaml
  - dashboard-service.yaml
  - gateway-route.yaml
  # Agent inventory: health-reader RBAC only (same namespace as targetNamespace).
  # The namespace, cross-namespace RBAC, and baseline agent are inline in the
  # signalloom-infra ResourceSet — they run first so Flux dry-run passes here.
  - health-rbac.yaml
  # SuperCred demo: cardvault-agent SA, inert agent pod (deliberately non-compliant),
  # and the Job template for the credential-chain run.
  - agents-cardvault-sa.yaml
  - agents-cardvault.yaml
  - agents-cardvault-job.yaml
  # Network Tests: ServiceAccount for the netassert-run Job. The Job itself is
  # NOT a static manifest here — fake-integration-proxy creates/deletes it on
  # demand (POST /network-tests/scan) so "Scan Now" triggers a run right now,
  # not on the next GitOps reconcile. Only the fixed inputs it needs (identity
  # + test config) are GitOps-managed.
  - netassert-runner-sa.yaml

configMapGenerator:
  # netassert-signalloom.yaml here is a committed copy of
  # d2-signalloom/test/netassert-signalloom.yaml — kustomize's load
  # restrictor refuses configMapGenerator files: sources outside the
  # kustomization root, so the source-of-truth file can't be referenced
  # directly. d2-signalloom/test/check-netassert-config-drift.sh (wired into
  # the netassert-config-drift Makefile target) keeps the two from silently
  # diverging, the same trade-off check-bootstrap-drift.sh already accepts
  # for the generated bootstrap SQL contract.
  #
  # disableNameSuffixHash keeps the ConfigMap name stable — the dynamically
  # created Job (not part of this kustomization) references it by fixed name
  # (NETASSERT_CONFIGMAP_NAME in fake-integration-proxy/server.py).
  - name: netassert-signalloom-config
    files:
      - netassert-signalloom.yaml
    options:
      disableNameSuffixHash: true
