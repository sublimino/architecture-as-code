apiVersion: apps/v1
kind: Deployment
metadata:
  name: osramp-multipurpose
spec:
  template:
    spec:
      containers:
      - name: listener
        image: ${IMAGE_BASE}/osramp/listener:${ARTIFACT_TAG}
        imagePullPolicy: IfNotPresent
      - name: processor
        image: ${IMAGE_BASE}/osramp/processor:${ARTIFACT_TAG}
        imagePullPolicy: IfNotPresent
