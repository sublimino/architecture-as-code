---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rbac-exporter-egress
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-rbac-exporter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: signalloom-rbac-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
      ports:
        - protocol: TCP
          port: 8000
