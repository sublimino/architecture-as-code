apiVersion: v1
kind: Secret
metadata:
  name: dex-local-auth
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
type: Opaque
stringData:
  config.yaml: |
    issuer: http://dex.inf-signalloom.svc.cluster.local:5556/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    enablePasswordDB: true
    staticClients:
      - id: signalloom-dashboard
        name: Signalloom Dashboard Local
        redirectURIs:
          - http://localhost:5173/callback
        secret: signalloom-dashboard-local-only
      - id: signalloom-api
        name: Signalloom Compatibility API Local
        secret: signalloom-api-local-only
        trustedPeers:
          - signalloom-dashboard
    staticPasswords:
      - email: demo-user@signalloom.local
        hash: $2y$10$2n.j1ndrN9e5UOO9mzQjXu2BXMFhbpr/9eTWHwjZuptjVPq7ZfpRu
        username: demo-user
        userID: demo-user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: signalloom-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsGroup: 1001
      volumes:
        - name: config
          secret:
            secretName: dex-local-auth
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
