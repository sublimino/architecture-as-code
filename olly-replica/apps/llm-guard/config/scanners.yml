# LLM Guard scanner config for the Estate 95 Security Sandbox.
#
# The lightweight set from the research-ai-red-teaming R&D (tuned thresholds
# kept verbatim), chosen so the pod fits a kind node's memory. Every ${VAR:def}
# carries a default so the config loads with a minimal env. Scanners run in the
# order listed.
#
# On the Olly -> Orbit A2A hop:
#   input_scanners  screen the message Olly is about to send to Orbit. Secrets +
#                   Anonymize catch credentials / PII that leaked from a log line
#                   into the proposal; PromptInjection catches an instruction an
#                   attacker planted in that log line trying to steer Orbit.
#   output_scanners screen Orbit's reply before Olly acts on it (Deanonymize
#                   restores redacted entities for a human; Sensitive re-checks
#                   for PII; MaliciousURLs / NoRefusal guard the response).
app:
  name: ${APP_NAME:LLM Guard API}
  log_level: ${LOG_LEVEL:INFO}
  log_json: ${LOG_JSON:false}
  scan_fail_fast: ${SCAN_FAIL_FAST:false}
  scan_prompt_timeout: ${SCAN_PROMPT_TIMEOUT:30}
  scan_output_timeout: ${SCAN_OUTPUT_TIMEOUT:30}
  lazy_load: ${LAZY_LOAD:true}

rate_limit:
  enabled: ${RATE_LIMIT_ENABLED:false}
  limit: ${RATE_LIMIT_LIMIT:100/minute}

auth:
  type: http_bearer
  token: ${AUTH_TOKEN:llm-guard-token}

tracing:
  exporter: ${TRACING_EXPORTER:console}

metrics:
  exporter: ${METRICS_TYPE:console}

input_scanners:
  - type: Anonymize
    params:
      use_faker: false
      threshold: 0.75
  - type: Gibberish
    params:
      threshold: 0.97
      model_max_length: 256
  - type: PromptInjection
    params:
      threshold: 0.92
      match_type: truncate_head_tail
      model_max_length: 256
  - type: Secrets
    params:
      redact_mode: "all"
  - type: Toxicity
    params:
      threshold: 0.9
      model_max_length: 256

output_scanners:
  - type: Deanonymize
    params:
      matching_strategy: "exact"
  - type: Gibberish
    params:
      threshold: 0.97
  - type: MaliciousURLs
    params:
      threshold: 0.75
  - type: NoRefusal
    params:
      threshold: 0.9
  - type: Sensitive
    params:
      redact: false
      threshold: 0.75
  - type: Toxicity
    params:
      threshold: 0.9
      model_max_length: 256
