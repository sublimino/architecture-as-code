---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-cardvault-openbao-config
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: agent-cardvault
    signalloom.ai/agent: "true"
    signalloom.ai/role: "vault"
data:
  agent.hcl: |
    vault {
      address = "http://openbao.inf-bao.svc.cluster.local:8200"
    }

    auto_auth {
      method "jwt" {
        config = {
          path   = "/run/spire/sockets/agent.sock"
          role   = "signalloom-agent-generic"
        }
      }

      sink "file" {
        config = {
          path = "/tmp/openbao-token"
        }
      }
    }

    template_config {
      exit_on_retry_failure = true
    }
