# FLUX ENVSUBST: FLEET — this is a fleet overlay, not a workload kustomization.
# Flux processes this via the tenants Kustomization with postBuild.substituteFrom.
# GHCR mode: artifacts are pulled from GitHub Container Registry and verified
# against the cosign keyless OIDC identity of the publishing workflow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
