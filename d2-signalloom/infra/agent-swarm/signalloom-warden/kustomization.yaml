#
# The canonical warden base. Consume this directory directly (Flux
# Kustomization agent-signalloom-warden does), or build an overlay on it
# — see ../signalloom-warden-overlays/ for the two kind clusters, which
# differ only in the image tag they retag to. An overlay cannot live inside
# this directory: kustomize refuses a root that contains a visited root.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` field, deliberately: this tree spans TWO namespaces and every
# file states its own. The warden (DaemonSet, ConfigMap, ServiceAccount, Role,
# RoleBinding, captures NetworkPolicy) is in inf-signalloom-warden. The RBAC
# exporter stays in fe-signalloom-agents, because every contract it has names
# that namespace: the signalloom-rbac-exporter ClusterRoleBinding subject in
# the fleet ResourceSet, fe-signalloom's allow-rbac-exporter-ingress
# NetworkPolicy, and the key Secret scripts/afm-importer-key.sh writes. A
# namespace transformer here (or a Flux targetNamespace) would move it away
# from all three. test/afm-rbac-exporter-manifests.bats pins both halves.
#
# No Namespace object here. On kind-osramp this tree is reconciled by the
# TENANT ServiceAccount agent-swarm-flux, which cannot patch cluster-scoped
# objects; the cluster-level ResourceSet owns inf-signalloom-warden. Overlays
# applied by hand add ../signalloom-warden-namespace.
resources:
  - service-account.yaml
  - rbac.yaml
  - configmap.yaml
  - daemonset.yaml
  - rbac-exporter-serviceaccount.yaml
  - rbac-exporter-cronjob.yaml
  - rbac-exporter-networkpolicy.yaml
  - networkpolicy-captures.yaml

configMapGenerator:
  - name: signalloom-rbac-exporter-script
    namespace: fe-signalloom-agents
    files:
      - rbac-exporter/export.py

# No `images:` block here, deliberately. An `images` entry with a newTag wins
# over the container's own tag, so declaring one at this level would put the
# version in two places and make daemonset.yaml's tag decorative — a
# mutation-proof run caught exactly that: changing the image to :latest in
# daemonset.yaml left the render unchanged. The tag lives in daemonset.yaml,
# once. Overlays override it with an `images:` entry of their own, which is
# where that transformer belongs.
