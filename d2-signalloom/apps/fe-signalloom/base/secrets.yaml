# Demo-only credentials. Production secrets and external credential providers are
# deliberately out of scope for this TRL 2 Kind baseline.
apiVersion: v1
kind: Secret
metadata:
  name: discovery-portal-database
type: Opaque
stringData:
  DATABASE_URL: postgresql://signalloom:signalloom@postgresql.inf-signalloom.svc.cluster.local:5432/signalloom
  POSTGRES_USER: signalloom
  POSTGRES_PASSWORD: signalloom
---
apiVersion: v1
kind: Secret
metadata:
  name: discovery-portal-storage
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: minio
  S3_SECRET_ACCESS_KEY: minio123
