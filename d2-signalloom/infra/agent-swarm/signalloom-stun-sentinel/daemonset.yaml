---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: stun-sentinel
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: stun-sentinel
    signalloom.ai/agent: "true"
    signalloom.ai/role: "sentinel"
    signalloom.ai/framework: "custom"
    signalloom.ai/harness: "go-ebpf"
    signalloom.ai/model: "deterministic"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: stun-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stun-sentinel
        signalloom.ai/agent: "true"
        signalloom.ai/role: "sentinel"
        signalloom.ai/framework: "custom"
        signalloom.ai/harness: "go-ebpf"
        signalloom.ai/model: "deterministic"
        signalloom.ai/tenant: "controlplane"
        signalloom.ai/project: "osramp"
    spec:
      serviceAccountName: stun-sentinel
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: sentinel
          image: stun-sentinel:latest
          imagePullPolicy: Never
          env:
            - name: WATCH_NAMESPACE
              value: "fe-signalloom-agents"
            - name: CGROUP_ROOT
              value: "/host-cgroup"
            - name: HEALTH_ADDR
              value: ":8081"
            - name: STUN_FREEZE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stun-sentinel-governance
                  key: freeze-token
                  optional: true
            - name: STUN_RESUME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stun-sentinel-governance
                  key: resume-token
                  optional: true
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            privileged: false
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                # open /proc/<pid>/ns/net of a cross-uid agent is a
                # PTRACE_MODE_READ check (network.go findHostVeth).
                - SYS_PTRACE
              drop:
                - ALL
          volumeMounts:
            - name: cgroup
              mountPath: /host-cgroup
              readOnly: false
          resources:
            limits:
              memory: 128Mi
              cpu: 200m
            requests:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
