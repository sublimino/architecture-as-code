# FLUX ENVSUBST: YES — postBuild.substituteFrom is configured on the Flux
# Kustomization that reconciles this directory. Flux runs envsubst over all
# rendered manifests: use $${VAR} to pass a literal $ through to the container,
# and ${VAR} for values Flux should substitute from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - bao-spire-proof.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - api-service.yaml
  - dashboard-deployment.yaml
  - dashboard-service.yaml
  - gateway-route.yaml
  # Agent inventory: health-reader RBAC only (same namespace as targetNamespace).
  # The namespace, cross-namespace RBAC, and baseline agent are inline in the
  # signalloom-infra ResourceSet — they run first so Flux dry-run passes here.
  - health-rbac.yaml
  # SuperCred demo: cardvault-agent ServiceAccount only.
  #
  # The agent POD is deliberately NOT here, for the same reason the
  # credential-chain Job is not: this Kustomization sets
  # `targetNamespace: fe-signalloom`, which OVERRIDES the `namespace:
  # fe-signalloom-agents` that agents-cardvault.yaml declares. Flux therefore
  # created a second agent-cardvault in fe-signalloom while
  # scripts/supercred-demo.sh:204 applied the same manifest into
  # fe-signalloom-agents — two live pods claiming one SPIFFE ID, visible as a
  # duplicate "Cardvault Agent" on the Agents page.
  #
  # Deleting the stray pod does not fix it: Flux owns that copy
  # (kustomize.toolkit.fluxcd.io/name: apps) and recreates it on the next
  # reconcile. The fix is to have exactly one creator, and it must be the demo
  # script, because only it can place the pod in the namespace the SPIFFE ID,
  # the SPIRE selectors and the OpenBao role all name.
  #
  # The SA stays: it is namespace-correct under targetNamespace and the demo
  # depends on it existing before step 1 runs.
  - agents-cardvault-sa.yaml
  # Network Tests: ServiceAccount for the netassert-run Job. The Job itself is
  # NOT a static manifest here — fake-integration-proxy creates/deletes it on
  # demand (POST /network-tests/scan) so "Scan Now" triggers a run right now,
  # not on the next GitOps reconcile. Only the fixed inputs it needs (identity
  # + test config) are GitOps-managed.
  - netassert-runner-sa.yaml
  # SuperCred demo runner: the workload that actually executes
  # scripts/supercred-demo.sh, so the dashboard can drive the demo from the
  # browser. It is a separate image and ServiceAccount on purpose — the
  # fe-signalloom API pod has no kubectl and no scripts/, and giving it either
  # would put cluster-mutating grants on the pod that serves every
  # tenant-facing route.
  #
  # Only the in-tenant objects are here. The cross-namespace RBAC is inline in
  # the signalloom-infra ResourceSet, because this Kustomization's
  # targetNamespace would otherwise relocate those Roles into fe-signalloom.
  - ../../supercred-demo-runner/base
  # Signal Fusion: ingest, correlation and query service. Same namespace as
  # fe-signalloom (via targetNamespace on the Flux Kustomization), so the proxy
  # can reach it at http://signal-ingest:8082 without cross-namespace wiring.
  - ../../signal-ingest/base
  # Fleet Manager: agent dependency DAG and cascade stun orchestrator, reached
  # by the dashboard at http://fleet-manager:8082 via nginx's /fleet-api/ proxy.
  #
  # This line is the whole reason the Fleet page worked or did not. The slice was
  # authored complete on 2026-08-04 — source, unit tests, a 22-test manifest
  # contract suite, and every manifest in apps/fleet-manager/base — and then
  # reached no cluster for two weeks, because nothing Flux reconciles ever named
  # that directory. The only deploy path was `make demo-signalloom-fleet-up`, a
  # `kubectl apply -k` escape hatch that no bring-up target and no CI stage
  # called. nginx resolved fleet-manager.fe-signalloom.svc.cluster.local, found
  # no Service, and answered /fleet-api/* with a raw nginx 502 page.
  #
  # Every test was green throughout, which is the part worth remembering: the
  # contract suite asserts manifest CONTENT, so it cannot distinguish a deployed
  # workload from a well-formed file. d2-signalloom/test/fleet-manager-live.bats
  # is the guard that can — it asks the running cluster.
  #
  # Only the in-tenant objects come from here. The cross-namespace RBAC (the
  # fe-signalloom-agents Role and its binding) is inline in the signalloom-infra
  # ResourceSet, for the same two reasons supercred-demo-runner's is: this
  # Kustomization's targetNamespace would relocate the Role into fe-signalloom,
  # and the namespace-scoped `flux` SA lacks `escalate`, so creating a
  # RoleBinding from here fails the server dry-run and aborts the whole set.
  - ../../fleet-manager/base

configMapGenerator:
  # netassert-signalloom.yaml here is a committed copy of
  # d2-signalloom/test/netassert-signalloom.yaml — kustomize's load
  # restrictor refuses configMapGenerator files: sources outside the
  # kustomization root, so the source-of-truth file can't be referenced
  # directly. d2-signalloom/test/check-netassert-config-drift.sh (wired into
  # the netassert-config-drift Makefile target) keeps the two from silently
  # diverging, the same trade-off check-bootstrap-drift.sh already accepts
  # for the generated bootstrap SQL contract.
  #
  # disableNameSuffixHash keeps the ConfigMap name stable — the dynamically
  # created Job (not part of this kustomization) references it by fixed name
  # (NETASSERT_CONFIGMAP_NAME in fake-integration-proxy/server.py).
  - name: netassert-signalloom-config
    files:
      - netassert-signalloom.yaml
    options:
      disableNameSuffixHash: true
