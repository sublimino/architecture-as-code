# FLUX ENVSUBST: YES — postBuild.substituteFrom is configured on the Flux
# Kustomization that reconciles this directory. Flux runs envsubst over all
# rendered manifests: use $${VAR} to pass a literal $ through to the container,
# and ${VAR} for values Flux should substitute from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: memcached-values.yaml
    target:
      kind: HelmRelease
      name: memcached
  - path: redis-values.yaml
    target:
      kind: HelmRelease
      name: redis
  - path: nats-values.yaml
    target:
      kind: HelmRelease
      name: nats
  - path: minio-values.yaml
    target:
      kind: Deployment
      name: minio
  - path: archivista-secret.yaml
    target:
      kind: Secret
      name: osramp-archivista
  - path: postgres-secret.yaml
    target:
      kind: Secret
      name: postgres
