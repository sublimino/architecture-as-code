apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster
spec:
  dnsNames:
    - "*.${CLUSTER_DOMAIN}"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-issuer
  secretName: cluster-tls
  usages:
    - digital signature
    - key encipherment
  secretTemplate:
    labels:
      reconcile.fluxcd.io/watch: Enabled
