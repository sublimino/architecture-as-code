apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-governor
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: "governor"
    signalloom.ai/harness: "go-a2a"
    signalloom.ai/model: "claude-sonnet-4"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarm-governor
  template:
    metadata:
      labels:
        app: swarm-governor
        signalloom.ai/agent: "true"
        signalloom.ai/role: "governor"
        signalloom.ai/harness: "go-a2a"
        signalloom.ai/model: "claude-sonnet-4"
        signalloom.ai/tenant: "controlplane"
        signalloom.ai/project: "osramp"
    spec:
      serviceAccountName: swarm-governor
      automountServiceAccountToken: false
      containers:
        - name: swarm-governor
          image: swarm-governor:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GOVERNOR_NAMESPACE
              value: fe-signalloom-agents
            - name: MAX_TOKEN_BUDGET
              value: "250000"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # OpenBao Agent sidecar — fetches secrets via SPIFFE JWT auth
        - name: openbao-agent
          image: openbao/openbao:2.1.0
          args:
            - agent
            - -config=/etc/openbao/agent.hcl
          env:
            - name: SPIFFE_ID
              value: "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/swarm-governor"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: bao-home
              mountPath: /home/openbao
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: openbao-agent-config
          configMap:
            name: swarm-governor-openbao-config
        - name: vault-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: bao-home
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
