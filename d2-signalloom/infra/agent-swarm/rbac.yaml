# ServiceAccounts for the ten demo agents in the agent swarm.
#
# Each agent type gets its own SA so SPIRE can issue a unique SPIFFE ID
# (spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/<name>) and
# OpenBao can scope secrets per identity via the glob-bound JWT role.
#
# Labels follow the signalloom.ai/ convention:
#   signalloom.ai/agent: "true"    — discovery selector
#   signalloom.ai/role: <role>     — agent's functional role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt-commit-summarizer
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: summarizer
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-ci-worker
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: ci-worker
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zulip-chat-agent
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: chat
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpai-engineer
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: engineer
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hosted-daytona-coder
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: coder
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarm-governor
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: governor
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-deploy-gate
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: deploy-gate
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-cardvault
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: cardvault
    app.kubernetes.io/part-of: signalloom-swarm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nono-containment-probe
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: containment
    app.kubernetes.io/part-of: signalloom-swarm
# The signalloom warden's SA is signalloom-warden, declared beside its DaemonSet in
# signalloom-warden/service-account.yaml. An SA here named
# signalloom-warden was used by no pod; see signalloom-warden-daemonset.bats.
---
# hosted-daytona-coder Role lives here, beside its ServiceAccount (the RoleBinding stays
# in hosted-daytona-coder/), for the same reason as the warden Role (970720b6): Flux dry-runs
# every object of a Kustomization before applying any, and the API server
# answers NotFound for a RoleBinding whose Role does not exist yet, so a
# Kustomization that ships both never applies on a fresh cluster. Base applies the
# Role first; the consumer Kustomization applies the RoleBinding after it
# (2026-10-03 zero-state rebuild: agent-hosted-daytona-coder stuck at
# "RoleBinding ... not found"). agent-swarm-base applies first.
# The workspace manager needs RBAC to create/delete pods in the agents
# namespace for provisioning devcontainer workspaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hosted-daytona-coder
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: hosted-daytona-coder
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: signalloom
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
