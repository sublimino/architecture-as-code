# signal-ingest inbound authentication.
#
# Two mechanisms, both behind api.ProtectedRouter, both optional, at least one
# required (main refuses to boot with neither):
#
# 1. Named static keys (SIGNAL_AUTH_STATIC_KEYS). One key per caller. Andy,
#    2026-10-02: "a bearer token with a long key is the simplest way … I
#    specifically don't want the SPIRE server to run in the remote signal
#    generating endpoint … we'll have to use a static key for now." So these
#    are TEMPORARY in intent and every key carries an expiry, at most 90 days
#    out (api.MaxStaticKeyLifetime, enforced by the binary); a key is WARNed
#    about 14 days before it lapses.
#    The list below is the NON-secret half: name, subject, tenant, exact
#    permissions. Each key's VALUE (a random 32-byte token) and its EXPIRY are
#    minted together by scripts/sldc-ingest-bearer.sh into Secret
#    signal-ingest-key-<name> (keys token, expires), with a consumer copy of
#    the value in the caller's namespace; --rotate renews both.
#    ../base/deployment.yaml projects them as /etc/signal-ingest/static-keys/
#    <name> and <name>.expires. A key value is never in this ConfigMap, env,
#    argv, git or a log; the key NAME is logged on every authentication.
#    A defect in this ConfigMap refuses startup; a missing, short, undated,
#    expired or over-long key in a Secret disables that key only (ERROR log)
#    and the others keep working.
#
# 2. JWT-SVIDs (OFF here). kind-osramp runs no SPIRE for callers, so
#    SIGNAL_AUTH_JWKS_FILE is not set and every JWT is refused with 401. To
#    enable it (the hub does, through scripts/bootstrap-spire-federation.sh),
#    sync the trust domain's jwt-svid keys into signal-ingest-jwks below and set
#    SIGNAL_AUTH_JWKS_FILE=/etc/signal-ingest/auth/jwks.json; the bindings below
#    then apply. An enabled JWKS with an empty key set refuses to boot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-ingest-jwt-auth
  labels:
    app.kubernetes.io/name: signal-ingest
    signalloom.io/card: SLDC-P2-2
data:
  SIGNAL_AUTH_AUDIENCE: signal-ingest
  SIGNAL_AUTH_TRUST_DOMAIN: osramp.local
  SIGNAL_AUTH_JWKS_REFRESH: 15m
  # Canonical tenant is "kusari" (phase pattern 1). Exact-match SPIFFE IDs,
  # no wildcards: signal-ingest bindings are a map keyed by the full subject.
  # Used only when a JWKS is enabled (see 2 above).
  SIGNAL_AUTH_BINDINGS: |
    {
      "spiffe://osramp.local/ns/fe-signalloom-agents/sa/stun-sentinel": {
        "tenant_id": "kusari",
        "permissions": ["observations:write"]
      },
      "spiffe://osramp.local/ns/fe-signalloom-agents/sa/kusari-agent": {
        "tenant_id": "kusari",
        "permissions": ["observations:write"]
      }
    }
  # One row per caller; least privilege, pinned row-for-row by
  # api.TestStaticKeysShippedGrantExactlyTheContract (shippedKeyGrants).
  # Subjects are deliberately not SPIFFE IDs: a static key must never be
  # mistaken for a verified SVID in an audit record.
  #   stun-sentinel  the eBPF correlator: POST /api/v1/observations only, for
  #                  whatever tenant the workload maps to (or __unattributed__),
  #                  hence tenant:cross-write.
  SIGNAL_AUTH_STATIC_KEYS: |
    [
      {"name": "stun-sentinel", "subject": "static-key/stun-sentinel",
       "tenant": "kusari", "permissions": ["observations:write", "tenant:cross-write"]}
    ]
  SIGNAL_AUTH_STATIC_KEYS_DIR: /etc/signal-ingest/static-keys
---
# Populated from the hub SPIRE server's federated osramp.local bundle, keys
# with use=jwt-svid only. Shipped with an empty key set; signal-ingest fails
# closed at boot until the bootstrap has synced real keys.
#
# ssa: IfNotPresent — Flux creates this ConfigMap once and never overwrites it.
# Without it every reconcile would put the empty key set back over the synced
# keys, and the next pod restart would refuse to boot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-ingest-jwks
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: signal-ingest
    signalloom.io/card: SLDC-P2-2
data:
  jwks.json: '{"keys":[]}'
