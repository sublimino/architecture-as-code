[pytest]
# There was no pytest config of any kind here before, so the suite ran serially:
# 583 passed, 83 skipped in 79.67s of wall clock for 7.9s of user CPU. Ninety
# percent of that was the suite asleep — the streaming and log-wait tests park on
# real timers, and the single slowest test is a deliberate 10s starvation probe.
# Serial execution paid for every one of those waits end to end.
testpaths = tests

# -n auto: measured 12/16/20/24 and `auto` on a 24-core box and the whole range
# lands between 13.5s and 16.1s — run-to-run noise is larger than the difference
# between any two of them, so the portable value wins over the locally optimal
# one. The floor is set by the 10s test, not by the worker count.
#
# --dist worksteal, NOT the loadfile default people reach for: durations here are
# wildly uneven (one 10s test, one 7.3s, then a long tail of sub-100ms), and
# keeping a file on one worker pins the whole of test_demo_runner_stream_sse.py —
# ~35s of serial timer waits — to a single process. Measured, same box, same run:
#
#   --dist loadfile   42.64s
#   --dist load       19.18s
#   --dist worksteal  13.19s
#
# Scattering individual tests across workers is safe here because it was checked
# rather than assumed: every one of the 43 test files was also run on its own,
# and the isolated pass counts sum to exactly the 583 the full suite reports, so
# no test depends on another having run first. The module-level state that would
# have made this dangerous — demo_runner._runs/_active/_open_log_streams, and
# api_compat._pool with its _pool_init_attempted latch — is already reset by
# autouse fixtures in each file that touches it, and xdist workers are separate
# processes so those globals are per-worker anyway.
#
# To run serially (debugging, or a single file where 16 interpreter startups cost
# more than they save): pytest -p no:xdist, or -n0.
addopts = -n auto --dist worksteal
