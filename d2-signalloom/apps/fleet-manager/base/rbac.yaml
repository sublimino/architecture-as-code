# Dedicated ServiceAccount for fleet-manager.
# The Deployment sets automountServiceAccountToken: true because the fleet-manager
# needs K8s API access to read/patch pod labels. RBAC is scoped to the minimum
# needed: get/list/patch pods in the agent namespace only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-manager
  namespace: fe-signalloom
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-manager-pod-reader
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-manager-pod-reader
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-manager-pod-reader
subjects:
  - kind: ServiceAccount
    name: fleet-manager
    # fe-signalloom, not default: the Deployment runs there, and a RoleBinding
    # naming a ServiceAccount that does not exist is LEGAL and SILENT. It binds
    # nothing, so every pod list/patch 403s -- which client-go surfaces as an
    # EMPTY result, not a permission error. The Fleet page would have rendered
    # an empty fleet with no reason given.
    namespace: fe-signalloom
