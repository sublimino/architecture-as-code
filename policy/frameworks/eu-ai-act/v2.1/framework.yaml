id: eu-ai-act
name: "EU AI Act: High-Risk AI System Requirements"
version: v2.1.0
controlSets:
- id: art9-risk-mgmt
  name: ART-9 Risk Management System
  controls:
  - id: ART-9.2
    name: ART-9(2) Risk Identification and Analysis
    checks:
    - id: container-run-as-non-root
      name: AI system container runs as non-root
      description: Ensures high-risk AI system workloads do not execute with root UID privileges.
      celExpression: object.spec.containers.all(c, c.securityContext.runAsNonRoot == true)
      severity: high
      remediation: Configure securityContext.runAsNonRoot to true in all container specifications.
      riskTriple:
        min: 10000
        mode: 50000
        max: 200000
      freqTriple:
        min: 0.5
        mode: 1.5
        max: 4
      policyVersions:
      - v1.0.0
      - v2.1.0

      name: AI system container runs as non-root
      description: Ensures high-risk AI system workloads do not execute with root UID privileges.
      celExpression: object.spec.containers.all(c, c.securityContext.runAsNonRoot == true)
      severity: high
      remediation: Configure securityContext.runAsNonRoot to true in all container specifications.
      riskTriple:
        min: 10000
        mode: 50000
        max: 200000
      freqTriple:
        min: 0.5
        mode: 1.5
        max: 4
      policyVersions:
      - v1.0.0
      - v2.1.0
    - id: no-privilege-escalation
      name: No privilege escalation in AI workloads
      description: Prohibits processes within AI workloads from gaining more privileges than their parent process.
      celExpression: object.spec.containers.all(c, c.securityContext.allowPrivilegeEscalation == false)
      severity: critical
      remediation: Set securityContext.allowPrivilegeEscalation to false in pod specifications.
      riskTriple:
        min: 10000
        mode: 60000
        max: 250000
      freqTriple:
