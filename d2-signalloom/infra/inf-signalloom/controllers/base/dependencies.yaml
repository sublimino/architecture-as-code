apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: bitnami-postgresql
spec:
  interval: 1h
  url: oci://registry-1.docker.io/bitnamicharts/postgresql
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: "18.8.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bitnami-postgresql
  install:
    remediation:
      retries: -1
  values:
    architecture: standalone
    auth:
      database: discovery_portal
      username: discovery_portal
    primary:
      persistence:
        enabled: true
        storageClass: "standard"
        size: 1Gi
      initdb:
        scriptsConfigMap: discovery-portal-bootstrap
---
apiVersion: source.toolkit.fluxcd.io/v1
