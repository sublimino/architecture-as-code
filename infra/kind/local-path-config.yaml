#
# infra/kind/local-path-config.yaml : ConfigMap configuring rancher.io/local-path
# provisioner with stable per-PVC subdirectories.
#
# The default local-path provisioner names directories pvc-<uid>_<ns>_<name>,
# which means a recreated PVC gets a new UUID and misses existing data on disk.
# Configuring pathPattern {{ .PVC.Namespace }}/{{ .PVC.Name }} gives PVCs
# stable, deterministic host directories under /var/local-path-provisioner,
# allowing local data to survive cluster deletion and recreation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
      "nodePathMap":[
        {
          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths":["/var/local-path-provisioner"]
        }
      ],
      "pathPattern": "{{ .PVC.Namespace }}/{{ .PVC.Name }}"
    }
