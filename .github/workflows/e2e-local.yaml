# The parity pipeline: CI runs the exact make targets a developer runs
# locally. A kind cluster hosts the zot registry, artifacts are pushed and
# cosign-signed, Flux reconciles the fleet from them, the app images are
# built and loaded, and the BATS suite runs against the result. Witness evidence
# remains a local workflow artifact.
name: e2e-local

# Manual only. The full stack (kube-prometheus-stack, ECK, Redpanda, a 3-node
# NATS, MinIO/PostgreSQL, and the apps) oversubscribes a standard 2-vCPU
# GitHub runner, so Prometheus and Redpanda land Pending and the reconcile
# times out. Run it on demand from the Actions tab (or `gh workflow run
# e2e-local.yaml`) on a machine with room, rather than gating every push.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and build the environment
        run: ./scripts/setup.sh
      - name: End-to-end tests (witness attested)
        run: make attested-test
      - name: Olly enrichment loop tests
        run: make olly-test
      - name: Promotion gate demo (witness policy)
        run: make promotion-demo
      - name: Retain local Witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-evidence
          path: docs/records/ci-evidence/local-witness/
          if-no-files-found: warn
      - name: Admission demo (Kyverno signature verification)
        run: make admission-demo
      - name: Trust revocation walkthrough
        run: make revocation-demo
      - name: Debug failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n flux-system get fluxinstance,resourceset,kustomization,ocirepository -o wide || true
          kubectl -n flux-system logs deploy/flux-operator --tail=50 || true
          kubectl -n flux-system logs deploy/source-controller --tail=50 || true
          kubectl -n frontend get pods -o wide || true
          kubectl -n olly-replica get pods,elasticsearch,helmrelease -o wide || true
          kubectl -n trivy-system get pods,helmrelease -o wide || true
          flux get all --all-namespaces || true
