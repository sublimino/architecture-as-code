# FLUX ENVSUBST: YES — this manifest is rendered by the Flux Kustomization
# that reconciles this directory (postBuild.substituteFrom is configured;
# see this directory's kustomization.yaml). Use ${VAR} for values Flux
# should substitute from flux-runtime-info, and $${VAR} to pass a literal $
# through untouched to the container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-signalloom
  labels:
    app.kubernetes.io/name: fe-signalloom
    bao.controlplane.io/consumer: fe-signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fe-signalloom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fe-signalloom
        bao.controlplane.io/consumer: fe-signalloom
    spec:
      serviceAccountName: fe-signalloom
      securityContext:
        runAsNonRoot: true
        # Group-owns the signal-ingest key volume (0440) for the portal's uid.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - until pg_isready -h postgresql.inf-signalloom.svc.cluster.local -p 5432 -U "$POSTGRES_USER"; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database-credentials
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: discovery-portal
          image: ${IMAGE_BASE}/signalloom/apps/fe-signalloom:${ARTIFACT_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SL_ENV
              value: demo
            # Node whose kubelet cAdvisor the telemetry poller scrapes (cadvisor_poller.py).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The poller hands a ~10 MB scrape to a worker thread every 5 s; glibc's
            # per-thread arenas turned that into RSS growth (131 → 224 MB in minutes,
            # 2026-10-03). One arena keeps the freed text reusable.
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: FE_MAX_RSS_BYTES
              value: "301989888"
            # fleet-manager caller key for POST /stun (scope stun only); see
            # apps/fleet-manager/callerauth.go. Optional: without it the stun
            # reaches fleet-manager and is refused 401, which the audit records.
            - name: FLEET_MANAGER_STUN_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-caller-keys
                  key: fe-signalloom
                  optional: true
            # fleet-manager caller key with scope read, for the remote workload
            # registry (GET /api/v1/fleet/workloads). The stun key above cannot
            # read it. Unset means this portal merges no remote cluster, which
            # /api/agents reports as source_health_detail.remote_registry
            # "unavailable" rather than as an empty registry: "no remote
            # workloads" and "cannot read the registry" are different facts.
            - name: FLEET_MANAGER_READ_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-caller-keys
                  key: fe-signalloom-read
                  optional: true
            # Remote cluster ids whose registry /api/agents merges, comma
            # separated. Empty asks fleet-manager for every cluster it knows.
            - name: FLEET_REMOTE_CLUSTERS
              value: ""
            # fleet-manager's operator break-glass key. recover and resume are
            # granted to this caller alone (apps/fleet-manager/callerauth.go),
            # which is why the dashboard's own key cannot call them and the
            # Fleet page's Recover button answered 403 for everyone. The key
            # stays in this pod: src/fleet_operator.py proxies both routes
            # behind require_superadmin and presents it server-side, so the
            # browser never holds break-glass. Optional: without it those two
            # routes answer 503 naming the missing key, rather than forwarding
            # and collecting a 401 that reads as the fleet refusing the
            # operator.
            - name: FLEET_MANAGER_OPERATOR_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-caller-keys
                  key: operator
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database-credentials
                  key: DATABASE_URL
            - name: API_JWT_ISSUER
              # Must track Dex's issuer exactly, or every token the dashboard
              # presents is rejected: you log in successfully and then watch an
              # empty dashboard while every API call returns 401 — a much more
              # confusing failure than being unable to log in at all. Same
              # PUBLIC_ORIGIN and same default as dex.yaml, substituted by this
              # Kustomization's existing postBuild.substituteFrom.
              value: ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}/dex
            - name: API_JWT_AUDIENCE
              value: signalloom-api
            - name: API_JWT_AUTHORIZED_PARTY
              value: signalloom-dashboard
            - name: API_JWKS_URL
              value: http://dex.inf-signalloom.svc.cluster.local:5556/dex/keys
            # Dex emits sub as its connector-encoded id (protobuf of userID+connector),
            # not the raw userID; map that actual sub. (Kept demo-user too for clarity.)
            - name: API_SUBJECT_TENANTS
              # viewer is the non-superadmin identity (dex.yaml staticPasswords).
              # It is mapped to a tenant so it authenticates cleanly; it is on
              # neither superadmin allowlist, so a 403 from it proves the
              # superadmin gate rather than a missing tenant mapping.
              # kusari-operator is the only subject mapped to tenant kusari: the
              # Kusari pilot claims kusari-agent as it, through the product.
              value: '{"CglkZW1vLXVzZXISBWxvY2Fs":"tenant-demo","demo-user":"tenant-demo","CgZ2aWV3ZXISBWxvY2Fs":"tenant-demo","viewer":"tenant-demo","Cg9rdXNhcmktb3BlcmF0b3ISBWxvY2Fs":"kusari","kusari-operator":"kusari"}'
            # Who is superadmin, stated here rather than left to the defaults in
            # src/superadmin.py. Those defaults name the demo user, so the
            # deployment and the code agreed by coincidence and a change to
            # either would have silently moved the boundary. This is the
            # documented path: GET /api/v1/me reports the same decision to the
            # dashboard, which now follows the server instead of matching the
            # demo user's name in the browser. Both spellings of the subject are
            # listed because Dex emits sub as its connector-encoded id.
            - name: API_SUPERADMIN_EMAILS
              value: '["demo-user@signalloom.local"]'
            - name: API_SUPERADMIN_SUBJECTS
              value: '["demo-user","CglkZW1vLXVzZXISBWxvY2Fs"]'
            - name: OIDC_PROVIDER
              value: generic
            - name: OIDC_ISSUER_URL
              value: http://localhost:5173/dex
            - name: OIDC_CLIENT_ID
              value: signalloom-dashboard
            - name: OIDC_REDIRECT_URI
              value: http://localhost:5173/callback
            - name: OIDC_SCOPES
              value: openid profile email groups audience:server:client_id:signalloom-api
            - name: OIDC_TENANT_MAPPING
              value: '{"demo-user":"tenant-demo"}'
            - name: REDIS_URL
              value: redis://redis.inf-signalloom.svc.cluster.local:6379/0
            - name: REPORT_STORE_BACKEND
              value: s3
            - name: S3_ENDPOINT_URL
              value: http://minio.inf-signalloom.svc.cluster.local:9000
            - name: S3_BUCKET
              value: discovery-reports
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-storage
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-storage
                  key: S3_SECRET_ACCESS_KEY
            - name: LLM_DISCOVERY_BACKEND
              value: fake-openai
            - name: CRM_BACKEND
              value: fake-hubspot
            - name: NOTIFICATION_BACKEND
              value: fake-slack
            - name: OUTBOUND_REPORTING_BACKEND
              value: fake-email
            # This demo deployment has no OpenBao/SPIRE provider wired for EAP
            # environment teardown (no SIGNALLOOM_TEARDOWN_KEY_SPIRE_PROVIDER
            # set), so environment_teardown.shred_openbao()/revoke_svid() now
            # fail closed by default (StageOutcome.FAILED) and
            # POST /api/v1/eap/lifecycle/environments/{hash}/teardown would
            # 500 on every call. This is the explicit, loudly-named escape
            # hatch documented in environment_teardown.py: it does not make
            # the shred/revoke verified, it only lets the demo's teardown
            # pipeline complete, and every stage detail for the two affected
            # stages will say "UNVERIFIED" in the audit trail.
            - name: SIGNALLOOM_TEARDOWN_ALLOW_UNVERIFIED
              value: "1"
            # When true, workloads declaring no signalloom.ai/tenant label may be claimed
            # into the caller's tenant instead of failing closed with 403 workload_tenant_undeclared.
            - name: ALLOW_UNDECLARED_TENANT_CLAIMS
              value: "true"
            # fe-signalloom's own signal-ingest key (fe-signalloom-gateway),
            # read from the mounted Secret by src/ingest_client.py on every
            # call, so a rotation needs no restart. A path, never the value.
            - name: SIGNAL_INGEST_KEY_FILE
              value: /etc/fe-signalloom/ingest-key/token
            # Connector credentials live in OpenBao KV v2 (SA-TODO-003,
            # src/connector_secret_store.py). The token is the openbao-agent
            # sidecar's sink file, re-read per request. A path, never a value.
            # OpenBao unreachable: credential reads and writes answer 503
            # credential_store_unavailable, with no fallback.
            - name: BAO_ADDR
              value: http://openbao.inf-bao.svc.cluster.local:8200
            - name: BAO_TOKEN_FILE
              value: /var/run/secrets/openbao/token
            # The OLD sealing key, read only by the one-shot
            # `python -m migrate_connector_credentials` (SA-TODO-003 runbook).
            # The portal no longer seals or opens with it. Remove this, the
            # mount and the Secret once the migration is verified on the cluster.
            - name: CONNECTOR_CREDENTIAL_KEY_FILE
              value: /etc/fe-signalloom/connector-credential-key/key
            # AFM import gateway key configuration: JSON array of authorized
            # keys, each bound to exactly one cluster (src/afm_import.py). The
            # binding is checked against the payload's "source_cluster", the
            # cluster the RBAC was read from -- not against "id", which is the
            # per-import identifier AFM sorts on and could never match a
            # cluster name. A mismatch is still 403 cluster_not_bound.
            #
            # Two entries: the central cluster, and the remote pilot cluster
            # whose id is a parameter so one overlay serves any pilot. Set
            # REMOTE_CLUSTER_ID through this Kustomization's existing
            # postBuild.substituteFrom, the same mechanism PUBLIC_ORIGIN uses
            # above. A key with no file on disk is logged and skipped, so the
            # second entry costs nothing until its Secret exists.
            - name: AFM_IMPORT_KEYS
              value: '[{"name":"afm-importer","scopes":["afm:import"],"cluster":"kind-osramp"},{"name":"afm-importer-remote","scopes":["afm:import"],"cluster":"${REMOTE_CLUSTER_ID:=kusari-prod}"}]'
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: signal-ingest-key
              mountPath: /etc/fe-signalloom/ingest-key
              readOnly: true
            - name: afm-importer-key
              mountPath: /etc/fe-signalloom/afm-importer-key
              readOnly: true
            - name: connector-credential-key
              mountPath: /etc/fe-signalloom/connector-credential-key
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            # Same ConfigMap fleet-manager mounts at /etc/fleet
            # (../fleet-manager/base/configmap.yaml) -- the single source of
            # truth for the signalloom.ai/agent-name -> (namespace,
            # ServiceAccount) identity map, read here by claim_tenancy.py's
            # authorize() so autoclaim cannot be spoofed into claiming a
            # decoy pod as a KNOWN agent identity. See identity.cardvault /
            # identity-ns.cardvault etc. in that ConfigMap's data for the
            # full doc comment.
            - name: agent-identity-map
              mountPath: /etc/fe-signalloom/identity-map
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 999
            runAsGroup: 999
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
        # cAdvisor transport for cadvisor_poller.py: it reads
        # http://localhost:8001/api/v1/nodes/<node>/proxy/metrics/cadvisor, which
        # only exists when something serves the API proxy in the pod. Nothing did,
        # so GET /api/telemetry/agents answered 503 on every cluster and the login
        # acceptance specs failed (2026-10-03). The sidecar binds loopback only;
        # nodes/proxy is granted to the fe-signalloom ServiceAccount by the fleet
        # ClusterRole fe-signalloom-cadvisor (tenants/local/signalloom.yaml).
        - name: kubectl-proxy
          image: docker.io/bitnamilegacy/kubectl:1.31
          imagePullPolicy: IfNotPresent
          args: ["proxy", "--port=8001", "--address=127.0.0.1", "--accept-hosts=^localhost$,^127\\.0\\.0\\.1$"]
          # The ServiceAccount has automountServiceAccountToken: false (the portal
          # itself never talks to the API server). Only this sidecar gets a projected,
          # short-lived token, at the path kubectl's in-cluster config reads.
          volumeMounts:
            - name: kubectl-proxy-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        # SA-TODO-003: connector credentials live in OpenBao KV v2. These two
        # sidecars are fleet-manager's pattern: jwt-svid writes the pod's
        # JWT-SVID (spiffe://signalloom.demo/ns/fe-signalloom/sa/fe-signalloom,
        # audience openbao) to a memory file; openbao-agent logs in as role
        # signalloom-fe-signalloom and keeps a short-lived token at
        # /var/run/secrets/openbao/token (BAO_TOKEN_FILE above). Both run as the
        # portal's uid so the 0440 token file is readable by the portal alone.
        - name: jwt-svid
          image: signalloom-spire-helper:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if /usr/local/bin/signalloom-spire-proof write --audience openbao \
                     --socket /run/spire/sockets/agent.sock \
                     --output /var/run/secrets/spiffe/jwt.tmp; then
                  mv -f /var/run/secrets/spiffe/jwt.tmp /var/run/secrets/spiffe/jwt
                else
                  echo "jwt-svid: fetch failed; keeping previous SVID" >&2
                fi
                sleep 60
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: spire-sockets
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spiffe-jwt
              mountPath: /var/run/secrets/spiffe
        - name: openbao-agent
          image: quay.io/openbao/openbao:2.7.1
          imagePullPolicy: IfNotPresent
          # bao directly, not the image entrypoint (see
          # d2-signalloom/test/openbao-sidecar-entrypoint.bats).
          command: ["bao", "agent", "-config=/etc/openbao/agent.hcl"]
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: spiffe-jwt
              mountPath: /var/run/secrets/spiffe
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
            - name: openbao-agent-tmp
              mountPath: /tmp
      volumes:
        - name: kubectl-proxy-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # optional: a key not yet minted leaves the proxies answering 503
        # (ingest_credential_unavailable) instead of holding the whole portal
        # in ContainerCreating. Mode 0440 + fsGroup: readable by uid 999 only.
        - name: signal-ingest-key
          secret:
            secretName: fe-signalloom-ingest-key
            optional: true
            defaultMode: 0440
        - name: afm-importer-key
          secret:
            secretName: fe-signalloom-afm-importer-key
            optional: true
            defaultMode: 0440
        # The old sealing key, for the one-shot migration only (SA-TODO-003).
        # optional: absent, the migration reports every sealed row as failed.
        - name: connector-credential-key
          secret:
            secretName: fe-signalloom-connector-credential-key
            optional: true
            defaultMode: 0440
        # fleet-config is the ConfigMap fleet-manager/base/configmap.yaml
        # declares; this Kustomization pulls that directory in as a resource
        # (../../fleet-manager/base below) and its targetNamespace puts both
        # Deployments' pods in fe-signalloom, so this is an in-namespace
        # reference, not a cross-namespace one. `optional: true` so a
        # deployment that has not yet rolled out fleet-manager's manifests
        # degrades to "no registered mapping" (every name resolves,
        # unchanged from before this map existed) rather than CrashLooping.
        - name: agent-identity-map
          configMap:
            name: fleet-config
            optional: true
            defaultMode: 0444
        - name: openbao-agent-config
          configMap:
            name: fe-signalloom-openbao-config
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spiffe-jwt
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: openbao-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: openbao-agent-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
