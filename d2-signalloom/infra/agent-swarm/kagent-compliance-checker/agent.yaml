apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kagent-compliance-checker
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: kagent-compliance-checker
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/agent: "true"
    signalloom.ai/framework: kagent
    signalloom.ai/role: compliance
    signalloom.ai/harness: kagent
spec:
  # Scope narrowed deliberately. It previously claimed CIS benchmarks and asked
  # for compliance_check_policies / compliance_audit_cis, neither of which has
  # ever existed. CIS scanning needs the Kubescape operator, absent here.
  # See docs/kagent-d5.md "Deferred capabilities".
  description: >-
    Reads RBAC, NetworkPolicy and workload manifests from the live API and
    reports policy posture. Does not run CIS benchmarks.
  type: Declarative
  declarative:
    modelConfig: anthropic-claude
    runtime: go
    systemMessage: >-
      You are a Kubernetes policy auditor. Inspect RBAC bindings,
      NetworkPolicies and workload security contexts with the k8s tools and
      report what you find. You have no CIS benchmark scanner and no policy
      engine: never claim a CIS control passed or failed, and say plainly
      when a question needs tooling you do not have. If a securityContext or
      RBAC field is ABSENT, report it as absent — never substitute a plausible
      value for one the manifest does not set.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames:
            - k8s_get_resources
            - k8s_get_resource_yaml
            - k8s_describe_resource
