# @id d2-agent-trust/spire-federation-bridge-relay.yaml
# @doc docs/eap/SLDC-P2-GOVERNOR-REPORT.md
# @tests test/phase2-governor-verification.bats
#
# SLDC-P2-GOV: host-stack relay for the workload SPIRE bundle endpoint.
#
# kind-osramp runs Cilium, whose BPF NodePort datapath is attached to eth0
# only. The signalloom-bridge interface (eth1, 172.19.0.10) therefore refuses
# NodePort 31843, and the hub's https_spiffe refresh of osramp.local fails
# with "connection refused" (see docs/eap/SLDC-P2-DUAL-CLUSTER.md, "Hub ->
# osramp traffic reaches only host-stack listeners"). kind-signalloom-hub uses
# kube-proxy iptables and needs no relay.
#
# This relay is a hostNetwork TCP pass-through bound to the bridge IP only,
# the same pattern as sldc-bridge-dns. It never terminates TLS, so the hub
# still authenticates the SPIRE server end to end against the seeded
# osramp.local bundle; a relay cannot forge that handshake.
#
# Rendered by scripts/bootstrap-spire-federation.sh (step "relay") with
# ${SPIRE_RELAY_BIND_IP} and ${SPIRE_BUNDLE_NODEPORT}; applied to the workload
# cluster only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-federation-bridge-relay
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-federation-bridge-relay
    signalloom.io/card: SLDC-P2-GOV
data:
  nginx.conf: |
    master_process off; # single process: no setuid to a worker user, so no SETUID/SETGID caps
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    stream {
      server {
        listen ${SPIRE_RELAY_BIND_IP}:${SPIRE_BUNDLE_NODEPORT};
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
        proxy_pass spire-server-federation.spire-system.svc.cluster.local:8443;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-federation-bridge-relay
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-federation-bridge-relay
    signalloom.io/card: SLDC-P2-GOV
spec:
  replicas: 1
  strategy:
    type: Recreate # a hostNetwork bind cannot be shared by two replicas
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-federation-bridge-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-federation-bridge-relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      containers:
        - name: relay
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-c", "/etc/relay/nginx.conf", "-g", "daemon off;"]
          readinessProbe:
            tcpSocket:
              host: ${SPIRE_RELAY_BIND_IP}
              port: ${SPIRE_BUNDLE_NODEPORT}
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: conf
              mountPath: /etc/relay
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: spire-federation-bridge-relay
