# FLUX ENVSUBST: FLEET — this is a fleet overlay, not a workload kustomization.
# Flux processes this via the tenants Kustomization with postBuild.substituteFrom.
# Local mode: artifacts are pulled from the in-cluster zot registry and
# verified against the cosign key pair generated by `make signing-keys`.
#
# This integration branch bootstraps shared infra, Signal Loom, and inactive
# definitions for opt-in demos. OSRAMP's ResourceSet is included but disabled,
# so `make demo-osramp-up` can explicitly activate it. Olly remains excluded.
# The original full-demo config is on the main branch.
#
# The JSON patches below index into spec.resources of each ResourceSet:
# index 5 is infra's and apps' OCIRepository. Agent Trust's is index 30.
# Signal Loom infra's OCIRepository is index 23 after its runner RBAC grants.
# after six namespaces, its ServiceAccount, two ClusterRoles, one
# ClusterRoleBinding, and six namespaced RoleBindings. Keep indexes in sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/policies.yaml
  - ../base/infra.yaml
  - ../base/agent-trust.yaml
  - ../base/agent-swarm.yaml
  - ../base/apps.yaml
  # Olly excluded — opt-in lifecycle must supply its definition:
  # - ../base/olly.yaml
  - signalloom.yaml
patches:
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: apps
    patch: |
      - op: replace
        path: /spec/resources/5/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: infra
    patch: |
      - op: add
        path: /spec/resources/5/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: agent-trust
    patch: |
      # Index 30 is agent-trust's OCIRepository. Bootstrap-owned topology
      # Roles and RoleBindings precede it to eliminate the first-reconcile
      # dependency race between a RoleBinding and its referenced Role.
      - op: add
        path: /spec/resources/30/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: agent-trust-platform
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: signalloom-infra
    patch: |
      # Index 26: OCIRepository follows the agent-inventory resources,
      # SuperCred runner cross-namespace RBAC, fleet-agents RBAC, then
      # tenant delivery grants. Was 25 until the fleet-agents-reader Role
      # and RoleBinding were added above it, shifting it by one.
      - op: add
        path: /spec/resources/26/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: agent-swarm
    patch: |
      # Index 8: OCIRepository follows Namespace, ServiceAccount, two
      # ClusterRoles (namespaces, workloads), CRB (namespaces), RoleBinding
      # (workloads), ClusterRole (cluster-rbac), CRB (cluster-rbac).
      - op: add
        path: /spec/resources/8/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: fe-signalloom-agents
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: signalloom-apps
    patch: |
      # Index 10: OCIRepository follows the tenant namespace, the pre-created
      # proxy-health Role, the standard tenant RBAC resources, and the
      # namespace-patch grants.  Agent RBAC was moved AFTER the OCIRepository
      # (see signalloom.yaml comment block at index 12-13).
      - op: add
        path: /spec/resources/10/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
