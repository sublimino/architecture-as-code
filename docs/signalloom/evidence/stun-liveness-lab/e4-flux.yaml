apiVersion: v1
kind: ServiceAccount
metadata: {name: flux, namespace: kusari-liveness-lab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: flux-lab-apply, namespace: kusari-liveness-lab}
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: flux-lab-apply, namespace: kusari-liveness-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: flux-lab-apply}
subjects:
- {kind: ServiceAccount, name: flux, namespace: kusari-liveness-lab}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: e4-lab, namespace: kusari-liveness-lab}
spec:
  interval: 10m
  url: oci://zot.registry.svc.cluster.local:5000/acme/lab/kusari-liveness-lab-e4
  insecure: true
  ref: {tag: v1}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: e4-lab, namespace: kusari-liveness-lab}
spec:
  interval: 10m
  prune: true
  wait: false
  path: ./
  sourceRef: {kind: OCIRepository, name: e4-lab}
  targetNamespace: kusari-liveness-lab
