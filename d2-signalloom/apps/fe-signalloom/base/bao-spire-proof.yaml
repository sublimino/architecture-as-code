apiVersion: batch/v1
kind: Job
metadata:
  name: bao-spire-positive-proof
  labels:
    bao.controlplane.io/consumer: fe-signalloom
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        bao.controlplane.io/consumer: fe-signalloom
    spec:
      restartPolicy: Never
      serviceAccountName: fe-signalloom
      initContainers:
        - name: jwt-svid
          image: signalloom-spire-helper:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/signalloom-spire-proof"]
          args: ["write", "--audience", "openbao", "--socket", "/run/spire/sockets/agent.sock", "--output", "/work/jwt"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: spire-socket
              mountPath: /run/spire/sockets
        - name: bao-login
          image: signalloom-spire-helper:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/signalloom-spire-proof"]
          args: ["exchange", "--address", "http://openbao.inf-bao.svc.cluster.local:8200", "--role", "signalloom-fe-signalloom", "--jwt", "/work/jwt", "--output", "/work/home/.vault-token"]
          env:
            - name: HOME
              value: /work/home
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: proof
          image: quay.io/openbao/openbao:2.1.1
          env:
            - name: BAO_ADDR
              value: http://openbao.inf-bao.svc.cluster.local:8200
            - name: HOME
              value: /work/home
          command: ["/bin/bao"]
          args: ["read", "kv/data/signalloom/fe-signalloom"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: spire-socket
              mountPath: /run/spire/sockets
      volumes:
        - name: work
          emptyDir: {}
        - name: spire-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bao-spire-negative-proof
  labels:
    bao.controlplane.io/consumer: fe-signalloom
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        bao.controlplane.io/consumer: fe-signalloom
    spec:
      restartPolicy: Never
      serviceAccountName: fe-signalloom-negative
      containers:
        - name: jwt-svid
          image: signalloom-spire-helper:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/signalloom-spire-proof"]
          args: ["expect-denied", "--audience", "openbao", "--socket", "/run/spire/sockets/agent.sock"]
          volumeMounts:
            - name: spire-socket
              mountPath: /run/spire/sockets
      volumes:
        - name: spire-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
