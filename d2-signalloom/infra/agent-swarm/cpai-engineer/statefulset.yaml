apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cpai-engineer
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: cpai-engineer
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/managed-by: signalloom-governor
    signalloom.ai/agent: "true"
    signalloom.ai/role: implementer
    signalloom.ai/harness: opencode-cpai
    signalloom.ai/model: claude-sonnet-4
    signalloom.ai/tenant: controlplane
    signalloom.ai/project: osramp
    signalloom.ai/state: idle
    signalloom.io/stunned: "false"
    signalloom.io/containment-mode: "none"
  annotations:
    signalloom.ai/stunned-at: ""
    signalloom.ai/stun-reason: ""
    signalloom.io/stun-reason: ""
    signalloom.ai/agent-display-name: "CPAI Engineer"
    signalloom.ai/description: "In-cluster sandboxed coding harness using OpenCode + nono Landlock."
spec:
  serviceName: cpai-engineer
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpai-engineer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpai-engineer
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: signalloom
        signalloom.ai/agent: "true"
        signalloom.ai/role: implementer
        signalloom.ai/harness: opencode-cpai
        signalloom.ai/model: claude-sonnet-4
        signalloom.ai/tenant: controlplane
        signalloom.ai/project: osramp
        signalloom.ai/state: idle
        signalloom.io/stunned: "false"
        signalloom.io/containment-mode: "none"
      annotations:
        signalloom.ai/stunned-at: ""
        signalloom.ai/stun-reason: ""
        signalloom.io/stun-reason: ""
    spec:
      serviceAccountName: cpai-engineer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: agent
          image: cpai-engineer:local
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: WORKSPACE_DIR
              value: /workspace
            - name: NONO_PROFILE
              value: strict
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: api-key
                  optional: true
            - name: SPIFFE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem: false — nono writes to /tmp at runtime.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
        # OpenBao Agent sidecar — fetches secrets via SPIFFE JWT auth
        - name: openbao-agent
          image: openbao/openbao:2.1.0
          args:
            - agent
            - -config=/etc/openbao/agent.hcl
          env:
            - name: SPIFFE_ID
              value: "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/cpai-engineer"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: bao-home
              mountPath: /home/openbao
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cpai-worktree-pvc
        - name: tmp
          emptyDir: {}
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: openbao-agent-config
          configMap:
            name: cpai-engineer-openbao-config
        - name: vault-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: bao-home
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
