apiVersion: v1
kind: Secret
metadata:
  name: dex-connectors
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/component: connectors
    app.kubernetes.io/part-of: signalloom-demo
type: Opaque
stringData:
  # Connector config fragment — merged into the base Dex config at deploy time.
  # Replace placeholders with real IdP credentials before applying.
  #
  # Usage:
  #   kubectl kustomize overlays/connectors | kubectl apply -n inf-signalloom -f -
  #
  # The base Dex Secret (dex-local-auth) includes the connectors: block commented
  # out. When this overlay is active, mount this Secret as an additional config
  # source or use a strategic merge patch to inject the connectors into the base.

  connectors.yaml: |
    connectors:
      # --- Microsoft Entra ID (Azure AD) ---
      - type: microsoft
        id: entra
        name: Microsoft Entra ID
        config:
          clientID: REPLACE_WITH_ENTRA_CLIENT_ID
          clientSecret: REPLACE_WITH_ENTRA_CLIENT_SECRET
          tenant: REPLACE_WITH_ENTRA_TENANT_ID
          redirectURI: https://dashboard.osramp.acme.local:30754/dex/callback
          scopes:
            - openid
            - profile
            - email
          groups:
            - Security Engineers
            - Platform Team

      # --- Generic OIDC (Okta, Auth0, Keycloak, etc.) ---
      - type: oidc
        id: oidc-upstream
        name: Enterprise SSO
        config:
          issuer: REPLACE_WITH_OIDC_ISSUER_URL
          clientID: REPLACE_WITH_OIDC_CLIENT_ID
          clientSecret: REPLACE_WITH_OIDC_CLIENT_SECRET
          redirectURI: https://dashboard.osramp.acme.local:30754/dex/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          insecureSkipEmailVerified: false

      # --- Google Workspace ---
      - type: google
        id: google
        name: Google
        config:
          clientID: REPLACE_WITH_GOOGLE_CLIENT_ID
          clientSecret: REPLACE_WITH_GOOGLE_CLIENT_SECRET
          redirectURI: https://dashboard.osramp.acme.local:30754/dex/callback
          hostedDomains:
            - signalloom.io

      # --- GitHub ---
      - type: github
        id: github
        name: GitHub
        config:
          clientID: REPLACE_WITH_GITHUB_CLIENT_ID
          clientSecret: REPLACE_WITH_GITHUB_CLIENT_SECRET
          redirectURI: https://dashboard.osramp.acme.local:30754/dex/callback
          loadAllGroups: true
          orgs:
            - name: signalloom
