# FLUX ENVSUBST: YES — Flux substitutes IMAGE_BASE and ARTIFACT_TAG.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-signalloom
  labels:
    app.kubernetes.io/name: docs-signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs-signalloom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs-signalloom
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: ${IMAGE_BASE}/signalloom/apps/docs-signalloom:${ARTIFACT_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 8Mi
            limits:
              memory: 96Mi
              ephemeral-storage: 32Mi
      volumes:
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
