apiVersion: v1
kind: Secret
metadata:
  name: osramp-archivista
stringData:
  ARCHIVISTA_LISTEN_ON: tcp://0.0.0.0:8082
  ARCHIVISTA_SQL_STORE_BACKEND: PSQL
  ARCHIVISTA_SQL_STORE_CONNECTION_STRING: "postgres://archiver:archiver-password@postgres.backend.svc.cluster.local:5432/testify?sslmode=disable"
  ARCHIVISTA_STORAGE_BACKEND: "BLOB"
  ARCHIVISTA_BLOB_STORE_ENDPOINT: minio.backend.svc.cluster.local:9000
  ARCHIVISTA_BLOB_STORE_ACCESS_KEY_ID: archivista
  ARCHIVISTA_BLOB_STORE_SECRET_ACCESS_KEY_ID: archivista_secret_key
  # ARCHIVISTA_BLOB_STORE_USE_TLS: "FALSE"
  ARCHIVISTA_BLOB_STORE_BUCKET_NAME: attestations
# data:
#   # for some reason, flux build can't use "FALSE" as a string
#   ARCHIVISTA_BLOB_STORE_USE_TLS: RkFMU0U= # "FALSE"
