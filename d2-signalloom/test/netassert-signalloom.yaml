      namespace: fe-signalloom-agents
  dst:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom

# Agent pods MUST NOT reach PostgreSQL directly
- name: agents-to-postgresql-denied
  type: k8s
  protocol: tcp
  targetPort: 5432
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: pod
      name: agent-patsy
      namespace: fe-signalloom-agents
  dst:
    k8sResource:
      kind: deployment
      name: postgresql
      namespace: inf-signalloom

# Dashboard MUST NOT reach PostgreSQL directly (only via API)
- name: dashboard-to-postgresql-denied
  type: k8s
  protocol: tcp
  targetPort: 5432
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: postgresql
      namespace: inf-signalloom

# Dashboard MUST NOT reach Redis directly
- name: dashboard-to-redis-denied
  type: k8s
  protocol: tcp
  targetPort: 6379
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: redis
      namespace: inf-signalloom

# ── SPIRE / SuperCred policy coverage ───────────────────────────────────────
#
# Resolver contract (the runtime image must replace these exact pod names and
# must exit non-zero before Netassert when no Ready pod matches):
# agent-patsy => namespace=fe-signalloom-agents label=signalloom.ai/agent=true,signalloom.ai/framework=custom,netassert.signalloom.ai/fixture=generic-agent
# netassert-cardvault-probe-pod => namespace=fe-signalloom-agents label=app.kubernetes.io/name=cardvault-agent,signalloom.ai/supercred=true,bao.controlplane.io/consumer=cardvault-agent,netassert.signalloom.ai/fixture=cardvault-agent serviceAccount=cardvault-agent lifecycle=fleet-provisioned-sustained
# envoy-gateway-pod => namespace=ingress label=gateway.envoyproxy.io/owning-gateway-name=cluster
#
# SPIRE agent uses hostNetwork; Kubernetes NetworkPolicy cannot prove its node-network enforcement.
# These assertions therefore cover the SPIRE server's pod-network endpoint,
# not traffic to the node-local SPIRE agent socket.

- name: envoy-gateway-to-dashboard-allowed
  type: k8s
  protocol: tcp
  targetPort: 8080
  timeoutSeconds: 30
  attempts: 3
  exitCode: 0
  src:
    k8sResource: {kind: pod, name: envoy-gateway-pod, namespace: ingress}
  dst:
    k8sResource: {kind: deployment, name: dashboard-signalloom, namespace: fe-signalloom}

