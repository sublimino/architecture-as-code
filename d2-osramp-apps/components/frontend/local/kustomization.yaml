apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../staging
patches:
  - path: archiver-values.yaml
    target:
      kind: Deployment
      name: osramp-archiver
  - path: listener-values.yaml
    target:
      kind: Deployment
      name: osramp-multipurpose
  - path: osramp-purl-values.yaml
    target:
      kind: Deployment
      name: osramp-purl