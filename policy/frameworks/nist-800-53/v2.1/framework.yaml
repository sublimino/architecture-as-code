    - id: no-privilege-escalation
      name: Privilege escalation disabled
      description: Blocks privilege escalation flag across all containers in the pod.
      celExpression: object.spec.containers.all(c, c.securityContext.allowPrivilegeEscalation == false)
      severity: critical
      remediation: "Set allowPrivilegeEscalation: false in container securityContext."
