# FLUX ENVSUBST: NO -- no postBuild on the Flux Kustomization that reconciles
# this directory. Flux does NOT run envsubst here.
#
# Generic glob-bound JWT auth role for the agent swarm. Instead of one role per
# agent (which scales linearly with agent count and requires a config deploy for
# every new agent type), this role accepts any SPIFFE ID under one fixed
# namespace prefix and uses OpenBao's identity templating to scope the policy
# dynamically.
#
# The glob claim is `spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/*`
# (SLAAT-P2-3 correction: pinned to the fe-signalloom-agents namespace, NOT
# "ns/*/sa/*" / "ANY SPIFFE ID under the trust domain" as an earlier revision
# of this comment claimed -- a namespace-wide glob would be the exact wildcard
# shape this role's sibling, supercred-bootstrap.yaml, explicitly documents
# rejecting). SPIRE must have issued a valid JWT-SVID for a workload inside
# that one namespace -- the signature check is the auth gate, and the
# templated policy is the authz gate.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-agent-generic-role-config
data:
  agent-generic-role.sh: |
    #!/usr/bin/env bash
    set -eo pipefail

    BAO_ADDR="${BAO_ADDR:-http://openbao.inf-bao.svc.cluster.local:8200}"
    # inf-bao-admin token from the admin-login init container (SA-TODO-003).
    BAO_TOKEN="${BAO_TOKEN:-$(cat "${HOME}/.vault-token")}"
    export BAO_ADDR BAO_TOKEN

    # The swarm agents that read secrets through this role, by service
    # account. Each gets an identity entity NAMED for it, whose alias on the
    # jwt mount is its SPIFFE ID (user_claim=sub, below), so a login by that
    # SVID resolves to that entity and the policy keys on the entity name.
    # Keep in step with the sidecar ConfigMaps' secret paths
    # (d2-signalloom/test/openbao-agent-secret-authz.bats checks both).
    AGENT_ENTITIES="prompt-commit-summarizer triage-ci-worker cpai-engineer prod-deploy-gate swarm-governor"
    SPIFFE_PREFIX="spiffe://signalloom.demo/ns/fe-signalloom-agents/sa"

    # Aliases name an auth mount by its ACCESSOR (auth_jwt_<hex>, minted when
    # the mount is enabled, so it differs per cluster), never by its path.
    #
    # Cold start (2026-10-03 zero-state rebuild): this Job ships in the
    # controllers layer, but the jwt mount is enabled by openbao-bootstrap in
    # the configs layer, which Flux orders AFTER controllers (dependsOn). On a
    # fresh cluster the read below found no mount, the Job hit its backoff
    # limit, controllers never went Ready and configs never ran: a deadlock
    # that a long-lived cluster (mount already present) never shows. Enabling
    # the mount here is idempotent; the bootstrap keeps `|| true` on its own
    # enable and still owns the mount's jwks_url config.
    bao auth enable jwt >/dev/null 2>&1 || true
    JWT_ACCESSOR="$(bao read -field=accessor sys/auth/jwt)"
    case "$JWT_ACCESSOR" in
      auth_jwt_*) ;;
      *) echo "unexpected accessor for auth/jwt: '${JWT_ACCESSOR}'" >&2; exit 1 ;;
    esac

    echo "--- Writing templated policy: signalloom-agent-templated ---"
    bao policy write signalloom-agent-templated - <<'POLICY'
    # Templated policy: each agent can only read the secrets under its own
    # entity name -- its service account, pre-created below. An SVID from
    # the namespace with no pre-created entity gets a generated name
    # (entity_<uuid>) and so reads nothing.
    #
    # Path shape: secret/data/agents/<agent-sa>/* on the secret/ KV v2 mount
    # that scripts/swarm-seed-secrets.sh writes.
    #
    # Until 2026-10-03 this templated the SPIFFE ID itself
    # ({{identity.entity.aliases.auth_jwt.metadata.sub}}, on kv/), which could
    # never grant a read: a request path carrying "spiffe://" is cleaned by
    # the HTTP layer to "spiffe:/" (a 301), which the substituted policy path
    # never matches, OpenBao 2.7 rejects a substitution containing "/"
    # outright, `auth_jwt` is not an accessor, and the secrets are on secret/.
    path "secret/data/agents/{{identity.entity.name}}/*" {
      capabilities = ["read", "list"]
    }
    POLICY

    echo "--- Creating JWT auth role: signalloom-agent-generic ---"
    # The whole payload goes in as JSON on stdin, NOT as k=v arguments.
    #
    # `bao write path k=v` sends every value as a STRING. bound_claims and
    # claim_mappings are map-typed fields, so the k=v form is rejected:
    #
    #   Code: 400. Errors:
    #   * error converting input {"sub":"spiffe://signalloom.demo/ns/*/sa/*"}
    #     for field "bound_claims": '' expected a map, got 'string'
    #
    # The quoting looks right -- the value IS valid JSON -- which is why this
    # survived review. The CLI simply never parses it as anything but a string.
    # `bao write path -` reads a JSON object from stdin and preserves types.
    #
    # This Job had therefore NEVER succeeded. It failed at this line on every
    # run since it was authored, took the Job to BackoffLimitExceeded, and held
    # inf-bao/infra-controllers not-Ready through its health check -- which in
    # turn blocked inf-bao/infra-configs on dependsOn. Nothing surfaced it
    # because the policy write on the line above succeeds first, so the log
    # opens with "Success! Uploaded policy".
    # SLAAT-P1-3-F2 (MEDIUM, fixed by SLAAT-P2-3): bound_claims_type was
    # missing, so OpenBao defaulted to "string" and compared the trailing
    # "*" in bound_claims.sub as a LITERAL character, never a wildcard.
    # Every one of the 18 registered fe-signalloom-agents/sa/* identities
    # was permanently denied with 'claim "sub" does not match any
    # associated bound claim values' -- this role has never successfully
    # authenticated a single agent since it was authored. Same bug class
    # already fixed in openbao-supercred-bootstrap.yaml's PF-3 comment
    # (signalloom-cardvault-agent, osramp.local agent-cardvault); this is
    # the back-port to the fleet-wide generic role.
    bao write auth/jwt/role/signalloom-agent-generic - <<'ROLE'
    {
      "role_type": "jwt",
      "bound_audiences": "openbao-supercredential",
      "bound_claims": {"sub": "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/*"},
      "bound_claims_type": "glob",
      "claim_mappings": {"sub": "sub"},
      "user_claim": "sub",
      "token_policies": "signalloom-agent-templated",
      "token_ttl": "5m",
      "token_max_ttl": "5m",
      "token_type": "batch"
    }
    ROLE

    echo "--- Pre-creating agent entities ---"
    # Prints the id of the entity holding alias $1 on the jwt mount, or
    # nothing. On no match the CLI still exits 0 and prints "Success! Data
    # written to: identity/lookup/entity" even under -field=id, so only a
    # UUID counts as an answer.
    alias_owner() {
      bao write -field=id identity/lookup/entity alias_name="$1" alias_mount_accessor="$JWT_ACCESSOR" 2>/dev/null \
        | grep -E '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' || true
    }
    for sa in $AGENT_ENTITIES; do
      alias_name="${SPIFFE_PREFIX}/${sa}"
      bao write identity/entity/name/"$sa" metadata=service_account="$sa" >/dev/null
      eid="$(bao read -field=id identity/entity/name/"$sa")"
      owner="$(alias_owner "$alias_name")"
      if [ -z "$owner" ]; then
        bao write identity/entity-alias name="$alias_name" canonical_id="$eid" mount_accessor="$JWT_ACCESSOR" >/dev/null
      elif [ "$owner" != "$eid" ]; then
        # A login before this ran auto-created an unnamed entity for the SVID;
        # fold it (and its alias) into the named one.
        bao write identity/entity/merge from_entity_ids="$owner" to_entity_id="$eid" >/dev/null
      fi
      owner="$(alias_owner "$alias_name")"
      [ "$owner" = "$eid" ] || { echo "alias ${alias_name} is not on entity ${sa}" >&2; exit 1; }
      echo "entity ${sa} <- ${alias_name}"
    done

    echo "--- Verifying role ---"
    bao read auth/jwt/role/signalloom-agent-generic
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-agent-generic-role-setup
  labels:
    app.kubernetes.io/name: openbao-agent-generic-role
    app.kubernetes.io/part-of: signalloom-bao-proof
  annotations:
    # SLAAT-P2-3 (Forge review finding): a Job's pod template is immutable
    # once created. Editing openbao-agent-generic-role-config's data (this
    # card's F2 fix) does NOT by itself cause Flux to re-run this Job on an
    # already-reconciled cluster -- the Job object is unchanged, so it stays
    # Completed from before the fix. `force` lets Flux delete+recreate the
    # Job when its spec changes; the pod-template config-hash annotation
    # below is what actually changes the spec in lockstep with the
    # ConfigMap, so the two annotations are a pair -- force alone is a
    # no-op without a corresponding spec diff to force past.
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-agent-generic-role
      annotations:
        # Bump whenever agent-generic-role-config's agent-generic-role.sh
        # content changes, so this Job's pod template (and therefore the
        # Job itself) is forced to recreate alongside the ConfigMap. Current
        # value is sha256 of the script as `yq '.data["agent-generic-role.sh"]'`
        # prints it, first 12 hex (pinned by openbao-agent-secret-authz.bats).
        signalloom.io/config-hash: "06b59ece60c3"
    spec:
      restartPolicy: OnFailure
      # Administer OpenBao as inf-bao-admin (SA-TODO-003): no static token.
      # The pod runs as openbao-admin, so SPIRE issues it
      # spiffe://signalloom.demo/ns/inf-bao/sa/openbao-admin; admin-login
      # trades that JWT-SVID for a 15m token in /work/home/.vault-token, which
      # the bao CLI reads. Retries cover openbao-init and the SPIRE entry
      # landing after this Job on a cold start.
      serviceAccountName: openbao-admin
      initContainers:
        - name: wait-for-openbao
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for OpenBao to be ready..."
              until wget -qO- http://openbao.inf-bao.svc.cluster.local:8200/v1/sys/health 2>/dev/null; do
                sleep 2
              done
              echo "OpenBao is ready."
        - name: admin-login
          image: signalloom-spire-helper:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /work/home
              i=0
              until /usr/local/bin/signalloom-spire-proof write --audience openbao \
                      --socket /run/spire/sockets/agent.sock --output /work/jwt \
                    && /usr/local/bin/signalloom-spire-proof exchange \
                      --address http://openbao.inf-bao.svc.cluster.local:8200 \
                      --role inf-bao-admin --jwt /work/jwt \
                      --output /work/home/.vault-token; do
                i=$((i + 1))
                [ "$i" -le 60 ] || { echo "admin-login: no inf-bao-admin token after 300s" >&2; exit 1; }
                sleep 5
              done
              rm -f /work/jwt
              # The configure container runs as a different uid; the file lives
              # in this pod's memory-backed emptyDir only.
              chmod 0444 /work/home/.vault-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: spire-socket
              mountPath: /run/spire/sockets
              readOnly: true
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.7.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat /config/agent-generic-role.sh | sh
          env:
            - name: BAO_ADDR
              value: "http://openbao.inf-bao.svc.cluster.local:8200"
            - name: HOME
              value: /work/home
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: config
          configMap:
            name: openbao-agent-generic-role-config
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: spire-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
