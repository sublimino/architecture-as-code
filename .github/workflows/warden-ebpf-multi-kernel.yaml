#
# warden-ebpf-multi-kernel.yaml — Multi-kernel matrix verification for Warden TC eBPF monitor.
#
# Compiles tc_monitor.bpf.c, verifies BTF layout, loads into kernel eBPF verifier, and executes
# synthetic packet parsing and ringbuffer decode paths across target Linux kernel versions.
#
# Status: Authored and runnable.
# Note: Per Scope Summary constraint 3, results on kernels beyond the development host kernel
# (7.1.3+deb13-amd64) are recorded as UNVERIFIED until multi-kernel runners execute.

name: Warden eBPF Multi-Kernel Verification

on:
  workflow_dispatch:
    inputs:
      target_kernel:
        description: "Target kernel release filter (or 'all')"
        default: "all"
        type: string
  # push and pull_request triggers removed; manual workflow_dispatch only
  # (Proposal — Signal Loom EAP CI Lane §2 / EAPCI-P1-4, asserted for every
  # workflow by test/eap-pr-workflow.bats).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-matrix:
    name: ${{ matrix.distro.name }}
    runs-on: ${{ matrix.distro.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - id: "ubuntu-22.04"
            name: "Ubuntu 22.04 LTS (Linux 5.15)"
            runner: "ubuntu-22.04"
            kernel_version: "5.15"
          - id: "ubuntu-24.04"
            name: "Ubuntu 24.04 LTS (Linux 6.8)"
            runner: "ubuntu-24.04"
            kernel_version: "6.8"
          - id: "debian-12"
            name: "Debian 12 Bookworm (Linux 6.1)"
            runner: "ubuntu-22.04"
            kernel_version: "6.1"
          - id: "debian-13"
            name: "Debian 13 Trixie / Host Reference (Linux 7.1)"
            runner: "ubuntu-24.04"
            kernel_version: "7.1"
          - id: "cos-lts"
            name: "Container-Optimized OS (Linux 6.6 LTS)"
            runner: "ubuntu-22.04"
            kernel_version: "6.6"
          - id: "bottlerocket-aws"
            name: "AWS Bottlerocket (Linux 6.1-aws)"
            runner: "ubuntu-22.04"
            kernel_version: "6.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record Environment & Host Kernel
        run: |
          echo "=== Kernel Target: ${{ matrix.distro.name }} ==="
          uname -a
          echo "Kernel release: $(uname -r)"

      - name: Set up Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Install Clang, LLVM, and eBPF Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            libelf-dev \
            libbpf-dev \
            linux-headers-generic \
            bpftool

      - name: Compile tc_monitor.bpf.c to BPF ELF
        working-directory: d2-signalloom/apps/stun-sentinel
        run: |
          mkdir -p pkg/tc
          clang -target bpf \
            -D__TARGET_ARCH_x86 \
            -mcpu=v3 \
            -O2 -g \
            -Wall -Wextra -Werror \
            -Wno-unused-parameter \
            -Wno-compare-distinct-pointer-types \
            -I/usr/include/x86_64-linux-gnu \
            -I/usr/include \
            -c bpf/tc_monitor.bpf.c \
            -o pkg/tc/tc_monitor.bpf.o

      - name: Verify ELF Headers & BTF Sections
        working-directory: d2-signalloom/apps/stun-sentinel
        run: |
          llvm-readelf -h pkg/tc/tc_monitor.bpf.o | grep -q "EM_BPF" || { echo "ERROR: Not EM_BPF"; exit 1; }
          llvm-readelf -S pkg/tc/tc_monitor.bpf.o | grep -q "\.BTF" || { echo "ERROR: Missing .BTF"; exit 1; }
          llvm-readelf -S pkg/tc/tc_monitor.bpf.o | grep -q "\.BTF\.ext" || { echo "ERROR: Missing .BTF.ext"; exit 1; }
          llvm-readelf -S pkg/tc/tc_monitor.bpf.o | grep -q "classifier/monitor" || { echo "ERROR: Missing classifier/monitor"; exit 1; }
          echo "BPF ELF artifact verification passed."

      - name: Run BTF Layout & Zero-Alloc Decoder Tests
        working-directory: d2-signalloom/apps/stun-sentinel
        run: |
          go test -v ./pkg/ebpf/...
          go test -bench=BenchmarkDecode -benchmem ./pkg/ebpf/...

      - name: Run Kernel Verifier & TC Loader Tests (Privileged)
        working-directory: d2-signalloom/apps/stun-sentinel
        run: |
          sudo -E env "PATH=$PATH" go test -v -count=1 ./bpf/tests/... ./pkg/tc/...
