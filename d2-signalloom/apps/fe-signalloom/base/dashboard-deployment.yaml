# FLUX ENVSUBST: YES — this manifest is rendered by the Flux Kustomization
# that reconciles this directory (postBuild.substituteFrom is configured;
# see this directory's kustomization.yaml). Use ${VAR} for values Flux
# should substitute from flux-runtime-info, and $${VAR} to pass a literal $
# through untouched to the container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-signalloom
  labels:
    app.kubernetes.io/name: dashboard-signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-signalloom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-signalloom
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ${IMAGE_BASE}/signalloom/apps/dashboard-signalloom:${ARTIFACT_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
          env:
            # The dashboard's fleet-manager caller key (scopes stun, deploy,
            # scan, reset; NOT recover). nginx injects it on /fleet-api/ only
            # after GET /api/v1/auth/check has accepted the browser's token as
            # a superadmin's (nginx.conf). Rendered into the config at start by
            # the image's envsubst entrypoint, never baked into the image.
            # Optional: without it the dashboard still serves and every gated
            # fleet call is refused 401 by fleet-manager (16-fleet-gate.envsh).
            - name: FLEET_DASHBOARD_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-caller-keys
                  key: dashboard
                  optional: true
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            # The envsubst entrypoint writes the rendered nginx config here;
            # the root filesystem is read-only.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
