name: push-images

on:
  # Manual trigger only. Automatic push/merge/tag/schedule triggers are disabled for now;
  # run these from the Actions tab (workflow_dispatch).
  workflow_dispatch:
jobs:
  docker-push:
    strategy:
      fail-fast: false
      matrix:
          include:
            - image: images/archiver
              context: ./d2-osramp-apps/apps/archiver
            - image: images/listener
              context: ./d2-osramp-apps/apps/listener
            - image: images/processor
              context: ./d2-osramp-apps/apps/processor
            - image: signalloom/apps/fe-signalloom
              context: ./d2-signalloom/apps/fe-signalloom
            - image: signalloom/infra/fake-integration-proxy
              context: ./d2-signalloom/apps/fake-integration-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare tags
        id: prep
        run: echo "VERSION=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Generate images meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.prep.outputs.VERSION }}
            type=raw,value=latest
      - name: Publish multi-arch image
        uses: docker/build-push-action@v6
        id: push
        with:
          sbom: true
          provenance: true
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository }}/${{ matrix.image }}@${DIGEST}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
