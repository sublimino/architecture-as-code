# FLUX ENVSUBST: YES — this manifest is rendered by the Flux Kustomization
# that reconciles this directory (postBuild.substituteFrom is configured;
# see this directory's kustomization.yaml). Use ${VAR} for values Flux
# should substitute from flux-runtime-info, and $${VAR} to pass a literal $
# through untouched to the container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-signalloom
  labels:
    app.kubernetes.io/name: fe-signalloom
    bao.controlplane.io/consumer: fe-signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fe-signalloom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fe-signalloom
        bao.controlplane.io/consumer: fe-signalloom
    spec:
      serviceAccountName: fe-signalloom
      securityContext:
        runAsNonRoot: true
        # Group-owns the signal-ingest key volume (0440) for the portal's uid.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - until pg_isready -h postgresql.inf-signalloom.svc.cluster.local -p 5432 -U "$POSTGRES_USER"; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: discovery-portal
          image: ${IMAGE_BASE}/signalloom/apps/fe-signalloom:${ARTIFACT_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SL_ENV
              value: demo
            # Node whose kubelet cAdvisor the telemetry poller scrapes (cadvisor_poller.py).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The poller hands a ~10 MB scrape to a worker thread every 5 s; glibc's
            # per-thread arenas turned that into RSS growth (131 → 224 MB in minutes,
            # 2026-10-03). One arena keeps the freed text reusable.
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: FE_MAX_RSS_BYTES
              value: "301989888"
            # fleet-manager caller key for POST /stun (scope stun only); see
            # apps/fleet-manager/callerauth.go. Optional: without it the stun
            # reaches fleet-manager and is refused 401, which the audit records.
            - name: FLEET_MANAGER_STUN_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-caller-keys
                  key: fe-signalloom
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database
                  key: DATABASE_URL
            - name: API_JWT_ISSUER
              # Must track Dex's issuer exactly, or every token the dashboard
              # presents is rejected: you log in successfully and then watch an
              # empty dashboard while every API call returns 401 — a much more
              # confusing failure than being unable to log in at all. Same
              # PUBLIC_ORIGIN and same default as dex.yaml, substituted by this
              # Kustomization's existing postBuild.substituteFrom.
              value: ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}/dex
            - name: API_JWT_AUDIENCE
              value: signalloom-api
            - name: API_JWT_AUTHORIZED_PARTY
              value: signalloom-dashboard
            - name: API_JWKS_URL
              value: http://dex.inf-signalloom.svc.cluster.local:5556/dex/keys
            # Dex emits sub as its connector-encoded id (protobuf of userID+connector),
            # not the raw userID; map that actual sub. (Kept demo-user too for clarity.)
            - name: API_SUBJECT_TENANTS
              # viewer is the non-superadmin identity (dex.yaml staticPasswords).
              # It is mapped to a tenant so it authenticates cleanly; it is on
              # neither superadmin allowlist, so a 403 from it proves the
              # superadmin gate rather than a missing tenant mapping.
              # kusari-operator is the only subject mapped to tenant kusari: the
              # Kusari pilot claims kusari-agent as it, through the product.
              value: '{"CglkZW1vLXVzZXISBWxvY2Fs":"tenant-demo","demo-user":"tenant-demo","CgZ2aWV3ZXISBWxvY2Fs":"tenant-demo","viewer":"tenant-demo","Cg9rdXNhcmktb3BlcmF0b3ISBWxvY2Fs":"kusari","kusari-operator":"kusari"}'
            - name: OIDC_PROVIDER
              value: generic
            - name: OIDC_ISSUER_URL
              value: http://localhost:5173/dex
            - name: OIDC_CLIENT_ID
              value: signalloom-dashboard
            - name: OIDC_REDIRECT_URI
              value: http://localhost:5173/callback
            - name: OIDC_SCOPES
              value: openid profile email groups audience:server:client_id:signalloom-api
            - name: OIDC_TENANT_MAPPING
              value: '{"demo-user":"tenant-demo"}'
            - name: REDIS_URL
              value: redis://redis.inf-signalloom.svc.cluster.local:6379/0
            - name: REPORT_STORE_BACKEND
              value: s3
            - name: S3_ENDPOINT_URL
              value: http://minio.inf-signalloom.svc.cluster.local:9000
            - name: S3_BUCKET
              value: discovery-reports
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-storage
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-storage
                  key: S3_SECRET_ACCESS_KEY
            - name: LLM_DISCOVERY_BACKEND
              value: fake-openai
            - name: CRM_BACKEND
              value: fake-hubspot
            - name: NOTIFICATION_BACKEND
              value: fake-slack
            - name: OUTBOUND_REPORTING_BACKEND
              value: fake-email
            # fe-signalloom's own signal-ingest key (fe-signalloom-gateway),
            # read from the mounted Secret by src/ingest_client.py on every
            # call, so a rotation needs no restart. A path, never the value.
            - name: SIGNAL_INGEST_KEY_FILE
              value: /etc/fe-signalloom/ingest-key/token
            # AFM import gateway key configuration: JSON array of authorized keys.
            - name: AFM_IMPORT_KEYS
              value: '[{"name":"afm-importer","scopes":["afm:import"],"cluster":"kind-osramp"}]'
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: signal-ingest-key
              mountPath: /etc/fe-signalloom/ingest-key
              readOnly: true
            - name: afm-importer-key
              mountPath: /etc/fe-signalloom/afm-importer-key
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 999
            runAsGroup: 999
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
        # cAdvisor transport for cadvisor_poller.py: it reads
        # http://localhost:8001/api/v1/nodes/<node>/proxy/metrics/cadvisor, which
        # only exists when something serves the API proxy in the pod. Nothing did,
        # so GET /api/telemetry/agents answered 503 on every cluster and the login
        # acceptance specs failed (2026-10-03). The sidecar binds loopback only;
        # nodes/proxy is granted to the fe-signalloom ServiceAccount by the fleet
        # ClusterRole fe-signalloom-cadvisor (tenants/local/signalloom.yaml).
        - name: kubectl-proxy
          image: docker.io/bitnamilegacy/kubectl:1.31
          imagePullPolicy: IfNotPresent
          args: ["proxy", "--port=8001", "--address=127.0.0.1", "--accept-hosts=^localhost$,^127\\.0\\.0\\.1$"]
          # The ServiceAccount has automountServiceAccountToken: false (the portal
          # itself never talks to the API server). Only this sidecar gets a projected,
          # short-lived token, at the path kubectl's in-cluster config reads.
          volumeMounts:
            - name: kubectl-proxy-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: kubectl-proxy-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # optional: a key not yet minted leaves the proxies answering 503
        # (ingest_credential_unavailable) instead of holding the whole portal
        # in ContainerCreating. Mode 0440 + fsGroup: readable by uid 999 only.
        - name: signal-ingest-key
          secret:
            secretName: fe-signalloom-ingest-key
            optional: true
            defaultMode: 0440
        - name: afm-importer-key
          secret:
            secretName: fe-signalloom-afm-importer-key
            optional: true
            defaultMode: 0440
