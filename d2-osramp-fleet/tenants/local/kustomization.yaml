# Local mode: artifacts are pulled from the in-cluster zot registry and
# verified against the cosign key pair generated by `make signing-keys`.
# The JSON patches below index into spec.resources of each ResourceSet:
# index 5 is the OCIRepository (after Namespace, ConfigMap, Secret,
# ServiceAccount, and the role binding). Keep the indexes in sync with
# tenants/base if the resource lists change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - signalloom.yaml
patches:
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: apps
    patch: |
      - op: replace
        path: /spec/resources/5/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: infra
    patch: |
      - op: replace
        path: /spec/resources/5/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: olly
    patch: |
      - op: replace
        path: /spec/resources/5/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
