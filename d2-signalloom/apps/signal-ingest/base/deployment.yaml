# Signal Fusion: ingest, correlation and query service for signal observations.
# Stateless — correlates cross-layer signals and maintains provisional actors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-ingest
  labels:
    app.kubernetes.io/name: signal-ingest
    app.kubernetes.io/component: signal-fusion
    app.kubernetes.io/part-of: signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-ingest
        app.kubernetes.io/component: signal-fusion
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Group-owns projected volumes (the static-key files are 0440), so the
        # non-root process can read its keys and nothing else in the pod can.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signal-ingest
          # Immutable, per-source tag in the in-cluster zot: src-<16 hex> is
          # `go run ./cmd/image-tag`, a digest of exactly the files the
          # Dockerfile's go build compiles. Never a side-loaded :local or a
          # mutable :latest, which cannot tell a rebuilt image from a stale one.
          # TestReconciledManifestRunsTheImageBuiltFromThisSource fails when the
          # source moves and this pin does not; re-pin, build and push with
          # `make -C d2-signalloom signal-ingest-image-push`.
          image: ${IMAGE_BASE}/signalloom/apps/signal-ingest:src-83f8420646df2c8d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
            # Probe-only listener (api.NewProbeHandler). The API port answers
            # the anonymous kubelet with 401 because every route there is
            # authenticated, so the probes cannot use it. This port is not in
            # the Service and allow-signal-ingest-ingress does not admit it.
            - name: probe
              containerPort: 8083
          # Startup and liveness use /healthz, which checks nothing external.
          # Readiness uses /readyz, which verifies the audit backend is
          # reachable. The split is deliberate: an unreachable database must
          # take the pod out of the Service (it cannot record what it does),
          # but must never restart it -- restarting cannot make a database
          # reachable, and that loop is precisely the failure this deployment
          # was stuck in before the connect was bounded.
          #
          # The 20s this budget allows (periodSeconds 2 x failureThreshold 10)
          # is the constraint audit.DefaultConnectTimeout is sized against;
          # TestDefaultConnectTimeout_FitsStartupProbeBudget asserts the
          # arithmetic, so changing either number in isolation fails the build.
          startupProbe:
            httpGet:
              path: /healthz
              port: probe
            failureThreshold: 10
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            # /readyz pings Postgres, bounded by api.readyCheckTimeout (2s).
            # The default timeoutSeconds of 1 would cut the handler off before
            # its own bound elapsed, turning a diagnosable 503 body into a
            # probe timeout. 3s leaves the handler room to answer.
            timeoutSeconds: 3
          env:
            # Selects the Parquet-backed FrostDB store (store/factory_frostdb.go).
            # This is load-bearing and silent if wrong: NewStoreFromEnv returns an
            # in-memory store for ANY other value, including unset, so the claim
            # below would be mounted, empty, and never written to -- a pod that
            # reports healthy while losing every observation on restart. It also
            # requires an image built `-tags frostdb`; without the tag the
            # !frostdb factory ignores this value entirely.
            # TestReconciledManifestStoresSignalsDurably asserts both halves.
            - name: SIGNAL_STORE
              value: frostdb
            - name: SIGNAL_STORE_DIR
              value: /data/signals
            # SLAWS v2 D6, ISC-51: observation-policy bundles are Flux-reconciled
            # FILES, loaded once at boot, never registered over the API. This is
            # the SAME ConfigMap policy-engine mounts (declared once in
            # apps/policy-engine/base/bundles-configmap.yaml and rendered from
            # policy/bundles/) at the same path, because both apps share the
            # fe-signalloom namespace under the fe-signalloom kustomization's
            # targetNamespace. Referenced, never duplicated: two copies of a
            # bundle set is two policies that can disagree.
            #
            # A missing or empty mount is zero bundles and a startup WARNING
            # naming the directory, not a boot failure -- every deployment
            # predates this feature. A bundle that fails to conform IS a boot
            # failure: a half-loaded policy set is indistinguishable at runtime
            # from a policy set that chose not to detect anything.
            - name: POLICY_BUNDLES_DIR
              value: /etc/policy-engine/bundles
            # SLAWS v2 D5: where a stage-2 decision is alerted. Unset means
            # decisions are stored and not alerted, which is the correct default
            # while every shipped bundle is in shadow mode. Delivery is bounded
            # (3 attempts, 5s total) and runs off the ingest path, so a dead
            # webhook cannot slow a collector.
            - name: POLICY_ALERT_WEBHOOK_URL
              value: ""
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database
                  key: DATABASE_URL
            # The shared discovery-portal-database DSN carries no sslmode, and
            # the in-cluster Postgres serves plaintext -- fe-signalloom's
            # psycopg client defaults to sslmode=prefer and silently falls back
            # to it. lib/pq defaults to sslmode=require instead and hard-fails
            # with "pq: SSL is not enabled on the server", so the two clients
            # disagree about the same DSN.
            #
            # This was a THIRD defect, hidden behind the startup hang: with the
            # network path repaired but this unset, the connect gets far enough
            # to be refused at the TLS negotiation. On the code that shipped it
            # would have surfaced as db.Ping() returning an error, main.go
            # falling back to NopWriter, and a 1/1 Running pod auditing nothing.
            #
            # Declared here rather than defaulted in Go on purpose. Whether an
            # audit connection runs without TLS is a posture decision for a
            # compliance product, and it belongs somewhere an operator reads it
            # -- not buried in a driver default. pq applies PGSSLMODE with LOWER
            # precedence than the DSN, so adding sslmode to the secret later
            # overrides this line rather than fighting it.
            - name: PGSSLMODE
              value: disable
            - name: IDENTITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database
                  key: IDENTITY_ENCRYPTION_KEY
            - name: SIGNAL_INGEST_PROBE_PORT
              value: "8083"
          # SIGNAL_AUTH_*: the non-secret half of every static key, and the
          # (disabled-by-default) JWT-SVID settings. main exits 1 with neither
          # a static key nor a JWKS.
          envFrom:
            - configMapRef:
                name: signal-ingest-jwt-auth
          volumeMounts:
            - name: signal-store
              mountPath: /data/signals
            # SIGNAL_AUTH_JWKS_FILE. Synced from SPIRE by the bootstrap; the
            # shipped key set is empty and the binary refuses to boot on it.
            - name: signal-auth-jwks
              mountPath: /etc/signal-ingest/auth
              readOnly: true
            # One file per static key, /etc/signal-ingest/static-keys/<name>,
            # each projected from that key's own Secret (minted by
            # scripts/sldc-ingest-bearer.sh). A file, not env: a value never
            # shows in `kubectl describe pod` or /proc/<pid>/environ.
            - name: signal-ingest-static-keys
              mountPath: /etc/signal-ingest/static-keys
              readOnly: true
            # The observation-policy bundle set named by POLICY_BUNDLES_DIR.
            # readOnly because policy is git: the only writer is Flux.
            - name: policy-bundles
              mountPath: /etc/policy-engine/bundles
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        # The FrostDB Parquet segments and their attestation evidence. The ephemeral
        # volume this replaces was deleted with the pod, so every reschedule or
        # image bump silently discarded the backlog the DuckDB last-resort runbook
        # and the segment verifier both read -- see
        # docs/signalloom/runbooks/slaws-duckdb-last-resort.md.
        - name: signal-store
          persistentVolumeClaim:
            claimName: signal-store
        - name: signal-auth-jwks
          configMap:
            name: signal-ingest-jwks
        # policy-engine-bundles is OWNED by apps/policy-engine/base/bundles-configmap.yaml
        # and is referenced here, not redeclared. optional: true so a cluster that
        # has not yet reconciled the bundle ConfigMap gets a pod that boots with
        # zero bundles and says so in the log, rather than one stuck in
        # ContainerCreating -- the same fail-open choice the static-keys mounts make.
        - name: policy-bundles
          configMap:
            name: policy-engine-bundles
            optional: true
        # optional: true per source, so one caller's Secret not yet minted
        # disables that caller's key (logged at ERROR) instead of holding the
        # whole pod in ContainerCreating. Every key named in
        # SIGNAL_AUTH_STATIC_KEYS needs a source here; asserted by
        # TestReconciledManifestTakesKeyValuesFromSecretsOnly.
        - name: signal-ingest-static-keys
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: signal-ingest-key-stun-sentinel
                  optional: true
                  items:
                    - key: token
                      path: stun-sentinel
                    - key: expires
                      path: stun-sentinel.expires
              - secret:
                  name: signal-ingest-key-signalloom-warden
                  optional: true
                  items:
                    - key: token
                      path: signalloom-warden
                    - key: expires
                      path: signalloom-warden.expires
              - secret:
                  name: signal-ingest-key-fe-signalloom-gateway
                  optional: true
                  items:
                    - key: token
                      path: fe-signalloom-gateway
                    - key: expires
                      path: fe-signalloom-gateway.expires
              - secret:
                  name: signal-ingest-key-signalfusion-demo
                  optional: true
                  items:
                    - key: token
                      path: signalfusion-demo
                    - key: expires
                      path: signalfusion-demo.expires
              - secret:
                  name: signal-ingest-key-sldc-live-bats
                  optional: true
                  items:
                    - key: token
                      path: sldc-live-bats
                    - key: expires
                      path: sldc-live-bats.expires
              - secret:
                  name: signal-ingest-key-sldc-evidence-reader
                  optional: true
                  items:
                    - key: token
                      path: sldc-evidence-reader
                    - key: expires
                      path: sldc-evidence-reader.expires
