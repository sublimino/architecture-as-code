apiVersion: signalloom.controlplane.io/v1alpha1
kind: AgentProfile
metadata:
  name: agent-nono-evidenced
  labels:
    signalloom.ai/fleet: demo
    signalloom.ai/team: governance
    signalloom.io/agent: demo
    signalloom.io/workload-profile: nono-evidenced
spec:
  type: demo-agent
  team: governance
  trustProfile: high
  riskClass: medium
  gracePeriod: 0h
  dependencies: []
  namespace: fe-signalloom-agents
  spiffe:
    trustDomain: signalloom.demo
    path: /ns/fe-signalloom-agents/sa/agent-nono-evidenced
  openbao:
    authMount: jwt/agents
    kvPath: secret/data/agents/agent-nono-evidenced
    policies: [agent-governance-read]
