# One Flux-managed baseline agent so the namespace always contains >=1 agent
# even before `make demo-signalloom-agents-up` runs an ephemeral cohort.
# Inert podinfo — it just sits there; only its metadata is read. Compliance and
# posture are intentionally unconfigured, so the dashboard renders them as zero.
# Label schema mirrors kagent's stable-selector idea (signalloom.ai/agent=true)
# plus the k8s recommended app.kubernetes.io/* labels; DNS-unsafe display
# strings live in annotations.
apiVersion: v1
kind: Pod
metadata:
  name: agent-sir-lancelot
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/managed-by: signalloom-governor
    app.kubernetes.io/instance: sir-lancelot
    signalloom.ai/agent: "true"
    signalloom.ai/agent-name: sir-lancelot
    signalloom.ai/agent-type: signal-loom-built
    signalloom.ai/framework: kagent
    signalloom.ai/model: claude-opus-4-8
    signalloom.ai/state: idle
  annotations:
    signalloom.ai/agent-display-name: "Sir Lancelot"
    signalloom.ai/model-full: "anthropic/claude-opus-4-8"
    signalloom.ai/description: "Inert demo agent — brave, and prone to charging in."
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: ghcr.io/stefanprodan/podinfo:6.7.1
      ports:
        - name: http
          containerPort: 9898
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
  volumes:
    - name: tmp
      emptyDir: {}
    - name: data
      emptyDir: {}
