  - id: AC-6
    name: AC-6 Least Privilege
    checks:
    - id: container-run-as-non-root
      name: Container runs as non-root
      description: Enforces least privilege execution preventing root user execution.
      celExpression: object.spec.containers.all(c, c.securityContext.runAsNonRoot == true)
      severity: high
      remediation: "Configure runAsNonRoot: true in container securityContext."
      riskTriple:
        min: 10000
        mode: 50000
        max: 200000
      freqTriple:
        min: 0.5
        mode: 2
        max: 6
      policyVersions:
      - v2.0.0
      - v2.1.0

      name: Container runs as non-root
