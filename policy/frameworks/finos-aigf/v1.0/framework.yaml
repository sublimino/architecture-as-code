- id: aigf-security
  name: "AIGF: Prompt Injection and Boundary Defense"
  controls:
  - id: AIGF-2.1
    name: AIGF-2.1 Adversarial Input and Guardrail Protection
    checks:
    - id: prompt-injection-guardrail-active
      name: Active prompt injection filter guardrail
      description: Enforces real-time input and output guardrails to detect adversarial prompt injection attacks.
      celExpression: has(agent.guardrails) && agent.guardrails.prompt_injection_filter == true
      severity: critical
      remediation: Enable prompt injection detection filter in agent inference pipeline.
      riskTriple:
        min: 18000
        mode: 75000
        max: 300000
      freqTriple:
        min: 0.4
        mode: 1.4
        max: 4.2
      policyVersions:
