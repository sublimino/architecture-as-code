# CronJob: periodic SPIRE → OpenBao JWT key re-sync
#
# SPIRE rotates its CA on ca_ttl (default 24h). At ca_ttl*5/6 = 20h, the new
# key starts signing JWTs while OpenBao still holds a snapshot of the old keys.
# Every SPIFFE login fails until the snapshot is refreshed.
#
# This CronJob runs every 8 hours — at least twice in the 20h window before
# drift causes an outage. Even if one run fails, the next run at t+8h still
# lands before the 20h deadline.
#
# The CronJob sources spire-trust-anchor.sh from a ConfigMap and calls
# sync_openbao_jwt_validation, which reads SPIRE's current JWT-SVID keys via
# `kubectl exec` and writes them to OpenBao's auth/jwt/config.
#
# Long-term fix: switch to jwks_url (see terraform/notes/l-jwks-url-upgrade-path.md).
#
# ── The ServiceAccount, Role and RoleBinding are NOT here. Do not move them
#    back. ────────────────────────────────────────────────────────────────
#
# They live in the `signalloom-spire-rbac` ResourceSet, in
# d2-osramp-fleet/tenants/local/signalloom.yaml, beside the spire-agent RBAC.
#
# This slice reconciles as the namespace-scoped `flux` ServiceAccount, which
# holds ClusterRole/admin but NOT `escalate` on roles. Creating a RoleBinding
# therefore makes the API server resolve its roleRef to run the
# privilege-escalation check, and kustomize-controller server-dry-runs the
# ENTIRE object set to build its change set BEFORE applying any of it. A dry
# run never persists the Role, so the RoleBinding fails the lookup with
#
#   RoleBinding/inf-bao/spire-openbao-sync not found
#
# and that aborts the whole set — so the Role is never applied for real and
# every later reconcile fails identically. It is a deadlock, not a race: no
# amount of retrying resolves it.
#
# This is the SECOND time the defect has landed. The first was
# supercred-demo-runner-agents, which left fe-signalloom empty for six
# consecutive reconciles over twenty minutes; the long comment at the Role in
# signalloom.yaml is the canonical write-up. Authoring these three objects here
# reintroduced it and froze the entire inf-bao slice at the last revision that
# predated this file — nine objects across three files never applied, the
# CronJob among them, so the 20h JWT-key re-sync this file exists to provide
# was never actually running. inf-bao/infra-configs blocked behind it on
# dependsOn, and the agent-trust ResourceSet behind that.
#
# Applied from the ResourceSet, the cluster-admin flux-system ServiceAccount
# binds them with no escalation check, in any order.
#
# d2-signalloom/test/spire-openbao-sync-rbac-placement.bats pins this.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-openbao-sync-script
data:
  sync.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    NAMESPACE="${NAMESPACE:-inf-bao}"
    BAO_ROOT_TOKEN="${BAO_ROOT_TOKEN:-signalloom-demo-root-token}"

    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    # shellcheck source=scripts/lib/spire-trust-anchor.sh
    source "${SCRIPT_DIR}/spire-trust-anchor.sh" 2>/dev/null \
      || source /scripts/spire-trust-anchor.sh 2>/dev/null \
      || { printf 'FATAL: cannot source spire-trust-anchor.sh\n' >&2; exit 1; }

    printf '[%s] spire-openbao-sync: starting key sync in namespace %s\n' \
      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$NAMESPACE"

    if sync_openbao_jwt_validation "$NAMESPACE" "$BAO_ROOT_TOKEN"; then
      printf '[%s] spire-openbao-sync: SUCCESS\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    else
      printf '[%s] spire-openbao-sync: FAILED — see errors above\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2
      exit 1
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spire-openbao-sync
  labels:
    app.kubernetes.io/name: spire-openbao-sync
    app.kubernetes.io/part-of: signalloom-bao-proof
spec:
  schedule: "0 */8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: spire-openbao-sync
        spec:
          serviceAccountName: spire-openbao-sync
          restartPolicy: Never
          containers:
            - name: sync
              # bitnamiLEGACY, not bitnami. Bitnami removed the versioned tags
              # from docker.io/bitnami in 2025, so `bitnami/kubectl:1.31` now
              # resolves to NotFound. This CronJob had never run — it was in the
              # set the privilege-escalation deadlock stopped Flux from ever
              # applying — so the dead pin was never exercised and nothing
              # reported it. Left unfixed, the 8-hourly JWT re-sync this CronJob
              # exists to perform would ImagePullBackOff forever, and the 20h
              # CA-rotation outage it prevents would return unannounced.
              #
              # Do NOT swap this for registry.k8s.io/kubectl: that image is
              # distroless and cannot run `bash /scripts/sync.sh`.
              image: docker.io/bitnamilegacy/kubectl:1.31
              command: ["bash", "/scripts/sync.sh"]
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: BAO_ROOT_TOKEN
                  value: signalloom-demo-root-token
              volumeMounts:
                - name: sync-script
                  mountPath: /scripts/sync.sh
                  subPath: sync.sh
                - name: trust-anchor-lib
                  mountPath: /scripts/spire-trust-anchor.sh
                  subPath: spire-trust-anchor.sh
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
          volumes:
            - name: sync-script
              configMap:
                name: spire-openbao-sync-script
                defaultMode: 0755
            - name: trust-anchor-lib
              configMap:
                name: spire-trust-anchor-lib
                defaultMode: 0644
