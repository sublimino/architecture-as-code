apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-deploy-gate
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/framework: "custom"
    signalloom.ai/role: "gate"
    signalloom.ai/harness: "go-gate"
    signalloom.ai/model: "deterministic"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-deploy-gate
  template:
    metadata:
      labels:
        app: prod-deploy-gate
        signalloom.ai/agent: "true"
        signalloom.ai/framework: "custom"
        signalloom.ai/role: "gate"
        signalloom.ai/harness: "go-gate"
        signalloom.ai/model: "deterministic"
        signalloom.ai/tenant: "controlplane"
        signalloom.ai/project: "osramp"
    spec:
      serviceAccountName: prod-deploy-gate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prod-deploy-gate
          image: prod-deploy-gate:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GATE_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: prod-deploy-gate-secrets
                  key: hmac-secret
            - name: GATE_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: prod-deploy-gate-config
                  key: webhook-url
                  optional: true
            - name: GATE_TIMEOUT
              value: "30m"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # OpenBao Agent sidecar — fetches secrets via SPIFFE JWT auth
        # Writes this pod's JWT-SVID (audience openbao-supercredential, the
        # bound_audiences of role signalloom-agent-generic) from the SPIRE
        # socket into a memory volume for the openbao-agent jwt method, as
        # fleet-manager's jwt-svid does. The jwt method reads a FILE; pointed
        # at the socket it never authenticated (live, 2026-10-03). Refreshed
        # every 60s, written then renamed so the agent never reads half a
        # file; 0600, read by the openbao-agent as the same uid (100). Pinned
        # by d2-signalloom/test/openbao-agent-jwt-source.bats.
        - name: jwt-svid
          image: signalloom-spire-helper:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if /usr/local/bin/signalloom-spire-proof write --audience openbao-supercredential \
                     --socket /run/spire/sockets/agent.sock \
                     --output /var/run/secrets/spiffe/jwt.tmp; then
                  mv -f /var/run/secrets/spiffe/jwt.tmp /var/run/secrets/spiffe/jwt
                else
                  echo "jwt-svid: fetch failed; keeping previous SVID" >&2
                fi
                sleep 60
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spiffe-jwt
              mountPath: /var/run/secrets/spiffe
        - name: openbao-agent
          image: openbao/openbao:2.1.0
          # bao directly, not the openbao image's docker-entrypoint.sh, whose
          # `id -u openbao` reads /etc/passwd inside a sentinel-watched pod and
          # froze agent-cardvault at birth (live, 2026-10-03). HOME keeps bao's
          # home lookup off the user database. Pinned estate-wide by
          # d2-signalloom/test/openbao-sidecar-entrypoint.bats.
          command: ["bao", "agent", "-config=/etc/openbao/agent.hcl"]
          env:
            - name: HOME
              value: /tmp
            - name: SPIFFE_ID
              value: "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/prod-deploy-gate"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: bao-home
              mountPath: /home/openbao
            - name: spiffe-jwt
              mountPath: /var/run/secrets/spiffe
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: openbao-agent-config
          configMap:
            name: prod-deploy-gate-openbao-config
        - name: vault-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: bao-home
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: spiffe-jwt
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
