id: nist-800-53
name: NIST SP 800-53 Rev. 5
version: v2.1.0
controlSets:
- id: ac-access-control
  name: "AC: Access Control"
  controls:
  - id: AC-3
    name: AC-3 Access Enforcement
    checks:
    - id: no-automount-sa-token
      name: Service account token auto-mount disabled
      description: Prevents automatic injection of default API credentials into container pods.
      celExpression: object.spec.automountServiceAccountToken == false
      severity: high
      remediation: "Set automountServiceAccountToken: false in pod spec."
      riskTriple:
        min: 5000
        mode: 25000
        max: 100000
      freqTriple:
        min: 0.5
        mode: 1.5
        max: 4
      policyVersions:
      - v2.0.0
      - v2.1.0

      name: Service account token auto-mount disabled
      description: Prevents automatic injection of default API credentials into container pods.
      celExpression: object.spec.automountServiceAccountToken == false
