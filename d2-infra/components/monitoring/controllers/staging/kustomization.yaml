apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: ResourceSet
      name: kube-prometheus-stack
    patch: |
      - op: replace
        path: /spec/resources/0/spec/values/prometheus/prometheusSpec/retention
        value: 24h
      - op: replace
        path: /spec/resources/0/spec/values/prometheus/prometheusSpec/storageSpec
        value:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi
