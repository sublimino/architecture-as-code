# Nono Landlock sandbox profile: strict
#
# This profile confines the coding agent to the workspace and tmp directories.
# All filesystem access outside these paths is denied by the kernel (Linux
# Landlock LSM). Network access is restricted to localhost only.

[landlock]
# Filesystem access
allow_read = ["/workspace", "/tmp", "/usr/lib", "/lib", "/run/spire/sockets", "/vault/secrets"]
allow_write = ["/workspace", "/tmp"]

# Network access — localhost for OpenBao sidecar loopback proxy (8200),
# plus the SPIRE workload API socket for SVID refresh.
allow_connect = ["127.0.0.1:*", "127.0.0.1:8200"]
deny_connect = ["0.0.0.0/0"]
