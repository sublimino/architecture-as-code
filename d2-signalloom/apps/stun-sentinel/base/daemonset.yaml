# Base DaemonSet specification for stun-sentinel
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: stun-sentinel
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: stun-sentinel
    app.kubernetes.io/component: tier-0-containment
    app.kubernetes.io/part-of: signalloom
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: stun-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stun-sentinel
        app.kubernetes.io/component: tier-0-containment
        app.kubernetes.io/part-of: signalloom
    spec:
      serviceAccountName: stun-sentinel
      hostPID: true
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: stun-sentinel
          image: ghcr.io/controlplaneio-in-toto/stun-sentinel:v0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_PTRACE
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
              drop:
                - ALL
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: false
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: DirectoryOrCreate
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
