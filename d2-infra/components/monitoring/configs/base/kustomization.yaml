# FLUX ENVSUBST: YES — postBuild.substituteFrom is configured on the Flux
# Kustomization that reconciles this directory. Flux runs envsubst over all
# rendered manifests: use $${VAR} to pass a literal $ through to the container,
# and ${VAR} for values Flux should substitute from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitor.yaml
  - servicemonitor.yaml
  - rbac.yaml
configMapGenerator:
  - name: flux-grafana-dashboards
    files:
      - dashboards/flux-k8s-api-performance.json
      - dashboards/flux-performance.json
      - dashboards/cluster.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: flux
        app.kubernetes.io/component: monitoring
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
