# TOMBSTONE. This file no longer declares anything.
#
# It was the CRKC-P1-2 standalone install bundle: a `signalloom-system`
# Namespace labelled pod-security enforce=privileged, a ServiceAccount,
# a ClusterRole/ClusterRoleBinding, a privileged sentinel DaemonSet, a headless
# Service on 8080 and a NetworkPolicy. Measured 2026-10-01: nothing applied it.
# No kustomization listed it, no script applied it, no Flux Kustomization named
# it; its only references in the tree were the two Go tests that asserted on it
# and the docs that described it. It was a third sentinel spec, in a third
# namespace, that had never run.
#
# REPLACEMENT — the one sentinel manifest, in fe-signalloom-agents:
#   d2-signalloom/infra/agent-swarm/signalloom-stun-sentinel/
#     daemonset.yaml        the DaemonSet
#     service-account.yaml  the ServiceAccount
#     rbac.yaml             namespace-scoped Role + RoleBinding (not ClusterRole)
#     configmap.yaml        per-cluster SIGNAL_INGEST_URL
#
# Three things this bundle had and the canonical base deliberately does not:
#
#   1. A Service. The unified deployable
#      (apps/signalloom-stun-sentinel) exposes only /healthz and /readyz on
#      HEALTH_ADDR (:8081), which the kubelet reaches directly on a hostNetwork
#      pod. The :8080 /stun HTTP API belongs to the OTHER binary,
#      apps/stun-sentinel/cmd/stun-sentinel, which is not deployed. A Service
#      fronting a port nothing serves is how "the dispatcher targets a route no
#      deployed sentinel serves" happened; do not re-add one without first
#      deciding which binary answers it.
#   2. A privileged Namespace. The canonical profile is privileged: false, so
#      the namespace does not need a privileged Pod Security level.
#   3. Cluster-scoped RBAC. The sentinel watches one namespace
#      (WATCH_NAMESPACE=fe-signalloom-agents), so a namespaced Role is enough.
#
# The sibling stun-sentinel-networkpolicy.yaml in this directory is untouched
# and equally unreferenced; it is outside this consolidation's scope.
#
# deploy-side contract tests: apps/stun-sentinel/deploy/manifest_test.go
# (TestRetiredManifestsStayRetired fails if a DaemonSet reappears here).
