apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - ebpf-sentinel-rbac.yaml
  - networkpolicy.yaml
  # Shared prerequisite for every Agent CR in this namespace — without it they
  # do not compile. Listed after namespace.yaml because it lives in it.
  # Requires kagent CRDs (kagent.dev/v1alpha2); excluded until the kagent
  # chart is deployed on the cluster.
  # - remotemcpserver.yaml
