apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-nono-kusari
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/instance: agent-nono-kusari
    signalloom.ai/agent: "true"
    signalloom.ai/tenant: "tenant-demo"
    signalloom.ai/agent-name: agent-nono-kusari
    signalloom.ai/agent-type: demo
    signalloom.ai/framework: custom
    signalloom.ai/model: claude-sonnet-4
    signalloom.ai/state: "active"
    signalloom.io/agent: demo
    signalloom.io/workload-profile: nono-kusari-enforced
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-nono-kusari
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalloom-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: signalloom
        app.kubernetes.io/instance: agent-nono-kusari
        signalloom.ai/agent: "true"
        signalloom.ai/tenant: "tenant-demo"
        signalloom.ai/agent-name: agent-nono-kusari
        signalloom.ai/agent-type: demo
        signalloom.ai/framework: custom
        signalloom.ai/model: claude-sonnet-4
        signalloom.ai/state: "active"
        signalloom.io/agent: demo
        signalloom.io/workload-profile: nono-kusari-enforced
      annotations:
        signalloom.ai/agent-display-name: "Kusari Agent (Nono Enforced)"
        signalloom.ai/description: "Kusari pilot stub under fail-closed Linux Landlock enforcement via the nono shim; its /act/* provocations are denied at the kernel LSM and surface as denial observations."
        signalloom.ai/model-full: "anthropic/claude-sonnet-4"
        spiffe.io/spiffe-id: "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/agent-nono-kusari"
        signalloom.io/workload-profile: "nono-kusari-enforced"
    spec:
      serviceAccountName: agent-nono-kusari
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Enforcement image built from Dockerfile.nono. Its ENTRYPOINT wraps
          # PID 1 in the REAL nono binary (nono run --listen-port 8080 -r /usr
          # ... -- /kusari-agent), so a capability allow-list is installed at the
          # kernel Landlock LSM before the agent runs: no shim, no simulation, no
          # unconfined fallback. imagePullPolicy Never — the lead loads the local
          # image onto the kind node.
          image: kusari-agent-nono:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agent-nono-kusari-config
          env:
            - name: SPIFFE_ID
              value: "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/agent-nono-kusari"
            - name: SPIFFE_SOCKET
              value: "/run/spire/sockets/agent.sock"
            # nono (the parent, before it applies the sandbox) persists session
            # state. The root filesystem is read-only, so point every XDG dir at
            # a dedicated writable emptyDir. It is /var/nono-state, which is NOT
            # in the child's allow-list, so the sandboxed agent cannot read its
            # own sandbox internals. HOME stays /home/nono (not writable, not
            # allowed) so nono's deny_credentials paths don't overlap an allow.
            - name: HOME
              value: "/home/nono"
            - name: XDG_STATE_HOME
              value: "/var/nono-state/state"
            - name: XDG_CONFIG_HOME
              value: "/var/nono-state/config"
            - name: XDG_CACHE_HOME
              value: "/var/nono-state/cache"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nono-state
              mountPath: /var/nono-state
      volumes:
        - name: spiffe-workload-api
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: nono-state
          emptyDir: {}
