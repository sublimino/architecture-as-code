[pytest]
# auto lets pytest-asyncio run the `async def` AgentEvaluator eval without a
# per-test marker; the sync unit tests (asyncio.run inside) are unaffected.
asyncio_mode = auto
# Bare `pytest` collects the unit suite and the eval; the image build and
# `make olly-eval` pass explicit paths, which override this.
testpaths = tests olly_sentinel
