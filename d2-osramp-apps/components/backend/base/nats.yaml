apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats-repo
spec:
  interval: 1h
  url: https://nats-io.github.io/k8s/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  releaseName: nats
  chart:
    spec:
      chart: nats
      sourceRef:
        kind: HelmRepository
        name: nats-repo
      version: "1.2.6" # Latest stable version
  interval: 50m
  driftDetection:
    mode: enabled
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
  values:
    config:
      jetstream:
        enabled: true
        memoryStore:
          enabled: true
          maxSize: 1Gi
      cluster:
        enabled: true
        replicas: 3
    nats:
      logging:
        debug: false
        trace: false
      limits:
        maxConnections: 100
        maxSubscriptions: 1000
    container:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    reloader:
      enabled: true
    serviceMonitor:
      enabled: true
      labels:
        app.kubernetes.io/component: monitoring
