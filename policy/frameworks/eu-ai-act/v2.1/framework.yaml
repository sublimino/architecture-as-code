- id: art14-human-oversight
  name: ART-14 Human Oversight Mechanisms
  controls:
  - id: ART-14.4
    name: ART-14(4) Human-in-the-Loop Authorization
    checks:
    - id: block-unauthorized-host-exec
      name: Privileged action human authorization SVID
      description: Mandates human approval credential for sensitive host execution or IAM modification actions.
      celExpression: "request.tool_call.action in ['exec', 'write_file', 'modify_iam'] ? (has(request.context.claims) && request.context.claims.exists(c, c.type == 'human_approval_svid' && c.valid == true)) : true"
