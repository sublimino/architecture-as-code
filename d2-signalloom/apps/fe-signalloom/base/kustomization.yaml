apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - bao-spire-proof.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - api-service.yaml
  - dashboard-deployment.yaml
  - dashboard-service.yaml
  - gateway-route.yaml
  # Agent inventory: namespace + a Flux-managed baseline agent, and read-only
  # RBAC letting the fake-integration-proxy discover agents for GET /api/agents.
  - agents-namespace.yaml
  - agents-rbac.yaml
  - agents-baseline.yaml
