apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # networkpolicy.yaml is not optional here. fe-signalloom is a default-deny
  # namespace, so a workload without one has no egress at all; dropping this
  # line reproduces the CrashLoopBackOff the policy was written to fix.
  # test/networkpolicy-coverage.bats fails if any workload in the namespace
  # loses its egress policy.
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  # Every route is authenticated (api.ProtectedRouter), and main refuses to
  # start without SIGNAL_AUTH_* configuration. This is that configuration;
  # without it an image built from HEAD exits 1 on boot.
  - ../deploy
