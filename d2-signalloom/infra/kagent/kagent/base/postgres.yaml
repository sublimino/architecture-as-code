---
apiVersion: v1
kind: Service
metadata:
  name: kagent-postgres
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent-postgres
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: state-store
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: kagent-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-postgres
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent-postgres
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: state-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-postgres
        app.kubernetes.io/part-of: signalloom
        app.kubernetes.io/component: state-store
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: kagent
            - name: POSTGRES_USER
              value: kagent
            - name: POSTGRES_PASSWORD
              value: kagent-db-password-local
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U kagent -d kagent
            initialDelaySeconds: 3
            periodSeconds: 5
