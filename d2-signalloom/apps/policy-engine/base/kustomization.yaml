# FLUX ENVSUBST: YES — this directory is pulled in by
# apps/fe-signalloom/base/kustomization.yaml, which the signalloom-apps Flux
# Kustomization reconciles with postBuild.substituteFrom configured. Flux runs
# envsubst over every rendered manifest here, so use $${VAR} to pass a literal
# $ through to a container and ${VAR} only for values Flux should substitute
# from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

