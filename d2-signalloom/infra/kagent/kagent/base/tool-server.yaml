---
apiVersion: v1
kind: Service
metadata:
  name: kagent-tool-server
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent-tool-server
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: tool-server
spec:
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: kagent-tool-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-tool-server
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent-tool-server
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: tool-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-tool-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-tool-server
        app.kubernetes.io/part-of: signalloom
        app.kubernetes.io/component: tool-server
    spec:
      serviceAccountName: kagent-tool-server
      containers:
        - name: tool-server
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import http.server, socketserver, json

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ('/health', '/healthz', '/readyz'):
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/json')
                          self.end_headers()
                          self.wfile.write(b'{"status": "ready", "component": "tool-server", "tools": ["k8s_get_resources", "k8s_get_available_api_resources"]}')
                      elif self.path == '/mcp/tools':
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/json')
                          self.end_headers()
                          self.wfile.write(b'{"tools": [{"name": "k8s_get_resources", "description": "Fetch Kubernetes cluster resources"}]}')
                      else:
                          self.send_response(200)
                          self.send_header('Content-Type', 'text/plain')
                          self.end_headers()
                          self.wfile.write(b'Kagent Tool Server')

                  def do_POST(self):
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(b'{"result": {"resources": ["pods", "services", "deployments"], "count": 3}}')

                  def log_message(self, format, *args):
                      return

              with socketserver.TCPServer(("", 8080), Handler) as httpd:
                  print("Serving Kagent MCP Tool Server on port 8080...")
                  httpd.serve_forever()
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
