# eBPF Stun Sentinel RBAC, cluster-scoped half only.
#
# The namespaced Role and RoleBinding "stun-sentinel" live in exactly one
# place: signalloom-stun-sentinel/rbac.yaml, next to the DaemonSet and its
# ServiceAccount (Flux Kustomization agent-signalloom-stun-sentinel). They
# were also declared here, applied by agent-swarm-base, and last writer won:
# the RoleBinding flapped between SA stun-sentinel (the one the DaemonSet runs
# as) and SA signalloom-stun-sentinel (declared in rbac.yaml, used by no
# workload). test/stun-sentinel-daemonset.bats pins one owner per RBAC object
# and that every stun-sentinel binding names the DaemonSet's SA.
---
# Cluster-scoped: the sentinel reads node cgroup paths for eBPF program
# attachment points. This is read-only and cannot be namespace-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stun-sentinel-node-reader
  labels:
    app.kubernetes.io/name: stun-sentinel
    app.kubernetes.io/part-of: signalloom-swarm
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stun-sentinel-node-reader
  labels:
    app.kubernetes.io/name: stun-sentinel
    app.kubernetes.io/part-of: signalloom-swarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stun-sentinel-node-reader
subjects:
  - kind: ServiceAccount
    name: stun-sentinel
    namespace: fe-signalloom-agents
