apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Stateful dependencies only accept their declared service ports from the
# portal tenant. Their internal replication/control traffic remains local.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dependency-traffic
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fe-signalloom
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
    # signal-ingest writes the Signal Fusion audit trail (signal_audit_trail)
    # to Postgres. It is a SECOND workload in fe-signalloom that needs this
    # namespace, and the rule above does not cover it: that one is scoped to
    # app.kubernetes.io/name=fe-signalloom, and signal-ingest carries its own
    # name label, so its packets were dropped here even once its own egress
    # policy allowed them out.
    #
    # This is the third half of what looked like a two-part pair, and it is the
    # half that stays hidden longest: the caller's egress rule is present, DNS
    # resolves, the connection is simply never answered. Reading either
    # namespace's policies alone shows nothing wrong.
    #
    # Postgres only. Deliberately NOT 6379 (Redis) or 9000 (MinIO) -- the
    # service touches neither, and inheriting the port list above just because
    # it was adjacent is how an allowlist stops meaning anything.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: signal-ingest
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Dex accepts OIDC traffic only from the local dashboard tenant.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dex-oidc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dex
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: cluster
      ports:
        - protocol: TCP
          port: 5556
---
# Allow the fe-signalloom HTTPRoute to reference the Dex backend
# service in this namespace via the Gateway.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-dex
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: fe-signalloom
  to:
    - group: ""
      kind: Service
      name: dex
