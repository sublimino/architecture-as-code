# The Role is provisioned by the fleet ResourceSet before this app
# Kustomization. Flux's dry-run then has a persisted Role to validate.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fake-proxy-health-reader
  namespace: fe-signalloom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fe-signalloom-health-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: inf-signalloom
