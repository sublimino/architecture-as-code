---
# OpenBao secret path mapping for the agent swarm.
#
# Each agent retrieves its secrets from OpenBao at a path scoped by its SPIFFE
# ID. The templated policy (signalloom-agent-templated) ensures an agent can
# only read secrets under its own identity:
#
#   secret/data/agents/<spiffe-id>/<key>
#
# This ConfigMap is consumed by the OpenBao Agent sidecar's template stanzas
# to render secrets into /vault/secrets/<env-var-name> files, which the main
# container reads as env vars via `cat` or direct file-mount.
#
# The JSON values list each secret's OpenBao path (relative to the agent's
# SPIFFE-scoped prefix) and the environment variable name it maps to.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-agent-secret-paths
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/component: credential-routing
data:
  prompt-commit-summarizer.json: |
    {"secrets": [{"path": "llm/api-key", "env": "LLM_API_KEY"}]}
  triage-ci-worker.json: |
    {"secrets": [{"path": "github/token", "env": "GITHUB_TOKEN"}]}
  zulip-chat-agent.json: |
    {"secrets": [{"path": "zulip/api-key", "env": "ZULIP_API_KEY"}]}
  cpai-engineer.json: |
    {"secrets": [{"path": "anthropic/api-key", "env": "ANTHROPIC_API_KEY"}]}
  prod-deploy-gate.json: |
    {"secrets": [{"path": "gate/hmac-secret", "env": "GATE_HMAC_SECRET"}]}
  swarm-governor.json: |
    {"secrets": [{"path": "anthropic/api-key", "env": "ANTHROPIC_API_KEY"}]}
