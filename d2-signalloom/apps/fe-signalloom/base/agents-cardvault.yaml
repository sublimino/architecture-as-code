# SuperCred demo agent — DELIBERATELY non-compliant.
#
# This agent pod is intentionally deployed WITHOUT a pod-level securityContext,
# without runAsNonRoot, and without capabilities drop. The compliance scan
# (demo step 3) discovers these gaps and marks the agent out-of-policy.
# The stun flow then revokes its OpenBao credentials and restricts it.
#
# Do NOT "fix" the missing securityContext — it is the demo's plot point.
apiVersion: v1
kind: Pod
metadata:
  name: agent-cardvault
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/managed-by: signalloom-governor
    app.kubernetes.io/instance: cardvault
    signalloom.ai/agent: "true"
    signalloom.ai/agent-name: cardvault
    signalloom.ai/agent-type: supercred-demo
    signalloom.ai/framework: custom
    signalloom.ai/model: gpt-4o
    # signalloom.ai/state and the two stun annotations are runtime state,
    # written by the stun path and read by the dashboard.
    #
    # They MUST be declared here AND ignored by the Kustomization
    # (d2-osramp-fleet/tenants/base/apps.yaml .spec.ignore). Declared-and-
    # ignored is the mechanism; deleting the declaration DEFEATS it.
    #
    # Measured with a matched control (_research-flux-ignore.md TEST G/H):
    #   declared + ignore rule  -> label and BOTH annotations survive reconciles
    #   declared, ignore removed -> all three reverted           (control)
    #   NOT declared + ignore rule -> annotations WIPED, label DELETED
    #
    # The last case is strictly worse than the original bug: the label is
    # removed outright rather than reverted, so the dashboard cannot even show
    # a stale value. `.spec.ignore` works by substituting the LIVE value at each
    # ignored path into the desired object before apply — a path the manifest
    # never declares has nothing to substitute into and is dropped.
    #
    # An earlier revision of this file deleted these declarations on the
    # reasoning that runtime state does not belong in desired state. That
    # reasoning is sound in general and wrong for this mechanism.
    signalloom.ai/state: idle
    signalloom.ai/supercred: "true"
  annotations:
    # Placeholders, load-bearing: the ignore rule can only preserve a path
    # that exists in the desired object. Without these two lines the stun
    # annotations are wiped on every reconcile even WITH the ignore rule.
    signalloom.ai/stunned-at: ""
    signalloom.ai/stun-reason: ""
    signalloom.ai/agent-display-name: "Cardvault Agent"
    signalloom.ai/model-full: "openai/gpt-4o"
    signalloom.ai/description: "SuperCred demo — accesses credit card data via SPIFFE→OpenBao→BasicAuth chain."
    signalloom.ai/supercred-target: "cardvault.inf-signalloom.svc.cluster.local:8080"
spec:
  # NOTE: pod-level securityContext is INTENTIONALLY ABSENT.
  # The compliance scan checks for this and correctly flags it.
  containers:
    - name: agent
      image: ghcr.io/stefanprodan/podinfo:6.7.1
      ports:
        - name: http
          containerPort: 9898
      # NOTE: container-level securityContext is INTENTIONALLY ABSENT.
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
  volumes:
    - name: tmp
      emptyDir: {}
