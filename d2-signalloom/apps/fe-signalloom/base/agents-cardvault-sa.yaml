# Source ServiceAccount rendered into fe-signalloom by the apps Kustomization's
# targetNamespace. The sustained Netassert fixture needs the same name in
# fe-signalloom-agents, which its fleet ResourceSet owns independently. Neither
# ServiceAccount mounts a token or receives RBAC through this manifest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cardvault-agent
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: cardvault-agent
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
    bao.controlplane.io/consumer: cardvault-agent
automountServiceAccountToken: false
