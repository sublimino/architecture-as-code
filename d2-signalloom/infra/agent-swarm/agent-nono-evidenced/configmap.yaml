apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-nono-evidenced-config
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/instance: agent-nono-evidenced
    signalloom.ai/agent: "true"
    signalloom.ai/agent-name: agent-nono-evidenced
    signalloom.io/agent: demo
    signalloom.io/workload-profile: nono-evidenced
data:
  # This entrypoint delegates to the baked fail-closed enforcer shipped in the
  # agent-nono-evidenced image (built from Dockerfile.nono). The script wraps the
  # heartbeat workload in REAL `nono run` (kernel Landlock) and exits non-zero —
  # with NO healthy heartbeat and NO landlock evidence — if the substrate cannot
  # enforce Landlock. It replaces the former inline SP-5 shim that logged
  # "executing unconfined" and then emitted status:"healthy" heartbeats forever
  # (enforcement evidence without enforcement). Single source of truth:
  # apps/fe-signalloom-agents/probe-nono-capability.sh.
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    exec /usr/local/bin/probe-nono-capability.sh "$@"
