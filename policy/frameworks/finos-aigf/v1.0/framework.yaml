- id: aigf-inventory
  name: "AIGF: Model Inventory and Registration"
  controls:
  - id: AIGF-1.1
    name: AIGF-1.1 Registered Enterprise Model Catalog
    checks:
    - id: registered-model-registry-entry
      name: Model catalog registration and approval
      description: Verifies AI agent model is registered and actively approved in the enterprise model catalog.
      celExpression: has(agent.registry) && agent.registry.model_registered == true
      severity: high
      remediation: Register model in the centralized enterprise AI model registry.
      riskTriple:
        min: 8000
        mode: 35000
        max: 140000
      freqTriple:
        min: 0.5
        mode: 1.5
        max: 4
      policyVersions:
      - v1.0.0

