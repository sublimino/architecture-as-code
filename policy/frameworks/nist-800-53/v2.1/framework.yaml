  - id: AC-4
    name: AC-4 Information Flow Enforcement
    checks:
    - id: cross-namespace-egress-authorization
      name: Cross-namespace network egress authorization
      description: Restricts inter-agent communication across namespace boundaries without explicit egress grant.
      celExpression: has(request.destination.namespace) && (request.destination.namespace == request.source.namespace || request.context.egress_authorized == true)
      severity: high
      remediation: Obtain cross-namespace authorization grant or isolate within local namespace.
      riskTriple:
        min: 8000
        mode: 35000
        max: 150000
      freqTriple:
        min: 0.4
        mode: 1.2
        max: 3.5
