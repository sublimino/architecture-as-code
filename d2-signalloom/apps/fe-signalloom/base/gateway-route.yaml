apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signalloom-dashboard
spec:
  parentRefs:
    - name: cluster
      namespace: ingress
      sectionName: https
  hostnames:
    - dashboard.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dashboard-signalloom
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signalloom-dex
spec:
  parentRefs:
    - name: cluster
