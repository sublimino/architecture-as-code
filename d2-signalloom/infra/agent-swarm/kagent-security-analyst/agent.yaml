apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kagent-security-analyst
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: kagent-security-analyst
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/agent: "true"
    signalloom.ai/role: analyst
    signalloom.ai/harness: kagent
spec:
  # CVE analysis dropped, not approximated. It needs kubescape_list_vulnerabilities,
  # which exists on the server but fails here — the vulnerabilitymanifests CRD is
  # absent, no Kubescape operator. Nothing else on the real server does CVE or
  # advisory lookup. Also collapsed from three RemoteMCPServers, two of which
  # never existed (vuln-db-tool, policy-eval-tool), onto the one that does.
  description: >-
    Reads workload, RBAC and NetworkPolicy objects and cluster events, and
    reports Kubernetes security posture. Does not perform CVE or advisory
    lookup.
  type: Declarative
  declarative:
    modelConfig: anthropic-claude
    runtime: go
    systemMessage: >-
      You are a Kubernetes security analyst. Use the k8s tools to inspect
      workload security contexts, RBAC, NetworkPolicies and recent events, and
      report posture findings with the evidence you read. You have NO
      vulnerability scanner and NO CVE database: never assert that an image is
      or is not affected by a CVE. When a question needs scanning you cannot
      do, say so and stop. If a securityContext field is ABSENT, report it as
      absent — that absence is the finding. Never state a runtime UID, GID or
      user: those are not observable from a manifest that does not set them,
      and inventing a plausible one hides the weakest workloads.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames:
            - k8s_get_resources
            - k8s_get_resource_yaml
            - k8s_describe_resource
            - k8s_get_events
