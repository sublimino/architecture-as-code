# FLUX ENVSUBST: YES — postBuild.substituteFrom is configured on the Flux
# Kustomization that reconciles this directory. Flux runs envsubst over all
# rendered manifests: use $${VAR} to pass a literal $ through to the container,
# and ${VAR} for values Flux should substitute from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - bao-spire-proof.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - api-service.yaml
  - dashboard-deployment.yaml
  - dashboard-service.yaml
  - gateway-route.yaml
  # Agent inventory: health-reader RBAC (same-namespace only). The namespace
  # and cross-namespace agent-discovery RBAC are in inf-signalloom/configs/base/
  # (deployed by signalloom-infra, which runs before this apps kustomization).
  - agents-rbac.yaml
  - agents-baseline.yaml
  # SuperCred demo: cardvault-agent SA, inert agent pod (deliberately non-compliant),
  # and the Job template for the credential-chain run.
  - agents-cardvault-sa.yaml
  - agents-cardvault.yaml
  - agents-cardvault-job.yaml
