apiVersion: v1
kind: Secret
metadata:
  name: dex-local-auth
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
type: Opaque
stringData:
  config.yaml: |
    # Origin-aware. PUBLIC_ORIGIN comes from the flux-runtime-info ConfigMap
    # via this Kustomization's postBuild.substituteFrom, so publishing the demo
    # on a tunnel, a LoadBalancer or a VM's external IP is a ConfigMap update
    # plus a reconcile — Flux DELIVERS the origin instead of reverting it.
    #
    # The :=default is load-bearing, not decoration. AGENTS.md records that a
    # missing substituteFrom key is a SILENT no-op, so an undefaulted token
    # would ship the literal string as Dex's issuer and break every login with
    # no diagnostic anywhere. Confirmed the hard way on 2026-08-03.
    #
    # PREREQUISITE, verified before this landed:
    #   kubectl get kustomization infra-configs -n inf-signalloom \
    #     -o jsonpath='{.spec.postBuild}'
    # must return a substituteFrom entry. It is delivered by the fleet artifact
    # through flux-system/tenants; if that Kustomization is suspended, this
    # token arrives with no envsubst to resolve it.
    issuer: ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    frontend:
      dir: /srv/dex/web
      theme: dark
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    enablePasswordDB: true

    # Remote connectors (Entra ID, Google, GitHub, generic OIDC) are defined in
    # the connectors overlay at overlays/connectors/. To enable them:
    #   1. Create a Secret with your IdP credentials
    #   2. Add the overlay to your kustomization
    # The base config uses the local password DB only (enablePasswordDB above).
    # See docs/signalloom/dex-connectors.md for the full connector reference.

    staticClients:
      - id: signalloom-dashboard
        name: Signal Loom Dashboard
        public: true
        redirectURIs:
          - https://dashboard.osramp.acme.local:30754/callback
          - http://dashboard.osramp.acme.local:5173/callback
          - http://localhost:5173/callback
          # Wherever the demo is published right now. Same default as the
          # issuer, so this is a harmless duplicate when PUBLIC_ORIGIN is unset.
          - ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}/callback
          # Wherever the demo is currently published. Same default as the
          # issuer above, so this is a harmless duplicate when unset.
      - id: signalloom-api
        name: Signal Loom API
        secret: signalloom-api-local-only
        trustedPeers:
          - signalloom-dashboard
    staticPasswords:
      - email: demo-user@signalloom.local
        # bcrypt("demo-user") — local-demo credential only (see docs/signalloom).
        hash: $2b$10$NZGZWtWZgbrmmuDU5Bf.N.38ar7tskOwJ176v1qo5p3UWw1dlIE4C
        username: demo-user
        userID: demo-user
      # A second, deliberately UNPRIVILEGED identity.
      #
      # demo-user is the demo instructor and is on the superadmin allowlist
      # (fe-signalloom config.py api_superadmin_emails), so with only that
      # user in the password DB there is no way to exercise a 403 from the
      # superadmin gate against the deployed system — every real token the
      # cluster can mint is a superadmin token. The gate was therefore only
      # ever proven by unit tests injecting a Principal, which is exactly the
      # class of "green tests, unverified deployment" this slice has been
      # bitten by before (see the demo_runner script_available story).
      #
      # viewer is authenticated (it maps to tenant-demo, so it clears
      # `tenant_forbidden`) and is NOT on either superadmin allowlist, so a
      # 403 from it is unambiguously the superadmin check firing. It grants
      # nothing demo-user did not already have.
      - email: viewer@signalloom.local
        # bcrypt("viewer") — local-demo credential only (see docs/signalloom).
        hash: $2b$10$gNhgjlqGP5VFva0S/bJtz.J2h0UTQAqYNh0OQRsJdCbRR0Yf.gitq
        username: viewer
        userID: viewer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      annotations:
        # Dex reads /etc/dex/config.yaml ONCE, at process start. It has no
        # config watcher and no SIGHUP reload. Kubernetes happily updates the
        # mounted Secret file underneath it, so the file on disk and the config
        # Dex is actually serving drift apart silently, with nothing in the
        # logs to say so. Nothing about the Deployment changes when only the
        # Secret changes, so no rollout is triggered and the drift persists
        # until something unrelated happens to restart the pod.
        #
        # Observed 2026-08-03: adding the `viewer` identity landed in the
        # Secret (`grep -c viewer /etc/dex/config.yaml` inside the pod returned
        # 5) while Dex kept rejecting `viewer` with "Invalid username or
        # password". The give-away was that Dex logged NO failed-login line at
        # all — the user did not exist as far as the running process was
        # concerned. `kubectl rollout restart deploy/dex` fixed it instantly.
        #
        # The same defect is far more dangerous on the issuer: change
        # PUBLIC_ORIGIN, and Dex carries on minting tokens with the OLD `iss`
        # while every consumer has already moved to the new one. Every token is
        # then rejected as invalid_token, which reads like a broken login
        # rather than a stale process.
        #
        # TWO annotations, because the two failure modes need different
        # mechanisms and neither one alone is sufficient:
        #
        #   dex-origin  — carries the substituted PUBLIC_ORIGIN. Flux resolves
        #     this at postBuild, so the rendered pod template differs whenever
        #     the origin differs, and the rollout is automatic. A content hash
        #     CANNOT cover this case: hashing happens before substitution, so
        #     the bytes are identical for every possible origin.
        #
        #   config-sha  — sha256 of the Secret's config.yaml as written here,
        #     pre-substitution. Covers every hand-edit (identities, clients,
        #     connectors) that the origin annotation is blind to. Enforced by
        #     test/dex-config-reload.bats, which recomputes it and fails if it
        #     is stale, so this cannot silently rot the way a hand-maintained
        #     hash normally would.
        #
        #   dex-ui-sha  — sha256 of the .html keys of the dex-ui ConfigMap. The
        #     web templates have EXACTLY the same reload defect as config.yaml,
        #     and neither annotation above covers them. Dex calls loadWebConfig
        #     once in newServer (server.go:290) and stores the parsed
        #     *template.Template on the server struct (server.go:313) — there is
        #     no watcher and no re-parse. Kubernetes swaps the mounted template
        #     files underneath the process, nothing in the Deployment changes, no
        #     rollout fires, and Dex keeps rendering the templates it parsed at
        #     boot. A fix to a broken template would land in git, land in the
        #     cluster, and never reach a single user.
        #
        #     Scoped to the .html keys ON PURPOSE. styles.css is served by an
        #     http.FileServer that reads from disk per request, so CSS already
        #     takes effect live and does not need a restart. Hashing it too would
        #     make every cosmetic tweak restart Dex, and because storage is
        #     `type: memory` a restart invalidates every in-flight login — which
        #     is the single largest source of the error page this hash exists to
        #     keep working.
        signalloom.ai/dex-origin: ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}
        signalloom.ai/dex-config-sha: "276891c421b48360bd29284aaa786680572cf464087543ca962e249efe3f9cb7"
        signalloom.ai/dex-ui-sha: "eb11147f7fc82987b22a0d4632a5767fe8767d8ab47880860af3f9abe0643584"
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: signalloom-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/header.html
              subPath: header.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/footer.html
              subPath: footer.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/login.html
              subPath: login.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/password.html
              subPath: password.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/approval.html
              subPath: approval.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/error.html
              subPath: error.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/oob.html
              subPath: oob.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/device.html
              subPath: device.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/device_success.html
              subPath: device_success.html
              readOnly: true
            - name: ui-theme
              mountPath: /srv/dex/web/themes/dark/styles.css
              subPath: styles.css
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
          livenessProbe:
            httpGet:
              # Dex serves endpoints under the issuer path (/dex); the bare
              # /healthz 404s once the issuer has a path, so probe a served path.
              path: /dex/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsGroup: 1001
      volumes:
        - name: config
          secret:
            secretName: dex-local-auth
        - name: ui-templates
          configMap:
            name: dex-ui
            items:
              - key: header.html
                path: header.html
              - key: footer.html
                path: footer.html
              - key: login.html
                path: login.html
              - key: password.html
                path: password.html
              - key: approval.html
                path: approval.html
              - key: error.html
                path: error.html
              - key: oob.html
                path: oob.html
              - key: device.html
                path: device.html
              - key: device_success.html
                path: device_success.html
        - name: ui-theme
          configMap:
            name: dex-ui
            items:
              - key: styles.css
                path: styles.css
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
