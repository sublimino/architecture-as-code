# The three managed applications Olly observes, as real workloads. Previously
# these were only app_id strings on seeded logs and replayed events; running
# them as Deployments gives Eye in the Sky genuine per-tenant telemetry:
#   - real pod CPU/memory (cAdvisor/kube-state scrape the container);
#   - real app metrics (request rate, error rate, latency histogram) from the
#     tenant-app image's /metrics, driven by an internal traffic generator;
#   - a Trivy scan target (they run in olly-replica, already in Aqua's scope).
# A single ServiceMonitor scrapes all three (shared osramp.acme.co/tenant-app
# label); app_id is a metric label so PromQL slices per tenant. Per-app RPS /
# error / latency are tuned so the tenants read distinctly on the dashboards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
    tenant: inventory-service
    osramp.acme.co/tenant-app: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        tenant: inventory-service
        osramp.acme.co/tenant-app: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: app
          image: ${IMAGE_BASE}/olly/tenant-app:${ARTIFACT_TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ID
              value: inventory-service
            - name: RPS
              value: "8"
            - name: ERROR_RATE
              value: "0.02"
            - name: LATENCY_MS
              value: "45"
            - name: UPSTREAMS
              value: ""
            # inventory-service is the base ledger service: no app upstreams, but
            # it depends on its positions-ledger data store, probed here against
            # the real Elasticsearch cluster health so its upstream health is
            # measured, not blank.
            - name: DATASTORE
              value: "positions-ledger-db=http://olly-es-http:9200/_cluster/health"
            - name: ELASTIC_URL
              value: http://olly-es-http:9200
            - name: ELASTIC_USER
              value: elastic
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: olly-es-elastic-user
                  key: elastic
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # Scannable runtime image so Trivy produces a real VulnerabilityReport
        # for this tenant. The metrics container above is a local :dev image
        # Trivy can't pull, so this idle sidecar carries a CVE-bearing public
        # image, mirroring the vulnerable base a real service would ship.
        - name: runtime
          image: mirror.gcr.io/library/python:3.9-slim
          command: ["sleep", "2147483647"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app: inventory-service
    osramp.acme.co/tenant-app: "true"
spec:
  selector:
    app: inventory-service
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
