# Health-reader RBAC for fake-integration-proxy — same namespace (fe-signalloom).
#
# The cross-namespace agent-inventory Role/RoleBinding (fe-signalloom-agents)
# is in infra/inf-signalloom/configs/base/agents-namespace-rbac.yaml, deployed
# by signalloom-infra so it exists before this apps kustomization applies.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fe-signalloom-health-reader
  namespace: fe-signalloom
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fake-proxy-health-reader
  namespace: fe-signalloom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fe-signalloom-health-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: inf-signalloom
