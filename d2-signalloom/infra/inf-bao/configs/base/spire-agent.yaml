apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  labels:
    app.kubernetes.io/name: spire-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-agent
    spec:
      serviceAccountName: spire-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.11.1
          args: ["-config", "/run/spire/config/agent.conf", "-expandEnv"]
          env:
            - name: JOIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spire-agent-join-token
                  key: token
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
            - name: data
              mountPath: /run/spire/data
            - name: sockets
              mountPath: /run/spire/sockets
      volumes:
        - name: config
          configMap:
            name: spire-agent-config
        - name: data
          # Join tokens are one-use. Preserve the attested agent state across
          # container restarts so a transient restart does not reuse its token.
          hostPath:
            path: /var/lib/spire-agent/data
            type: DirectoryOrCreate
        - name: sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
