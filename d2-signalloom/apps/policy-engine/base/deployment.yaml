# Policy Engine: mock compliance evaluator for the SuperCred demo.
# Accepts a pod spec and a list of checks; returns pass/fail per check.
# Stateless — no K8s API access needed; the caller passes the pod spec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-engine
  labels:
    app.kubernetes.io/name: policy-engine
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-engine
        app.kubernetes.io/component: supercred-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy-engine
          image: policy-engine:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 10
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
