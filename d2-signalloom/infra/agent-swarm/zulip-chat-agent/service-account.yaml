# ServiceAccount for the zulip-chat-agent. SPIRE issues an SVID scoped to
# spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/zulip-chat-agent,
# which authorises Zulip API access via OpenBao credential issuance.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zulip-chat-agent
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: "chatops"
    signalloom.ai/harness: "bun-zulip"
    signalloom.ai/model: "claude-sonnet-4"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
