# FLUX ENVSUBST: NO — Static ingress route for public webhook receivers.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eap-webhook-receiver
  namespace: fe-signalloom
  labels:
    app.kubernetes.io/name: fe-signalloom
    app.kubernetes.io/component: webhook-ingress
    app.kubernetes.io/managed-by: signalloom-eap
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster
      namespace: ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/webhooks
      backendRefs:
        - name: dashboard-signalloom
          port: 8080
          weight: 1
