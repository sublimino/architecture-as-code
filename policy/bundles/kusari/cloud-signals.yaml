# The Kusari pilot cloud-signal bundle (SLAWS v2 §4, D2/D3/D6).
#
# Kusari runs Kubernetes workloads in AWS. kusari-iam-change.yaml covers the IAM
# privilege path; this bundle covers the rest of the cloud surface the pilot
# streams: the EKS control plane, console sign-in, cross-account role assumption,
# S3 exposure, GuardDuty tampering, and egress that the network refused.
#
# Mode is `shadow`: every rule here emits and stores findings, nothing alerts and
# nothing in the customer account is touched. Promotion to warn, then enforce, is
# a reviewed commit that bumps `version`. Several rules below are deliberate
# over-triggers at this granularity (noted per rule) and shadow is where that is
# affordable.
#
# # What the rules may read
#
# Only the §2.3 label contract (collectors/awslogs/contract_doc.go) and
# obs.actor. That is the whole of the vocabulary, and it is a tighter constraint
# than it looks -- note in particular that obs.actor is a keyed pseudonym, so it
# supports EQUALITY and membership only. Never startsWith, never a substring,
# never any other read of its internal structure: there is none.
#
#   * additionalEventData is NOT projected, so MFA state is unavailable. The
#     console rule therefore discriminates on the PRINCIPAL, not on MFA. See
#     console-login-outside-allowlist.
#   * requestParameters is NOT projected beyond the ResourceNameKeys scalar
#     allowlist, so "did this policy actually make the bucket public" is
#     unavailable. See s3-bucket-exposure-changed.
#   * userIdentity.accountId is NOT projected under that name, and obs.actor is a
#     keyed PSEUDONYM, so neither the acting account nor any other ARN component
#     can be recovered from it. The §2.3 projection therefore carries
#     actor_account_id, parsed from userIdentity.arn before pseudonymisation.
#     See cross-account-assume-role.
#
# Extending the projection is not a projection-only change: store/label_allowlist.go
# is a CLOSED key set and FrostDBStore.Append refuses an entire batch containing a
# key outside it. So each limit above is a coordinated change across two packages,
# and each is named in the rule that carries it rather than papered over.
#
# # Missing-key idiom
#
# Every label read is guarded with has(). Bare obs.labels.k on an absent key is a
# CEL evaluation error, which the evaluator records as a fault and which would
# degrade detection for the whole bundle on one unlabelled record (§4.1).
#
# # Rule disjointness
#
# One event produces at most one finding per concern, so the EKS rules are split
# by what they grant (cluster configuration vs. Kubernetes RBAC) and each carries
# its own rule_id and severity. Same principle as kusari-iam-change.yaml splitting
# CreateAccessKey out of the privilege-change rule.
#
# # Fixtures
#
# Every rule has a positive fixture that fires it and a negative that does not,
# under collectors/awslogs/testdata/kusari/. The per-rule expectation table lives
# in d2-signalloom/apps/signal-ingest/e2e/expectations.go and is asserted by
# `make test-kusari-e2e`. docs/EAP/kusari-e2e.md is the walkthrough.

id: kusari-cloud-signals
tenant_id: kusari
version: 1.0.0
mode: shadow

# The vars that hold ACTOR IDENTITIES, rewritten at load through the same keyed
# pseudonymiser obs.actor is rewritten with. See kusari-iam-change.yaml for the
# full reasoning; the short version is that obs.actor is a pseudonym by the time
# a rule evaluates, so a cleartext allowlist can never match it and every
# NEGATIVE allowlist test below would become always-true.
#
# tenant_accounts is deliberately ABSENT: it holds AWS account numbers and is
# compared against a label (obs.labels.aws_account_id), not against obs.actor.
# Pseudonymising it would break that comparison in the opposite direction.
actor_vars:
  - break_glass_actors
  - console_login_actors
  - cross_account_assume_role_actors
  - eks_cluster_admin_actors

vars:
  # The AWS accounts that belong to this tenant. Used to decide whether a role
  # assumption crossed an account boundary. An empty list is rejected at load:
  # it would turn every AssumeRole in the estate into a non-finding, silently.
  tenant_accounts:
    - "123456789012"
    - "210987654321"

  # Identities permitted to make privilege and credential changes without
  # producing a finding. Shared in spirit with kusari-iam-change.yaml, declared
  # separately because a bundle's vars are its own and a cross-bundle reference
  # would make one file's promotion depend on another's contents.
  break_glass_actors:
    - "arn:aws:iam::123456789012:user/break-glass"

  # Identities expected to sign in to the console. Anything else -- notably the
  # account root, which is never on this list -- is a finding.
  console_login_actors:
    - "arn:aws:iam::123456789012:user/kusari-operator"

  # Foreign principals permitted to assume a role in a tenant account. The
  # partner CI role is here; an unknown partner identity is not.
  cross_account_assume_role_actors:
    - "arn:aws:iam::555544443333:role/kusari-ci-deploy"

  # Identities permitted to reconfigure the EKS control plane or grant
  # Kubernetes RBAC from IAM.
  eks_cluster_admin_actors:
    - "arn:aws:iam::123456789012:user/break-glass"

rules:
  # --- EKS control plane ---------------------------------------------------
  - id: eks-cluster-config-changed
    name: EKS cluster configuration changed by a non-admin identity
    severity: high
    # Read-only EKS calls (DescribeCluster, ListClusters) are deliberately absent:
    # they are the bulk of EKS CloudTrail volume and carry no change.
    expression: |-
      obs.layer == "cloud_control_plane" &&
      has(obs.labels.event_source) &&
      obs.labels.event_source == "eks.amazonaws.com" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name in [
        "UpdateClusterConfig", "UpdateClusterVersion", "AssociateEncryptionConfig",
        "CreateAddon", "UpdateAddon", "DeleteAddon", "DeleteCluster"
      ] &&
      !(obs.actor in vars.eks_cluster_admin_actors)

  - id: eks-access-entry-created
    name: Kubernetes RBAC granted from IAM by a non-admin identity
    severity: high
    # An access entry is the IAM-side grant of in-cluster RBAC, so this is the
    # one cloud event that directly changes who can act inside the cluster. It
    # is a separate rule from the config change so a promotion decision can
    # treat the two differently.
    expression: |-
      obs.layer == "cloud_control_plane" &&
      has(obs.labels.event_source) &&
      obs.labels.event_source == "eks.amazonaws.com" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name in [
        "CreateAccessEntry", "UpdateAccessEntry", "AssociateAccessPolicy"
      ] &&
      !(obs.actor in vars.eks_cluster_admin_actors)

  # --- Console sign-in -----------------------------------------------------
  - id: console-login-outside-allowlist
    name: Console sign-in by an identity outside the allowlist
    severity: high
    # The discriminator is the principal, NOT the MFA state: MFAUsed lives in
    # additionalEventData, which the §2.3 projection does not carry (see the
    # header). The account root is never on the allowlist, so a root sign-in --
    # the case this rule exists for -- fires regardless.
    expression: |-
      obs.layer == "cloud_control_plane" &&
      has(obs.labels.event_source) &&
      obs.labels.event_source == "signin.amazonaws.com" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name == "ConsoleLogin" &&
      !(obs.actor in vars.console_login_actors)

  # --- Cross-account role assumption ---------------------------------------
  - id: cross-account-assume-role
    name: Role assumed in a tenant account by a principal from another account
    severity: medium
    # obs.labels.aws_account_id is recipientAccountId: the account that RECEIVED
    # the call. obs.labels.actor_account_id is the account of the ACTING
    # principal, parsed from userIdentity.arn at projection time. Cross-account
    # is simply the two disagreeing.
    #
    # This rule used to recover the acting account inside CEL with
    # obs.actor.startsWith("arn:aws:iam::" + obs.labels.aws_account_id + ":"),
    # which read obs.actor as STRUCTURE. obs.actor is now a keyed pseudonym on
    # both the live and the replay path, so that structure is gone: both
    # startsWith calls evaluate false, both negations evaluate true, and the
    # same-account role chain in the fixture reads as cross-account. The account
    # is a label instead, which round-trips through a segment and therefore
    # through a replay. It also needs one comparison where the ARN needed two,
    # because an IAM principal and an already-assumed STS session differ only in
    # the prefix the label does not carry.
    #
    # has() guards both: a record with no userIdentity.arn (an AWS service
    # principal) carries no actor_account_id key at all, and must not read as
    # cross-account.
    expression: |-
      obs.layer == "cloud_control_plane" &&
      has(obs.labels.event_source) &&
      obs.labels.event_source == "sts.amazonaws.com" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name == "AssumeRole" &&
      has(obs.labels.aws_account_id) &&
      obs.labels.aws_account_id in vars.tenant_accounts &&
      has(obs.labels.actor_account_id) &&
      obs.labels.actor_account_id != obs.labels.aws_account_id &&
      !(obs.actor in vars.cross_account_assume_role_actors)

  # --- S3 exposure ---------------------------------------------------------
  - id: s3-bucket-exposure-changed
    name: S3 bucket exposure control changed
    severity: high
    # A DELIBERATE OVER-TRIGGER. Whether the new policy grants public read is in
    # requestParameters.policy, which this projection must not read. So the rule
    # fires on the exposure-changing API surface rather than on a verdict. In a
    # regulated account these calls are rare and each is worth a look; the
    # alternative is a policy-document parser on the ingest hot path, fed
    # attacker-influenced JSON.
    expression: |-
      obs.layer == "cloud_control_plane" &&
      has(obs.labels.event_source) &&
      obs.labels.event_source == "s3.amazonaws.com" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name in [
        "PutBucketPolicy", "DeleteBucketPolicy", "PutBucketAcl",
        "PutBucketPublicAccessBlock", "DeletePublicAccessBlock",
        "DeleteBucketPublicAccessBlock", "PutAccountPublicAccessBlock"
      ]

  # --- GuardDuty ------------------------------------------------------------
  - id: guardduty-detection-tampered
    name: GuardDuty detection suppressed, disabled or archived
    severity: critical
    # Critical rather than high: this is the only rule here whose subject is the
    # detection capability itself, so a true positive degrades every other
    # control in the account.
    #
    # SCOPE: these are GuardDuty MANAGEMENT calls, which is what GuardDuty
    # actually writes to CloudTrail. A GuardDuty FINDING arrives over
    # EventBridge in a different envelope and is not projectable today -- see
    # testdata/kusari/guardduty-eventbridge-envelope.json, which pins that as a
    # silent zero rather than leaving it to be found on the pilot.
    expression: |-
      obs.layer == "cloud_control_plane" &&
      has(obs.labels.event_source) &&
      obs.labels.event_source == "guardduty.amazonaws.com" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name in [
        "DeleteDetector", "UpdateDetector", "CreateFilter", "UpdateFilter",
        "ArchiveFindings", "UpdateFindingsFeedback", "DeleteMembers",
        "DisassociateMembers", "DisableOrganizationAdminAccount",
        "StopMonitoringMembers", "DeletePublishingDestination"
      ]

  # --- IAM credentials and policy ------------------------------------------
  - id: iam-credential-or-policy-change
    name: IAM credential or policy change by a non-break-glass identity
    severity: high
    # Overlaps kusari-iam-change.yaml by design, and the overlap is not a
    # duplicate finding: Finding.ID hashes the bundle version, so the same event
    # produces one finding per bundle with distinct ids, distinct rule_ids, and
    # distinct windows. That is what lets the narrow IAM bundle be promoted to
    # warn on its own schedule while this broader one stays in shadow.
    expression: |-
      obs.layer == "cloud_control_plane" &&
      has(obs.labels.event_source) &&
      obs.labels.event_source == "iam.amazonaws.com" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name in [
        "CreateAccessKey", "UpdateAccessKey", "AttachUserPolicy", "AttachRolePolicy",
        "AttachGroupPolicy", "PutUserPolicy", "PutRolePolicy", "PutGroupPolicy",
        "CreatePolicyVersion", "SetDefaultPolicyVersion",
        "CreateLoginProfile", "UpdateLoginProfile"
      ] &&
      !(obs.actor in vars.break_glass_actors)

  # --- Network egress -------------------------------------------------------
  - id: vpc-egress-rejected
    name: VPC Flow Log rejected an egress flow
    severity: low
    # One REJECT is noise, which is why severity is low and the signal that
    # matters is the stage-2 window below. The layer guard is what keeps this
    # rule off control-plane records, whose event_name is an API name.
    expression: |-
      obs.layer == "network_egress" &&
      has(obs.labels.event_name) &&
      obs.labels.event_name == "REJECT"

windows:
  # Stage 2 is declared here, never in CEL (§3, D2, D3). A decision fires on the
  # EDGE -- when an arriving finding takes the counter from below the threshold to
  # at or above it -- and the window is anchored on the ARRIVING finding's
  # timestamp, never on wall-clock, so a replay of an S3 backlog reproduces live.

  - id: iam-change-burst-10m
    over_rule: iam-credential-or-policy-change
    key: [tenant_id, actor]
    window: 10m
    threshold: 3
    severity: high

  - id: cross-account-assume-role-burst-30m
    over_rule: cross-account-assume-role
    key: [tenant_id, actor]
    window: 30m
    threshold: 2
    severity: high

  - id: vpc-reject-burst-5m
    over_rule: vpc-egress-rejected
    key: [tenant_id, "labels.source_ip"]
    window: 5m
    threshold: 20
    severity: medium
    # This window keys on a SOURCE-OBSERVATION label, which used to be a known
    # limit: a stored finding carried only the closed policy label set, so
    # source_ip was absent at warm-up. The effect was worse than the
    # "over-counts across addresses" originally recorded here -- every warmed
    # finding landed in a counter keyed `source_ip=`, which no live finding can
    # ever join, so warm-up contributed NOTHING and a restart MISSED the burst
    # it was warmed to catch. policy/convert.go now carries each window's keyed
    # label values onto the stored finding, and
    # TestWindows_WarmCollapsesWithoutTheKeyedLabels pins the old behaviour as
    # the mutation.
    #
    # It is keyed on source_ip because a window keyed on tenant alone cannot
    # distinguish one host scanning from twenty hosts each retrying once, which
    # is the entire question.
