#
# Per-cluster configuration for the probe. One key today; the point is that
# it is a ConfigMap, so kind-osramp and kind-signalloom-hub each carry their
# own value without a second copy of the DaemonSet.
#
# The live pod before consolidation carried
# SIGNAL_INGEST_URL=http://10.96.224.2:8082 — a ClusterIP someone patched in by
# hand. A ClusterIP is the wrong thing to commit: it is reassigned on every
# cluster rebuild, so the manifest goes stale silently and the sentinel posts
# telemetry into a dead address. The Service FQDN is stable across rebuilds.
#
# Why the FULLY-QUALIFIED name and not "signal-ingest:8082":
#   signal-ingest is a Service in namespace fe-signalloom (placed there by
#   targetNamespace on the Flux Kustomization that reconciles
#   apps/fe-signalloom/base). The sentinel runs in fe-signalloom-agents, so a
#   bare short name resolves against that namespace's search path first and
#   never reaches fe-signalloom. The FQDN skips the search path entirely.
#   It resolves only because the DaemonSet sets
#   dnsPolicy: ClusterFirstWithHostNet — see daemonset.yaml.
#
# SENTINEL_TENANT_MAP is the ONLY source of an observation's tenant_id
# (review M5). It used to be read from the pod's own `tenant` label and default
# to kusari, so whoever created a pod chose its tenant and every unlabelled pod
# was kusari's. Entries are `namespace=tenant` or
# `namespace/serviceAccount=tenant`, comma- or newline-separated; anything not
# listed is reported as tenant_id "__unattributed__" (still detected, still
# frozen). An invalid map attributes nothing and logs tenant_map_invalid.
#
# fe-signalloom-agents is shared by every swarm agent, so it is mapped per
# service account, never as a whole namespace. Residual, stated plainly: any
# principal that can create pods in a namespace can run them as ANY service
# account there (today hosted-daytona-coder's Role can create pods in
# fe-signalloom-agents), so the namespace's pod-create RBAC is the real
# boundary. This ConfigMap is written only by the agent-swarm-flux identity; no
# agent's Role grants configmaps. No credential belongs in this file — the
# ingest bearer is Secret signalloom-warden-ingest-token.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signalloom-warden-config
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-warden
    signalloom.ai/agent: "true"
    signalloom.ai/role: "sentinel"
data:
  SIGNAL_INGEST_URL: "http://signal-ingest.fe-signalloom.svc.cluster.local:8082"
  # fleet-manager's stun cascade, same FQDN rule as SIGNAL_INGEST_URL.
  FLEET_MANAGER_URL: "http://fleet-manager.fe-signalloom.svc.cluster.local:8082"
  # One entry per swarm agent's namespace/serviceAccount, mapped to the tenant
  # its manifest declares in signalloom.ai/tenant. kusari-agent's SA runs
  # kusari-agent/deployment.yaml. test/agent-swarm-tenancy.bats fails if an agent
  # is missing here or the map disagrees with its label.
  SENTINEL_TENANT_MAP: |
    fe-signalloom-agents/agent-cardvault=controlplane
    fe-signalloom-agents/agent-nono-evidenced=tenant-demo
    fe-signalloom-agents/agent-nono-kusari=tenant-demo
    fe-signalloom-agents/agent-standard-baseline=tenant-demo
    fe-signalloom-agents/cpai-engineer=controlplane
    fe-signalloom-agents/hosted-daytona-coder=controlplane
    fe-signalloom-agents/kagent-chaos-prober=tenant-demo
    fe-signalloom-agents/kagent-commit-summariser=tenant-demo
    fe-signalloom-agents/kagent-compliance-checker=tenant-demo
    fe-signalloom-agents/kagent-finops-optimizer=tenant-demo
    fe-signalloom-agents/kagent-incident-responder=tenant-demo
    fe-signalloom-agents/kagent-k8s-reader=tenant-demo
    fe-signalloom-agents/kagent-network-auditor=tenant-demo
    fe-signalloom-agents/kagent-security-analyst=tenant-demo
    fe-signalloom-agents/kusari-agent=kusari
    fe-signalloom-agents/nono-containment-probe=controlplane
    fe-signalloom-agents/prod-deploy-gate=controlplane
    fe-signalloom-agents/prompt-commit-summarizer=controlplane
    fe-signalloom-agents/swarm-governor=controlplane
    fe-signalloom-agents/triage-ci-worker=controlplane
