# Reusable witness-attested step. Callers wrap any command in `witness run`
# so its execution evidence is signed and uploaded as a workflow artifact
# for retention as a workflow artifact.
#
# Usage from another workflow:
#   jobs:
#     build:
#       uses: ./.github/workflows/reusable-witness-step.yaml
#       with:
#         step-name: build
#         command: make -C d2-osramp-apps build
name: reusable-witness-step

on:
  workflow_call:
    inputs:
      step-name:
        required: true
        type: string
      command:
        required: true
        type: string

jobs:
  witness-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install witness
        run: ./scripts/setup.sh --tools-only
      - name: Generate ephemeral signing key
        run: |
          openssl genpkey -algorithm ed25519 -out witness.pem
          openssl pkey -in witness.pem -pubout -out witness-pub.pem
      - name: Run step under witness
        run: |
          mkdir -p "${RUNNER_TEMP}/witness-home"
          cat > .witness.yaml <<'YAML'
          run:
            enable-archivista: false
            enable-archivist: false
          verify:
            enable-archivista: false
            enable-archivist: false
          YAML
          HOME="${RUNNER_TEMP}/witness-home" XDG_CONFIG_HOME="${RUNNER_TEMP}/witness-home/.config" \
            witness run --workingdir "${GITHUB_WORKSPACE}" --attestations= \
            --step "${{ inputs.step-name }}" \
            -o "${{ inputs.step-name }}.attestation.json" \
            -k witness.pem \
            -- ${{ inputs.command }}
      - name: Upload attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attestation-${{ inputs.step-name }}
          path: |
            ${{ inputs.step-name }}.attestation.json
            witness-pub.pem
          if-no-files-found: warn
