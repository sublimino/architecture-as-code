# FLUX ENVSUBST: FLEET — this is a fleet overlay, not a workload kustomization.
# Flux processes this via the tenants Kustomization with postBuild.substituteFrom.
# Local mode: artifacts are pulled from the in-cluster zot registry and
# verified against the cosign key pair generated by `make signing-keys`.
#
# SIGNALLOOM-ONLY: this integration branch bootstraps only shared infra +
# signalloom. OSRAMP (apps.yaml) and Olly (olly.yaml) are excluded so the
# cluster starts clean without any demos. Use `make demo-osramp-up` or
# `make demo-olly-up` from the governor Makefile to opt-in individually.
# The original full-demo config is on the main branch.
#
# The JSON patches below index into spec.resources of each ResourceSet:
# index 5 is the OCIRepository (after Namespace, ConfigMap, Secret,
# ServiceAccount, and the role binding). Keep the indexes in sync with
# tenants/base if the resource lists change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/policies.yaml
  - ../base/infra.yaml
  # OSRAMP and Olly excluded — signalloom-only on this branch:
  # - ../base/apps.yaml
  # - ../base/olly.yaml
  - signalloom.yaml
patches:
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: infra
    patch: |
      - op: add
        path: /spec/resources/5/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: signalloom-infra
    patch: |
      # Index 13: OCIRepository follows the agent-inventory namespace, RBAC,
      # and proxy Pod, then tenant namespace, RBAC, and namespace-patch grants.
      - op: add
        path: /spec/resources/13/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: signalloom-apps
    patch: |
      # Index 10: OCIRepository follows the tenant namespace, the pre-created
      # proxy-health Role, and the standard tenant RBAC resources.
      - op: add
        path: /spec/resources/10/spec/verify
        value:
          provider: cosign
          secretRef:
            name: cosign-pub
      - op: add
        path: /spec/resources/-
        value:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosign-pub
            namespace: << inputs.tenant >>
            annotations:
              fluxcd.controlplane.io/copyFrom: "flux-system/cosign-pub"
