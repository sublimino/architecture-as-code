# Canonical Signalloom ResourceSet source. The active fleet carries an identical
# copy at d2-osramp-fleet/tenants/local/signalloom.yaml because Flux consumes
# only the fleet OCI artifact.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: signalloom-spire-rbac
  namespace: flux-system
spec:
  resources:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: spire-agent
        namespace: inf-bao
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: signalloom-spire-agent-kubelet
      rules:
        - apiGroups: [""]
          resources: ["nodes/proxy"]
          verbs: ["get"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: signalloom-spire-agent-kubelet
      subjects:
        - kind: ServiceAccount
          name: spire-agent
          namespace: inf-bao
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: signalloom-spire-agent-kubelet
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: signalloom-infra
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  # Signal Loom infrastructure starts only through `make demo-signalloom-up`.
  inputs: []
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: tenant
    # Agent inventory belongs outside the apps Kustomization because that
    # Kustomization deliberately targets only << inputs.tenant >>.
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: fe-signalloom-agents
        labels:
          app.kubernetes.io/part-of: signalloom
          signalloom.ai/purpose: agent-inventory
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: agent-inventory-reader
        namespace: fe-signalloom-agents
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: fake-proxy-agent-inventory-reader
        namespace: fe-signalloom-agents
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: agent-inventory-reader
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: inf-signalloom
    - apiVersion: v1
      kind: Pod
      metadata:
        name: agent-sir-lancelot
        namespace: fe-signalloom-agents
        labels:
          app.kubernetes.io/name: signalloom-agent
          app.kubernetes.io/component: agent
          app.kubernetes.io/part-of: signalloom
          app.kubernetes.io/managed-by: signalloom-governor
          app.kubernetes.io/instance: sir-lancelot
          signalloom.ai/agent: "true"
          signalloom.ai/agent-name: sir-lancelot
          signalloom.ai/agent-type: signal-loom-built
          signalloom.ai/framework: kagent
          signalloom.ai/model: claude-opus-4-8
          signalloom.ai/state: idle
        annotations:
          signalloom.ai/agent-display-name: "Sir Lancelot"
          signalloom.ai/model-full: "anthropic/claude-opus-4-8"
          signalloom.ai/description: "Inert demo agent — brave, and prone to charging in."
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: agent
            image: ghcr.io/stefanprodan/podinfo:6.7.1
            ports:
              - name: http
                containerPort: 9898
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: data
                mountPath: /data
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
        volumes:
          - name: tmp
            emptyDir: {}
          - name: data
            emptyDir: {}
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/flux-runtime-info
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/ghcr-auth
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-auth
    # Signalloom manifests are constrained to their target namespace. Do not
    # grant this tenant a cluster-wide reconciliation identity.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-<< inputs.tenant >>
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # Gateway API CRDs (referencegrants) are not covered by admin ClusterRole.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: flux-gateway-api
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["referencegrants"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-gateway-api
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: flux-gateway-api
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # Cluster-scoped namespace patch — same rationale as signalloom-apps.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      rules:
        - apiGroups: [""]
          resources: ["namespaces"]
          resourceNames: ["<< inputs.tenant >>"]
          verbs: ["get", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: flux-ns-patch-<< inputs.tenant >>
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: << inputs.component >>
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        serviceAccountName: flux
        url: oci://${REGISTRY_BASE}/signalloom/infra/<< inputs.component >>
        insecure: ${REGISTRY_INSECURE}
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/acme-co/osramp/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-controllers
        namespace: << inputs.tenant >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: << inputs.component >>
        path: ./controllers/<< inputs.environment >>
        prune: true
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-configs
        namespace: << inputs.tenant >>
      spec:
        dependsOn:
          - name: infra-controllers
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: << inputs.component >>
        path: ./configs/<< inputs.environment >>
        prune: true
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: signalloom-apps
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: inf-signalloom
      ready: true
      readyExpr: status.observedGeneration >= 0
  # The Signal Loom frontend starts only through `make demo-signalloom-up`.
  inputs: []
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: tenant
    # Flux dry-run validates RoleBindings before resources from its own
    # Kustomization are persisted. The proxy health binding therefore needs its
    # Role to exist as part of tenant provisioning.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: fe-signalloom-health-reader
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["kustomize.toolkit.fluxcd.io"]
          resources: ["kustomizations"]
          verbs: ["get", "list"]
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list"]
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/flux-runtime-info
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/ghcr-auth
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # The built-in `admin` ClusterRole does not cover Gateway API resources
    # (Gateway API CRDs do not aggregate into admin/edit), so an app tenant that
    # ships HTTPRoutes (fe-signalloom's gateway-route.yaml) needs this explicit
    # least-privilege grant. Without it the apps Kustomization fails its
    # HTTPRoute dry-run and no workloads deploy.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: flux-gateway-routes
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["httproutes", "referencegrants", "grpcroutes", "tcproutes", "tlsroutes"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-gateway-routes
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: flux-gateway-routes
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # The built-in admin ClusterRole bound via RoleBinding cannot grant
    # access to cluster-scoped resources. Flux's Kustomization dry-run needs
    # to patch the tenant Namespace (labels/annotations from overlays).
    # Least-privilege: restricted to this specific tenant namespace.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      rules:
        - apiGroups: [""]
          resources: ["namespaces"]
          resourceNames: ["<< inputs.tenant >>"]
          verbs: ["get", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: flux-ns-patch-<< inputs.tenant >>
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: << inputs.component >>
        namespace: << inputs.tenant >>
        labels:
          bao.controlplane.io/consumer: fe-signalloom
      spec:
        interval: 5m
        serviceAccountName: flux
        url: oci://${REGISTRY_BASE}/signalloom/apps/<< inputs.component >>
        insecure: ${REGISTRY_INSECURE}
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/acme-co/osramp/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps
        namespace: << inputs.tenant >>
        labels:
          bao.controlplane.io/consumer: fe-signalloom
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        # Phase 1 establishes Flux delivery only. Workload health and the
        # deliberately negative SPIRE proof are acceptance evidence for later
        # phases, so they must not hold this delivery Kustomization unready.
        wait: false
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: << inputs.component >>
        path: ./<< inputs.environment >>
        prune: true
        # Proof Jobs are intentionally revised as the SPIRE assertion evolves;
        # Kubernetes makes Job pod templates immutable, so Flux must recreate it.
        force: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
