apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: afm-platform
  namespace: fe-k8s-afm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: afm-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fe-signalloom
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard-signalloom
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              gateway.envoyproxy.io/owning-gateway-name: cluster
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cluster-import
      ports:
        - protocol: TCP
          port: 8000
