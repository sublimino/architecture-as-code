apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# The portal is not a general cluster client. It can reach only DNS and the
# five declared backing services plus the bounded OpenBao proof endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-dependencies
spec:
  podSelector:
    matchLabels:
      bao.controlplane.io/consumer: fe-signalloom
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-signalloom
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 5556
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-bao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # rbac_correlation.py calls AFM_BASE_URL (afm-platform.fe-k8s-afm) server-side
    # to build /api/rbac/clusters/{id}/correlated. This is the API pod's egress
    # half; afm-platform itself has no ingress NetworkPolicy of its own (see
    # d2-k8s-afm/apps/afm-platform/base) so no matching ingress rule is needed there.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-k8s-afm
      ports:
        - protocol: TCP
          port: 8000
---
# Public exposure is permitted only through the selected gateway namespace;
# direct cross-namespace access to the portal is denied by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-ingress
spec:
  podSelector:
    matchLabels:
      bao.controlplane.io/consumer: fe-signalloom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              gateway.envoyproxy.io/owning-gateway-name: cluster
      ports:
        - protocol: TCP
          port: 8000
---
# Dashboard assets are served only through the selected Gateway. The dashboard
# has no direct service dependencies, so default-deny retains its egress boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard-signalloom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              gateway.envoyproxy.io/owning-gateway-name: cluster
      ports:
        - protocol: TCP
          port: 8080
---
# The dashboard nginx proxies /dex, /api, the AFM prefixes and /supercred-api/
# on the browser's behalf, so it needs egress to DNS, Dex (inf-signalloom), the
# in-namespace compatibility API, AFM (fe-k8s-afm), and the SuperCred
# fake-integration-proxy (inf-signalloom:8080).
#
# Every upstream in dashboard-signalloom/nginx.conf must have a rule here.
# default-deny above denies egress, and a denied packet is DROPPED, not
# rejected: the fetch hangs until nginx gives up and logs a 499, with nothing at
# all in the upstream's own logs. There is no error message anywhere that names
# the missing rule, so the omission reads as "the page just spins".
# Enforced by d2-signalloom/test/dashboard-route-collisions.bats.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard-signalloom
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dex
      ports:
        - protocol: TCP
          port: 5556
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fe-signalloom
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-k8s-afm
      ports:
        - protocol: TCP
          port: 8000
    # SuperCred: nginx's /supercred-api/ block proxies here. This is the egress
    # half of a pair — the ingress half is the dashboard-signalloom rule in
    # allow-fake-integration-proxy (inf-signalloom configs). Both are required;
    # removing either silently breaks the SuperCred page with no error anywhere
    # except a 499 in the dashboard's nginx access log.
    #
    # Note allow-portal-dependencies above also opens 8080 into inf-signalloom,
    # but its podSelector is bao.controlplane.io/consumer: fe-signalloom — the
    # API pod, not the dashboard. It does not cover this path.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fake-integration-proxy
      ports:
        - protocol: TCP
          port: 8080
---
# Permit the dashboard's /api proxy to reach the compatibility API in-namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-to-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fe-signalloom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard-signalloom
      ports:
        - protocol: TCP
          port: 8000
