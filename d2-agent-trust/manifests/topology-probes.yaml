apiVersion: batch/v1
kind: CronJob
metadata: {name: cross-project-denied, namespace: agent-trust-acme-risk}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      # 120s: the positive-control loop below may wait up to 60s for the CNI
      # to program this pod's rules, so the old 30s ceiling guaranteed a timeout.
      activeDeadlineSeconds: 120
      template:
        metadata: {labels: {agent-trust.signalloom.io/probe: cross-project-denied}}
        spec:
          serviceAccountName: agent-trust-risk-reader
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: probe
              image: busybox:1.36
              command: [sh, -ec]
              args:
                - |
                  # `nc` exits 1 for a dropped packet, an unresolvable name, a
                  # missing binary and a dead container alike, so a bare exit
                  # code cannot prove a denial — and this probe SELF-REPORTS a
                  # verdict the topology collector consumes as evidence. Deleting
                  # the allow-dns policy for this namespace made it emit
                  # "outcome":"pass" every five minutes forever.
                  #
                  # kube-dns TCP/53 is permitted from every agent-trust namespace
                  # by allow-dns, so reaching it is a positive control: it proves
                  # nc works here AND that the CNI has programmed this pod's
                  # rules. A brand-new pod is briefly unconfined, so without this
                  # the denial below could also just be measuring startup.
                  deadline=$(( $(date +%s) + 60 ))
                  until nc -z -w 3 kube-dns.kube-system.svc.cluster.local 53; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      printf '{"observed_at":"%s","outcome":"unverified","reason":"probe apparatus never became usable; denial unproven"}' "$now" > /dev/termination-log
                      exit 1
                    fi
                    sleep 2
                  done
                  # `nc` exits 1 for a dropped packet, an unresolvable name, a
                  # missing binary and a dead container alike, so a bare exit
                  # code cannot prove a denial — and this probe SELF-REPORTS a
                  # verdict the topology collector consumes as evidence. Deleting
                  # the allow-dns policy for this namespace made it emit
                  # "outcome":"pass" every five minutes forever.
                  #
                  # kube-dns TCP/53 is permitted from every agent-trust namespace
                  # by allow-dns, so reaching it is a positive control: it proves
                  # nc works here AND that the CNI has programmed this pod's
                  # rules. A brand-new pod is briefly unconfined, so without this
                  # the denial below could also just be measuring startup.
                  deadline=$(( $(date +%s) + 60 ))
                  until nc -z -w 3 kube-dns.kube-system.svc.cluster.local 53; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      printf '{"observed_at":"%s","outcome":"unverified","reason":"probe apparatus never became usable; denial unproven"}' "$now" > /dev/termination-log
                      exit 1
                    fi
                    sleep 2
                  done
                  now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  if nc -z -w 5 agent-trust-triage.agent-trust-acme-payments.svc 8080; then
                    printf '{"observed_at":"%s","outcome":"fail","reason":"cross-project path unexpectedly reachable"}' "$now" > /dev/termination-log
                    exit 1
                  fi
                  printf '{"observed_at":"%s","outcome":"pass","reason":"cross-project path denied"}' "$now" > /dev/termination-log
              terminationMessagePolicy: File
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: cross-tenant-denied, namespace: agent-trust-northstar-investigations}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      # 120s: the positive-control loop below may wait up to 60s for the CNI
      # to program this pod's rules, so the old 30s ceiling guaranteed a timeout.
      activeDeadlineSeconds: 120
      template:
        metadata: {labels: {agent-trust.signalloom.io/probe: cross-tenant-denied}}
        spec:
          serviceAccountName: agent-trust-investigator
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: probe
              image: busybox:1.36
              command: [sh, -ec]
              args:
                - |
                  # See cross-project-denied: `nc` cannot distinguish a dropped
                  # packet from an unresolvable name, a missing binary or a dead
                  # container, and this probe self-reports a verdict the topology
                  # collector treats as evidence. kube-dns TCP/53 is permitted
                  # from every agent-trust namespace by allow-dns, so reaching it
                  # proves both that the probe works and that this pod's rules
                  # are programmed — a new pod is briefly unconfined.
                  deadline=$(( $(date +%s) + 60 ))
                  until nc -z -w 3 kube-dns.kube-system.svc.cluster.local 53; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      printf '{"observed_at":"%s","outcome":"unverified","reason":"probe apparatus never became usable; denial unproven"}' "$now" > /dev/termination-log
                      exit 1
                    fi
                    sleep 2
                  done
                  now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  if nc -z -w 5 agent-trust-triage.agent-trust-acme-payments.svc 8080; then
                    printf '{"observed_at":"%s","outcome":"fail","reason":"cross-tenant path unexpectedly reachable"}' "$now" > /dev/termination-log
                    exit 1
                  fi
                  printf '{"observed_at":"%s","outcome":"pass","reason":"cross-tenant path denied"}' "$now" > /dev/termination-log
              terminationMessagePolicy: File
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: planner-egress-denied, namespace: agent-trust-acme-payments}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      # 240s, not 120s: the probe below spends two bounded waits back to back —
      # up to 60s for the OpenBao control, then up to 90s polling the denial
      # until the CNI has programmed this pod's rules. 120s could expire
      # mid-poll and turn a healthy cluster into a DeadlineExceeded pod, which
      # reads as a failure with no termination message to explain it. Stays
      # under the 300s schedule tick so a slow run cannot lap itself.
      activeDeadlineSeconds: 240
      template:
        metadata: {labels: {agent-trust.signalloom.io/probe: planner-egress-denied, app.kubernetes.io/name: agent-trust-planner, app.kubernetes.io/component: probe}}
        spec:
          serviceAccountName: agent-trust-planner
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: probe
              image: busybox:1.36
              command: [sh, -ec]
              args:
                - |
                  # A brand-new pod is briefly UNCONFINED. The CNI programs its
                  # NetworkPolicy rules shortly AFTER it starts running, so an
                  # `nc` fired at t=0 reaches anything and this probe reported
                  # "arbitrary planner egress unexpectedly reachable" — a
                  # security hole that does not exist.
                  #
                  # THE OPENBAO CONTROL CANNOT DETECT THAT WINDOW, which is why
                  # the previous version of this probe still failed on every
                  # single run. The planner is ALLOWED to reach OpenBao, so an
                  # unconfined pod reaches it too — the control is satisfied
                  # identically whether the rules are programmed or absent, so
                  # it distinguishes nothing about confinement and passes at
                  # t=0 while the pod is still wide open. Measured on the live
                  # cluster 2026-08-22, two pods identical but for a settle:
                  #   control-then-immediately   1.1.1.1:443 REACHABLE
                  #   control-then-sleep-10      1.1.1.1:443 refused
                  # The hole was in the probe, not in the NetworkPolicy.
                  #
                  # Only the denial itself distinguishes confined from
                  # unconfined, so POLL THE DENIAL rather than sampling it once.
                  # Enforcement is eventually-consistent: reachable-then-refused
                  # is the CNI catching up and is a pass, while still reachable
                  # at the deadline is a genuine hole. A refusal never reverts,
                  # so polling cannot launder a real failure into a pass.
                  #
                  # The OpenBao control is KEPT, for the one thing it does
                  # prove: that the allow-path works at all. Without it a pod
                  # with no network whatsoever would refuse 1.1.1.1 and be
                  # reported as correctly-denied.
                  #
                  # Fails UNVERIFIED rather than passing if the control never
                  # comes up — same fail-closed vocabulary as the rest of the
                  # slice; a probe that cannot observe enforcement must never
                  # report a pass.
                  deadline=$(( $(date +%s) + 60 ))
                  until nc -z -w 3 openbao.inf-bao.svc.cluster.local 8200; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      printf '{"observed_at":"%s","outcome":"unverified","reason":"NetworkPolicy enforcement never became observable; denial unproven"}' "$now" > /dev/termination-log
                      exit 1
                    fi
                    sleep 2
                  done
                  denial_deadline=$(( $(date +%s) + 90 ))
                  while nc -z -w 5 1.1.1.1 443; do
                    if [ "$(date +%s)" -ge "$denial_deadline" ]; then
                      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      printf '{"observed_at":"%s","outcome":"fail","reason":"arbitrary planner egress unexpectedly reachable"}' "$now" > /dev/termination-log
                      exit 1
                    fi
                    sleep 2
                  done
                  now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  printf '{"observed_at":"%s","outcome":"pass","reason":"arbitrary planner egress denied"}' "$now" > /dev/termination-log
              terminationMessagePolicy: File
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
