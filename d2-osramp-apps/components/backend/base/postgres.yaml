apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  init.sql.sh: |
    #!/bin/bash
    set -e
    
    # Create postgres superuser and set password if provided
    if [ -n "$POSTGRES_POSTGRES_PASSWORD" ]; then
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
    CREATE USER postgres WITH SUPERUSER PASSWORD '$POSTGRES_POSTGRES_PASSWORD';
    EOSQL
    fi
    
    # Create task_archive database
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
    CREATE DATABASE task_archive;
    GRANT ALL PRIVILEGES ON DATABASE task_archive TO $POSTGRES_USER;
    EOSQL

