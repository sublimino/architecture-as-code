---
apiVersion: v1
kind: Secret
metadata:
  name: kagent-anthropic-key
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  api-key: "mock-anthropic-key-for-local-demo"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-controller
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent
        app.kubernetes.io/part-of: signalloom
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kagent-controller
      containers:
        - name: controller
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import time, sys
              print("Starting Kagent v0.9.9 Controller (Go ADK default, Anthropic provider)...")
              print("Reconciling Agent CRDs, ModelConfigs, and MCPServers...")
              sys.stdout.flush()
              while True:
                  time.sleep(10)
          env:
            - name: DATABASE_URL
              value: "postgres://kagent:kagent-db-password-local@kagent-postgres.kagent.svc.cluster.local:5432/kagent?sslmode=disable"
            - name: DEFAULT_RUNTIME
              value: "go"
            - name: PROVIDER_DEFAULT
              value: "anthropic"
            - name: TOOLS_SERVER_URL
              value: "http://kagent-tool-server.kagent.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "echo ready"
            initialDelaySeconds: 2
            periodSeconds: 5
