apiVersion: v1
kind: Service
metadata:
  name: prod-deploy-gate
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: "gate"
spec:
  type: ClusterIP
  selector:
    app: prod-deploy-gate
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
