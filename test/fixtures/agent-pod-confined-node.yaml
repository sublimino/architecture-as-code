apiVersion: v1
kind: Pod
metadata:
  name: test-agent-confined
  namespace: default
  labels:
    signalloom.ai/agent: "true"
    app.kubernetes.io/name: test-agent
spec:
  nodeSelector:
    node.signalloom.ai/cgroup-v2: "true"
    node.signalloom.ai/landlock: "true"
  containers:
  - name: runner
    image: alpine:latest
    command: ["sleep", "3600"]
