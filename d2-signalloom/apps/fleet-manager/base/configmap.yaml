apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-config
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
data:
  fleet.yaml: |
    # ── aggregateRisk: AUTHORED DEMO DATA, NOT A COMPUTED FIGURE ──────────────
    #
    # The dashboard renders these as currency on the Fleet page, so they need to
    # be right in the sense of "deliberately chosen and reviewable", not in the
    # sense of "derived". They are declared here rather than calculated in Go on
    # purpose: this repository has NO fleet risk model. risk/ and tools/riskctl
    # implement FAIR over component CVE baselines, which is a different subject
    # entirely, and nothing anywhere maps an agent's riskClass to an ALE. A
    # number invented inside the topology handler would be a fabricated risk
    # figure presented to a bank audience with no way to review or change it
    # short of a rebuild.
    #
    # Provenance: these are the figures the repo's own Fleet page fixture already
    # used (FleetDemoPage.test.tsx:61) — adopted rather than invented, so the
    # live demo and the test fixture tell the same story.
    #
    # They are demo values and should be replaced when a real fleet risk model
    # exists. Editing them here changes the demo with no code change and no
    # rebuild: fleet-manager reads this ConfigMap at /etc/fleet/fleet.yaml.
    aggregateRisk:
      ale: 847000
      var95: 1200000
      trend: up
      previousAle: 650000
    # `name` is the human label the topology graph draws on each node. It falls
    # back to `id` when omitted, so it is not load-bearing — but "Card Vault"
    # reads better on a projector than "agent-cardvault".
    agents:
      - id: agent-cardvault
        name: Card Vault
        type: data-vault
        team: platform
        trustProfile: high
        riskClass: high
        gracePeriod: 0h
        dependencies: []
        namespace: fe-signalloom-agents
      - id: agent-txn-pipeline
        name: Transaction Pipeline
        type: data-pipeline
        team: payments
        trustProfile: medium
        riskClass: medium
        gracePeriod: 72h
        dependencies: [agent-cardvault]
        namespace: fe-signalloom-agents
      - id: agent-llm-classifier
        name: LLM Classifier
        type: llm-inference
        team: ml-ops
        trustProfile: high
        riskClass: high
        gracePeriod: 0h
        dependencies: [agent-txn-pipeline]
        namespace: fe-signalloom-agents
      - id: agent-api-gateway
        name: API Gateway
        type: api-gateway
        team: platform
        trustProfile: medium
        riskClass: medium
        gracePeriod: 24h
        dependencies: [agent-cardvault]
        namespace: fe-signalloom-agents
      - id: agent-monitor
        name: Fleet Monitor
        type: observability
        team: sre
        trustProfile: low
        riskClass: low
        gracePeriod: 0h
        dependencies: [agent-cardvault, agent-txn-pipeline, agent-llm-classifier, agent-api-gateway]
        namespace: fe-signalloom-agents
      # Kusari pilot agent. The id must be agent-kusari-agent: fleet-manager
      # strips the agent- prefix and selects pods on
      # signalloom.ai/agent-name=kusari-agent, which is the live pod's label
      # (the pod itself is named agent-kusari-<rs-hash>-<suffix>, so the
      # by-name lookup misses and the selector fallback resolves it).
      - id: agent-kusari-agent
        name: Kusari Agent
        type: supply-chain
        team: kusari
        trustProfile: low
        riskClass: high
        gracePeriod: 0h
        dependencies: []
        namespace: fe-signalloom-agents
  # ── identity.<agent-name> / identity-ns.<agent-name> — the agent identity map
  #
  # The single source of truth binding a signalloom.ai/agent-name label value
  # to the NAMESPACE and ServiceAccount the real agent is registered to run
  # as. A pod's labels are written by whoever creates it -- including
  # hosted-daytona-coder, which holds pod-create RBAC in fe-signalloom-agents
  # (d2-signalloom/infra/agent-swarm/hosted-daytona-coder/rolebinding.yaml) --
  # so a label match alone can never prove a pod is the real agent-name it
  # claims to be. Both namespace and ServiceAccount are required: a
  # ServiceAccount name is only unique within its namespace, so a decoy in a
  # DIFFERENT namespace that names its own ServiceAccount after a registered
  # agent (e.g. a workload in hosted-daytona-coder's own namespace running as
  # a ServiceAccount literally called "kusari-agent") must not pass a check
  # that compares the ServiceAccount name alone. Every place that resolves
  # "which agent is this pod" from a label checks the match here first:
  #
  #   - fleet-manager: agent_resolution.go (resolveAgentID), k8sclient.go
  #     (resolvePod), mesh_client.go (resolveTargetIP) -- all reading this
  #     same ConfigMap's mounted files (identity_map.go, LoadAgentIdentityMap).
  #   - the ValidatingAdmissionPolicy sl-agent-identity-binding, defined
  #     inline in the fleet's cluster-level ResourceSet at
  #     d2-osramp-fleet/tenants/base/policies.yaml (reconciled by
  #     flux-system, NOT by this tenant's own Kustomization -- the tenant
  #     ServiceAccount has no RBAC to touch cluster-scoped admission
  #     policies, and must not be granted any). It admits this ConfigMap as
  #     its params object and rejects CREATE/UPDATE, in ANY namespace, of a
  #     pod whose signalloom.ai/agent-name label names a registered agent
  #     but whose namespace/serviceAccountName pair differs.
  #   - fe-signalloom: agent_identity_map.py / claim_tenancy.py (authorize()).
  #
  # Two keys per registered agent -- the ServiceAccount (identity.) and its
  # namespace (identity-ns.), kept as sibling keys rather than one combined
  # value so no reader needs to parse a delimiter (in particular, the CEL
  # policy above needs no string-splitting). An agent with only one half of
  # the pair is treated as UNREGISTERED by every reader, never as "registered
  # with an empty namespace" -- see LoadAgentIdentityMap's doc comment. Values
  # are read verbatim (ConfigMap volume mount materialises each key as a
  # file; trailing whitespace is trimmed by every reader), so there is
  # exactly one authored list -- extending the map to a new agent is two
  # lines here, never a change to Go, Python or CEL. Values cross-checked
  # against the live manifests in
  # d2-signalloom/infra/agent-swarm/*/service-account.yaml and deployment.yaml.
  identity.cardvault: agent-cardvault
  identity-ns.cardvault: fe-signalloom-agents
  identity.kusari-agent: kusari-agent
  identity-ns.kusari-agent: fe-signalloom-agents
  identity.agent-nono-evidenced: agent-nono-evidenced
  identity-ns.agent-nono-evidenced: fe-signalloom-agents
  identity.agent-standard-baseline: agent-standard-baseline
  identity-ns.agent-standard-baseline: fe-signalloom-agents
