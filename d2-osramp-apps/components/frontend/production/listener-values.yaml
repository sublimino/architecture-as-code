apiVersion: apps/v1
kind: Deployment
metadata:
  name: osramp-multipurpose
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: listener
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
        - name: processor
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
