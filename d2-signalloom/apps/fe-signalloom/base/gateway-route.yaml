apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signalloom-dashboard
spec:
  parentRefs:
    - name: cluster
      namespace: ingress
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dashboard-signalloom
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signalloom-api
spec:
  parentRefs:
    - name: cluster
      namespace: ingress
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: fe-signalloom-api
          port: 8000
