framework:
  id: eu-ai-act
  name: EU AI Act
  version: v2.0.0
  description: "Standard tier — defence-in-depth for high-risk AI systems"

controlSets:
  - id: art9-risk-mgmt
    name: "Art. 9 — Risk Management System"
    controls:
      - id: art9-1-non-root
        name: "AI containers run as non-root"
        description: "High-risk AI systems must not run with root privileges"
        riskTriple:
          min: 5000
          mode: 25000
          max: 100000
        checks:
          - id: container-run-as-non-root
            name: "Container runs as non-root"
            cel: "object.spec.containers.all(c, c.securityContext.runAsNonRoot == true)"
      - id: art9-2-no-privilege-escalation
        name: "No privilege escalation"
        description: "AI containers must not allow privilege escalation"
        riskTriple:
          min: 5000
          mode: 30000
          max: 120000
        checks:
          - id: no-privilege-escalation
            name: "Privilege escalation disabled"
            cel: "object.spec.containers.all(c, c.securityContext.allowPrivilegeEscalation == false)"
      - id: art9-3-no-privileged
        name: "No privileged containers"
        description: "AI containers must not run in privileged mode"
        riskTriple:
          min: 8000
          mode: 40000
          max: 150000
        checks:
          - id: no-privileged-mode
            name: "Privileged mode disabled"
            cel: "object.spec.containers.all(c, !c.securityContext.privileged)"
      - id: art9-4-read-only-rootfs
        name: "Read-only root filesystem"
        description: "Containers must use read-only root filesystem to limit attack surface"
        riskTriple:
          min: 3000
          mode: 15000
          max: 70000
        checks:
          - id: read-only-rootfs
            name: "Read-only root filesystem"
            cel: "object.spec.containers.all(c, c.securityContext.readOnlyRootFilesystem == true)"
      - id: art9-5-drop-capabilities
        name: "Drop all capabilities"
        description: "Containers must drop all Linux capabilities"
        riskTriple:
          min: 4000
          mode: 20000
          max: 90000
        checks:
          - id: drop-all-capabilities
            name: "All capabilities dropped"
            cel: "object.spec.containers.all(c, c.securityContext.capabilities.drop.exists(d, d == 'ALL'))"
      - id: art9-6-liveness-probe
        name: "Liveness probe configured"
        description: "AI workloads must have liveness probes for fault detection"
        riskTriple:
          min: 1000
          mode: 8000
          max: 35000
        checks:
          - id: liveness-probe-present
            name: "Liveness probe defined"
            cel: "object.spec.containers.all(c, has(c.livenessProbe))"

  - id: art10-data-governance
    name: "Art. 10 — Data Governance"
    controls:
      - id: art10-1-data-classification
        name: "Data classification label present"
        description: "Workloads handling training data must declare classification"
        riskTriple:
          min: 3000
          mode: 15000
          max: 70000
        checks:
          - id: data-classification-label
            name: "Data classification label exists"
            cel: "has(object.metadata.labels.data_classification)"
      - id: art10-2-pii-handling
        name: "PII handling annotation"
        description: "Workloads must declare whether they process PII"
        riskTriple:
          min: 5000
          mode: 25000
          max: 100000
        checks:
          - id: pii-handling-annotation
            name: "PII handling declared"
            cel: "object.metadata.annotations.exists(k, k == 'osramp.io/pii-handling')"
      - id: art10-3-data-retention
        name: "Data retention annotation"
        description: "Workloads must declare data retention policy"
        riskTriple:
          min: 2000
          mode: 12000
          max: 55000
        checks:
          - id: data-retention-annotation
            name: "Data retention policy declared"
            cel: "object.metadata.annotations.exists(k, k == 'osramp.io/data-retention')"

  - id: art14-human-oversight
    name: "Art. 14 — Human Oversight"
    controls:
      - id: art14-1-hitl-label
        name: "Human-in-the-loop label present"
        description: "AI workloads must declare their human oversight level"
        riskTriple:
          min: 5000
          mode: 25000
          max: 100000
        checks:
          - id: hitl-label
            name: "HITL oversight label exists"
            cel: "has(object.metadata.labels.ai_human_oversight)"
      - id: art14-2-approval-gate
        name: "Approval gate annotation"
        description: "High-risk AI decisions must have an approval gate configured"
        riskTriple:
          min: 8000
          mode: 35000
          max: 140000
        checks:
          - id: approval-gate-annotation
            name: "Approval gate annotation present"
            cel: "object.metadata.annotations.exists(k, k == 'osramp.io/approval-gate')"
      - id: art14-3-override-contact
        name: "Human override contact"
        description: "Workloads must declare a human override contact"
        riskTriple:
          min: 3000
          mode: 15000
          max: 60000
        checks:
          - id: override-contact-annotation
            name: "Override contact declared"
            cel: "object.metadata.annotations.exists(k, k == 'osramp.io/override-contact')"

  - id: art15-accuracy-robustness
    name: "Art. 15 — Accuracy, Robustness & Cybersecurity"
    controls:
      - id: art15-1-resource-limits
        name: "Resource limits defined"
        description: "AI workloads must have resource limits to prevent resource exhaustion"
        riskTriple:
          min: 3000
          mode: 15000
          max: 60000
        checks:
          - id: resource-limits-set
            name: "CPU and memory limits defined"
            cel: "object.spec.containers.all(c, has(c.resources) && has(c.resources.limits))"
      - id: art15-2-resource-requests
        name: "Resource requests defined"
        description: "AI workloads must declare resource requests for scheduling"
        riskTriple:
          min: 2000
          mode: 10000
          max: 40000
        checks:
          - id: resource-requests-set
            name: "CPU and memory requests defined"
            cel: "object.spec.containers.all(c, has(c.resources) && has(c.resources.requests))"
      - id: art15-3-readiness-probe
        name: "Readiness probe configured"
        description: "AI workloads must have readiness probes for availability"
        riskTriple:
          min: 2000
          mode: 10000
          max: 45000
        checks:
          - id: readiness-probe-present
            name: "Readiness probe defined"
            cel: "object.spec.containers.all(c, has(c.readinessProbe))"
      - id: art15-4-replica-count
        name: "Minimum replica count"
        description: "High-risk AI workloads should have multiple replicas"
        riskTriple:
          min: 3000
          mode: 12000
          max: 50000
        checks:
          - id: min-replicas
            name: "At least 2 replicas specified"
            cel: "object.spec.replicas >= 2"

  - id: art17-quality-mgmt
    name: "Art. 17 — Quality Management System"
    controls:
      - id: art17-1-image-digest
        name: "Image pinned by digest"
        description: "Container images must use digest references for reproducibility"
        riskTriple:
          min: 5000
          mode: 20000
          max: 80000
        checks:
          - id: image-digest-required
            name: "Image uses sha256 digest"
            cel: "object.spec.containers.all(c, c.image.contains('@sha256:'))"
      - id: art17-2-trusted-registry
        name: "Trusted registry enforcement"
        description: "Images must originate from approved registries"
        riskTriple:
          min: 5000
          mode: 25000
          max: 100000
        checks:
          - id: trusted-registry
            name: "Image from trusted registry"
            cel: "object.spec.containers.all(c, c.image.startsWith('ghcr.io/') || c.image.startsWith('registry.internal/'))"
      - id: art17-3-version-label
        name: "Policy version label"
        description: "Workloads must declare the policy version they comply with"
        riskTriple:
          min: 1000
          mode: 5000
          max: 25000
        checks:
          - id: policy-version-label
            name: "Policy version label present"
            cel: "has(object.metadata.labels.policy_version)"
