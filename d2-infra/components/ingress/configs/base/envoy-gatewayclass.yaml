apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # kind has no cloud load balancer; NodePort exposes the gateway on the
        # node so kind extraPortMappings can forward host ports to it. A cloud
        # deployment would use LoadBalancer with provider annotations here.
        type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-gateway
    namespace: ingress
