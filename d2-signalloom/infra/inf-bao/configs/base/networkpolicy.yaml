apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Bao and SPIRE form one tightly bounded infrastructure slice. Internal
# control traffic stays in this namespace; the portal may reach OpenBao only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bao-spire-and-portal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
          podSelector:
            matchLabels:
              bao.controlplane.io/consumer: fe-signalloom
      ports:
        - protocol: TCP
          port: 8200
    # SuperCred: agents in the agent-inventory namespace need OpenBao access
    # for the SPIFFE→JWT→KV credential chain.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom-agents
          podSelector:
            matchLabels:
              bao.controlplane.io/consumer: cardvault-agent
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
