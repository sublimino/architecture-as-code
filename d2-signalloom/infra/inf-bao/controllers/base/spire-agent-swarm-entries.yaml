# FLUX ENVSUBST: NO — no postBuild on the Flux Kustomization that reconciles
# this directory. Flux does NOT run envsubst here.
#
# SPIRE registration entries for the agent swarm. Uses the k8s workload
# attestor's pod-label selector so any pod in fe-signalloom-agents with
# `signalloom.ai/agent: "true"` automatically receives a SPIFFE SVID
# scoped to its service account.
#
# This ConfigMap + Job pattern mirrors openbao-spire.yaml: a one-shot Job
# registers the entries via the SPIRE Server API after the server is ready.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-swarm-entries-config
data:
  register-entries.sh: |
    #!/usr/bin/env bash
    set -eo pipefail

    SPIRE_SERVER="${SPIRE_SERVER:-spire-server.inf-bao.svc.cluster.local:8081}"

    # The ten demo agent service accounts. Each gets a registration entry
    # using the label-based workload attestation selector so SPIRE issues
    # SVIDs automatically when the pod carries signalloom.ai/agent=true.
    AGENTS=(
      prompt-commit-summarizer
      triage-ci-worker
      zulip-chat-agent
      cpai-engineer
      hosted-daytona-coder
      swarm-governor
      prod-deploy-gate
      agent-cardvault
      nono-containment-probe
      signalloom-stun-sentinel
    )

    for sa in "${AGENTS[@]}"; do
      echo "--- Registering SPIRE entry: ${sa} ---"
      /opt/spire/bin/spire-server entry create \
        -spiffeID "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/${sa}" \
        -parentID "spiffe://signalloom.demo/spire/agent/join_token" \
        -selector "k8s:ns:fe-signalloom-agents" \
        -selector "k8s:sa:${sa}" \
        -selector "k8s:pod-label:signalloom.ai/agent:true" \
        -dns "${sa}.fe-signalloom-agents.svc.cluster.local" \
        -registrationUDSPath /run/spire/sockets/registration.sock \
        2>/dev/null || echo "  (entry may already exist, continuing)"
    done

    echo "--- Listing all entries ---"
    /opt/spire/bin/spire-server entry show \
      -registrationUDSPath /run/spire/sockets/registration.sock \
      2>/dev/null || true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spire-agent-swarm-entries-setup
  labels:
    app.kubernetes.io/name: spire-agent-swarm-entries
    app.kubernetes.io/part-of: signalloom-bao-proof
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-agent-swarm-entries
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-spire
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for SPIRE server to be ready..."
              until nc -z spire-server.inf-bao.svc.cluster.local 8081 2>/dev/null; do
                sleep 2
              done
              echo "SPIRE server is ready."
      containers:
        - name: register
          image: ghcr.io/spiffe/spire-server:1.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat /config/register-entries.sh | sh
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: spire-socket
              mountPath: /run/spire/sockets
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: config
          configMap:
            name: spire-agent-swarm-entries-config
        - name: spire-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
