# FLUX ENVSUBST: NO — Dynamic script or EAP reconciler renders variables at runtime.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eap-route-${EAP_HASH}
  namespace: ${EAP_NAMESPACE:-fe-signalloom}
  labels:
    app.kubernetes.io/managed-by: signalloom-eap
    signalloom.io/eap-hash: "${EAP_HASH}"
    signalloom.io/customer: "${EAP_CUSTOMER}"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster
      namespace: ingress
  hostnames:
    - "sl-eap-${EAP_HASH}.tailscale"
    - "sl-eap-${EAP_HASH}.ts.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: dashboard-signalloom
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dashboard-signalloom
          port: 8080
