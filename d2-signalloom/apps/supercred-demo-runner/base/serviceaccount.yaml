apiVersion: v1
kind: ServiceAccount
metadata:
  name: supercred-demo-runner
  labels:
    app.kubernetes.io/name: supercred-demo-runner
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
# The whole point of this workload is that it, and not fe-signalloom, holds the
# cluster-mutating grants the SuperCred demo needs. fe-signalloom-api keeps its
# own ServiceAccount and gains nothing from this file.
