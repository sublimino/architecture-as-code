# Fixed periodic probes. Helper probe modes write token-free RFC3339 JSON directly
# to /dev/termination-log; network probes declare success only on expected denial.
apiVersion: batch/v1
kind: CronJob
metadata: {name: spiffe-planner, namespace: agent-trust-acme-payments}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate: {spec: {backoffLimit: 0, activeDeadlineSeconds: 45, template: {metadata: {labels: {agent-trust.signalloom.io/probe: spiffe-planner}}, spec: {serviceAccountName: agent-trust-planner, automountServiceAccountToken: false, restartPolicy: Never, securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}, containers: [{name: probe, image: signalloom-spire-helper:local, imagePullPolicy: Never, args: [probe-svid], terminationMessagePolicy: File, securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}, volumeMounts: [{name: spire-sockets, mountPath: /run/spire/sockets, readOnly: true}]}], volumes: [{name: spire-sockets, hostPath: {path: /run/spire/sockets, type: Directory}}]}}}}
---
