# FLUX ENVSUBST: NO — the Flux Kustomization that reconciles this directory
# has no postBuild (see this directory's kustomization.yaml). Flux does NOT
# run envsubst here; ${VAR} below is SPIRE's own -expandEnv shell-style
# substitution at container startup, not Flux's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-config
data:
  server.conf: |
    server { bind_address = "0.0.0.0" bind_port = "8081" trust_domain = "signalloom.demo" data_dir = "/run/spire/data" }
    plugins { DataStore "sql" { plugin_data { database_type = "sqlite3" connection_string = "/run/spire/data/datastore.sqlite3" } } KeyManager "disk" { plugin_data { keys_path = "/run/spire/data/keys.json" } } NodeAttestor "join_token" { } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-config
data:
  agent.conf: |
    agent { data_dir = "/run/spire/data" socket_path = "/run/spire/sockets/agent.sock" trust_domain = "signalloom.demo" server_address = "spire-server.inf-bao.svc.cluster.local" server_port = "8081" insecure_bootstrap = true join_token = "${JOIN_TOKEN}" }
    plugins { KeyManager "memory" { } NodeAttestor "join_token" { } WorkloadAttestor "k8s" { plugin_data { skip_kubelet_verification = true } } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-spire-policy
data:
  signalloom-fe-signalloom.hcl: |
    path "kv/data/signalloom/fe-signalloom" { capabilities = ["read"] }
  identity.json: |
    {"namespace":"fe-signalloom","serviceAccount":"fe-signalloom","selector":["k8s:ns:fe-signalloom","k8s:sa:fe-signalloom"],"spiffeID":"spiffe://signalloom.demo/ns/fe-signalloom/sa/fe-signalloom","audience":"openbao","role":"signalloom-fe-signalloom","policy":"kv/data/signalloom/fe-signalloom","negativeServiceAccount":"fe-signalloom-negative"}
