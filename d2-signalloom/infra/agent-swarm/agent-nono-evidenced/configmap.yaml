apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-nono-evidenced-config
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/instance: agent-nono-evidenced
    signalloom.ai/agent: "true"
    signalloom.ai/agent-name: agent-nono-evidenced
    signalloom.io/agent: demo
    signalloom.io/workload-profile: nono-evidenced
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    trap 'echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [agent-nono-evidenced] Received termination signal, shutting down gracefully"; exit 0' SIGTERM SIGINT SIGHUP

    AGENT_ID="${AGENT_ID:-agent-nono-evidenced}"
    AGENT_NAME="${AGENT_NAME:-Demo Agent (Nono Evidenced)}"
    WORKLOAD_PROFILE="${WORKLOAD_PROFILE:-nono-evidenced}"
    SPIFFE_SOCKET="${SPIFFE_SOCKET:-/run/spire/sockets/agent.sock}"
    SPIFFE_ID="${SPIFFE_ID:-spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/agent-nono-evidenced}"
    HEARTBEAT_INTERVAL="${HEARTBEAT_INTERVAL:-10}"

    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ================================================================================"
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Starting Signal Loom Demo Agent: ${AGENT_NAME} (${AGENT_ID})"
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Workload Profile: ${WORKLOAD_PROFILE}"
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Expected SPIFFE ID: ${SPIFFE_ID}"
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] SPIFFE Workload API Socket: ${SPIFFE_SOCKET}"
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ================================================================================"

    # SPIFFE Workload API socket preflight probe
    if [ -S "$SPIFFE_SOCKET" ]; then
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [SPIFFE] Workload API socket verified available at ${SPIFFE_SOCKET}"
    else
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [SPIFFE] WARNING: Workload API socket not found at ${SPIFFE_SOCKET}"
    fi

    # Dynamic Nono Optionality & Capability Detection (SP-5)
    NONO_AVAILABLE=false
    if command -v nono >/dev/null 2>&1; then
      NONO_AVAILABLE=true
      NONO_BIN="$(command -v nono)"
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [NONO-PROBE] {\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"event\":\"nono_probe\",\"status\":\"detected\",\"nono_available\":true,\"binary\":\"${NONO_BIN}\",\"sandboxing\":\"landlock\",\"evidence_signing\":\"spiffe\"}"
    else
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [NONO-PROBE] {\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"event\":\"nono_probe\",\"status\":\"fallback\",\"nono_capability_available\":false,\"warning\":\"Nono binary or Landlock LSM not available on container substrate; executing unconfined without crashing or blocking pod scheduling\"}"
    fi

    # Periodic heartbeat and audit session emission loop
    SEQ=0
    SESSION_ID="audit-sess-${AGENT_ID}-$(date +%s)"
    while true; do
      SEQ=$((SEQ + 1))
      NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "{\"timestamp\":\"${NOW}\",\"agent_id\":\"${AGENT_ID}\",\"name\":\"${AGENT_NAME}\",\"profile\":\"${WORKLOAD_PROFILE}\",\"spiffe_id\":\"${SPIFFE_ID}\",\"status\":\"healthy\",\"lifecycle_state\":\"active\",\"heartbeat_seq\":${SEQ},\"nono_capability_available\":${NONO_AVAILABLE},\"audit_session_id\":\"${SESSION_ID}\"}"
      sleep "${HEARTBEAT_INTERVAL}" &
      wait $!
    done
