apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-integration-proxy
  labels:
    app.kubernetes.io/name: fake-integration-proxy
    app.kubernetes.io/part-of: signalloom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-integration-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-integration-proxy
        app.kubernetes.io/part-of: signalloom-demo
    spec:
      containers:
        - name: fake-integration-proxy
          image: fake-integration-proxy:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SIGNALLOOM_DEMO_PROFILE
              value: demo
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: fake-integration-proxy
  labels:
    app.kubernetes.io/name: fake-integration-proxy
spec:
  selector:
    app.kubernetes.io/name: fake-integration-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
