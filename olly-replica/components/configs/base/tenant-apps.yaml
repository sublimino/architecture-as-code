# One ServiceMonitor scrapes all three tenant apps (shared label selector). The
# osramp.acme.co/scrape: Enabled label is the gate kube-prometheus-stack's
# serviceMonitorSelector requires; app_id arrives as a metric label already.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tenant-apps
  labels:
    app.fluxcd.io/component: "metrics"
    osramp.acme.co/scrape: Enabled
spec:
  selector:
    matchLabels:
      osramp.acme.co/tenant-app: "true"
  endpoints:
    - port: metrics
      interval: 30s
---
# Alert rules over the metrics the tenant apps already export, labelled by
# app_id. These make ALERTS{app_id} a real series for the estate landing page
# and commit the Warning/Critical thresholds the dashboard bands read, so the
# health verdict is system-derived rather than a per-panel choice.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tenant-apps
  labels:
    app.fluxcd.io/component: "metrics"
    release: kube-prometheus-stack
spec:
  groups:
    - name: tenant-apps.rules
      rules:
        - alert: TenantAppErrorRateHigh
          expr: |
            100 * sum by (app_id) (rate(tenant_app_requests_total{code="500"}[5m]))
              / clamp_min(sum by (app_id) (rate(tenant_app_requests_total[5m])), 0.001) > 10
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.app_id }} error rate above 10%"
        - alert: TenantAppErrorRateElevated
          expr: |
            100 * sum by (app_id) (rate(tenant_app_requests_total{code="500"}[5m]))
              / clamp_min(sum by (app_id) (rate(tenant_app_requests_total[5m])), 0.001) > 3
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.app_id }} error rate above 3%"
        - alert: TenantAppLatencyP95High
          expr: |
            histogram_quantile(0.95,
              sum by (app_id, le) (rate(tenant_app_request_duration_seconds_bucket[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.app_id }} p95 latency above 500ms"
        - alert: TenantAppUpstreamDown
          expr: tenant_app_upstream_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.app_id }} upstream {{ $labels.upstream }} is down"
