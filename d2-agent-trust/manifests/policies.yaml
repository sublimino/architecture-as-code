---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-planner-to-triage, namespace: agent-trust-acme-payments}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: agent-trust-triage}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: agent-trust-planner}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-planner-to-triage-egress, namespace: agent-trust-acme-payments}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: agent-trust-planner}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: agent-trust-triage}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-planner-openbao-egress, namespace: agent-trust-acme-payments, annotations: {agent-trust.signalloom.io/openbao-ingress-intent: "inf-bao/openbao TCP/8200; destination policy remains baseline gap"}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: agent-trust-planner}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: inf-bao}}, podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}}]
      ports: [{protocol: TCP, port: 8200}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-triage-openbao-egress, namespace: agent-trust-acme-payments, annotations: {agent-trust.signalloom.io/openbao-ingress-intent: "inf-bao/openbao TCP/8200; destination policy remains baseline gap"}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: agent-trust-triage}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: inf-bao}}, podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}}]
      ports: [{protocol: TCP, port: 8200}]
