# ECK operator, scoped to the olly-replica namespace only: it manages the
# single-node Elasticsearch that stands in for the client's ELK estate
# (app-logs-*, infra-logs-*, audit-logs-* -- the elk.logs.read MCP source
# from the design doc's tool surface).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: elastic
spec:
  interval: 1h
  url: https://helm.elastic.co
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
spec:
  interval: 1h
  releaseName: eck-operator
  chart:
    spec:
      chart: eck-operator
      version: "2.16.1"
      sourceRef:
        kind: HelmRepository
        name: elastic
  install:
    crds: Create
    timeout: 5m
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 3
  values:
    # Watch only this tenant's namespace; the operator holds no power over
    # the rest of the cluster.
    managedNamespaces:
      - olly-replica
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
