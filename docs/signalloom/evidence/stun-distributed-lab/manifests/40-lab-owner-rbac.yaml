# W6 lab only: read access the owner-annotation patch needs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: stun-sentinel-owner-read, namespace: fe-signalloom-agents}
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: stun-sentinel-owner-read, namespace: fe-signalloom-agents}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: stun-sentinel-owner-read}
subjects: [{kind: ServiceAccount, name: stun-sentinel, namespace: fe-signalloom-agents}]
