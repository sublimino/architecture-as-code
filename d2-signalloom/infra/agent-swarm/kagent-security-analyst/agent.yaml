apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kagent-security-analyst
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: kagent-security-analyst
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/agent: "true"
    signalloom.ai/role: analyst
    signalloom.ai/harness: kagent
spec:
  description: Multi-tool security analyst evaluating Kubernetes posture, CVEs, and compliance
  type: Declarative
  declarative:
    modelConfig: anthropic-claude
    runtime: go
    systemMessage: "Autonomous security analyst evaluating K8s posture, CVEs, and policy engines."
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames: [k8s_get_resources]
      - type: McpServer
        mcpServer:
          name: vuln-db-tool
          kind: RemoteMCPServer
          toolNames: [lookup_cve, query_advisories]
      - type: McpServer
        mcpServer:
          name: policy-eval-tool
          kind: RemoteMCPServer
          toolNames: [evaluate_rbac_policy, evaluate_netpol]
