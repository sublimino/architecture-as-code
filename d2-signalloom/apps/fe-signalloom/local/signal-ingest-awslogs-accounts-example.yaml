# SLAWS D11: Example Secret for multi-account AWSLogs configuration.
# Mounted by signal-ingest Deployment as COLLECTOR_AWSLOGS_ACCOUNTS via secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: signal-ingest-awslogs-accounts
  namespace: fe-signalloom
type: Opaque
stringData:
  accounts.json: |
    [
      {
        "account_id": "123456789012",
        "role_arn": "arn:aws:iam::123456789012:role/kusari-telemetry-read",
        "external_id": "kusari-ext-49f2",
        "queue_url": "https://sqs.us-east-1.amazonaws.com/123456789012/kusari-telemetry-queue",
        "tenant_id": "kusari",
        "region": "us-east-1"
      }
    ]
