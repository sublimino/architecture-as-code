# FLUX ENVSUBST: YES — ${REGISTRY_BASE}/${REGISTRY_INSECURE} in spec.resources
# below are reached by the tenants Kustomization's postBuild.substituteFrom
# (clusters/<env>/tenants.yaml -> flux-runtime-info ConfigMap). spec.inputs is
# deliberately empty ([]) here: `make demo-osramp-up` (scripts/osramp-up.sh)
# activates this ResourceSet with `kubectl patch resourceset/apps --type
# merge`, injecting concrete literal values — that path never goes through
# envsubst, so it is not subject to the postBuild race documented on
# tenants/base/infra.yaml and in AGENTS.md "Flux variable substitution".
#
# The OSRAMP demo really is opt-in — `make up` finishes by printing "No demos
# are running" — so unlike signalloom-infra/signalloom-apps/agent-trust this
# object is NOT given declarative inputs. But `inputs: []` on its own was never
# a valid off-state: flux-operator renders spec.resources with
# `Option("missingkey=error")` and, in BuildResourceSet, an empty input list
# means "render ONCE against a nil map", not "render nothing" —
#
#     if len(combinedInputs) == 0 {
#         object, err := BuildResource(tmpl, nil)
#
# so `<< inputs.tenant >>` below became a terminal build failure and this
# ResourceSet shipped permanently Stalled on every cluster carrying the ghcr
# overlay (staging, prod-eu, prod-us). The deploy-nothing behaviour this was
# relying on exists but the controller gates it on `len(obj.Spec.InputsFrom) > 0`.
#
# The reconcile annotation is the supported off-switch: the controller checks
# `obj.IsDisabled()` and returns BEFORE the build, so a disabled ResourceSet
# neither renders nor stalls. scripts/osramp-up.sh clears it on activation and
# scripts/resourceset-down.sh restores it on teardown. Nothing about which
# workloads run has changed — only that "off" is now a state the operator
# actually implements.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
    fluxcd.controlplane.io/reconcile: disabled
spec:
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: monitoring
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  # The OSRAMP demo starts only through `make demo-osramp-up`.
  inputs: []
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: "tenant"
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/flux-runtime-info"
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/ghcr-auth"
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      imagePullSecrets:
        - name: ghcr-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: apps
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        serviceAccountName: flux
        url: "oci://${REGISTRY_BASE}/apps/<< inputs.tenant >>"
        insecure: ${REGISTRY_INSECURE}
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/acme-co/osramp/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps
        namespace: << inputs.tenant >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: apps
        path: "./<< inputs.environment >>"
        prune: true
        # Runtime-owned fields on agent pods. These are written by the stun path
        # (supercred-demo.sh step 4 and the proxy's stun handler) and read by the
        # dashboard via fake-integration-proxy -> api/supercredState.ts.
        #
        # Without this, the stun is silently undone. Measured on kind-osramp:
        #   kubectl label pod agent-cardvault signalloom.ai/state=stunned -> stunned
        #   <any reconcile of this Kustomization>
        #   read back                                                    -> idle
        #
        # Credential revocation lives outside the reconciled set and survives, so
        # the agent stays genuinely revoked while the dashboard reports it healthy
        # — split-brain, in the direction where the UI lies in the reassuring
        # direction. Mid-demo it flips the agent back to idle in front of the
        # audience while the presenter explains it has been contained.
        #
        # `~1` is JSON Pointer (RFC 6901) escaping for the `/` in the label key.
        ignore:
          - target:
              kind: Pod
              labelSelector: signalloom.ai/agent=true
            paths:
              - /metadata/labels/signalloom.ai~1state
              - /metadata/annotations/signalloom.ai~1stunned-at
              - /metadata/annotations/signalloom.ai~1stun-reason
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
