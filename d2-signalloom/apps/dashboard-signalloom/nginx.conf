server {
  listen 8080;
  server_name _;
  resolver 10.96.0.10 valid=30s;
  root /usr/share/nginx/html;
  index index.html;

  # This server is always reached through the gateway on an external scheme and
  # port (https://dashboard.osramp.acme.local:30754), never on its own
  # http://…:8080. nginx builds absolute redirects from its OWN listen port and
  # scheme, so any redirect it generates would send the browser to
  # http://…:8080/… — a URL that does not exist off-cluster, giving
  # ERR_CONNECTION_REFUSED. Relative redirects carry no scheme or port, so they
  # stay on whatever origin the client actually used.
  absolute_redirect off;
  port_in_redirect off;

  # INVARIANT: no proxy prefix below may shadow a client-side route registered
  # in src/App.tsx. nginx matches proxy locations before `location /` reaches
  # try_files, so a prefix sharing a name with a SPA route means that page can
  # never render — the request is proxied to an API instead. API prefixes are
  # therefore namespaced under /api/ where no SPA route lives.
  # Enforced by d2-signalloom/test/dashboard-route-collisions.bats.

  location = /readyz {
    default_type text/plain;
    return 200 "ready";
  }

  location /dex/ {
    set $dex http://dex.inf-signalloom.svc.cluster.local:5556;
    proxy_pass $dex$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # KubeSec-AFM: proxy the full dashboard and all its assets.
  # AFM serves at /dashboard/ with Next.js assets at /dashboard/_next/.
  # The iframe in Signal Loom loads /dashboard/ directly (same-origin proxy).
  location /dashboard/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AFM's standalone frontend is built with localhost:8000 as its API base.
    # When it is embedded through this same-origin proxy, that absolute URL
    # bypasses nginx and fails in the browser. Rewrite only the quoted build
    # literal so its existing API client uses this dashboard origin instead.
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/javascript text/javascript;
    sub_filter_once off;
    sub_filter '"http://localhost:8000"' 'window.location.origin';
  }

  # AFM API routes — used by the /afm/ prefix (Signal Loom native) and by
  # the iframed AFM frontend (which calls /clusters, /metrics, /health, /jobs
  # relative to the origin when it detects it's not on port 8000).
  location /afm/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    rewrite ^/afm(/.*) $1 break;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AFM API paths called by the iframed frontend (same-origin, no prefix).
  location /clusters {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /metrics/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /jobs {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhooks/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api http://fe-signalloom-api.fe-signalloom.svc.cluster.local:8000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SuperCred demo: agent discovery, compliance + stun endpoints served by
  # fake-integration-proxy.
  #
  # This block used to be `location /supercred/`, which shared a name with the
  # `/supercred` SPA route in App.tsx: any redirect that added a trailing slash
  # landed the browser in this proxy instead of the React page, so the page
  # could not render at all.
  #
  # NOT /api/supercred/, despite that reading more naturally. The gateway's
  # signalloom-api HTTPRoute matches PathPrefix /api and sends it to
  # fe-signalloom-api — a longer prefix than the dashboard's own `/` route, so
  # anything under /api never reaches this nginx at all. A distinct root-level
  # prefix is the only split that is unambiguous at BOTH the gateway and here.
  # Enforced by d2-signalloom/test/dashboard-route-collisions.bats.
  location /supercred-api/ {
    set $proxy http://fake-integration-proxy.inf-signalloom.svc.cluster.local:8080;
    rewrite ^/supercred-api(/.*) $1 break;
    proxy_pass $proxy;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reads only.
    #
    # Note what this block does NOT do, three lines above: it never sets
    # Authorization, unlike /api/ and /demo-api/. The proxy does not check one
    # either — server.py's stun handler reads its own ServiceAccount token and
    # PATCHes the kube-apiserver with it. So while POST was reachable here, any
    # browser that could load the dashboard could relabel a pod and revoke its
    # OpenBao lease with no credential at all, borrowing the proxy's identity.
    #
    # Nothing legitimate needs it now. The dashboard's only mutating call
    # through this prefix was the stun, and that moved to
    # POST /api/agents/{id}/stun, which is behind a validated Dex JWT and calls
    # the proxy server-side. Every remaining browser call here is a GET:
    # /agents discovery and /agents/{id}/compliance from supercredSource, plus
    # CredentialInventoryPage's reads.
    #
    # This does not break the server-side stun: fe-signalloom reaches the proxy
    # directly on the cluster service (api_compat.py), never through this nginx.
    #
    # Scope, stated plainly rather than overclaimed: this closes MUTATION
    # through this prefix -- the stun, POST /network-tests/scan, and the
    # /_test/ fixture routes (DELETE /_test/requests, PUT /_test/fixtures/…).
    # It does NOT authenticate the prefix. Every GET above still reaches the
    # proxy unauthenticated, so anyone who can reach the dashboard origin can
    # still enumerate the estate -- pod names, namespaces, labels, crypto
    # proofs, trust topology. Closing that is a separate change.
    #
    # limit_except rather than a second location block: a sibling
    # `location /supercred-api/` would trip the exactly-once assertion in
    # d2-signalloom/test/dashboard-route-collisions.bats.
    limit_except GET HEAD {
      deny all;
    }
  }

  # SuperCred demo runner: the five-step demo lifecycle, executed in-cluster by
  # the supercred-demo-runner workload.
  #
  # Distinct from /supercred-api/ above, which is the fake-integration-proxy's
  # read + stun surface. This one drives scripts/supercred-demo.sh itself.
  #
  # Root-level prefix, not /api/demo/, for the same reason /supercred-api/ is
  # not /api/supercred/: the gateway's signalloom-api HTTPRoute matches
  # PathPrefix /api and hands it to fe-signalloom-api, so anything under /api
  # never reaches this nginx. `/demo-api/` shadows no SPA route in App.tsx —
  # enforced by d2-signalloom/test/dashboard-route-collisions.bats.
  #
  # The client (src/api/demoRunner.ts) calls /demo-api/steps, /demo-api/runs,
  # /demo-api/status and friends; the runner mounts its router at
  # /api/demo/supercred, so the prefix is rewritten rather than stripped.
  location /demo-api/ {
    set $demo http://supercred-demo-runner.fe-signalloom.svc.cluster.local:8000;
    # Two demo types, one runner, one location.
    #
    # The runner mounts a router per demo type (demo_runner.py's DEMO_CONFIGS),
    # so the prefix has to name the type. Signal Fusion is matched FIRST and
    # more specifically; anything else keeps the historical SuperCred mapping,
    # which is why that rewrite is unchanged and still unconditional. `break`
    # stops rewrite processing, so exactly one of these ever applies. Step ids
    # are numeric, so no SuperCred path can collide with the literal below.
    #
    # A sibling `location /demo-api/signalfusion/` would have worked too and was
    # rejected: it would have had to restate the SSE, timeout and Authorization
    # directives below, and the streaming ones are precisely the settings whose
    # silent absence produces a blank console with no error. Sharing one block
    # means Signal Fusion cannot drift from the behaviour SuperCred's stream
    # tests already cover.
    #
    # NOT a Gateway HTTPRoute to the runner. That was tried and is forbidden by
    # ISC-14 (d2-signalloom/test/supercred-demo-api.bats, "no Gateway route
    # targets the runner directly"): a route would put the demo control plane
    # on the internet beside the dashboard, bypassing this block — which is the
    # thing that forwards the bearer. signalFusionDemo.ts already documented
    # this proxy as the intended design; only its base constant disagreed.
    rewrite ^/demo-api/signalfusion(/.*) /api/demo/signalfusion$1 break;
    rewrite ^/demo-api(/.*) /api/demo/supercred$1 break;
    proxy_pass $demo;
    proxy_set_header Host $host;
    # Authorization is FORWARDED here, unlike in the /supercred-api/ block.
    # POST /runs and POST /reset are gated server-side on a superadmin claim
    # taken from the validated Dex JWT, so dropping this header would 401 every
    # mutating call. This matches the /api/ block's behaviour, not
    # /supercred-api/'s.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A demo step runs for minutes (step 2 waits up to 300s for the credential
    # -chain Job). The default 60s proxy_read_timeout would drop the connection
    # mid-run. The API is poll-based, so this only needs to outlast a single
    # request, not a whole run — but the log-tail poll must not race it.
    #
    # For GET /demo-api/runs/{id}/stream it has a second job: that connection is
    # held open for the WHOLE run, so 300s is now a floor on how long a silent
    # phase may last. The runner sends an SSE keepalive comment every 15s, which
    # resets this timer, so the connection survives a phase of any length.
    proxy_read_timeout 300s;

    # Server-Sent Events for GET /demo-api/runs/{id}/stream.
    #
    # With nginx's default proxy_buffering on, nginx accumulates the upstream
    # response in 4k/8k buffers and forwards it when one fills or the response
    # ends. For a stream that emits a few dozen bytes per phase that means the
    # browser sees NOTHING until the run finishes — bit-for-bit the same symptom
    # as the fill-exactly-n pipe read that made the runner batch its output in
    # the first place, just relocated to the proxy. Fixing one without the other
    # fixes nothing observable.
    #
    # HTTP/1.1 upstream because chunked transfer encoding — how a
    # response of unknown length gets delivered incrementally — does not exist
    # in HTTP/1.0, which is what proxy_pass speaks by default.
    #
    # These are location-wide and therefore also apply to the poll endpoints.
    # That is deliberate and costs nothing: every other response here is a small
    # complete JSON document, so buffering it changes only whether nginx holds
    # a few hundred bytes for a moment before sending them. No poll response
    # changes shape, size, status or content — the tested default behaviour of
    # GET /log is untouched.
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    # Chunked responses require a connection nginx has not asked to close.
    proxy_set_header Connection "";
    # Compression is the most commonly missed cause of exactly this symptom: a
    # compressor fills a block before it emits anything, so it re-buffers a
    # stream that every other setting here just unbuffered.
    #
    # Measured, not assumed: neither hop compresses today. This server block
    # sets no gzip directives and the nginx:alpine base ships `#gzip on;`
    # commented out, so nginx is not compressing; the FastAPI app installs no
    # GZipMiddleware, so the upstream is not either. Both lines below are
    # therefore no-ops right now and are here as guards — `gzip off` survives
    # someone enabling gzip at the http level, and clearing Accept-Encoding
    # upstream survives someone adding compression middleware to the runner.
    # Either change would otherwise break the stream silently, with a blank
    # console and no error to debug.
    #
    # The cost on the poll path is nil today for the same measured reason: it
    # forecloses a compression optimisation nobody has taken, and changes no
    # response that currently exists.
    gzip off;
    proxy_set_header Accept-Encoding "";
  }

  # Fleet Manager. Without this block /fleet-api/* fell through to the SPA
  # catch-all below and nginx answered API calls with index.html, so the Fleet
  # page died on `Unexpected token '<', "<!doctype "... is not valid JSON`
  # before it could even fall back to demo data. fleetApi.ts:4 already named this
  # proxy as the intended design; it was simply never added.
  #
  # The rewrite maps the browser-facing prefix onto the service's real mount: the
  # Go server registers /api/v1/fleet/topology (main.go:227) while the client
  # calls /fleet-api/v1/fleet/topology, so /fleet-api -> /api.
  location /fleet-api/ {
    set $fleet http://fleet-manager.fe-signalloom.svc.cluster.local:8082;
    rewrite ^/fleet-api(/.*) /api$1 break;
    proxy_pass $fleet;
    proxy_set_header Host $host;
    # Forwarded like /demo-api/: POST /stun mutates running workloads and is
    # gated server-side, so dropping this header would 401 every stun call.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A cascade walks the DAG patching pods in sequence; the default 60s would
    # cut a large fleet mid-cascade.
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
