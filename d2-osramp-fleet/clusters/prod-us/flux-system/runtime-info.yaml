apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-runtime-info
  namespace: flux-system
  labels:
    toolkit.fluxcd.io/runtime: "true"
    reconcile.fluxcd.io/watch: Enabled
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: "Merge"
data:
  ARTIFACT_TAG: latest-stable
  ENVIRONMENT: production
  CLUSTER_NAME: prod-us-1
  CLUSTER_DOMAIN: produs1.example.com
  ARTIFACT_SUBJECT_WORKFLOW: release-artifacts
  ARTIFACT_SUBJECT_GIT_REF: refs/tags/.*
  REGISTRY_BASE: ghcr.io/acme-co/osramp
  REGISTRY_INSECURE: "false"
  IMAGE_BASE: ghcr.io/acme-co/osramp/images
