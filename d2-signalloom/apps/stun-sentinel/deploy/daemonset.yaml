# TOMBSTONE. This file no longer declares a DaemonSet.
#
# It held a byte-for-byte copy of ../base/daemonset.yaml, kept in step by a
# TestDeployMatchesBase drift check — a test whose entire job was to police a
# duplication that should not have existed. Both copies deployed the
# apps/stun-sentinel cmd/ HTTP server contract (privileged: true,
# --listen-addr=$(POD_IP):8080, five host mounts), which is not the binary that
# ships: the deployable is apps/signalloom-stun-sentinel, the unified process
# that loads the eBPF probe and runs the correlator, informer and freezer.
#
# REPLACEMENT — the one sentinel manifest:
#   d2-signalloom/infra/agent-swarm/signalloom-stun-sentinel/daemonset.yaml
#
# Per-cluster renders:
#   d2-signalloom/infra/agent-swarm/signalloom-stun-sentinel-overlays/kind-osramp
#   d2-signalloom/infra/agent-swarm/signalloom-stun-sentinel-overlays/kind-signalloom-hub
#
# The contract that used to live here is asserted by manifest_test.go and
# least_privilege_test.go in this directory, against the canonical manifest.
# TestRetiredManifestsStayRetired fails if a DaemonSet reappears in this file.
#
# capability-audit.yaml stays: it is the SLDC-P1-PRE capability SPEC, not a
# deployable, and it has been corrected to the measured profile.
