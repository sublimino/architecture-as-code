# FLUX ENVSUBST: NO — no postBuild on the Flux Kustomization that reconciles
# this directory. Flux does NOT run envsubst here. Use ${VAR} directly for
# shell/tool expansion (e.g. SPIRE -expandEnv). $$ will NOT be reduced.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openbao-spire.yaml
  # SPIRE must mount these ConfigMaps before Flux can health-check the
  # controller Deployment.  Bootstrap and policy remain in configs, which
  # intentionally waits for this controller slice.
  - spire-openbao-config.yaml
  # Generic glob-bound JWT auth role for the agent swarm. One role serves
  # all agents; identity-templated policy scopes secrets per SPIFFE ID.
  - openbao-agent-generic-role.yaml
  # SPIRE registration entries for the agent swarm — label-based attestation
  # so any pod with signalloom.ai/agent=true gets a SPIFFE SVID.
  - spire-agent-swarm-entries.yaml
  # SPIFFE CSI driver DaemonSet (node-driver-registrar + spiffe-csi-driver) that
  # projects the spire-agent Workload API socket into every csi.spiffe.io volume.
  # The cluster-scoped CSIDriver object is in the fleet tenant ResourceSet
  # signalloom-spire-rbac. Moved here from d2-signalloom/deploy/spiffe-csi on
  # 2026-10-03: nothing applied it, so every consumer stayed ContainerCreating
  # on a fresh cluster.
  - spiffe-csi-driver.yaml
