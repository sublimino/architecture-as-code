apiVersion: v1
data:
  client.pl: |
    # usage: perl client.pl host port path timeout  -> prints OK <status line> or FAIL <err>
    use IO::Socket::INET; my ($h,$p,$path,$t)=@ARGV; $t||=3;
    my $c = IO::Socket::INET->new(PeerAddr=>$h, PeerPort=>$p, Timeout=>$t) or do { print "FAIL connect $!\n"; exit 1 };
    print $c "GET $path HTTP/1.0\r\nHost: $h\r\n\r\n"; my $r; eval { local $SIG{ALRM}=sub{die "timeout\n"}; alarm $t; $r=<$c>; alarm 0; };
    if ($@ or !defined $r) { print "FAIL read ", ($@||"eof"), "\n"; exit 1 } $r =~ s/\r?\n//; print "OK $r\n";
  guardian.pl: |
    use IO::Socket::INET; $|=1;
    my $s = IO::Socket::INET->new(LocalPort=>($ENV{PORT}||8081), Listen=>16, ReuseAddr=>1) or die "listen: $!";
    while (my $c = $s->accept) { my $l=<$c>; while (my $h=<$c>) { last if $h =~ /^\r?\n$/ } print $c "HTTP/1.0 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 3\r\n\r\nok\n"; close $c; }
  loop.pl: |
    # usage: perl loop.pl host port seconds -> "epoch OK|FAIL detail latency_ms" per attempt; 0.25s spacing, 1s connect+read timeout
    # v2: read timeout via IO::Select (v1 used alarm+readline and misreported read timeouts as OK)
    use IO::Socket::INET; use IO::Select; use Time::HiRes qw(time sleep); $|=1; my ($h,$p,$secs)=@ARGV; my $end=time+$secs;
    while (time < $end) { my $t=time; my $res;
      my $c = IO::Socket::INET->new(PeerAddr=>$h, PeerPort=>$p, Timeout=>1);
      if (!$c) { $res="FAIL connect" } else { print $c "GET /healthz HTTP/1.0\r\n\r\n";
        my $sel = IO::Select->new($c); my $buf='';
        if ($sel->can_read(1) && sysread($c,$buf,64) && $buf =~ /^HTTP/) { $res="OK" } else { $res="FAIL read-timeout" } close $c }
      printf "%.3f %s %d\n", $t, $res, (time-$t)*1000; sleep 0.25 }
kind: ConfigMap
metadata:
  name: lab-scripts
  namespace: kusari-liveness-lab
