apiVersion: v1
kind: ServiceAccount
metadata:
  name: afm-cluster-reader
  namespace: fe-k8s-afm
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: afm-rbac-reader
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: afm-rbac-reader
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: afm-rbac-reader
subjects:
  - kind: ServiceAccount
    name: afm-cluster-reader
    namespace: fe-k8s-afm
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: afm-cluster-import
  namespace: fe-k8s-afm
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: afm-cluster-reader
          restartPolicy: OnFailure
          containers:
            - name: import
              image: bitnami/kubectl:1.31
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  echo "==> Exporting cluster RBAC..."
                  kubectl get clusterroles,clusterrolebindings,roles,rolebindings \
                    -A -o json > /tmp/rbac.json
                  echo "==> Importing into AFM..."
                  # Use wget (available in bitnami/kubectl) to POST the RBAC data
                  wget -q -O- --post-file=/tmp/rbac.json \
                    --header="Content-Type: application/json" \
                    "http://afm-platform.fe-k8s-afm.svc.cluster.local:8000/clusters/import" \
                    || echo "  (import returned non-200 — may need /clusters/upload for this format)"
                  echo "==> Done."
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
