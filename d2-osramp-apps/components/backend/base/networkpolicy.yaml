# SLAAT-P2-1: backend had zero NetworkPolicy coverage (SLAAT-P1-1 finding
# NET-2, confirmed live by SLAAT-P2-PRE's NETPOL-backend reproduction).
# Default-deny plus explicit allows, same convention as
# d2-signalloom/infra/inf-signalloom/configs/base/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Backend's own components (minio, nats, archivista, postgres) talk to each
# other freely within the namespace, and every pod needs DNS to resolve
# in-cluster service names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-internal-and-dns
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# frontend's three workers (osramp-archiver, osramp-multipurpose,
# osramp-purl) all publish/consume via NATS. Excludes nats-box (the chart's
# debug client), which carries the same app.kubernetes.io/name label but a
# different component label and has no legitimate external caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-nats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frontend
      ports:
        - protocol: TCP
          port: 4222
---
# Only osramp-archiver writes to Postgres (POSTGRES_HOST/PORT in
# ../frontend/base/archiver.yaml); osramp-multipurpose and osramp-purl never
# reference it, so they are deliberately excluded from this rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-archiver-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frontend
          podSelector:
            matchLabels:
              app: osramp-archiver
      ports:
        - protocol: TCP
          port: 5432
---
# fe-signalloom's audit_anchor (anchor.py) and signal-ingest's frostdb
# attestor both read ARCHIVISTA_URL and target svc/osramp-archivista in this
# namespace by design (see d2-signalloom/apps/fe-signalloom/src/audit_anchor/
# anchor.py:22). No manifest sets ARCHIVISTA_URL today so the path is
# dormant, but the NetworkPolicy should not block a documented, intentional
# consumer just because it isn't wired up yet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fe-signalloom-to-archivista
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: archivista
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom
      ports:
        - protocol: TCP
          port: 8082
