# d2-signalloom/infra/kagent/values.yaml
# Values for the UPSTREAM kagent Helm chart, pinned to 0.9.9.
#
#   oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds  --version 0.9.9
#   oci://ghcr.io/kagent-dev/kagent/helm/kagent       --version 0.9.9
#
# Installed by scripts/kagent-infra.sh. This file is the ALWAYS-ON baseline:
# controller, kagent-tools, UI, bundled PostgreSQL and the kmcp controller.
# The observability components are layered on top by values-observability.yaml
# only when ENABLE_OBSERVABILITY=true.
#
# ─── Why every key below is spelled the way it is ──────────────────────────
#
# The previous revision of this file was written against a remembered API
# rather than a rendered one, and four of its keys were dead. Helm does not
# warn about an unrecognised value; it silently ignores it, so each of these
# read as configured and did nothing:
#
#   postgres.resources          the chart's path is database.postgres.bundled.resources
#   defaultRuntime: go          no such top-level key exists in 0.9.9 at all
#   prometheus-agent.enabled    the chart's agent is called promql-agent
#   providers.anthropic
#     .apiKeySecretName         the chart reads apiKeySecretRef (+ apiKeySecretKey)
#
# and two bundled agents were never named, so they deployed:
# cilium-policy-agent and observability-agent. Rendering the chart with the old
# file produced three Agent CRs on a cluster the file claims runs none.
#
# If you change a key here, prove it landed:
#   helm template kagent oci://ghcr.io/kagent-dev/kagent/helm/kagent \
#     --version 0.9.9 -n kagent -f values.yaml | rg <the thing you expect>

# ==============================================================================
# BUNDLED AGENTS — all off
# ==============================================================================
# This is a kind cluster on a laptop already carrying ~80 pods. Each bundled
# agent is an Agent CR that the controller materialises into its own Deployment
# running cr.kagent.dev/kagent-dev/kagent/app, so "enabled" is a pod, not a
# config line. Signal Loom supplies its own eight agents in
# d2-signalloom/infra/agent-swarm/; none of kagent's samples are wanted.
#
# The list is exhaustive against 0.9.9. Cross-check after any version bump:
#   helm show values oci://ghcr.io/kagent-dev/kagent/helm/kagent --version X \
#     | rg '^[a-z-]+-agent:'
argo-rollouts-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
helm-agent:
  enabled: false
istio-agent:
  enabled: false
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
promql-agent:
  enabled: false

# observability-agent, grafana-mcp and querydoc are ALSO off here and are
# turned on by values-observability.yaml. They are listed in both files
# deliberately: this file must be safe to apply on its own, and a reader
# should not have to open the overlay to learn the default.
observability-agent:
  enabled: false
grafana-mcp:
  enabled: false
querydoc:
  enabled: false

# OIDC in front of the UI is out of scope for the demo; the chart already
# defaults this to false, stated here so the security posture is explicit.
oauth2-proxy:
  enabled: false

# ==============================================================================
# LLM PROVIDER
# ==============================================================================
# The credential itself is owned by the kagent-credentials workstream, which
# seeds it from OpenBao into Secret/kagent-anthropic-key in BOTH the kagent and
# fe-signalloom-agents namespaces — the CRD requires the secret to be in the
# same namespace as the ModelConfig that references it, and there is one in
# each. Nothing here creates, reads or rotates it.
#
# The three halves of the agreed contract, all of which this file must match:
#   secret name  kagent-anthropic-key
#   data key     ANTHROPIC_API_KEY   (NOT `api-key`, which the old stub used)
#   type         Opaque
#
# Verified live: the controller stamps
#   env: ANTHROPIC_API_KEY -> secretKeyRef{name: kagent-anthropic-key,
#                                          key: ANTHROPIC_API_KEY}
# into every agent Deployment it mints.
providers:
  default: anthropic
  anthropic:
    provider: Anthropic
    model: "claude-haiku-4-5"
    # apiKeySecretRef, NOT apiKeySecretName. templates/modelconfig.yaml renders
    # `apiKeySecret: {{ .apiKeySecretRef }}` and has no branch for any other
    # spelling, so the old key left the ModelConfig with no secret reference at
    # all — visible only as an agent that never gets a model.
    apiKeySecretRef: kagent-anthropic-key
    apiKeySecretKey: ANTHROPIC_API_KEY

# ==============================================================================
# CONTROLLER
# ==============================================================================
controller:
  replicas: 1
  loglevel: "info"
  agentImage:
    # ─── The registry the agent RUNTIME images come from ────────────────────
    #
    # This is not the controller's own image (that is controller.image, and it
    # stays on cr.kagent.dev). It is the registry the controller stamps into
    # every Deployment it mints from an Agent CR, and it governs TWO images:
    #
    #   kagent-dev/kagent/app         the Python runtime (`runtime: python`)
    #   kagent-dev/kagent/golang-adk  the Go runtime     (`runtime: go`)
    #
    # ─── The reference is SPLIT, and that is the whole trick ────────────────
    #
    # The image reference the controller stamps into an agent Deployment is
    # assembled from two sources, and only one of them is ours:
    #
    #   <IMAGE_REGISTRY> / kagent-dev/kagent/golang-adk @ sha256:e01479…
    #   \_____________/   \_________________________________________/
    #     from THIS key            hardcoded in the controller binary
    #
    # So "golang-adk is hardcoded" and "a chart value redirects it" are both
    # true and are not in tension. The repository path and the digest cannot be
    # changed from here at all — `rg golang-adk` over the whole chart returns
    # nothing, there is no values.schema.json, and the controller ConfigMap
    # carries no ADK key. The registry prefix is the one component that is
    # configurable, via templates/controller-configmap.yaml:
    #
    #   IMAGE_REGISTRY: {{ .Values.controller.agentImage.registry
    #                      | default .Values.registry }}
    #
    # The consequence worth stating plainly, because it is what makes this
    # comprehensible rather than magic: THE DIGEST DOES NOT CHANGE. Before and
    # after, the agents run sha256:e01479b52280b0eae9e2808cc68392ba98fd7377
    # 82496ff256847257e6bb8ed1. Same bytes, same content, different host. This
    # is not a substitution of one image for another, and nothing is being
    # re-pinned or trusted differently — the identical artifact is simply
    # fetched from the registry that actually publishes it.
    #
    # Proven by experiment rather than read off the template, because the
    # `default` chain has two ends and only a running controller settles which
    # one won: patching IMAGE_REGISTRY to ghcr.io and re-reconciling one Agent
    # CR changed the minted Deployment image to
    # ghcr.io/kagent-dev/kagent/golang-adk@sha256:e01479…, digest untouched.
    #
    # ─── Why it has to move ─────────────────────────────────────────────────
    #
    # cr.kagent.dev does not carry golang-adk at all. Not a bad digest, not a
    # network fault — the repository does not exist:
    #
    #   repository cr.kagent.dev/kagent-dev/kagent/golang-adk not found:
    #   name unknown: repository name not known to registry
    #
    # while controller, ui, app and skills-init all resolve there. All eight of
    # Signal Loom's agents declare `runtime: go`, so on the chart's default
    # registry every one of them reconciles correctly, gets a real Deployment,
    # and then sits in ImagePullBackOff. ghcr.io carries golang-adk (including
    # the exact index digest the controller pins, sha256:e01479…, which is
    # golang-adk:0.9.9 — verified by matching its platform manifests) and it
    # carries `app` too, so moving this one key moves both runtimes coherently.
    #
    # Scoped to agentImage rather than set on the chart-global `registry`: the
    # global would also relocate controller, ui and skills-init, which are
    # published to cr.kagent.dev and are working. Minimum blast radius for the
    # defect actually being worked around.
    #
    # ghcr.io is additionally one of the five hosts scripts/registry-cache.sh
    # mirrors, and cr.kagent.dev is not — so this also moves the agent runtime
    # onto the pull-through cache instead of the open internet.
    #
    # ─── This is the SECOND registry-inference defect in this one chart ─────
    #
    # The other is in values-observability.yaml: grafana-mcp defaults to
    # `registry: mcp`, which renders the unqualified reference
    # `mcp/grafana:latest`. Both are the same class of bug — the chart assumes
    # a registry component that the consumer's tooling then has to infer:
    #
    #   golang-adk   a registry that is NAMED and does not serve the image
    #   grafana-mcp  a registry that is OMITTED and has to be guessed as
    #                docker.io, which scripts/lib/image-identity.sh guesses
    #                wrong for two-segment names
    #
    # They surface completely differently — one as ImagePullBackOff on every
    # agent, one as a preload FAIL that blames the image loader — which is why
    # they were found separately and days of debugging apart in principle. The
    # shared lesson is the cheap one: for any image this chart deploys, write
    # the registry out in full and verify the resulting reference resolves,
    # rather than trusting the chart's default to be both present and correct.
    #
    # Revert to the chart default once upstream publishes golang-adk to
    # cr.kagent.dev.
    registry: ghcr.io
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      # Chart default is `cpu: 2`, which is a quarter of this laptop on a node
      # already running ~80 pods. 500m is enough to reconcile eight Agent CRs.
      cpu: 500m
      memory: 512Mi

# ==============================================================================
# UI
# ==============================================================================
ui:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ==============================================================================
# BUILT-IN TOOL SERVER
# ==============================================================================
kagent-tools:
  enabled: true
  rbac:
    create: true
    # The chart's DEFAULT here is cluster-admin — literally
    # apiGroups/resources/verbs all "*" plus nonResourceURLs "*" — bound to the
    # kagent-tools ServiceAccount. On a repo whose subject is Kubernetes
    # security posture that is not an acceptable default to inherit silently.
    #
    # readOnly: true swaps it for a scoped get/list/watch ClusterRole over
    # pods, services, endpoints, configmaps, serviceaccounts, PVCs, RCs,
    # namespaces, pods/log, events, apps workloads, batch workloads, ingresses,
    # networkpolicies and HPAs. That is the same posture the hand-written
    # base/rbac.yaml encoded in `kagent-reader-role`, which this replaces.
    readOnly: true
    # Deliberately NOT granting the tool server read access to Secrets.
    allowSecrets: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ==============================================================================
# DATABASE
# ==============================================================================
# Bundled PostgreSQL. Required since 0.8 — SQLite was removed.
database:
  postgres:
    bundled:
      enabled: true
      storage: 500Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

# ==============================================================================
# KMCP — OFF, and this is a blocked decision rather than a preference
# ==============================================================================
# kmcp owns mcpservers.kagent.dev. Turning it on means installing the real
# kmcp-crds MCPServer CRD, which is INCOMPATIBLE with the five MCPServer CRs a
# different workstream already has in fe-signalloom-agents (github-tool,
# incident-triage-tool, network-probe-tool, policy-eval-tool, vuln-db-tool).
#
# Both incompatibilities were proven against the real upstream schema, using a
# renamed shadow CRD so no live object was touched:
#
#   1. version.  The repo's CRs are apiVersion kagent.dev/v1alpha2. The
#      upstream CRD serves ONLY v1alpha1 (one entry in spec.versions).
#        no matches for kind "MCPServerProbe" in version "kagent.dev/v1alpha2"
#
#   2. shape.  Corrected to v1alpha1, the body still fails: upstream's spec is
#      {deployment, httpTransport, stdioTransport, timeout, transportType},
#      `deployment` is required, and `description` does not exist.
#        strict decoding error: unknown field "spec.description"
#
# Neither is visible today because the hand-written CRD this replaces declared
# `spec: {type: object, x-kubernetes-preserve-unknown-fields: true}` — a schema
# that validates nothing at all. The five CRs have never been checked against
# anything.
#
# Installing the real CRD therefore requires deleting mcpservers.kagent.dev
# first, which cascades to all five of those CRs. That is not this change's
# call to make, so kmcp stays off and the hand-written CRD is left in place
# untouched. Nothing else needs it: the tool server the eight agents use is a
# RemoteMCPServer from the kagent chart, not an MCPServer from kmcp.
#
# Turning it on is a two-line change here and in values-crds.yaml, once the
# five CRs are rewritten to v1alpha1 with a `deployment` block.
kmcp:
  enabled: false
