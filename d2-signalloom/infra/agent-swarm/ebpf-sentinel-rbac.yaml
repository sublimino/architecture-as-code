#
# Prerequisite Role for signalloom-warden deployed by agent-swarm-base before
# individual agent Kustomizations reconcile (resolves server-side apply
# RoleBinding dependency ordering).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signalloom-warden
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-warden
    signalloom.ai/agent: "true"
    signalloom.ai/role: "sentinel"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  # Owner-chain stun record: signalloom.io/stunned on the pod's ReplicaSet or
  # Deployment. get only (named lookups from ownerReferences), no list/watch.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
