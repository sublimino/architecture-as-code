# Signal Fusion: ingest, correlation and query service for signal observations.
# Stateless — correlates cross-layer signals and maintains provisional actors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-ingest
  labels:
    app.kubernetes.io/name: signal-ingest
    app.kubernetes.io/component: signal-fusion
    app.kubernetes.io/part-of: signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-ingest
        app.kubernetes.io/component: signal-fusion
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signal-ingest
          image: signal-ingest:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          # Startup and liveness use /healthz, which checks nothing external.
          # Readiness uses /readyz, which verifies the audit backend is
          # reachable. The split is deliberate: an unreachable database must
          # take the pod out of the Service (it cannot record what it does),
          # but must never restart it -- restarting cannot make a database
          # reachable, and that loop is precisely the failure this deployment
          # was stuck in before the connect was bounded.
          #
          # The 20s this budget allows (periodSeconds 2 x failureThreshold 10)
          # is the constraint audit.DefaultConnectTimeout is sized against;
          # TestDefaultConnectTimeout_FitsStartupProbeBudget asserts the
          # arithmetic, so changing either number in isolation fails the build.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 10
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            # /readyz pings Postgres, bounded by api.readyCheckTimeout (2s).
            # The default timeoutSeconds of 1 would cut the handler off before
            # its own bound elapsed, turning a diagnosable 503 body into a
            # probe timeout. 3s leaves the handler room to answer.
            timeoutSeconds: 3
          env:
            - name: SIGNAL_STORE_DIR
              value: /data/signals
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: discovery-portal-database
                  key: DATABASE_URL
            # The shared discovery-portal-database DSN carries no sslmode, and
            # the in-cluster Postgres serves plaintext -- fe-signalloom's
            # psycopg client defaults to sslmode=prefer and silently falls back
            # to it. lib/pq defaults to sslmode=require instead and hard-fails
            # with "pq: SSL is not enabled on the server", so the two clients
            # disagree about the same DSN.
            #
            # This was a THIRD defect, hidden behind the startup hang: with the
            # network path repaired but this unset, the connect gets far enough
            # to be refused at the TLS negotiation. On the code that shipped it
            # would have surfaced as db.Ping() returning an error, main.go
            # falling back to NopWriter, and a 1/1 Running pod auditing nothing.
            #
            # Declared here rather than defaulted in Go on purpose. Whether an
            # audit connection runs without TLS is a posture decision for a
            # compliance product, and it belongs somewhere an operator reads it
            # -- not buried in a driver default. pq applies PGSSLMODE with LOWER
            # precedence than the DSN, so adding sslmode to the secret later
            # overrides this line rather than fighting it.
            - name: PGSSLMODE
              value: disable
          volumeMounts:
            - name: signal-store
              mountPath: /data/signals
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: signal-store
          emptyDir: {}
