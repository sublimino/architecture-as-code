# In-cluster OCI registry for local mode. Manifest artifacts are pushed here
# from the host (via `kubectl port-forward`) and pulled by Flux at
# zot.registry.svc.cluster.local:5000. Anonymous access is intentional:
# this registry only ever runs inside a local Kind cluster. Its data is mounted
# from the host through Kind so OCI artefacts survive a cluster restart.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/zot"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "compat": ["docker2s2"]
      },
      "log": {
        "level": "info"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      # The root Makefile maps ZOT_CACHE_DIR into each Kind node at this path.
      # The init container makes that host-backed directory writable by Zot's
      # non-root UID without relaxing the registry container's security context.
      initContainers:
        - name: prepare-data
          image: busybox:1.36.1
          command: ["sh", "-ec", "mkdir -p /var/lib/zot && chown 65532:65532 /var/lib/zot && chmod 0770 /var/lib/zot"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/zot
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.2
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/zot
            - name: data
              mountPath: /var/lib/zot
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: zot-config
        - name: data
          hostPath:
            path: /var/local/osramp-zot-cache
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: registry
spec:
  selector:
    app: zot
  ports:
    - port: 5000
      targetPort: 5000
