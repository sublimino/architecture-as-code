# Disposable local Kind dependencies; no external tenant OCI sources are used.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql}
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: signalloom}
            - {name: POSTGRES_USER, value: signalloom}
            - {name: POSTGRES_PASSWORD, value: signalloom}
          ports: [{name: postgresql, containerPort: 5432}]
          volumeMounts: [{name: init, mountPath: /docker-entrypoint-initdb.d}]
          readinessProbe:
            exec: {command: [pg_isready, -U, signalloom, -d, signalloom]}
      volumes:
        - name: init
          configMap: {name: discovery-portal-bootstrap}
---
apiVersion: v1
kind: Service
metadata: {name: postgresql}
spec:
  selector: {app.kubernetes.io/name: postgresql}
  ports: [{name: postgresql, port: 5432, targetPort: postgresql}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: [server, /data]
          env:
            - {name: MINIO_ROOT_USER, value: minio}
            - {name: MINIO_ROOT_PASSWORD, value: minio123}
          ports: [{name: s3, containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
---
apiVersion: v1
kind: Service
metadata: {name: minio}
spec:
  selector: {app.kubernetes.io/name: minio}
  ports: [{name: s3, port: 9000, targetPort: s3}]
