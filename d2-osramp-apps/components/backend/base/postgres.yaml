---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
stringData:
  POSTGRES_DB: testify
  POSTGRES_USER: archiver
  POSTGRES_PASSWORD: archiver-password
  POSTGRES_POSTGRES_PASSWORD: postgres-password
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  volumes:
    - name: postgres-data
      emptyDir: {}
    - name: init-scripts
      configMap:
        name: postgres-init-scripts
  containers:
    - name: postgres
      image: postgres:18
      envFrom:
        - secretRef:
            name: postgres
      ports:
        - name: postgres
          containerPort: 5432
      volumeMounts:
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        - name: postgres-data
          mountPath: /var/lib/postgresql/18/docker
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: postgres
  type: ClusterIP
