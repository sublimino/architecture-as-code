apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-deploy-gate
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/framework: "custom"
    signalloom.ai/role: "gate"
    signalloom.ai/harness: "go-gate"
    signalloom.ai/model: "deterministic"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-deploy-gate
  template:
    metadata:
      labels:
        app: prod-deploy-gate
        signalloom.ai/agent: "true"
        signalloom.ai/framework: "custom"
        signalloom.ai/role: "gate"
        signalloom.ai/harness: "go-gate"
        signalloom.ai/model: "deterministic"
        signalloom.ai/tenant: "controlplane"
        signalloom.ai/project: "osramp"
    spec:
      serviceAccountName: prod-deploy-gate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prod-deploy-gate
          image: prod-deploy-gate:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GATE_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: prod-deploy-gate-secrets
                  key: hmac-secret
            - name: GATE_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: prod-deploy-gate-config
                  key: webhook-url
                  optional: true
            - name: GATE_TIMEOUT
              value: "30m"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # OpenBao Agent sidecar — fetches secrets via SPIFFE JWT auth
        - name: openbao-agent
          image: openbao/openbao:2.1.0
          args:
            - agent
            - -config=/etc/openbao/agent.hcl
          env:
            - name: SPIFFE_ID
              value: "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/prod-deploy-gate"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: bao-home
              mountPath: /home/openbao
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: openbao-agent-config
          configMap:
            name: prod-deploy-gate-openbao-config
        - name: vault-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: bao-home
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
