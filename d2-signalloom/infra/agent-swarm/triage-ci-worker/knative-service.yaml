apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: triage-ci-worker
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: triage
    signalloom.ai/harness: go-worker
    signalloom.ai/model: deterministic
    signalloom.ai/tenant: controlplane
    signalloom.ai/project: osramp
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
      labels:
        signalloom.ai/agent: "true"
        signalloom.ai/role: triage
        signalloom.ai/state: active
    spec:
      serviceAccountName: triage-ci-worker
      containers:
        - image: triage-ci-worker:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GITHUB_REPO
              valueFrom:
                configMapKeyRef:
                  name: triage-ci-config
                  key: github-repo
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
