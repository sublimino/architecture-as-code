      description: Verifies that generative AI models mark synthetic outputs in a machine-readable format.
      celExpression: "has(agent.model_type) && agent.model_type == 'generative' ? (has(agent.transparency) && agent.transparency.synthetic_content_watermarking == true) : true"
      severity: high
      remediation: Enable cryptographic synthetic content watermarking in generative model pipelines.
      riskTriple:
        min: 15000
        mode: 60000
        max: 250000
      freqTriple:
        min: 0.5
        mode: 1.5
        max: 4
