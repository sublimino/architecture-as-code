apiVersion: v1
kind: ServiceAccount
metadata:
  name: afm-cluster-reader
  namespace: fe-k8s-afm
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: afm-rbac-reader
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: afm-rbac-reader
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: afm-rbac-reader
subjects:
  - kind: ServiceAccount
    name: afm-cluster-reader
    namespace: fe-k8s-afm
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: afm-cluster-import
  namespace: fe-k8s-afm
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/component: cluster-import
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: afm-cluster-reader
          restartPolicy: OnFailure
          containers:
            - name: import
              image: kubesec-afm:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  echo "==> Exporting cluster RBAC via k8s API..."
                  # Use Python (available in the AFM image) with the SA token
                  python3 -c "
                  import json, urllib.request, ssl, os
                  token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read()
                  ca = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
                  ctx = ssl.create_default_context(cafile=ca)
                  host = os.environ['KUBERNETES_SERVICE_HOST']
                  port = os.environ['KUBERNETES_SERVICE_PORT']
                  base = f'https://{host}:{port}'
                  headers = {'Authorization': f'Bearer {token}'}
                  items = []
                  for res in ['clusterroles', 'clusterrolebindings']:
                      url = f'{base}/apis/rbac.authorization.k8s.io/v1/{res}'
                      req = urllib.request.Request(url, headers=headers)
                      data = json.load(urllib.request.urlopen(req, context=ctx))
                      items.extend(data.get('items', []))
                  for res in ['roles', 'rolebindings']:
                      url = f'{base}/apis/rbac.authorization.k8s.io/v1/{res}'
                      req = urllib.request.Request(url, headers=headers)
                      data = json.load(urllib.request.urlopen(req, context=ctx))
                      items.extend(data.get('items', []))
                  rbac = json.dumps({'apiVersion': 'v1', 'kind': 'List', 'items': items}).encode()
                  print(f'  Collected {len(items)} RBAC items')
                  req2 = urllib.request.Request(
                      'http://afm-platform.fe-k8s-afm.svc.cluster.local:8000/clusters/import',
                      data=rbac, headers={'Content-Type': 'application/json'}, method='POST')
                  try:
                      resp = urllib.request.urlopen(req2, timeout=30)
                      print(f'  Imported: {resp.status}')
                  except Exception as e:
                      print(f'  Import error: {e}')
                  "
                  echo "==> Done."
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
