apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-manager
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the dashboard and other signalloom components.
    #
    # Two selectors, because the dashboard does NOT carry part-of: its pods are
    # labelled only app.kubernetes.io/name=dashboard-signalloom. A policy
    # admitting part-of alone silently dropped every /fleet-api/ request, and
    # nginx returned 504 while fleet-manager was healthy and listening — a
    # NetworkPolicy naming a label the sender does not have is a closed door
    # wearing a timeout's clothes.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: signalloom
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard-signalloom
      ports:
        - port: http
          protocol: TCP
  egress:
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow K8s API (in-cluster)
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Allow OpenBao
    - to: []
      ports:
        - port: 8200
          protocol: TCP
