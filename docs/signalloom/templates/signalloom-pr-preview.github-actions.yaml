# Signal Loom PR preview trigger — GitHub Actions workflow TEMPLATE (SLTE-P4-PRE)
#
# Copy into the customer repository as .github/workflows/signalloom-pr-preview.yaml.
# It is deliberately NOT under this repo's .github/workflows/: it must never run here.
#
# Contract (verified end-to-end by
# d2-signalloom/apps/fe-signalloom/src/tests/test_slte_p4_preflight_lifecycle.py,
# which executes the `send` step's script below against a live receiver):
#   POST <SIGNALLOOM_WEBHOOK_URL>            (…/api/v1/webhooks/generic)
#   X-SignalLoom-Timestamp: <unix epoch seconds, integer>
#   X-SignalLoom-Signature: <lowercase hex HMAC-SHA256(secret, "<timestamp>." + raw body)>
#   body: {"company_name", "action": "provision"|"teardown", "ttl_minutes", "pr_number", ...}
#   The receiver rejects |now - timestamp| > 300 s.
#
# Required configuration on the GitHub Environment `signalloom-preview`:
#   secrets.SIGNALLOOM_WEBHOOK_SECRET  per-tenant HMAC secret issued by ControlPlane
#   secrets.SIGNALLOOM_BEARER_TOKEN    tenant bearer token (JWT) issued by ControlPlane; the
#                                      receiver is authenticated (EAPR-P2-1) and answers 401
#                                      to a signed delivery that carries no bearer
#   vars.SIGNALLOOM_WEBHOOK_URL        full URL of the generic receiver
#   vars.SIGNALLOOM_TENANT             tenant slug, e.g. "kusari"
# Optional (receiver reachable only over the tailnet):
#   vars.SIGNALLOOM_RECEIVER_ON_TAILNET = "true"            (enables the tailnet-join step)
#   secrets.TS_OAUTH_CLIENT_ID / secrets.TS_OAUTH_SECRET  (tag:signalloom-ci, ephemeral)
#
# Security notes:
#   * Trigger is `pull_request`, NOT `pull_request_target`: runs for fork PRs get no
#     secrets, so they fail closed by construction (zizmor dangerous-triggers). Previews are
#     same-repository only, so pull_request_target would add risk and buy nothing.
#     NEVER add `actions/checkout` of the PR head to this workflow — it only builds a JSON
#     body from event metadata and POSTs it.
#   * Event fields reach the script through `env:`, never through ${{ }} inside `run:`
#     (script-injection defence: PR titles and branch names are attacker-controlled).
#   * Fork PRs are skipped at job level (they could never have provisioned a preview).
#   * Third-party actions are pinned to a full commit SHA (zizmor unpinned-uses).
#   * No `set -x`, no `curl -v`: the secret must never reach the job log.

name: signalloom-pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}  # the job never uses GITHUB_TOKEN

concurrency:
  group: signalloom-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Signal Loom preview trigger
    runs-on: ubuntu-latest
    # Secrets live on this GitHub Environment, not at repo level, so the customer can add
    # protection rules around them. NOT required reviewers: this job also runs teardown on
    # `closed`, and an approval gate would hold every teardown and orphan previews.
    environment: signalloom-preview
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Join tailnet (only when the receiver is tailnet-only)
        if: ${{ vars.SIGNALLOOM_RECEIVER_ON_TAILNET == 'true' }}
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade  # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:signalloom-ci

      - name: Send signed Signal Loom trigger
        id: send
        env:
          SIGNALLOOM_WEBHOOK_URL: ${{ vars.SIGNALLOOM_WEBHOOK_URL }}
          SIGNALLOOM_WEBHOOK_SECRET: ${{ secrets.SIGNALLOOM_WEBHOOK_SECRET }}
          SIGNALLOOM_BEARER_TOKEN: ${{ secrets.SIGNALLOOM_BEARER_TOKEN }}
          SIGNALLOOM_TENANT: ${{ vars.SIGNALLOOM_TENANT }}
          SIGNALLOOM_TTL_MINUTES: "120"
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_FULL_NAME: ${{ github.repository }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${SIGNALLOOM_WEBHOOK_URL:?vars.SIGNALLOOM_WEBHOOK_URL is not set}"
          : "${SIGNALLOOM_WEBHOOK_SECRET:?secrets.SIGNALLOOM_WEBHOOK_SECRET is not set}"
          : "${SIGNALLOOM_BEARER_TOKEN:?secrets.SIGNALLOOM_BEARER_TOKEN is not set}"
          : "${SIGNALLOOM_TENANT:?vars.SIGNALLOOM_TENANT is not set}"

          case "$PR_ACTION" in
            opened|reopened|synchronize) action=provision ;;
            closed)                      action=teardown ;;
            *) echo "ignoring pull_request action '$PR_ACTION'"; exit 0 ;;
          esac

          body_file="$(mktemp)"
          jq -cn \
            --arg company "$SIGNALLOOM_TENANT" \
            --arg action "$action" \
            --argjson ttl "$SIGNALLOOM_TTL_MINUTES" \
            --argjson pr "$PR_NUMBER" \
            --arg pr_action "$PR_ACTION" \
            --arg merged "$PR_MERGED" \
            --arg sha "$PR_HEAD_SHA" \
            --arg repo "$REPO_FULL_NAME" \
            --arg delivery "$DELIVERY_ID" \
            '{company_name:$company, action:$action, ttl_minutes:$ttl, pr_number:$pr,
              pr_action:$pr_action, merged:($merged=="true"), head_sha:$sha,
              repository:$repo, delivery_id:$delivery}' > "$body_file"
          # jq emits a trailing newline; the signature must cover the exact bytes sent.
          printf '%s' "$(cat "$body_file")" > "$body_file.raw"

          ts="$(date +%s)"
          # The secret is read from the environment, never placed on argv.
          sig="$(TS="$ts" BODY_FILE="$body_file.raw" python3 -c '
          import hashlib, hmac, os
          body = open(os.environ["BODY_FILE"], "rb").read()
          msg = os.environ["TS"].encode() + b"." + body
          print(hmac.new(os.environ["SIGNALLOOM_WEBHOOK_SECRET"].encode(), msg, hashlib.sha256).hexdigest())
          ')"

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-max-time 60 \
            -X POST "$SIGNALLOOM_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-SignalLoom-Timestamp: $ts" \
            -H "X-SignalLoom-Signature: $sig" \
            -H "Authorization: Bearer $SIGNALLOOM_BEARER_TOKEN" \
            --data-binary "@$body_file.raw" | tee "$body_file.response"
          echo
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            printf 'response=%s\n' "$(jq -c . "$body_file.response")" >> "$GITHUB_OUTPUT"
          fi
