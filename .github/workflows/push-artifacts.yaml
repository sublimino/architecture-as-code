name: push-artifacts

on:
  # Manual trigger only. Automatic push/merge/tag/schedule triggers are disabled for now;
  # run these from the Actions tab (workflow_dispatch).
  workflow_dispatch:
jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: fleet
            path: ./d2-osramp-fleet
          - repository: infra/cert-manager
            path: ./d2-infra/components/cert-manager
          - repository: infra/ingress
            path: ./d2-infra/components/ingress
          - repository: infra/monitoring
            path: ./d2-infra/components/monitoring
          - repository: infra/trivy-system
            path: ./d2-infra/components/trivy-system
          - repository: signalloom/infra/inf-bao
            path: ./d2-signalloom/infra/inf-bao
          - repository: signalloom/infra/inf-signalloom
            path: ./d2-signalloom/infra/inf-signalloom
          - repository: apps/frontend
            path: ./d2-osramp-apps/components/frontend
          - repository: apps/backend
            path: ./d2-osramp-apps/components/backend
          - repository: signalloom/apps/fe-signalloom
            path: ./d2-signalloom/apps/fe-signalloom
          - repository: signalloom/agent-trust
            path: ./d2-agent-trust/manifests
          - repository: olly/olly-replica
            path: ./olly-replica/components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@main
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@main
        id: push
        with:
          repository: ghcr.io/${{ github.repository }}/${{ matrix.repository }}
          path: ${{ matrix.path }}
          diff-tag: latest
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
