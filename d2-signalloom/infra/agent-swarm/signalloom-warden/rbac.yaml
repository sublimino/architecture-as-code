---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signalloom-warden
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-warden
    signalloom.ai/agent: "true"
    signalloom.ai/role: "sentinel"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  # Owner-chain stun record: signalloom.io/stunned on the pod's ReplicaSet or
  # Deployment. get only (named lookups from ownerReferences), no list/watch.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signalloom-warden
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-warden
    signalloom.ai/agent: "true"
    signalloom.ai/role: "sentinel"
subjects:
  - kind: ServiceAccount
    name: signalloom-warden
    namespace: fe-signalloom-agents
roleRef:
  kind: Role
  name: signalloom-warden
  apiGroup: rbac.authorization.k8s.io
