apiVersion: v1
kind: Secret
metadata:
  name: dex-local-auth
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
type: Opaque
stringData:
  config.yaml: |
    # ORDERING HAZARD — read before making this ${PUBLIC_ORIGIN}-aware.
    #
    # The intended end state is:
    #     issuer: ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}/dex
    # so the demo can be published on any origin. That token is ONLY safe once
    # inf-signalloom/infra-configs carries postBuild.substituteFrom — and that
    # wiring is delivered by the fleet artifact through the flux-system/tenants
    # Kustomization, NOT by this artifact.
    #
    # The two travel independently, and this one is faster: infra-configs polls
    # its OCIRepository every 5 minutes and applies immediately, whereas the
    # postBuild wiring cannot arrive while `tenants` is suspended. Ship the
    # token first and envsubst never runs, so the LITERAL string
    # '${PUBLIC_ORIGIN:=...}' becomes Dex's issuer and every login on the
    # cluster fails. Confirmed the hard way on 2026-08-03: the token reached a
    # live cluster ~4 minutes after push and had to be reverted.
    #
    # Correct order: land the postBuild wiring, verify it with
    #   kubectl get kustomization infra-configs -n inf-signalloom -o jsonpath='{.spec.postBuild}'
    # returning a substituteFrom entry, and only then reintroduce the token.
    issuer: https://dashboard.osramp.acme.local:30754/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    frontend:
      dir: /srv/dex/web
      theme: dark
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    enablePasswordDB: true

    # Remote connectors (Entra ID, Google, GitHub, generic OIDC) are defined in
    # the connectors overlay at overlays/connectors/. To enable them:
    #   1. Create a Secret with your IdP credentials
    #   2. Add the overlay to your kustomization
    # The base config uses the local password DB only (enablePasswordDB above).
    # See docs/signalloom/dex-connectors.md for the full connector reference.

    staticClients:
      - id: signalloom-dashboard
        name: Signal Loom Dashboard
        public: true
        redirectURIs:
          - https://dashboard.osramp.acme.local:30754/callback
          - http://dashboard.osramp.acme.local:5173/callback
          - http://localhost:5173/callback
          # Wherever the demo is currently published. Same default as the
          # issuer above, so this is a harmless duplicate when unset.
      - id: signalloom-api
        name: Signal Loom API
        secret: signalloom-api-local-only
        trustedPeers:
          - signalloom-dashboard
    staticPasswords:
      - email: demo-user@signalloom.local
        # bcrypt("demo-user") — local-demo credential only (see docs/signalloom).
        hash: $2b$10$NZGZWtWZgbrmmuDU5Bf.N.38ar7tskOwJ176v1qo5p3UWw1dlIE4C
        username: demo-user
        userID: demo-user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: signalloom-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/header.html
              subPath: header.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/footer.html
              subPath: footer.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/login.html
              subPath: login.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/password.html
              subPath: password.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/approval.html
              subPath: approval.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/error.html
              subPath: error.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/oob.html
              subPath: oob.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/device.html
              subPath: device.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/device_success.html
              subPath: device_success.html
              readOnly: true
            - name: ui-theme
              mountPath: /srv/dex/web/themes/dark/styles.css
              subPath: styles.css
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
          livenessProbe:
            httpGet:
              # Dex serves endpoints under the issuer path (/dex); the bare
              # /healthz 404s once the issuer has a path, so probe a served path.
              path: /dex/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsGroup: 1001
      volumes:
        - name: config
          secret:
            secretName: dex-local-auth
        - name: ui-templates
          configMap:
            name: dex-ui
            items:
              - key: header.html
                path: header.html
              - key: footer.html
                path: footer.html
              - key: login.html
                path: login.html
              - key: password.html
                path: password.html
              - key: approval.html
                path: approval.html
              - key: error.html
                path: error.html
              - key: oob.html
                path: oob.html
              - key: device.html
                path: device.html
              - key: device_success.html
                path: device_success.html
        - name: ui-theme
          configMap:
            name: dex-ui
            items:
              - key: styles.css
                path: styles.css
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
