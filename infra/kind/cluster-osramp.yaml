# infra/kind/cluster-osramp.yaml : SLDC workload cluster (kind-osramp)
#
# Consumed by: scripts/dual-cluster-up.sh (only when no `osramp` cluster exists)
# Tests:       test/dual-cluster-networking.bats
# Spec:        Proposal (SLDC) Appendix B.2
#
# Hosts untrusted agent workloads and the in-sentinel eBPF DaemonSet, so the
# node gets the host cgroup tree (rw, for cgroup.freeze), kernel modules (ro)
# and BTF (ro, for CO-RE).
#
# ATTACH, DON'T RECREATE. On a workstation where `osramp` already exists (the
# shared demo cluster, created on the default `kind` docker network)
# dual-cluster-up.sh does NOT recreate it from this file. It adds a second
# interface on signalloom-bridge at 172.19.0.10. Kind/kubeadm pin the node's
# first address into the kubelet config and the API server certificate, so a
# node must never be re-IPed after creation.
#
# Deviations from B.2 (see the SLDC-P2-1 errata):
#   * image: B.2 pins kindest/node:v1.31.0, which is not cached here and is five
#     minors behind kubectl v1.36. The live osramp node runs v1.36.1, pinned by
#     digest so kind never pulls a moving tag.
#   * disableDefaultCNI stays true (Cilium, as on the live cluster).
#     dual-cluster-up.sh installs Cilium on a freshly created cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: osramp
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 34777
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  disableDefaultCNI: true # Cilium, installed by scripts/dual-cluster-up.sh
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraMounts:
      - hostPath: /sys/fs/cgroup
        containerPath: /sys/fs/cgroup
        readOnly: false
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
      - hostPath: /sys/kernel/btf
        containerPath: /sys/kernel/btf
        readOnly: true
