- id: art13-transparency
  name: ART-13 Transparency and Instructions for Use
  controls:
  - id: ART-13.1
    name: ART-13(1) Clear User Instructions and Transparency
    checks:
    - id: user-instructions-transparency
      name: Operator transparency and instruction manual
      description: Mandates clear operational characteristics, intended purpose, and limitations documentation.
      celExpression: has(agent.transparency) && agent.transparency.user_instructions_available == true
      severity: medium
      remediation: Provide accessible model transparency card and operator instruction manual.
      riskTriple:
        min: 5000
        mode: 25000
        max: 90000
      freqTriple:
        min: 0.5
        mode: 1.5
        max: 3.5
      policyVersions:
      - v1.0.0
      - v2.1.0

