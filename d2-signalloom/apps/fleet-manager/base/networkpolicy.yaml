apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-manager
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the dashboard and other signalloom components.
    #
    # Two selectors, because the dashboard does NOT carry part-of: its pods are
    # labelled only app.kubernetes.io/name=dashboard-signalloom. A policy
    # admitting part-of alone silently dropped every /fleet-api/ request, and
    # nginx returned 504 while fleet-manager was healthy and listening — a
    # NetworkPolicy naming a label the sender does not have is a closed door
    # wearing a timeout's clothes.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: signalloom
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard-signalloom
        # The fe-signalloom API calls POST /api/v1/fleet/stun/{agentId}
        # server-side (kusari-e2e). Its pods carry only
        # app.kubernetes.io/name=fe-signalloom, so neither selector above
        # admits them. Same namespace, so a podSelector is enough.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fe-signalloom
        # The Envoy gateway, for the remote-cluster warden routes /warden-ingest and /warden-fleet
        # (apps/fe-signalloom/base/gateway-route.yaml). Key-authenticated upstream.
        #
        # One rule covers every path and verb the remote contract adds: the
        # workload report, the registry read, the stun-state read and its ack
        # all arrive on this same connection from this same proxy. A rule per
        # endpoint would be four copies of one selector, and NetworkPolicy
        # cannot see a path anyway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              gateway.envoyproxy.io/owning-gateway-name: cluster
      ports:
        - port: http
          protocol: TCP
    # The signalloom-warden DaemonSet runs hostNetwork, so its POST /stun arrives
    # from a NODE address, which no podSelector can match. Admitting the kind
    # node network is acceptable only because every mutating route now needs a
    # named caller key (callerauth.go); this rule opens the port, the key
    # decides. Port http only. 172.18.0.0/16 is the kind docker network on the
    # local estate; another cluster substitutes its node CIDR.
    - from:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - port: http
          protocol: TCP
  egress:
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow K8s API (in-cluster)
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Allow OpenBao
    - to: []
      ports:
        - port: 8200
          protocol: TCP
    # Allow the SPIRE server API (entry eviction / re-entry). Scoped to the
    # spire-server pods; the matching ingress is inf-bao's
    # allow-fleet-manager-to-spire.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-bao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spire-server
      ports:
        - port: 8081
          protocol: TCP
