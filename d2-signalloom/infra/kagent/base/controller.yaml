---
# Secret/kagent-anthropic-key is DELIBERATELY NOT DECLARED HERE.
#
# It used to be, carrying the literal "mock-anthropic-key-for-local-demo" —
# 33 bytes with which no agent can complete a model call. Every check that
# looked at it reported it healthy: right name, right key, non-empty, present.
# That is the failure mode: a demo whose entire claim is OpenBao credential
# mediation, silently running on a hardcoded string committed to git.
#
# Restoring it would be worse than leaving it, because `kubectl apply -k` on
# this directory would then overwrite a real operator-supplied credential with
# the placeholder, and nothing anywhere would fail.
#
# The Secret is now created from the operator's environment, by way of OpenBao:
#
#     export ANTHROPIC_API_KEY='sk-ant-...'
#     make demo-kagent-credentials
#
# See scripts/kagent-credentials.sh. OpenBao is the system of record; the Secret
# is a projection of it into each namespace holding a ModelConfig, because the
# upstream controller resolves apiKeySecret in the ModelConfig's own namespace.
#
# Guarded by d2-signalloom/test/kagent-credentials.bats, which fails if the
# retired literal reappears anywhere in the tree.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-controller
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent
        app.kubernetes.io/part-of: signalloom
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kagent-controller
      containers:
        - name: controller
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import time, sys
              print("Starting Kagent v0.9.9 Controller (Go ADK default, Anthropic provider)...")
              print("Reconciling Agent CRDs, ModelConfigs, and MCPServers...")
              sys.stdout.flush()
              while True:
                  time.sleep(10)
          env:
            - name: DATABASE_URL
              value: "postgres://kagent:kagent-db-password-local@kagent-postgres.kagent.svc.cluster.local:5432/kagent?sslmode=disable"
            - name: DEFAULT_RUNTIME
              value: "go"
            - name: PROVIDER_DEFAULT
              value: "anthropic"
            - name: TOOLS_SERVER_URL
              value: "http://kagent-tool-server.kagent.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "echo ready"
            initialDelaySeconds: 2
            periodSeconds: 5
