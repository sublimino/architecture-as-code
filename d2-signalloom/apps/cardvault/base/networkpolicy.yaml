# Allow the cardvault-agent (running in fe-signalloom-agents) to reach
# the cardvault service on port 8080 for credential-based API access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cardvault-from-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cardvault
  policyTypes:
    - Ingress
  ingress:
    # Intra-namespace (for health checks, port-forwards)
    - from:
        - podSelector: {}
    # Cross-namespace: the cardvault-agent Job in fe-signalloom-agents
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom-agents
          podSelector:
            matchLabels:
              bao.controlplane.io/consumer: cardvault-agent
      ports:
        - protocol: TCP
          port: 8080
