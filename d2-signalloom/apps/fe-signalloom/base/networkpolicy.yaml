apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# The disposable netassert-run Job resolves its dynamic agent-pod name through
# kube-apiserver before it starts the real probe. The default-deny policy
# otherwise drops that request and the Job emits no TAP records. kindnet
# evaluates service traffic after DNAT, so the ClusterIP's :443 can reach the
# node's :6443; permit only these API transport ports for Job-labelled pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-netassert-runner-egress
spec:
  podSelector:
    matchLabels:
      signalloom.ai/purpose: network-test-run
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# The portal is not a general cluster client. It can reach only DNS and the
# five declared backing services plus the bounded OpenBao proof endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-dependencies
spec:
  podSelector:
    matchLabels:
      bao.controlplane.io/consumer: fe-signalloom
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-signalloom
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 5556
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-bao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # rbac_correlation.py calls AFM_BASE_URL (afm-platform.fe-k8s-afm) server-side
    # to build /api/rbac/clusters/{id}/correlated. This is the API pod's egress
    # half; afm-platform itself has no ingress NetworkPolicy of its own (see
    # d2-k8s-afm/apps/afm-platform/base) so no matching ingress rule is needed there.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-k8s-afm
      ports:
        - protocol: TCP
          port: 8000
---
# Public exposure is permitted only through the selected gateway namespace;
# direct cross-namespace access to the portal is denied by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-ingress
spec:
  podSelector:
    matchLabels:
      bao.controlplane.io/consumer: fe-signalloom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              gateway.envoyproxy.io/owning-gateway-name: cluster
      ports:
        - protocol: TCP
          port: 8000
---
# Dashboard assets are served only through the selected Gateway. The dashboard
# has no direct service dependencies, so default-deny retains its egress boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard-signalloom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
              gateway.envoyproxy.io/owning-gateway-name: cluster
      ports:
        - protocol: TCP
          port: 8080
---
# The dashboard nginx proxies /dex, /api, the AFM prefixes and /supercred-api/
# on the browser's behalf, so it needs egress to DNS, Dex (inf-signalloom), the
# in-namespace compatibility API, AFM (fe-k8s-afm), and the SuperCred
# fake-integration-proxy (inf-signalloom:8080).
#
# Every upstream in dashboard-signalloom/nginx.conf must have a rule here.
# default-deny above denies egress, and a denied packet is DROPPED, not
# rejected: the fetch hangs until nginx gives up and logs a 499, with nothing at
# all in the upstream's own logs. There is no error message anywhere that names
# the missing rule, so the omission reads as "the page just spins".
# Enforced by d2-signalloom/test/dashboard-route-collisions.bats.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard-signalloom
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Fleet Manager. nginx proxies /fleet-api/ to fleet-manager:8082; without a
    # matching egress rule the dashboard pod cannot reach it and nginx returns
    # 504 while the service is healthy. d2-signalloom/test/dashboard-route-
    # collisions.bats asserts every nginx upstream has a rule here, and caught
    # this omission.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-manager
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dex
      ports:
        - protocol: TCP
          port: 5556
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fe-signalloom
      ports:
        - protocol: TCP
          port: 8000
    # SuperCred demo runner: nginx's /demo-api/ block proxies here.
    #
    # This needs its OWN rule even though the rule directly above already opens
    # :8000 inside this namespace — that one's podSelector is
    # app.kubernetes.io/name: fe-signalloom, which selects the API pod and not
    # the runner (app.kubernetes.io/name: supercred-demo-runner). A same-port,
    # same-namespace rule is not the same rule.
    #
    # dashboard-route-collisions.bats compares nginx upstreams to this policy at
    # namespace:port granularity, so `fe-signalloom:8000` already looked
    # satisfied and that test passes with or without this block. It cannot see
    # the podSelector mismatch. Deleting this rule therefore breaks the demo
    # page silently and with a green suite — a 499 in the dashboard's nginx
    # access log is the only symptom.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: supercred-demo-runner
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-k8s-afm
      ports:
        - protocol: TCP
          port: 8000
    # SuperCred: nginx's /supercred-api/ block proxies here. This is the egress
    # half of a pair — the ingress half is the dashboard-signalloom rule in
    # allow-fake-integration-proxy (inf-signalloom configs). Both are required;
    # removing either silently breaks the SuperCred page with no error anywhere
    # except a 499 in the dashboard's nginx access log.
    #
    # Note allow-portal-dependencies above also opens 8080 into inf-signalloom,
    # but its podSelector is bao.controlplane.io/consumer: fe-signalloom — the
    # API pod, not the dashboard. It does not cover this path.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inf-signalloom
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fake-integration-proxy
      ports:
        - protocol: TCP
          port: 8080
---
# Permit the dashboard's /api proxy to reach the compatibility API in-namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-to-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fe-signalloom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard-signalloom
        # The SuperCred demo runner, for POST /api/audit/privileged-invocations
        # and nothing else. That workload owns no database by design, so the
        # audit rows for the privileged phases it drives are forwarded here to
        # the process that holds the pool, rather than by giving a pod that
        # executes shell scripts against the cluster its own route to Postgres.
        #
        # It presents the operator's own Dex token, which this API validates
        # independently -- the runner is a transport for the record, not an
        # authority over it, and the superadmin gate is applied again on this
        # side. A NetworkPolicy cannot scope an ingress rule to one path, so
        # the narrowing that matters is done at the endpoint: it is superadmin
        # -gated and accepts two values from closed sets.
        #
        # Ingress half of a pair; the egress half and the URL live in
        # apps/supercred-demo-runner/base/{networkpolicy,deployment}.yaml.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: supercred-demo-runner
      ports:
        - protocol: TCP
          port: 8000
