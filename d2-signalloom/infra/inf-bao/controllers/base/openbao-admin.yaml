# FLUX ENVSUBST: NO — no postBuild on the Flux Kustomization that reconciles
# this directory. Flux does NOT run envsubst here.
#
# openbao-admin: the one place a person or a host script reaches OpenBao
# administration from, after the static root token was removed
# (SA-TODO-003 phase 1).
#
# The pod runs as ServiceAccount openbao-admin, so SPIRE issues it
# spiffe://signalloom.demo/ns/inf-bao/sa/openbao-admin (registered by
# spire-agent-swarm-entries.yaml). A jwt-svid sidecar writes the JWT-SVID to a
# file; a bao agent logs in with it as role inf-bao-admin (created by
# openbao-init.yaml) and keeps a 15-minute token in a memory-backed file that
# never leaves the pod. Host scripts run one bao command at a time:
#
#   kubectl -n inf-bao exec -i deploy/openbao-admin -c bao -- bao-admin <args>
#
# `bao-admin` reads the token from the file and execs bao, so the token is
# never on the host, on argv, or in kubectl's request.
#
# Exposure: anyone allowed `pods/exec` in inf-bao can act as inf-bao-admin.
# That is the same set of people who can read Secret openbao-seal-key, which
# already opens every byte in storage, so this adds no new principal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-admin
  labels:
    app.kubernetes.io/name: openbao-admin
    app.kubernetes.io/part-of: signalloom-bao-proof
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-admin-config
  labels:
    app.kubernetes.io/name: openbao-admin
data:
  agent.hcl: |
    vault {
      address = "http://openbao.inf-bao.svc.cluster.local:8200"
    }

    auto_auth {
      method "jwt" {
        mount_path = "auth/jwt"
        config = {
          path                     = "/var/run/secrets/spiffe/jwt"
          role                     = "inf-bao-admin"
          remove_jwt_after_reading = false
        }
      }

      sink "file" {
        config = {
          path = "/var/run/secrets/openbao/token"
          mode = 0400
        }
      }
    }
  bao-admin: |
    #!/bin/sh
    # Run one bao command as inf-bao-admin. The token stays in this pod.
    set -eu
    BAO_ADDR="http://openbao.inf-bao.svc.cluster.local:8200"
    BAO_TOKEN="$(cat /var/run/secrets/openbao/token)"
    export BAO_ADDR BAO_TOKEN
    exec bao "$@"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-admin
  labels:
    app.kubernetes.io/name: openbao-admin
    app.kubernetes.io/part-of: signalloom-bao-proof
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-admin
    spec:
      serviceAccountName: openbao-admin
      containers:
        - name: jwt-svid
          image: signalloom-spire-helper:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if /usr/local/bin/signalloom-spire-proof write --audience openbao \
                     --socket /run/spire/sockets/agent.sock \
                     --output /var/run/secrets/spiffe/jwt.tmp; then
                  mv -f /var/run/secrets/spiffe/jwt.tmp /var/run/secrets/spiffe/jwt
                else
                  echo "jwt-svid: fetch failed; keeping previous SVID" >&2
                fi
                sleep 60
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - name: spire-sockets
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spiffe-jwt
              mountPath: /var/run/secrets/spiffe
        - name: bao
          image: quay.io/openbao/openbao:2.7.1
          imagePullPolicy: IfNotPresent
          # bao directly, not the image entrypoint (see fleet-manager and
          # d2-signalloom/test/openbao-sidecar-entrypoint.bats).
          command: ["bao", "agent", "-config=/etc/openbao/agent.hcl"]
          env:
            - name: HOME
              value: /tmp
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/openbao-admin
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/openbao/agent.hcl
              subPath: agent.hcl
              readOnly: true
            - name: wrapper
              mountPath: /opt/openbao-admin
              readOnly: true
            - name: spiffe-jwt
              mountPath: /var/run/secrets/spiffe
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: openbao-admin-config
        - name: wrapper
          configMap:
            name: openbao-admin-config
            items:
              - key: bao-admin
                path: bao-admin
            defaultMode: 0555
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spiffe-jwt
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: openbao-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
