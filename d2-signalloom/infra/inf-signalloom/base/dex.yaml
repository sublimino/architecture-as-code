apiVersion: v1
kind: Secret
metadata:
  name: dex-local-auth
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
type: Opaque
stringData:
  config.yaml: |
    # Origin-aware. PUBLIC_ORIGIN comes from the flux-runtime-info ConfigMap
    # via this Kustomization's postBuild.substituteFrom, so publishing the demo
    # on a tunnel, a LoadBalancer or a VM's external IP is a ConfigMap update
    # plus a reconcile — Flux DELIVERS the origin instead of reverting it.
    #
    # The :=default is load-bearing, not decoration. AGENTS.md records that a
    # missing substituteFrom key is a SILENT no-op, so an undefaulted token
    # would ship the literal string as Dex's issuer and break every login with
    # no diagnostic anywhere. Confirmed the hard way on 2026-08-03.
    #
    # PREREQUISITE, verified before this landed:
    #   kubectl get kustomization infra-configs -n inf-signalloom \
    #     -o jsonpath='{.spec.postBuild}'
    # must return a substituteFrom entry. It is delivered by the fleet artifact
    # through flux-system/tenants; if that Kustomization is suspended, this
    # token arrives with no envsubst to resolve it.
    issuer: ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    frontend:
      dir: /srv/dex/web
      theme: dark
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    enablePasswordDB: true

    # Remote connectors (Entra ID, Google, GitHub, generic OIDC) are defined in
    # the connectors overlay at overlays/connectors/. To enable them:
    #   1. Create a Secret with your IdP credentials
    #   2. Add the overlay to your kustomization
    # The base config uses the local password DB only (enablePasswordDB above).
    # See docs/signalloom/dex-connectors.md for the full connector reference.

    staticClients:
      - id: signalloom-dashboard
        name: Signal Loom Dashboard
        public: true
        redirectURIs:
          - https://dashboard.osramp.acme.local:30754/callback
          - http://dashboard.osramp.acme.local:5173/callback
          - http://localhost:5173/callback
          # Wherever the demo is published right now. Same default as the
          # issuer, so this is a harmless duplicate when PUBLIC_ORIGIN is unset.
          - ${PUBLIC_ORIGIN:=https://dashboard.osramp.acme.local:30754}/callback
          # Wherever the demo is currently published. Same default as the
          # issuer above, so this is a harmless duplicate when unset.
      - id: signalloom-api
        name: Signal Loom API
        secret: signalloom-api-local-only
        trustedPeers:
          - signalloom-dashboard
    staticPasswords:
      - email: demo-user@signalloom.local
        # bcrypt("demo-user") — local-demo credential only (see docs/signalloom).
        hash: $2b$10$NZGZWtWZgbrmmuDU5Bf.N.38ar7tskOwJ176v1qo5p3UWw1dlIE4C
        username: demo-user
        userID: demo-user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: signalloom-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/header.html
              subPath: header.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/footer.html
              subPath: footer.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/login.html
              subPath: login.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/password.html
              subPath: password.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/approval.html
              subPath: approval.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/error.html
              subPath: error.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/oob.html
              subPath: oob.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/device.html
              subPath: device.html
              readOnly: true
            - name: ui-templates
              mountPath: /srv/dex/web/templates/device_success.html
              subPath: device_success.html
              readOnly: true
            - name: ui-theme
              mountPath: /srv/dex/web/themes/dark/styles.css
              subPath: styles.css
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
          livenessProbe:
            httpGet:
              # Dex serves endpoints under the issuer path (/dex); the bare
              # /healthz 404s once the issuer has a path, so probe a served path.
              path: /dex/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsGroup: 1001
      volumes:
        - name: config
          secret:
            secretName: dex-local-auth
        - name: ui-templates
          configMap:
            name: dex-ui
            items:
              - key: header.html
                path: header.html
              - key: footer.html
                path: footer.html
              - key: login.html
                path: login.html
              - key: password.html
                path: password.html
              - key: approval.html
                path: approval.html
              - key: error.html
                path: error.html
              - key: oob.html
                path: oob.html
              - key: device.html
                path: device.html
              - key: device_success.html
                path: device_success.html
        - name: ui-theme
          configMap:
            name: dex-ui
            items:
              - key: styles.css
                path: styles.css
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
