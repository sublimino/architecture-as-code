apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpai-runtime
  labels:
    app.kubernetes.io/name: cpai-runtime
    app.kubernetes.io/part-of: demo-cpai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpai-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpai-runtime
        app.kubernetes.io/part-of: demo-cpai
    spec:
      containers:
        - name: cpai-runtime
          image: zot.registry.svc.cluster.local:5000/acme/images/cpai/apps/cpai-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CPAI_CONTEXT_ROOT
              value: /context
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      terminationGracePeriodSeconds: 30
