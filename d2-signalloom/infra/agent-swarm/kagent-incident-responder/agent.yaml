apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kagent-incident-responder
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: kagent-incident-responder
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/agent: "true"
    signalloom.ai/role: incident-responder
    signalloom.ai/harness: kagent
spec:
  # A FIFTH agent, beyond the four in the ruling. It is one of the four
  # kind: MCPServer / referenced-as-RemoteMCPServer mismatches that were in
  # scope, and it is the only agent in the swarm that loses NOTHING in the
  # move: events, logs, describe and get are all verified working, and
  # together they are exactly what its three fictional tools claimed to do.
  # Trivially revertible if unwanted — see docs/kagent-d5.md.
  description: >-
    Triages cluster incidents by reading events, pod logs and workload state,
    correlates restarts, and proposes remediation. Read-only: it does not
    apply changes.
  type: Declarative
  declarative:
    modelConfig: anthropic-claude
    runtime: go
    systemMessage: >-
      You are a Kubernetes incident responder. Use k8s_get_events,
      k8s_get_pod_logs, k8s_describe_resource and k8s_get_resources to
      establish what happened: correlate restart counts, exit codes, recent
      events and log tails into a timeline, then propose a remediation and
      say what evidence supports it. You have read-only access and cannot
      apply changes — propose them for a human. Distinguish what you observed
      from what you inferred. Do NOT state a count in prose: on a live run
      this agent wrote "16 pods in Error state" directly above a list of 18.
      Present the list and let the reader count, or if a total is genuinely
      needed, enumerate first and derive the number from what you enumerated.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames:
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_describe_resource
            - k8s_get_resources
