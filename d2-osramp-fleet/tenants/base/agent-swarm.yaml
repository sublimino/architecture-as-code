# FLUX ENVSUBST: YES — registry settings AND spec.inputs below are substituted
# by the tenants Kustomization, exactly as in tenants/base/agent-trust.yaml.
#
# This ResourceSet deploys the 10-agent Signal Loom swarm into the
# fe-signalloom-agents namespace. Each agent gets its own Flux Kustomization
# so it can be individually suspended, reconciled, or removed.
#
# The base agent-swarm kustomization (d2-signalloom/infra/agent-swarm/) owns
# the namespace, shared RBAC, and NetworkPolicies. Each agent subdirectory
# owns its own workload manifests.
#
# Agent inventory (10):
#   Tier 1  prompt-commit-summarizer   KnativeService
#   Tier 2  triage-ci-worker           KnativeService
#   Tier 3  zulip-chat-agent           Deployment
#   Tier 4A cpai-engineer              StatefulSet + PVC
#   Tier 4B hosted-daytona-coder       Deployment + RBAC
#   Tier 5  swarm-governor             Deployment + Service
#   Tier 5  prod-deploy-gate           Deployment + Service
#   Tier 6  agent-cardvault            Deployment overlay
#   Tier 7  nono-containment-probe     Job + PVC
#   Tier 8  signalloom-stun-sentinel   DaemonSet
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: agent-swarm
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: signalloom-infra
      namespace: flux-system
      ready: true
      readyExpr: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: inf-bao
      ready: true
      readyExpr: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  inputs:
    - tenant: "agent-swarm"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "${ARTIFACT_SUBJECT_WORKFLOW}"
      artifactSubjectGitRef: "${ARTIFACT_SUBJECT_GIT_REF}"
  resources:
    # ── Namespace ──────────────────────────────────────────────────────
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: fe-signalloom-agents
        labels:
          signalloom.ai/managed: "true"
          signalloom.ai/tier: "agents"
          signalloom.ai/agent: "true"
          app.kubernetes.io/part-of: signalloom-swarm

    # ── Flux identity ─────────────────────────────────────────────────
    - apiVersion: v1
      kind: ServiceAccount
      metadata: {name: agent-swarm-flux, namespace: fe-signalloom-agents}

    # ── ClusterRole: namespace discovery + create ─────────────────────
    # Kubernetes RBAC does not apply resourceNames to create, so the
    # create verb is global; mutation/deletion is restricted to the
    # single namespace owned by this slice.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: agent-swarm-flux-namespaces}
      rules:
        - apiGroups: [""]
          resources: [namespaces]
          verbs: [get, list, watch, create]
        - apiGroups: [""]
          resources: [namespaces]
          resourceNames: [fe-signalloom-agents]
          verbs: [get, update, patch, delete]

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: agent-swarm-flux-namespaces}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-swarm-flux-namespaces}
      subjects: [{kind: ServiceAccount, name: agent-swarm-flux, namespace: fe-signalloom-agents}]

    # ── ClusterRole: workload management ──────────────────────────────
    # Covers all workload kinds used by swarm agents: Deployments,
    # StatefulSets, Jobs, DaemonSets, Services, ConfigMaps, Secrets,
    # PVCs, ServiceAccounts, NetworkPolicies, RBAC.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: agent-swarm-flux-workloads}
      rules:
        - apiGroups: [""]
          resources: [configmaps, events, pods, pods/log, secrets, serviceaccounts, services, persistentvolumeclaims]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [apps]
          resources: [deployments, replicasets, statefulsets, daemonsets]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [batch]
          resources: [jobs, cronjobs]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [networking.k8s.io]
          resources: [networkpolicies]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [roles, rolebindings, clusterroles, clusterrolebindings]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [serving.knative.dev]
          resources: [services, revisions, routes, configurations]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [kagent.dev]
          resources: [agents, modelconfigs, remotemcpservers, toolservers]
          verbs: [get, list, watch, create, update, patch, delete]

    # ── RoleBinding: workloads in fe-signalloom-agents ────────────────
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: agent-swarm-flux, namespace: fe-signalloom-agents}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-swarm-flux-workloads}
      subjects: [{kind: ServiceAccount, name: agent-swarm-flux, namespace: fe-signalloom-agents}]

    # ── ClusterRole + Binding: cluster-scoped resources ─────────────
    # The sentinel's ebpf-sentinel-rbac.yaml creates a ClusterRole
    # granting nodes get/list and a ClusterRoleBinding. A namespace
    # RoleBinding cannot grant cluster-scoped access, and Kubernetes
    # RBAC escalation prevention requires the creating SA to already
    # hold any permissions it grants via a ClusterRole.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: agent-swarm-flux-cluster-rbac}
      rules:
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [clusterroles, clusterrolebindings]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [""]
          resources: [nodes]
          verbs: [get, list]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: agent-swarm-flux-cluster-rbac}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-swarm-flux-cluster-rbac}
      subjects: [{kind: ServiceAccount, name: agent-swarm-flux, namespace: fe-signalloom-agents}]

    # ── OCI source for agent-swarm artifacts ──────────────────────────
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata: {name: agent-swarm, namespace: fe-signalloom-agents}
      spec:
        interval: 5m
        serviceAccountName: agent-swarm-flux
        url: "oci://${REGISTRY_BASE}/signalloom/agent-swarm"
        insecure: ${REGISTRY_INSECURE}
        ref: {tag: << inputs.tag >>}
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/acme-co/osramp/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$

    # ── Base infrastructure Kustomization ─────────────────────────────
    # Deploys namespace, shared RBAC, and NetworkPolicies from the base
    # agent-swarm kustomization before any individual agents.
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: agent-swarm-base
        namespace: fe-signalloom-agents
        labels:
          signalloom.ai/agent: "true"
          signalloom.ai/component: "base"
      spec:
        serviceAccountName: agent-swarm-flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef: {kind: OCIRepository, name: agent-swarm}
        path: .
        prune: true
        ignore:
          - target:
              kind: Pod
            paths:
              - /metadata/labels/signalloom.io~1stunned
              - /metadata/labels/signalloom.io~1containment-mode
              - /metadata/annotations/signalloom.io~1stun-reason
              - /metadata/labels/signalloom.ai~1state
              - /metadata/annotations/signalloom.ai~1stunned-at
              - /metadata/annotations/signalloom.ai~1stun-reason
          - target:
              kind: Deployment
            paths:
              - /metadata/labels/signalloom.io~1stunned
              - /metadata/labels/signalloom.io~1containment-mode
              - /metadata/annotations/signalloom.io~1stun-reason
              - /metadata/labels/signalloom.ai~1state
              - /metadata/annotations/signalloom.ai~1stunned-at
              - /metadata/annotations/signalloom.ai~1stun-reason

    # ── Per-agent Kustomizations ──────────────────────────────────────
    # Each agent has its own Kustomization so it can be individually
    # suspended, reconciled, or removed via Flux.

    # 1. prompt-commit-summarizer (Tier 1 — KnativeService)
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
