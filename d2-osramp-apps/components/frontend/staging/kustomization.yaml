# FLUX ENVSUBST: YES — postBuild.substituteFrom is configured on the Flux
# Kustomization that reconciles this directory. Flux runs envsubst over all
# rendered manifests: use $${VAR} to pass a literal $ through to the container,
# and ${VAR} for values Flux should substitute from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: archiver-values.yaml
    target:
      kind: Deployment
      name: osramp-archiver
  - path: listener-values.yaml
    target:
      kind: Deployment
      name: osramp-multipurpose
  - path: osramp-purl-values.yaml
    target:
      kind: Deployment
      name: osramp-purl
images:
- name: archiver
  newName: ghcr.io/acme-co/osramp/images/archiver
  newTag: latest
- name: listener
  newName: ghcr.io/acme-co/osramp/images/listener
  newTag: latest
- name: processor
  newName: ghcr.io/acme-co/osramp/images/processor
  newTag: latest
