apiVersion: apps/v1
kind: Deployment
metadata:
  name: hosted-daytona-coder
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: hosted-daytona-coder
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/managed-by: signalloom-governor
    signalloom.ai/agent: "true"
    signalloom.ai/role: pairing
    signalloom.ai/harness: daytona-devbox
    signalloom.ai/model: human
    signalloom.ai/tenant: controlplane
    signalloom.ai/project: osramp
    signalloom.ai/state: idle
  annotations:
    signalloom.ai/stunned-at: ""
    signalloom.ai/stun-reason: ""
    signalloom.ai/agent-display-name: "Hosted Daytona Coder"
    signalloom.ai/description: "On-demand devcontainer workspace manager for human pairing sessions."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hosted-daytona-coder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hosted-daytona-coder
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: signalloom
        signalloom.ai/agent: "true"
        signalloom.ai/role: pairing
        signalloom.ai/harness: daytona-devbox
        signalloom.ai/model: human
        signalloom.ai/tenant: controlplane
        signalloom.ai/project: osramp
        signalloom.ai/state: idle
    spec:
      serviceAccountName: hosted-daytona-coder
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: manager
          image: hosted-daytona-coder:local
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
