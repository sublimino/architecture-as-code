apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-signalloom
  labels:
    app.kubernetes.io/name: dashboard-signalloom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-signalloom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-signalloom
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ${IMAGE_BASE}/signalloom/apps/dashboard-signalloom:${ARTIFACT_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: nginx-tmp
          emptyDir: {}
