#
# kind-osramp. The image is the in-cluster zot reference every other estate
# image uses, published under its source-commit tag by
# `make -C d2-signalloom sentinel-image-publish CLUSTER_NAME=osramp` (verified
# kind load onto the node, plus a push to zot so a rebuilt node can be
# reloaded from the registry rather than from someone's laptop). It used to be
# the short name stun-sentinel:v0.2.0, a tag reused for ~7 builds.
#
# This is the path the flux ResourceSet agent-swarm deploys
# (d2-osramp-fleet/tenants/base/agent-swarm.yaml), so this file, not the base,
# decides what runs on kind-osramp.
#
# The ingest URL is stated explicitly even though it currently matches the base
# default. That is the point of the overlay: when this cluster's ingest moves,
# this file changes and kind-signalloom-hub does not.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../signalloom-stun-sentinel

# newName only, no newTag: the version lives in the base daemonset.yaml and is
# inherited, so a version bump there does not have to be chased into every
# overlay. This overlay changes WHERE the image comes from, not WHICH version.
images:
  - name: ghcr.io/controlplaneio-in-toto/signalloom-stun-sentinel
    newName: zot.registry.svc.cluster.local:5000/acme/images/signalloom/apps/stun-sentinel

patches:
  - target:
      kind: ConfigMap
      name: stun-sentinel-config
    patch: |
      - op: replace
        path: /data/SIGNAL_INGEST_URL
        value: http://signal-ingest.fe-signalloom.svc.cluster.local:8082
