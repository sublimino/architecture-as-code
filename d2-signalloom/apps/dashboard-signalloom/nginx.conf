server {
  listen 8080;
  server_name _;
  resolver 10.96.0.10 valid=30s;
  root /usr/share/nginx/html;
  index index.html;

  location = /readyz {
    default_type text/plain;
    return 200 "ready";
  }

  location /dex/ {
    set $dex http://dex.inf-signalloom.svc.cluster.local:5556;
    proxy_pass $dex$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # KubeSec-AFM: proxy the full dashboard and all its assets.
  # AFM serves at /dashboard/ with Next.js assets at /dashboard/_next/.
  # The iframe in Signal Loom loads /dashboard/ directly (same-origin proxy).
  location /dashboard/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AFM API routes — used by the /afm/ prefix (Signal Loom native) and by
  # the iframed AFM frontend (which calls /clusters, /metrics, /health, /jobs
  # relative to the origin when it detects it's not on port 8000).
  location /afm/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    rewrite ^/afm(/.*) $1 break;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AFM API paths called by the iframed frontend (same-origin, no prefix).
  location /clusters {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /metrics/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /jobs {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhooks/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api http://fe-signalloom-api.fe-signalloom.svc.cluster.local:8000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
