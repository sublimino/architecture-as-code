apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kagent-finops-optimizer
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: kagent-finops-optimizer
    app.kubernetes.io/part-of: signalloom
    signalloom.ai/agent: "true"
    signalloom.ai/role: finops
    signalloom.ai/harness: kagent
spec:
  description: Analyzes resource utilization and unused PVC cost efficiency
  type: Declarative
  declarative:
    modelConfig: anthropic-claude
    runtime: go
    systemMessage: "You are a FinOps optimizer. Recommend resource rightsizing and PVC cleanup."
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames:
            - finops_query_metrics
            - finops_identify_waste
