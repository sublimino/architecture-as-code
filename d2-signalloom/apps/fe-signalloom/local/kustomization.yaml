# FLUX ENVSUBST: YES — postBuild.substituteFrom is configured on the Flux
# Kustomization that reconciles this directory. Flux runs envsubst over all
# rendered manifests: use $${VAR} to pass a literal $ through to the container,
# and ${VAR} for values Flux should substitute from flux-runtime-info.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: signal-ingest-awslogs-fixture.yaml
    target:
      kind: Deployment
      name: signal-ingest
  - target:
      kind: Deployment
      name: dashboard-signalloom
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ${IMAGE_BASE}/signalloom/apps/dashboard-signalloom:src-7ed91df33532c582
