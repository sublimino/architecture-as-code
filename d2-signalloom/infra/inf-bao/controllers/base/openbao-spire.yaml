apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: signalloom-bao-proof
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
    spec:
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:2.1.1
          # The image entrypoint uses su-exec, which needs setgroups(2) while
          # transitioning from root.  Start the Bao binary directly as its
          # packaged unprivileged account instead, retaining the restricted
          # capability and no-privilege-escalation posture.
          command: ["/bin/bao"]
          args: ["server", "-dev", "-dev-root-token-id=signalloom-demo-root-token", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              value: signalloom-demo-root-token
          ports:
            - name: http
              containerPort: 8200
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
spec:
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spire-server-data
  labels:
    app.kubernetes.io/name: spire-server
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # ⚠ APPLYING THIS TO A RUNNING CLUSTER IS NOT FREE. READ THE MIGRATION
  #   SECTION IN scripts/lib/spire-trust-anchor.sh FIRST.
  #
  # A new PVC is an EMPTY volume, so spire-server starts on it, mints a fresh CA
  # and an empty registration table — exactly once. That strands the agent's
  # hostPath cache on the old CA and deletes every entry, i.e. it triggers the
  # outage this change exists to prevent, on the way to preventing it. On a
  # cluster whose trust chain was repaired by hand, it discards the repair.
  #
  # Two routes, both documented at the reference above: pre-seed the volume
  # node-side for zero CA change, or accept the one-time break and run the full
  # recovery. A FRESH cluster needs neither — there is nothing to preserve.
  #
  # This warning is here, on the object that causes it, rather than only in the
  # library someone reads while debugging: by the time you are reading
  # spire-trust-anchor.sh you have usually already applied this.
  #
  # storageClassName is deliberately UNSET so the cluster's default class is
  # used. Both lanes are kind, whose default is `standard`
  # (rancher.io/local-path, WaitForFirstConsumer, no volume expansion). Pinning
  # the name here would make this slice unschedulable on any cluster that names
  # its default differently, and the failure mode of getting it wrong is a
  # Pending pod, which is loud. Note the class does NOT support expansion: 1Gi
  # is what this gets for its lifetime. SPIRE's datastore is a handful of
  # registration rows and its CA journal — the live one is ~2MB — so the
  # headroom is three orders of magnitude, not a guess.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-server
  labels:
    app.kubernetes.io/name: spire-server
spec:
  replicas: 1
  # Recreate, NOT the default RollingUpdate, and this is load-bearing rather
  # than stylistic. The data volume below is ReadWriteOnce, so a rolling update
  # deadlocks against itself: the replacement pod cannot attach a volume the
  # outgoing pod still holds, maxUnavailable keeps the outgoing pod alive
  # waiting for the replacement to become ready, and the rollout hangs until
  # somebody scales to zero by hand. Landing the PVC without this line is worse
  # than landing neither.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-server
    spec:
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.11.1
          # The image entrypoint already supplies `spire-server run`; repeating
          # it makes SPIRE ignore the supplied config path and exit.
          args: ["-config", "/run/spire/config/server.conf"]
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
            - name: data
              mountPath: /run/spire/data
            - name: sockets
              mountPath: /tmp/spire-server/private
        - name: spire-oidc-provider
          image: ghcr.io/spiffe/oidc-discovery-provider:1.11.1
          args: ["-config", "/run/spire/config/oidc-discovery-provider.conf"]
          ports:
            - name: http-oidc
              containerPort: 8008
          volumeMounts:
            - name: oidc-config
              mountPath: /run/spire/config
            - name: sockets
              mountPath: /tmp/spire-server/private
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: config
          configMap:
            name: spire-server-config
        - name: oidc-config
          configMap:
            name: spire-oidc-config
        - name: sockets
          emptyDir: {}
        - name: data
          # server.conf's data_dir. This holds BOTH halves of the server's
          # identity — the sqlite datastore (registration entries, the CA
          # journal) and KeyManager "disk"'s keys.json (the CA private keys) —
          # so without a volume a restart issues a brand new CA and forgets
          # every registration.
          #
          # That alone would be recoverable. What made it terminal is the
          # asymmetry with spire-agent, whose data_dir is a hostPath and
          # therefore DID survive: the agent reloaded a bundle for a CA that no
          # longer existed and crash-looped on "certificate signed by unknown
          # authority" indefinitely — 1528 restarts over 6d19h on kind-osramp,
          # each burning one of its single-use join tokens. Recovery needed node
          # access to clear the agent's directory, which is why
          # scripts/lib/spire-trust-anchor.sh refuses to attempt it in-cluster.
          #
          # This makes the server the durable side, matching the agent, so the
          # CA the agent already trusts is still the CA after a restart.
          persistentVolumeClaim:
            claimName: spire-server-data
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
spec:
  selector:
    app.kubernetes.io/name: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: spire-oidc
  labels:
    app.kubernetes.io/name: spire-oidc
spec:
  selector:
    app.kubernetes.io/name: spire-server
  ports:
    - name: http-oidc
      port: 8008
      targetPort: http-oidc
