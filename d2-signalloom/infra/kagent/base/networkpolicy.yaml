---
# Signal Loom's own network posture for the kagent namespace.
#
# KEPT (not superseded by the upstream chart): kagent 0.9.9 ships no
# NetworkPolicy of any kind — `helm template ... | rg 'kind: NetworkPolicy'`
# returns nothing. Everything in this file is Signal Loom's tenancy boundary,
# not kagent's, so it outlives the stub manifests the chart replaced.
#
# ─── The selectors moved, and a silently-dead policy is worse than none ────
#
# Both policies below used to select pods the chart does not create:
#
#   was  app.kubernetes.io/name=kagent-postgres     is  name=kagent, component=database
#   was  app.kubernetes.io/name=kagent-tool-server  is  name=kagent-tools
#
# A podSelector that matches nothing is not an error and not a warning. The
# NetworkPolicy object exists, `kubectl get netpol` lists it, and it constrains
# no traffic whatsoever. Ported as-is onto the real chart these two would have
# read as an enforced boundary while the database accepted connections from
# every pod in the namespace.
#
# The tool server's port moved too — the chart's Service and containerPort are
# 8084, not the stub's 8080 — so even a corrected selector would have allowed
# nothing on the port the tool server actually listens on.
#
# Labels below are from the rendered chart, not from memory:
#   helm template kagent oci://ghcr.io/kagent-dev/kagent/helm/kagent \
#     --version 0.9.9 -n kagent -f ../values.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-postgres-isolation
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: signalloom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/instance: kagent
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-tool-server-allow
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: signalloom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent-tools
      app.kubernetes.io/instance: kagent
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Anything inside the kagent namespace: the controller reaches the tool
        # server to enumerate tools, and the UI proxies through the controller.
        - podSelector: {}
        # Signal Loom's agents run in their own namespace and reach the tool
        # server across it via the kagent-tool-server RemoteMCPServer.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom-agents
      ports:
        # 8084 is the chart's tools port. 8085 is its Prometheus metrics port
        # and is deliberately NOT opened here.
        - protocol: TCP
          port: 8084
---
# SLAAT-P2-1: SLAAT-P1-1's hardening checklist found kagent-controller,
# kagent-ui, and the kagent-tools-metrics port (8085) carry NO Ingress-type
# policy at all -- every port on all three is reachable from any pod in the
# cluster, not just the two ports the policies above cover. Scoped to
# Ingress only: WATCH_NAMESPACES is empty on kagent-controller (it watches
# every namespace via the k8s apiserver) and its model-config egress target
# is not something this card can safely enumerate, so Egress is left
# untouched here, same reasoning as d2-infra/components/ingress's
# NetworkPolicy for envoy-gateway's own control plane.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-controller-ingress
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: signalloom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        # kagent-ui proxies through the controller; Signal Loom's managed
        # agents (fe-signalloom-agents) call back via the A2A protocol
        # (A2A_BASE_URL points at this service).
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fe-signalloom-agents
      ports:
        - protocol: TCP
          port: 8083
---
# No HTTPRoute references kagent-ui anywhere in this repo today, so it has
# no legitimate caller outside the namespace. If a Gateway route is added
# later, this policy needs an explicit `ingress` namespaceSelector carve-out
# alongside it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-ui-ingress
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: signalloom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/component: ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
# Closes the kagent-tools-metrics Service (8085) that kagent-tool-server-allow
# (above) deliberately left out of its own ingress rule -- that port was
# genuinely open to the whole cluster until now, not merely undocumented.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-tools-metrics-ingress
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: signalloom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent-tools
      app.kubernetes.io/instance: kagent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8085
