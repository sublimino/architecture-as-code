# ServiceAccount for the swarm-governor. SPIRE issues an SVID scoped to
# spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/swarm-governor,
# which authorises A2A task dispatch to specialist agents.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarm-governor
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/role: "governor"
    signalloom.ai/harness: "go-a2a"
    signalloom.ai/model: "claude-sonnet-4"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
