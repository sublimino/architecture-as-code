apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cluster-gateway
spec:
  serviceAccountName: flux
  resources:
    - apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: cluster-gateway-to-cluster-tls
        namespace: cert-manager
      spec:
        from:
          - group: gateway.networking.k8s.io
            kind: Gateway
            namespace: ingress
        to:
          - group: ""
            kind: Secret
            name: cluster-tls
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: cluster
        namespace: ingress
      spec:
        gatewayClassName: envoy-gateway
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            hostname: "*.${CLUSTER_DOMAIN}"
            allowedRoutes:
              namespaces:
                from: Same
          - name: https
            protocol: HTTPS
            port: 443
            hostname: "*.${CLUSTER_DOMAIN}"
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  name: cluster-tls
                  namespace: cert-manager
            allowedRoutes:
              namespaces:
                from: All
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: http-to-https-redirect
        namespace: ingress
      spec:
        parentRefs:
          - name: cluster
            sectionName: http
        hostnames:
          - "*.${CLUSTER_DOMAIN}"
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
