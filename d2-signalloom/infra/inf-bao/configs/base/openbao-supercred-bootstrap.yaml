# SuperCred demo: seed OpenBao with the cardvault-agent's credentials and policy.
#
# The cardvault-agent authenticates to OpenBao using its SPIFFE JWT-SVID
# (issued by the SPIRE server). OpenBao validates the JWT, binds it to the
# signalloom-cardvault-agent role and policy, and returns a token the agent
# uses to read the KV secret containing the cardvault service credentials.
#
# Prerequisites: openbao-spire-bootstrap must have already enabled the KV-v2
# engine and the JWT auth backend. This Job is additive -- it creates a new
# role and secret without disturbing the existing fe-signalloom setup.
#
# SLAAT-P1-3-F1 (CRITICAL, fixed by SLAAT-P2-3): this role previously declared
# no token_ttl/token_max_ttl, so it inherited the auth/jwt mount's
# default_lease_ttl=768h -- a captured token stayed valid (and renewable) for
# 32 days against the mission's stated 5-minute hard cap. token_ttl/
# token_max_ttl=5m plus token_type=batch (non-renewable) now match the
# agent-trust-planner/triage pattern in d2-agent-trust/contracts/openbao-role-intent.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-supercred-bootstrap
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.1.1
          env:
            - name: BAO_ADDR
              value: http://openbao.inf-bao.svc.cluster.local:8200
            - name: BAO_TOKEN
              value: signalloom-demo-root-token
          command:
            - sh
            - -ec
            - |
              until bao status >/dev/null 2>&1; do sleep 2; done

              # Wait for the base bootstrap to enable the JWT auth backend
              echo "waiting for JWT auth backend..."
              until bao auth list 2>/dev/null | grep -q 'jwt/'; do sleep 2; done

              # Wait for the KV-v2 engine
              until bao secrets list 2>/dev/null | grep -q 'kv/'; do sleep 2; done

              # --- Policy: the cardvault-agent can read its own credential path only ---
              cat >/tmp/policy.hcl <<'POLICY'
              path "kv/data/signalloom/cardvault-agent" {
                capabilities = ["read"]
              }
              POLICY
              bao policy write signalloom-cardvault-agent /tmp/policy.hcl

              # --- JWT auth role: bound to the agent's SPIFFE identity ---
              bao write auth/jwt/role/signalloom-cardvault-agent - <<'ROLE'
              {
                "role_type": "jwt",
                "bound_audiences": ["openbao"],
                "bound_claims": {"sub": "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/*cardvault*"},
                "bound_claims_type": "glob",
                "user_claim": "sub",
                "policies": ["signalloom-cardvault-agent"],
                "token_ttl": "5m",
                "token_max_ttl": "5m",
                "token_type": "batch"
              }
              ROLE


              # --- Seed the credential the agent will retrieve ---
              bao kv put kv/signalloom/cardvault-agent \
                username=cardvault-svc-account \
                password=supercred-demo-password-2026

              echo "supercred bootstrap complete"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# SLDC-P2-2: cross-cluster JWT role for workload-domain (osramp.local)
# cardvault agents, consumed by scripts/bootstrap-spire-federation.sh on the
# hub OpenBao. It is applied to the auth mount that trusts the *federated*
# osramp.local JWT-SVID keys (auth/jwt-osramp by default), not to the
# signalloom.demo auth/jwt mount the Job above configures.
#
# bound_claims_type "glob" is load-bearing. OpenBao's default is "string",
# which compares the "*" in bound_claims.sub as a literal asterisk and rejects
# every real SVID with HTTP 400 "claim \"sub\" does not match any associated
# bound claim values" (proposal F.4 PF-3). The mutation test in
# test/spire-federation-openbao-jwt.bats proves this on a live OpenBao.
#
# The glob is pinned to one namespace and one service-account prefix. A
# namespace or SA wildcard ("ns/*", "sa/*") would admit any workload in
# osramp.local; the static test rejects both shapes.
#
# clock_skew_leeway / expiration_leeway / not_before_leeway are 5s rather
# than OpenBao's 60s/150s defaults: an expired SVID is refused within 5s,
# matching the Kind-node skew tolerance in the proposal's failure modes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-jwt-role-config
  labels:
    app.kubernetes.io/part-of: signalloom
    signalloom.io/card: SLDC-P2-2
data:
  auth-mount: jwt-osramp
  role-name: agent-cardvault
  transit-key: agent-cardvault
  role.json: |
    {
      "role_type": "jwt",
      "bound_audiences": ["signal-ingest", "openbao"],
      "user_claim": "sub",
      "bound_claims_type": "glob",
      "bound_claims": {"sub": "spiffe://osramp.local/ns/agent-trust/sa/agent-cardvault*"},
      "token_policies": ["agent-cardvault-policy"],
      "token_no_default_policy": true,
      "token_type": "service",
      "token_ttl": "1h",
      "token_max_ttl": "1h",
      "clock_skew_leeway": 5,
      "expiration_leeway": 5,
      "not_before_leeway": 5
    }
  # Read + lease on the agent's own transit key. Explicit deny wins over any
  # grant in OpenBao, so the deny stanzas hold even if a broader policy is
  # ever attached: no child/orphan tokens, no role or policy edits, no key
  # rotation/export/config, no mount or auth-method changes.
  agent-cardvault-policy.hcl: |
    path "transit/keys/agent-cardvault" {
      capabilities = ["read"]
    }
    path "sys/leases/lookup" {
      capabilities = ["update"]
    }
    path "sys/leases/renew" {
      capabilities = ["update"]
    }
    path "auth/token/lookup-self" {
      capabilities = ["read"]
    }
    path "auth/token/renew-self" {
      capabilities = ["update"]
    }
    path "auth/token/create" {
      capabilities = ["deny"]
    }
    path "auth/token/create/*" {
      capabilities = ["deny"]
    }
    path "auth/token/create-orphan" {
      capabilities = ["deny"]
    }
    path "auth/jwt-osramp/role/*" {
      capabilities = ["deny"]
    }
    path "sys/policy/*" {
      capabilities = ["deny"]
    }
    path "sys/policies/*" {
      capabilities = ["deny"]
    }
    path "sys/auth/*" {
      capabilities = ["deny"]
    }
    path "sys/mounts/*" {
      capabilities = ["deny"]
    }
    path "transit/keys/agent-cardvault/config" {
      capabilities = ["deny"]
    }
    path "transit/keys/agent-cardvault/rotate" {
      capabilities = ["deny"]
    }
    path "transit/export/*" {
      capabilities = ["deny"]
    }
