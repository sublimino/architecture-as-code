---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-ui-nginx-config
  namespace: kagent
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /healthz {
            return 200 '{"status":"ok","component":"kagent-ui"}';
            add_header Content-Type application/json;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Kagent UI — Signal Loom Demo 5</title></head>
    <body style="font-family: sans-serif; padding: 2rem; background: #0f172a; color: #f8fafc;">
      <h1>Kagent Declarative AI Agent Platform</h1>
      <p>CNCF Sandbox AI Agent Framework — Governed by Signal Loom</p>
      <ul>
        <li>K8s Resource Reader (Declarative, Go ADK)</li>
        <li>Commit Summariser (GitHub MCP, OpenBao Tokens)</li>
        <li>Security Analyst (Multi-Tool Posture Assessment)</li>
      </ul>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-ui
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent-ui
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: ui
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: kagent-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-ui
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent-ui
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-ui
        app.kubernetes.io/part-of: signalloom
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: kagent-ui
      containers:
        - name: ui
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-conf
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: nginx-conf
          configMap:
            name: kagent-ui-nginx-config
