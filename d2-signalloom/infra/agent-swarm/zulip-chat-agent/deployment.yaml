apiVersion: apps/v1
kind: Deployment
metadata:
  name: zulip-chat-agent
  namespace: fe-signalloom-agents
  labels:
    signalloom.ai/agent: "true"
    signalloom.ai/framework: "custom"
    signalloom.ai/role: "chatops"
    signalloom.ai/harness: "bun-zulip"
    signalloom.ai/model: "claude-sonnet-4"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zulip-chat-agent
  template:
    metadata:
      labels:
        app: zulip-chat-agent
        signalloom.ai/agent: "true"
        signalloom.ai/framework: "custom"
        signalloom.ai/role: "chatops"
        signalloom.ai/harness: "bun-zulip"
        signalloom.ai/model: "claude-sonnet-4"
        signalloom.ai/tenant: "controlplane"
        signalloom.ai/project: "osramp"
    spec:
      serviceAccountName: zulip-chat-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: zulip-chat-agent
          image: zulip-chat-agent:latest
          imagePullPolicy: Never
          env:
            - name: ZULIP_URL
              valueFrom:
                secretKeyRef:
                  name: zulip-chat-agent-secrets
                  key: zulip-url
            - name: ZULIP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: zulip-chat-agent-secrets
                  key: zulip-email
            - name: ZULIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zulip-chat-agent-secrets
                  key: zulip-api-key
            - name: ZULIP_STREAM
              value: cpai-swarms
            - name: ZULIP_BOT_NAME
              value: swarm-bot
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # OpenBao Agent sidecar — fetches secrets via SPIFFE JWT auth
        - name: openbao-agent
          image: openbao/openbao:2.1.0
          args:
            - agent
            - -config=/etc/openbao/agent.hcl
          env:
            - name: SPIFFE_ID
              value: "spiffe://signalloom.demo/ns/fe-signalloom-agents/sa/zulip-chat-agent"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: bao-home
              mountPath: /home/openbao
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: openbao-agent-config
          configMap:
            name: zulip-chat-agent-openbao-config
        - name: vault-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: bao-home
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
