# fake-integration-proxy reads fixed runtime state only. It receives no Secret,
# ConfigMap, exec, mutation, wildcard-resource, or unrestricted namespace grant.
# The namespace-name ClusterRole lives in the ResourceSet because this Flux
# Kustomization is deliberately unable to mint cluster-scoped RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: agent-trust-topology-reader, namespace: agent-trust-platform}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [list]}
  - {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: agent-trust-topology-reader, namespace: agent-trust-tenant-acme-control}
rules:
