# Canonical Signalloom ResourceSet source. The active fleet carries an identical
# copy at d2-osramp-fleet/tenants/local/signalloom.yaml because Flux consumes
# only the fleet OCI artifact.
#
# FLUX ENVSUBST: YES for signalloom-infra/signalloom-apps' spec.resources —
# ${REGISTRY_BASE}/${REGISTRY_INSECURE} there are reached by the tenants
# Kustomization's postBuild.substituteFrom (clusters/local/tenants.yaml ->
# flux-runtime-info ConfigMap). spec.inputs on both is deliberately empty
# ([]): `make demo-signalloom-up` (scripts/signalloom-local.sh, see
# `activate_resourceset`) activates them with `kubectl patch resourceset
# --type merge`, injecting concrete literal values — that path never goes through
# envsubst, so it is not subject to the postBuild race documented on
# tenants/base/infra.yaml and in AGENTS.md "Flux variable substitution".
# signalloom-spire-rbac has no inputs and no ${VAR} tokens at all.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: signalloom-spire-rbac
  namespace: flux-system
spec:
  resources:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: spire-agent
        namespace: inf-bao
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: signalloom-spire-agent-kubelet
      rules:
        - apiGroups: [""]
          resources: ["nodes/proxy"]
          verbs: ["get"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: signalloom-spire-agent-kubelet
      subjects:
        - kind: ServiceAccount
          name: spire-agent
          namespace: inf-bao
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: signalloom-spire-agent-kubelet
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: signalloom-infra
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  # Signal Loom infrastructure starts only through `make demo-signalloom-up`.
  inputs: []
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: tenant
    # Agent inventory belongs outside the apps Kustomization because that
    # Kustomization deliberately targets only << inputs.tenant >>.
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: fe-signalloom-agents
        labels:
          app.kubernetes.io/part-of: signalloom
          signalloom.ai/purpose: agent-inventory
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: agent-inventory-reader
        namespace: fe-signalloom-agents
      rules:
        # `patch` is what the SuperCred stun flow needs: POST /agents/<id>/stun
        # sets signalloom.ai/state=stunned plus the stun annotations on the pod.
        # Without it the button returns 502 wrapping a 403 and nothing changes.
        #
        # Deliberately `patch` and nothing else — no create, update, delete or
        # wildcard, and pods only. The proxy may relabel an existing agent; it
        # may not conjure, replace or remove one. The Role name still says
        # "reader" because it is the roleRef of a live RoleBinding and of
        # agent-discovery-rbac.bats; the verb list is the authority on what it
        # actually grants.
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: fake-proxy-agent-inventory-reader
        namespace: fe-signalloom-agents
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: agent-inventory-reader
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: inf-signalloom
    # ─── SuperCred demo runner: cross-namespace RBAC ─────────────────────────
    #
    # The supercred-demo-runner workload, its ServiceAccount, Service and
    # NetworkPolicy live in apps/supercred-demo-runner/base/ and land in
    # << inputs.tenant >> via the apps Kustomization. Everything below reaches
    # OUTSIDE that namespace, so it has to be here for exactly the reason
    # agent-inventory-reader above is: the apps Kustomization sets
    # `targetNamespace: << inputs.tenant >>` and would silently relocate these
    # Roles into the tenant namespace, applying cleanly and reporting Ready
    # while the runner got Forbidden on every call that mattered.
    #
    # Every verb below is derived from a specific kubectl invocation in
    # scripts/supercred-demo.sh; line numbers refer to that file. No wildcards.
    #
    # Deliberately absent: `secrets` (all OpenBao credential material is
    # handled by exec'ing into the OpenBao pod, never via the Kubernetes API)
    # and `configmaps` (nothing in the script touches one).
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: supercred-demo-runner
        labels:
          app.kubernetes.io/name: supercred-demo-runner
          app.kubernetes.io/part-of: signalloom
      rules:
        # L63-64 `get ns`; L147-148 `create namespace --dry-run=client -o yaml
        # | kubectl apply -f -` (apply = get, then create); L149
        # `annotate namespace --overwrite`. No delete: teardown deliberately
        # leaves fe-signalloom-agents in place.
        - apiGroups: [""]
          resources: ["namespaces"]
          verbs: ["get", "create", "patch"]
        # Read-only, and not used by supercred-demo.sh directly: it is how the
        # in-image `docker` shim answers `docker exec <node> crictl images` for
        # preflight_images (L96-101). The kubelet fills node.status.images from
        # the CRI's ListImages -- the same source crictl reads -- so the shim
        # keeps the preflight's semantics without a Docker socket.
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: supercred-demo-runner
        labels:
          app.kubernetes.io/name: supercred-demo-runner
          app.kubernetes.io/part-of: signalloom
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: supercred-demo-runner
      subjects:
        - kind: ServiceAccount
          name: supercred-demo-runner
          namespace: << inputs.tenant >>
    # kube-system: `kubectl cluster-info` (L62) lists Services in kube-system
    # by label selector. Without this it exits non-zero and preflight_cluster
    # fails closed with "cluster not reachable" against a healthy cluster --
    # the same misleading-preflight class AGENTS.md records for
    # wait_k8s_ready against a Deployment.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: supercred-demo-runner-cluster-info
        namespace: kube-system
      rules:
        - apiGroups: [""]
          resources: ["services"]
          verbs: ["list"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: supercred-demo-runner-cluster-info
        namespace: kube-system
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: supercred-demo-runner-cluster-info
      subjects:
        - kind: ServiceAccount
          name: supercred-demo-runner
          namespace: << inputs.tenant >>
    # inf-signalloom: where the demo deploys cardvault and policy-engine.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: supercred-demo-runner
        namespace: inf-signalloom
      rules:
        # L178/L183 `apply -k` (get + create/patch); L360/L361 `delete -k`;
        # L179/L184 wait_rollout -> `rollout status` (get, list, watch);
        # L106/L108 wait_k8s_exists (get); L403/L404 teardown check (get).
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        # `rollout status deploy/<n>` reads the Deployment's ReplicaSets.
        - apiGroups: ["apps"]
          resources: ["replicasets"]
          verbs: ["get", "list", "watch"]
        # rollout status; and `port-forward svc/policy-engine` (L258) resolves
        # the Service to a backing pod before opening the tunnel.
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
        # L258 `port-forward svc/policy-engine 18081:8081` for step 3.
        - apiGroups: [""]
          resources: ["pods/portforward"]
          verbs: ["create"]
        # Both kustomizations contain a Service: L178/L183 apply, L360/L361
        # delete. L258 additionally needs get to resolve the port-forward.
        - apiGroups: [""]
          resources: ["services"]
          verbs: ["get", "list", "create", "update", "patch", "delete"]
        # cardvault/base/networkpolicy.yaml is in that kustomization, so L178's
        # apply creates it and L360's delete removes it.
        - apiGroups: ["networking.k8s.io"]
          resources: ["networkpolicies"]
          verbs: ["get", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: supercred-demo-runner
        namespace: inf-signalloom
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: supercred-demo-runner
      subjects:
        - kind: ServiceAccount
          name: supercred-demo-runner
          namespace: << inputs.tenant >>
    # inf-bao: OpenBao and SPIRE. Everything here is reached by kubectl exec.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: supercred-demo-runner
        namespace: inf-bao
      rules:
        # L54 resolves the spire-server pod by label; `exec deployment/openbao`
        # resolves the Deployment to a pod before exec'ing.
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
        # The demo's whole credential lifecycle: SPIRE entry show/create/delete
        # (L163, L167, L213, L367, L371) and every `bao` policy/role/kv call
        # (L197, L299, L303, L393). This is the most powerful grant in the set
        # -- exec into the OpenBao pod is equivalent to holding its root token
        # -- which is precisely why it sits on this ServiceAccount and not on
        # fe-signalloom-api's.
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]
        # L74/L76 wait_rollout openbao and spire-server; `exec
        # deployment/openbao` needs get to resolve the Deployment.
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources: ["replicasets"]
          verbs: ["get", "list", "watch"]
        # L154 and L331 `delete job openbao-supercred-bootstrap
        # --ignore-not-found --wait=true`. The --wait is why list and watch are
        # here alongside delete.
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch", "delete"]
        # L174 `apply -f .../inf-bao/configs/base/networkpolicy.yaml`.
        # No delete: nothing in the script ever removes it.
        - apiGroups: ["networking.k8s.io"]
          resources: ["networkpolicies"]
          verbs: ["get", "create", "update", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: supercred-demo-runner
        namespace: inf-bao
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: supercred-demo-runner
      subjects:
        - kind: ServiceAccount
          name: supercred-demo-runner
          namespace: << inputs.tenant >>
    # fe-signalloom-agents: declared home of the agent pod, its ServiceAccount
    # and the credential-chain Job. The matching Role for the OTHER candidate
    # namespace (the tenant namespace itself) follows immediately below.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: supercred-demo-runner
        namespace: fe-signalloom-agents
      rules:
        # get: L41, L112, L121, L132, L255. list/watch: L191 wait_pods_ready by
        # label, plus the `--wait=true` deletes. create: L189 applies a bare
        # Pod. delete: L156, L348. patch: L244/L285/L307 `label pod
        # --overwrite` and L308 `annotate pod --overwrite` -- the agent state
        # transitions the demo exists to show.
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "create", "delete", "patch"]
        # L237, L242, L320 `kubectl logs job/supercred-agent-run`.
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
        # create/update: L232 and L315 apply agents-cardvault-job.yaml.
        # get/list/watch: L235/L316 `wait --for condition=complete`, and
        # `logs job/<n>` resolving the Job to its pods.
        # delete: L153, L231, L314, L323, L347.
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        # L188 applies agents-cardvault-sa.yaml; L349 deletes it at teardown.
        - apiGroups: [""]
          resources: ["serviceaccounts"]
          verbs: ["get", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: supercred-demo-runner
        namespace: fe-signalloom-agents
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: supercred-demo-runner
      subjects:
        - kind: ServiceAccount
          name: supercred-demo-runner
          namespace: << inputs.tenant >>
    # << inputs.tenant >>: the OTHER candidate namespace. agents-cardvault.yaml
    # declares `namespace: fe-signalloom-agents` while targetNamespace can land
    # the pod in the tenant namespace instead, so supercred-demo.sh sweeps both
    # candidates (L28-30) and teardown deletes from every one of them
    # (L346-350). Verb derivation is identical to the fe-signalloom-agents Role
    # directly above -- see there for the line-by-line justification.
    #
    # This pair has to live HERE rather than in the apps Kustomization, and the
    # reason is not stylistic. signalloom-apps reconciles as the namespace-
    # scoped `flux` ServiceAccount, which holds ClusterRole/admin but NOT
    # `escalate` on roles. Creating a RoleBinding therefore makes the API
    # server resolve its roleRef to run the privilege-escalation check, and
    # kustomize-controller server-dry-runs the ENTIRE object set to build its
    # change set BEFORE it applies any of it. A dry run never persists the
    # Role, so the RoleBinding failed the lookup with
    #   RoleBinding/fe-signalloom/supercred-demo-runner-agents not found
    # which aborted the whole set -- so the Role was never applied for real,
    # and every later reconcile failed identically. That deadlock left
    # fe-signalloom empty for six consecutive reconciles over twenty minutes
    # and took the dashboard, the API and stages 6-8 down with it. Applied
    # from here, the cluster-admin flux-system ServiceAccount binds it with no
    # escalation check, in any order.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: supercred-demo-runner-agents
        namespace: << inputs.tenant >>
        labels:
          app.kubernetes.io/name: supercred-demo-runner
          app.kubernetes.io/component: supercred-demo
          app.kubernetes.io/part-of: signalloom
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "create", "delete", "patch"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["serviceaccounts"]
          verbs: ["get", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: supercred-demo-runner-agents
        namespace: << inputs.tenant >>
        labels:
          app.kubernetes.io/name: supercred-demo-runner
          app.kubernetes.io/component: supercred-demo
          app.kubernetes.io/part-of: signalloom
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: supercred-demo-runner-agents
      subjects:
        - kind: ServiceAccount
          name: supercred-demo-runner
          namespace: << inputs.tenant >>
    - apiVersion: v1
      kind: Pod
      metadata:
        name: agent-sir-lancelot
        namespace: fe-signalloom-agents
        labels:
          app.kubernetes.io/name: signalloom-agent
          app.kubernetes.io/component: agent
          app.kubernetes.io/part-of: signalloom
          app.kubernetes.io/managed-by: signalloom-governor
          app.kubernetes.io/instance: sir-lancelot
          signalloom.ai/agent: "true"
          signalloom.ai/agent-name: sir-lancelot
          signalloom.ai/agent-type: signal-loom-built
          signalloom.ai/framework: kagent
          signalloom.ai/model: claude-opus-4-8
          # signalloom.ai/state is NOT declared here, and that is a KNOWN GAP
          # rather than the fix — see stun-under-flux.md Q7.
          #
          # For Kustomization-managed pods the correct configuration is
          # declared-AND-ignored (agents-cardvault.yaml carries the full note).
          # `.spec.ignore` is a Kustomization field and has no flux-operator
          # ResourceSet equivalent, so there is nowhere to hang the ignore rule
          # for this cohort. Declaring the literal here without one would
          # reproduce the original bug: the stun's `stunned` value would be
          # reverted to `idle` on the next reconcile.
          #
          # These are the inert demo agents (Monty Python cohort); nothing in
          # the demo stuns them, so the gap is currently unreachable. It stops
          # being unreachable the moment anyone stuns one.
        annotations:
          signalloom.ai/agent-display-name: "Sir Lancelot"
          signalloom.ai/model-full: "anthropic/claude-opus-4-8"
          signalloom.ai/description: "Inert demo agent — brave, and prone to charging in."
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: agent
            image: ghcr.io/stefanprodan/podinfo:6.7.1
            ports:
              - name: http
                containerPort: 9898
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: data
                mountPath: /data
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
        volumes:
          - name: tmp
            emptyDir: {}
          - name: data
            emptyDir: {}
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/flux-runtime-info
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/ghcr-auth
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-auth
    # Signalloom manifests are constrained to their target namespace. Do not
    # grant this tenant a cluster-wide reconciliation identity.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-<< inputs.tenant >>
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # Gateway API CRDs (referencegrants) are not covered by admin ClusterRole.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: flux-gateway-api
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["referencegrants"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-gateway-api
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: flux-gateway-api
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # Cluster-scoped namespace patch — same rationale as signalloom-apps.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      rules:
        - apiGroups: [""]
          resources: ["namespaces"]
          resourceNames: ["<< inputs.tenant >>"]
          verbs: ["get", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: flux-ns-patch-<< inputs.tenant >>
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: << inputs.component >>
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        serviceAccountName: flux
        url: oci://${REGISTRY_BASE}/signalloom/infra/<< inputs.component >>
        insecure: ${REGISTRY_INSECURE}
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/acme-co/osramp/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-controllers
        namespace: << inputs.tenant >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: << inputs.component >>
        path: ./controllers/<< inputs.environment >>
        prune: true
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-configs
        namespace: << inputs.tenant >>
      spec:
        dependsOn:
          - name: infra-controllers
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: << inputs.component >>
        path: ./configs/<< inputs.environment >>
        prune: true
        # Added so Dex's issuer and redirect URI can come from PUBLIC_ORIGIN in
        # flux-runtime-info, which is already copied into this namespace.
        #
        # Without it, exposing the demo on any origin other than the baked-in
        # dashboard.osramp.acme.local meant hand-patching the Dex secret and
        # then SUSPENDING this Kustomization to stop Flux reverting it 30
        # minutes later. Every such patch was a time bomb: the tunnel kept
        # serving, status kept reporting healthy, and logins started failing
        # with "Unregistered redirect_uri" once reconciliation caught up.
        #
        # Routing the origin through substitution makes reconciliation the
        # delivery mechanism instead of the thing we fight.
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
    # ─────────────────────────────────────────────────────────────────────────
    # APPENDED DELIBERATELY — see the identical warning below in signalloom-apps
    # (fleet-patch-indexes.bats guards both ResourceSets by name).
    #
    # Network Tests (netassert) — RBAC for the netassert-run Job's own identity
    # (netassert-runner ServiceAccount, created by apps/fe-signalloom/base/
    # netassert-runner-sa.yaml in the fe-signalloom tenant). The Job runs the
    # real netassert CLI (github.com/controlplaneio/netassert), which injects
    # an ephemeral scanner container into the already-running SRC pod for each
    # NetSerts test — these two Roles mirror netassert's own upstream
    # ClusterRole (rbac/cluster-role.yaml), re-scoped to namespaced Roles per
    # the netassert README's own suggestion, split by what each namespace
    # actually needs:
    #
    #   fe-signalloom-agents hosts only a SRC (agent-patsy, the denied-path
    #   tests) — patch on pods/ephemeralcontainers is required.
    #
    #   inf-signalloom hosts only DESTINATIONS across the whole suite (dex,
    #   postgresql, redis, minio) — read-only, no ephemeralcontainers patch.
    #   (fe-signalloom itself hosts both SRC and DST pods; that grant lives in
    #   signalloom-apps below, alongside the ServiceAccount's own tenant.)
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: netassert-runner
        namespace: fe-signalloom-agents
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/ephemeralcontainers"]
          verbs: ["get", "list", "watch", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: netassert-runner
        namespace: fe-signalloom-agents
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: netassert-runner
      subjects:
        - kind: ServiceAccount
          name: netassert-runner
          namespace: fe-signalloom
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: netassert-runner-readonly
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["", "apps"]
          resources: ["deployments", "statefulsets", "daemonsets", "pods"]
          verbs: ["get"]
        - apiGroups: ["", "apps"]
          resources: ["replicasets", "pods"]
          verbs: ["list"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: netassert-runner-readonly
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: netassert-runner-readonly
      subjects:
        - kind: ServiceAccount
          name: netassert-runner
          namespace: fe-signalloom
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: signalloom-apps
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: inf-signalloom
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  # The Signal Loom frontend starts only through `make demo-signalloom-up`.
  inputs: []
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: tenant
    # Flux dry-run validates RoleBindings before resources from its own
    # Kustomization are persisted. The proxy health binding therefore needs its
    # Role to exist as part of tenant provisioning.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: fe-signalloom-health-reader
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["kustomize.toolkit.fluxcd.io"]
          resources: ["kustomizations"]
          verbs: ["get", "list"]
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list"]
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/flux-runtime-info
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/ghcr-auth
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # The built-in `admin` ClusterRole does not cover Gateway API resources
    # (Gateway API CRDs do not aggregate into admin/edit), so an app tenant that
    # ships HTTPRoutes (fe-signalloom's gateway-route.yaml) needs this explicit
    # least-privilege grant. Without it the apps Kustomization fails its
    # HTTPRoute dry-run and no workloads deploy.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: flux-gateway-routes
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["httproutes", "referencegrants", "grpcroutes", "tcproutes", "tlsroutes"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-gateway-routes
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: flux-gateway-routes
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    # The built-in admin ClusterRole bound via RoleBinding cannot grant
    # access to cluster-scoped resources. Flux's Kustomization dry-run needs
    # to patch the tenant Namespace (labels/annotations from overlays).
    # Least-privilege: restricted to this specific tenant namespace.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      rules:
        - apiGroups: [""]
          resources: ["namespaces"]
          resourceNames: ["<< inputs.tenant >>"]
          verbs: ["get", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-ns-patch-<< inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: flux-ns-patch-<< inputs.tenant >>
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: << inputs.component >>
        namespace: << inputs.tenant >>
        labels:
          bao.controlplane.io/consumer: fe-signalloom
      spec:
        interval: 5m
        serviceAccountName: flux
        url: oci://${REGISTRY_BASE}/signalloom/apps/<< inputs.component >>
        insecure: ${REGISTRY_INSECURE}
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/acme-co/osramp/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps
        namespace: << inputs.tenant >>
        labels:
          bao.controlplane.io/consumer: fe-signalloom
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        # Phase 1 establishes Flux delivery only. Workload health and the
        # deliberately negative SPIRE proof are acceptance evidence for later
        # phases, so they must not hold this delivery Kustomization unready.
        wait: false
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: << inputs.component >>
        path: ./<< inputs.environment >>
        prune: true
        # Proof Jobs are intentionally revised as the SPIRE assertion evolves;
        # Kubernetes makes Job pod templates immutable, so Flux must recreate it.
        force: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
    # ─────────────────────────────────────────────────────────────────────────
    # APPENDED DELIBERATELY — keep new resources at the END of this list.
    #
    # tenants/local/kustomization.yaml patches this ResourceSet by hard-coded
    # positional index (/spec/resources/10/spec/verify) to swap the cosign
    # verify block over to the local key pair. Inserting anywhere above index 10
    # shifts the OCIRepository out from under that patch; the patch then lands on
    # an unrelated resource, the OCIRepository keeps its GitHub-keyless verify
    # block, and Flux rejects every locally-pushed artifact with a
    # VerificationError while the Kustomization silently stays on the old
    # revision. Appending costs nothing: these are namespaced RBAC objects with
    # no ordering requirement, and Flux applies a ResourceSet's resources
    # together. Guarded by d2-signalloom/test/fleet-patch-indexes.bats.
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Agent discovery. agents-cardvault.yaml declares `namespace:
    # fe-signalloom-agents`, but the apps Kustomization above carries
    # `targetNamespace: << inputs.tenant >>`, which relocates the pod into the
    # tenant namespace. The fake-integration-proxy therefore has to list pods
    # here as well as in fe-signalloom-agents, or the SuperCred agent is
    # invisible and /agents silently returns a short list.
    #
    # This mirrors `agent-inventory-reader` in fe-signalloom-agents (the
    # signalloom-infra ResourceSet) and is the narrowest grant that works: pods,
    # read-only, this namespace alone. No ClusterRole and no wildcard namespace —
    # this tenant must not acquire a cluster-wide identity.
    #
    # Role and RoleBinding are declared together deliberately. The API server
    # accepts a RoleBinding whose roleRef names a Role that does not exist and
    # silently grants nothing, so splitting the pair across two reconcilers is a
    # silent-failure shape worth avoiding.
    #
    # This pairs with the `?namespace=` allow-list in server.py
    # (_resolve_agent_namespace): the proxy only ever consults namespaces listed
    # in AGENT_DISCOVERY_NAMESPACES, and this Role is the only thing that makes
    # one of them readable. Both must widen before discovery could read another
    # tenant's pods; widening either alone changes nothing.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: agent-inventory-reader
        namespace: << inputs.tenant >>
      rules:
        # Mirrors the fe-signalloom-agents grant, `patch` included — the
        # SuperCred agent is relocated into this namespace by the apps
        # Kustomization's targetNamespace, so the stun write has to exist here
        # too or the button 502s on a 403. Same limit: pods only, no
        # create/update/delete/wildcard.
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: fake-proxy-agent-inventory-reader
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: agent-inventory-reader
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: inf-signalloom
    # Network Tests (netassert) — Scan Now button. Three identities now, not
    # two — see the fix/netassert-dedicated-sa branch for the full history:
    #
    # netassert-status-reader (below) grants fake-integration-proxy's own SA
    # (default/inf-signalloom) READ-ONLY access to the netassert-run Job and
    # its pods/logs, for GET /network-tests. This SA does NOT hold
    # jobs:create or jobs:delete any more — it used to (as
    # netassert-run-manager), and that was a real privilege-escalation risk:
    # `jobs: create` lets a caller submit ANY Job manifest, not just the
    # fixed netassert-run one, so a stolen or SSRF'd token with that verb
    # would have been a skeleton key for this namespace. The proxy parses
    # far more attacker-reachable input (arbitrary JSON bodies, headers,
    # route params across a dozen endpoints) than the alternative below, so
    # it is the wrong process to trust with that verb.
    #
    # netassert-scan-manager (further below, appended at the end of this
    # ResourceSet to preserve the positional cosign-verify patch — see
    # d2-signalloom/test/fleet-patch-indexes.bats) is the ONLY identity that
    # can create/delete the netassert-run Job. It is bound to a dedicated
    # ServiceAccount held by netassert-controller
    # (d2-signalloom/apps/netassert-controller/), a separate, minimal
    # process whose entire HTTP surface is "(re)run the one fixed scan" —
    # see that app's server.py docstring for the full rationale. The proxy
    # reaches it over HTTP (POST /scan) instead of calling the Kubernetes
    # API itself, so compromising the proxy no longer yields a credential
    # capable of minting arbitrary Jobs.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: netassert-status-reader
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: netassert-status-reader
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: netassert-status-reader
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: inf-signalloom
    # netassert-runner is the Job's own identity (see
    # apps/fe-signalloom/base/netassert-runner-sa.yaml). fe-signalloom hosts
    # both SRC and DST pods across the NetSerts suite, so it needs the full
    # read set plus ephemeralcontainers patch — see the matching comment in
    # signalloom-infra above for the fe-signalloom-agents (SRC-only) and
    # inf-signalloom (DST-only, read-only) halves of this same grant.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: netassert-runner
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["", "apps"]
          resources: ["deployments", "statefulsets", "daemonsets", "pods"]
          verbs: ["get"]
        - apiGroups: ["", "apps"]
          resources: ["replicasets", "pods"]
          verbs: ["list"]
        - apiGroups: [""]
          resources: ["pods", "pods/ephemeralcontainers"]
          verbs: ["watch", "patch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: netassert-runner
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: netassert-runner
      subjects:
        - kind: ServiceAccount
          name: netassert-runner
          namespace: << inputs.tenant >>
    # netassert-scan-manager — the only identity in the system that can
    # create or delete the netassert-run Job. Bound to netassert-controller's
    # own ServiceAccount (inf-signalloom), never to fake-integration-proxy's.
    # get is needed for the existence/active check and the post-delete
    # polling loop before recreating; no list/watch is needed since the
    # controller only ever addresses this one fixed Job by name. Appended
    # here (end of the resources list) rather than inserted near the other
    # netassert grants above — see fleet-patch-indexes.bats.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: netassert-scan-manager
        namespace: << inputs.tenant >>
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "create", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: netassert-scan-manager
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: netassert-scan-manager
      subjects:
        - kind: ServiceAccount
          name: netassert-scan-manager
          namespace: inf-signalloom
