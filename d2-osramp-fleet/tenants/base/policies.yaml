apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: policies
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-allowlist
        namespace: flux-system
        labels:
          fluxcd.controlplane.io/role: "policy"
      data:
        sources: >-
          https://github.com/acme-co/
          oci://ghcr.io/acme-co/
          oci://zot.registry.svc.cluster.local:5000/
          https://nats-io.github.io/k8s/helm/charts/
          https://helm.elastic.co
          https://charts.redpanda.com
          https://grafana.github.io/helm-charts
          https://aquasecurity.github.io/helm-charts
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: "source.policy.fluxcd.controlplane.io"
        annotations:
          policy.fluxcd.controlplane.io/role: |
            Restrict Flux access to Git repositories, OCI registries and Helm repositories,
            based on an allowlist defined in a ConfigMap stored in the flux-system namespace.
      spec:
        failurePolicy: Fail
        matchConstraints:
          resourceRules:
            - apiGroups: [ "source.toolkit.fluxcd.io" ]
              apiVersions: [ "*" ]
              operations: [ "CREATE", "UPDATE" ]
              resources: [ "gitrepositories", "ocirepositories", "helmrepositories" ]
        matchConditions:
          - name: "exclude-source-controller-finalizer"
            expression: >
              request.userInfo.username != "system:serviceaccount:flux-system:source-controller"
        paramKind:
          apiVersion: v1
          kind: ConfigMap
        variables:
          - name: url
            expression: object.spec.url
          - name: sources
            expression: params.data.sources.split(' ')
        validations:
          - expression: >
              variables.sources.exists_one(prefix, variables.url.startsWith(prefix))
            messageExpression: >
              "Source " + variables.url + " is not allowed, must be one of " + variables.sources.join(", ")
            reason: Invalid
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: flux-tenant-sources
      spec:
        policyName: "source.policy.fluxcd.controlplane.io"
        validationActions: [ "Deny" ]
        paramRef:
          name: flux-allowlist
          namespace: flux-system
          parameterNotFoundAction: "Deny"
        matchResources:
          namespaceSelector:
            matchExpressions:
              - key: toolkit.fluxcd.io/role
                operator: In
                values:
                  - tenant
    # ── Agent Identity Binding ──────────────────────────────────────────────
    #
    # Binds a signalloom.ai/agent-name label value to the NAMESPACE and
    # ServiceAccount the real agent is registered to run as, and rejects any
    # pod CREATE/UPDATE, in ANY namespace, that claims a REGISTERED agent's
    # identity label while running in a different namespace or as a
    # different ServiceAccount.
    #
    # Why this exists: a pod's labels are written by whoever creates it.
    # hosted-daytona-coder (d2-signalloom/infra/agent-swarm/hosted-daytona-coder)
    # holds pod-create RBAC in fe-signalloom-agents, so without this policy
    # it could create a pod carrying signalloom.ai/agent-name=kusari-agent
    # (or any other registered agent's identity label) and have the warden,
    # fleet-manager's own resolution (d2-signalloom/apps/fleet-manager/
    # agent_resolution.go, k8sclient.go, mesh_client.go) or signal
    # attribution treat it as that agent. Both namespace and ServiceAccount
    # are required: a ServiceAccount name is only unique within its
    # namespace, so a decoy in a DIFFERENT namespace that names its own
    # ServiceAccount after a registered agent (e.g. hosted-daytona-coder's
    # own namespace running a ServiceAccount literally called
    # "kusari-agent") must not pass a check that compares the ServiceAccount
    # name alone.
    #
    # Why it lives HERE and not in d2-signalloom/apps/fleet-manager/base
    # (where it was first deployed, then moved): the `apps` Kustomization
    # for fe-signalloom is reconciled by the TENANT ServiceAccount
    # system:serviceaccount:fe-signalloom:flux, which has no RBAC to touch
    # cluster-scoped ValidatingAdmissionPolicy/-Binding objects -- and must
    # not be granted any, because a tenant that can edit admission policies
    # can disable its own guardrails. Putting this file in fleet-manager's
    # own Kustomization made the tenant's entire `apps` dry-run apply fail,
    # taking down everything else in that Kustomization with it (found on a
    # live deploy, 2026-10-07). This ResourceSet is reconciled by
    # flux-system (cluster-admin), the same way the
    # source.policy.fluxcd.controlplane.io policy above already is -- the
    # established pattern for any cluster-scoped policy in this fleet.
    #
    # Scope: matchResources is cluster-wide (no namespaceSelector) precisely
    # BECAUSE the spoof this guards against is cross-namespace --
    # restricting to fe-signalloom-agents would let a decoy in any OTHER
    # namespace with the right label win. spec.matchConditions keeps this
    # cheap and narrow in practice: the CEL only runs for pods that carry
    # signalloom.ai/agent-name at all, so an ordinary cluster-wide workload
    # with no such label is never evaluated. kube-system is NOT excluded:
    # nothing there carries that label, so matchConditions already excludes
    # it in effect, and adding a second, redundant exclusion would be an
    # unverified claim about what kube-system pods look like today,
    # maintained forever against a cluster this policy does not control.
    #
    # The mapping is this ValidatingAdmissionPolicy's own params object: the
    # fleet-config ConfigMap (d2-signalloom/apps/fleet-manager/base/
    # configmap.yaml, identity.<agent-name> / identity-ns.<agent-name> key
    # pairs) in namespace fe-signalloom -- the SAME ConfigMap fleet-manager
    # mounts at /etc/fleet and identity_map.go (LoadAgentIdentityMap) reads.
    # paramRef.namespace lets this cluster-scoped binding name a params
    # object in a tenant namespace regardless of its own matchResources
    # scope. One authored list; extending it to a new agent is two lines in
    # that ConfigMap and needs no change here.
    #
    # An unregistered agent-name value is unaffected (registered == false
    # admits unconditionally) -- this policy only ever narrows a spoof of a
    # KNOWN identity, it is never a second allow-list for which agents may
    # exist. parameterNotFoundAction: Deny -- a missing fleet-config
    # ConfigMap must not silently admit every spoof; combined with
    # matchConditions, a missing ConfigMap only denies pods that carry the
    # agent-name label at all.
    #
    # Pinned offline by d2-signalloom/apps/fleet-manager/
    # agent_identity_binding_vap_test.go (CEL evaluation against the policy
    # extracted from this file by metadata.name) and
    # test/agent-identity-binding-vap.bats (structural + render-location
    # proof). test/tenant-kustomizations-no-cluster-scoped-kinds.bats proves
    # no tenant-reconciled Kustomization path renders a cluster-scoped kind.
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: sl-agent-identity-binding
        annotations:
          policy.fluxcd.controlplane.io/role: |
            Bind a signalloom.ai/agent-name identity label to the registered
            agent's namespace and ServiceAccount, so a workload with
            pod-create RBAC in an agent namespace cannot spoof another
            agent's identity merely by copying its label.
        labels:
          app.kubernetes.io/part-of: signalloom
          app.kubernetes.io/component: admission-policy
          signalloom.ai/tier: agents
      spec:
        failurePolicy: Fail
        paramKind:
          apiVersion: v1
          kind: ConfigMap
        matchConstraints:
          resourceRules:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE", "UPDATE"]
              resources: ["pods"]
        matchConditions:
          - name: carries-agent-name-label
            expression: >-
              has(object.metadata.labels) && 'signalloom.ai/agent-name' in object.metadata.labels
        variables:
          - name: agentNameLabel
            expression: >-
              has(object.metadata.labels) && 'signalloom.ai/agent-name' in object.metadata.labels
                ? object.metadata.labels['signalloom.ai/agent-name']
                : ''
          - name: identityKey
            expression: "'identity.' + variables.agentNameLabel"
          - name: identityNsKey
            expression: "'identity-ns.' + variables.agentNameLabel"
          - name: registered
            expression: >-
              variables.agentNameLabel != '' && params != null && has(params.data) &&
              variables.identityKey in params.data && variables.identityNsKey in params.data
          - name: expectedServiceAccount
            expression: "variables.registered ? params.data[variables.identityKey] : ''"
          - name: expectedNamespace
            expression: "variables.registered ? params.data[variables.identityNsKey] : ''"
          - name: actualServiceAccount
            expression: >-
              has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : ''
          - name: actualNamespace
            expression: >-
              has(object.metadata.namespace) ? object.metadata.namespace : ''
        validations:
          - expression: >-
              !variables.registered ||
              (variables.expectedServiceAccount == variables.actualServiceAccount &&
               variables.expectedNamespace == variables.actualNamespace)
            messageExpression: >-
              "pod labelled signalloom.ai/agent-name=" + variables.agentNameLabel +
              " must run in namespace '" + variables.expectedNamespace +
              "' as the registered ServiceAccount '" + variables.expectedServiceAccount +
              "' for that agent; got namespace '" + variables.actualNamespace +
              "' and ServiceAccount '" + variables.actualServiceAccount +
              "' -- a label match alone is never proof of agent identity, and a " +
              "ServiceAccount name alone is only unique within its namespace"
            reason: Forbidden
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: sl-agent-identity-binding-binding
        labels:
          app.kubernetes.io/part-of: signalloom
          app.kubernetes.io/component: admission-policy
      spec:
        policyName: sl-agent-identity-binding
        validationActions: ["Deny"]
        paramRef:
          name: fleet-config
          namespace: fe-signalloom
          parameterNotFoundAction: Deny
        matchResources:
          objectSelector:
            matchExpressions:
              - key: signalloom.ai/agent-name
                operator: Exists
