# NetworkPolicy is reachability only; identity comes from SPIFFE and A2A authorization is receiver-owned.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: agent-trust-platform}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: agent-trust-tenant-acme-control}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
