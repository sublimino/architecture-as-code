---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-controller-role
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["agents", "agents/status", "modelconfigs", "modelconfigs/status", "mcpservers", "mcpservers/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/status", "services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-controller-binding
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-controller-role
subjects:
  - kind: ServiceAccount
    name: kagent-controller
    namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-reader-role
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: tool-server
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "kagent.dev"]
    resources: ["pods", "services", "deployments", "statefulsets", "daemonsets", "configmaps", "namespaces", "nodes", "events", "agents", "modelconfigs", "mcpservers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-reader-binding
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: tool-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-reader-role
subjects:
  - kind: ServiceAccount
    name: kagent-tool-server
    namespace: kagent
