# GENERATED by scripts/render-policy-bundles.sh from policy/bundles/ -- do not edit.
# Regenerate with: make policy-bundles-render
apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-engine-bundles
  labels:
    app.kubernetes.io/name: policy-engine
    app.kubernetes.io/part-of: signalloom
data:
  kusari--application-saas.yaml: |
    # The Kusari APPLICATION / SaaS threat bundle.
    #
    # This reads only the application_saas projection (collectors/workspacesaas,
    # model.LayerApplicationSaaS, Source "<provider>.audit"). Every rule source-gates
    # on the ".audit" suffix AND layer-gates on application_saas, so it never crosses
    # the SaaS LOGIN surface (same collector, same source suffix, but layer
    # identity_authorization) which identity-auth.yaml owns, and never reads the
    # spirea or OpenBao identity projections. See review H3.
    #
    # Mode is `shadow`: every rule emits and stores findings, nothing alerts.
    #
    # # What the rules may read
    #
    # collectors/workspacesaas ToObservation projects: provider, event_type, action,
    # resource_id, volume_bytes, item_count, client_ip, oauth_app_id, oauth_app_name,
    # oauth_scopes, risk_level, plus passthrough labels (this stream sets
    # sensitivity). obs.actor is the pseudonymised principal.
    #
    # # Binding corrections applied (docs/EAP "Adversarial-review corrections")
    #
    #   * Every rule source-gates on obs.source.endsWith(".audit") and layer-gates on
    #     obs.layer == "application_saas". "openbao-audit" ends "-audit", not
    #     ".audit", so the OpenBao identity projection is never read here.
    #   * Every label read is guarded with has().
    #   * These rules key on resource/action/scope attributes, not on actor identity,
    #     so there is no actor_vars set. sensitive_classes and admin_change_actions are
    #     attribute allowlists compared against labels. When an application_saas rule
    #     does need to key on identity, it must do so via obs.actor against an
    #     actor_var, exactly as identity-auth.yaml's saas-admin-role-grant does.
    #
    # # Fixtures
    #
    # collectors/workspacesaas/testdata/app. Every rule has a positive fixture that
    # fires it and a negative that does not. The per-rule expectation table lives in
    # d2-signalloom/apps/signal-ingest/e2e/saas_expectations.go and is asserted by
    # TestApplicationSaaSE2E_FixtureCorpusMatchesTheExpectationTable.
    
    id: kusari-application-saas
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    vars:
      # Document sensitivity classes that make an external share a finding. A share of
      # a public document is not.
      sensitive_classes:
        - "confidential"
        - "restricted"
    
      # Admin-console actions that mutate tenant configuration. A read/view of the
      # same console is not a change.
      admin_change_actions:
        - "setting_change"
        - "policy_change"
        - "security_setting_change"
    
    rules:
      # --- Mass file download ---------------------------------------------------
      - id: saas-mass-file-download
        name: Bulk file download / export above the item threshold
        severity: high
        # A volume-spike event whose item count crosses 100 (the contract's bulk
        # threshold, contract_doc.go). int() parses the projected numeric label; the
        # has() guard keeps it off any record without the label.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "application_saas" &&
          has(obs.labels.event_type) && obs.labels.event_type == "workspace_volume_spike" &&
          has(obs.labels.item_count) && int(obs.labels.item_count) >= 100
    
      # --- External share of a sensitive document -------------------------------
      - id: saas-external-sensitive-share
        name: External share of a sensitive document
        severity: high
        # A document-access event whose action is an external share and whose
        # sensitivity is in the sensitive set. An internal share, or an external share
        # of a public document, does not fire.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "application_saas" &&
          has(obs.labels.event_type) && obs.labels.event_type == "workspace_document_access" &&
          has(obs.labels.action) && obs.labels.action == "external_share" &&
          has(obs.labels.sensitivity) && obs.labels.sensitivity in vars.sensitive_classes
    
      # --- OAuth application grant with write scopes ----------------------------
      - id: saas-oauth-app-grant
        name: External OAuth application grant with read-write scopes
        severity: high
        # An external OAuth consent whose granted scopes include a ReadWrite scope.
        # oauth_scopes is projected as the Go slice rendering, so a substring test on
        # "ReadWrite" is the available signal; a read-only grant does not fire.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "application_saas" &&
          has(obs.labels.event_type) && obs.labels.event_type == "workspace_external_oauth_grant" &&
          has(obs.labels.oauth_scopes) && obs.labels.oauth_scopes.contains("ReadWrite")
    
      # --- Admin-console setting change -----------------------------------------
      - id: saas-admin-console-change
        name: Admin-console configuration change
        severity: high
        # An admin-privilege event whose action mutates tenant configuration. A read
        # of the same console (view_settings) does not fire.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "application_saas" &&
          has(obs.labels.event_type) && obs.labels.event_type == "workspace_admin_privilege" &&
          has(obs.labels.action) && obs.labels.action in vars.admin_change_actions
    
    windows:
      # Repeated bulk downloads by one principal in a short window is the shape of
      # staged data exfiltration rather than a single large export.
      - id: mass-download-burst
        over_rule: saas-mass-file-download
        key: [tenant_id, actor]
        window: 10m
        threshold: 3
        severity: high
  kusari--cloud-signals.yaml: |
    # The Kusari pilot cloud-signal bundle (SLAWS v2 §4, D2/D3/D6).
    #
    # Kusari runs Kubernetes workloads in AWS. kusari-iam-change.yaml covers the IAM
    # privilege path; this bundle covers the rest of the cloud surface the pilot
    # streams: the EKS control plane, console sign-in, cross-account role assumption,
    # S3 exposure, GuardDuty tampering, and egress that the network refused.
    #
    # Mode is `shadow`: every rule here emits and stores findings, nothing alerts and
    # nothing in the customer account is touched. Promotion to warn, then enforce, is
    # a reviewed commit that bumps `version`. Several rules below are deliberate
    # over-triggers at this granularity (noted per rule) and shadow is where that is
    # affordable.
    #
    # # What the rules may read
    #
    # Only the §2.3 label contract (collectors/awslogs/contract_doc.go) and
    # obs.actor. That is the whole of the vocabulary, and it is a tighter constraint
    # than it looks -- note in particular that obs.actor is a keyed pseudonym, so it
    # supports EQUALITY and membership only. Never startsWith, never a substring,
    # never any other read of its internal structure: there is none.
    #
    #   * additionalEventData is NOT projected, so MFA state is unavailable. The
    #     console rule therefore discriminates on the PRINCIPAL, not on MFA. See
    #     console-login-outside-allowlist.
    #   * requestParameters is NOT projected beyond the ResourceNameKeys scalar
    #     allowlist, so "did this policy actually make the bucket public" is
    #     unavailable. See s3-bucket-exposure-changed.
    #   * userIdentity.accountId is NOT projected under that name, and obs.actor is a
    #     keyed PSEUDONYM, so neither the acting account nor any other ARN component
    #     can be recovered from it. The §2.3 projection therefore carries
    #     actor_account_id, parsed from userIdentity.arn before pseudonymisation.
    #     See cross-account-assume-role.
    #
    # Extending the projection is not a projection-only change: store/label_allowlist.go
    # is a CLOSED key set and FrostDBStore.Append refuses an entire batch containing a
    # key outside it. So each limit above is a coordinated change across two packages,
    # and each is named in the rule that carries it rather than papered over.
    #
    # # Missing-key idiom
    #
    # Every label read is guarded with has(). Bare obs.labels.k on an absent key is a
    # CEL evaluation error, which the evaluator records as a fault and which would
    # degrade detection for the whole bundle on one unlabelled record (§4.1).
    #
    # # Rule disjointness
    #
    # One event produces at most one finding per concern, so the EKS rules are split
    # by what they grant (cluster configuration vs. Kubernetes RBAC) and each carries
    # its own rule_id and severity. Same principle as kusari-iam-change.yaml splitting
    # CreateAccessKey out of the privilege-change rule.
    #
    # # Fixtures
    #
    # Every rule has a positive fixture that fires it and a negative that does not,
    # under collectors/awslogs/testdata/kusari/. The per-rule expectation table lives
    # in d2-signalloom/apps/signal-ingest/e2e/expectations.go and is asserted by
    # `make test-kusari-e2e`. docs/EAP/kusari-e2e.md is the walkthrough.
    
    id: kusari-cloud-signals
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    # The vars that hold ACTOR IDENTITIES, rewritten at load through the same keyed
    # pseudonymiser obs.actor is rewritten with. See kusari-iam-change.yaml for the
    # full reasoning; the short version is that obs.actor is a pseudonym by the time
    # a rule evaluates, so a cleartext allowlist can never match it and every
    # NEGATIVE allowlist test below would become always-true.
    #
    # tenant_accounts is deliberately ABSENT: it holds AWS account numbers and is
    # compared against a label (obs.labels.aws_account_id), not against obs.actor.
    # Pseudonymising it would break that comparison in the opposite direction.
    actor_vars:
      - break_glass_actors
      - console_login_actors
      - cross_account_assume_role_actors
      - eks_cluster_admin_actors
    
    vars:
      # The AWS accounts that belong to this tenant. Used to decide whether a role
      # assumption crossed an account boundary. An empty list is rejected at load:
      # it would turn every AssumeRole in the estate into a non-finding, silently.
      tenant_accounts:
        - "123456789012"
        - "210987654321"
    
      # Identities permitted to make privilege and credential changes without
      # producing a finding. Shared in spirit with kusari-iam-change.yaml, declared
      # separately because a bundle's vars are its own and a cross-bundle reference
      # would make one file's promotion depend on another's contents.
      break_glass_actors:
        - "arn:aws:iam::123456789012:user/break-glass"
    
      # Identities expected to sign in to the console. Anything else -- notably the
      # account root, which is never on this list -- is a finding.
      console_login_actors:
        - "arn:aws:iam::123456789012:user/kusari-operator"
    
      # Foreign principals permitted to assume a role in a tenant account. The
      # partner CI role is here; an unknown partner identity is not.
      cross_account_assume_role_actors:
        - "arn:aws:iam::555544443333:role/kusari-ci-deploy"
    
      # Identities permitted to reconfigure the EKS control plane or grant
      # Kubernetes RBAC from IAM.
      eks_cluster_admin_actors:
        - "arn:aws:iam::123456789012:user/break-glass"
    
    rules:
      # --- EKS control plane ---------------------------------------------------
      - id: eks-cluster-config-changed
        name: EKS cluster configuration changed by a non-admin identity
        severity: high
        # Read-only EKS calls (DescribeCluster, ListClusters) are deliberately absent:
        # they are the bulk of EKS CloudTrail volume and carry no change.
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "eks.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name in [
            "UpdateClusterConfig", "UpdateClusterVersion", "AssociateEncryptionConfig",
            "CreateAddon", "UpdateAddon", "DeleteAddon", "DeleteCluster"
          ] &&
          !(obs.actor in vars.eks_cluster_admin_actors)
    
      - id: eks-access-entry-created
        name: Kubernetes RBAC granted from IAM by a non-admin identity
        severity: high
        # An access entry is the IAM-side grant of in-cluster RBAC, so this is the
        # one cloud event that directly changes who can act inside the cluster. It
        # is a separate rule from the config change so a promotion decision can
        # treat the two differently.
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "eks.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name in [
            "CreateAccessEntry", "UpdateAccessEntry", "AssociateAccessPolicy"
          ] &&
          !(obs.actor in vars.eks_cluster_admin_actors)
    
      # --- Console sign-in -----------------------------------------------------
      - id: console-login-outside-allowlist
        name: Console sign-in by an identity outside the allowlist
        severity: high
        # The discriminator is the principal, NOT the MFA state: MFAUsed lives in
        # additionalEventData, which the §2.3 projection does not carry (see the
        # header). The account root is never on the allowlist, so a root sign-in --
        # the case this rule exists for -- fires regardless.
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "signin.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name == "ConsoleLogin" &&
          !(obs.actor in vars.console_login_actors)
    
      # --- Cross-account role assumption ---------------------------------------
      - id: cross-account-assume-role
        name: Role assumed in a tenant account by a principal from another account
        severity: medium
        # obs.labels.aws_account_id is recipientAccountId: the account that RECEIVED
        # the call. obs.labels.actor_account_id is the account of the ACTING
        # principal, parsed from userIdentity.arn at projection time. Cross-account
        # is simply the two disagreeing.
        #
        # This rule used to recover the acting account inside CEL with
        # obs.actor.startsWith("arn:aws:iam::" + obs.labels.aws_account_id + ":"),
        # which read obs.actor as STRUCTURE. obs.actor is now a keyed pseudonym on
        # both the live and the replay path, so that structure is gone: both
        # startsWith calls evaluate false, both negations evaluate true, and the
        # same-account role chain in the fixture reads as cross-account. The account
        # is a label instead, which round-trips through a segment and therefore
        # through a replay. It also needs one comparison where the ARN needed two,
        # because an IAM principal and an already-assumed STS session differ only in
        # the prefix the label does not carry.
        #
        # has() guards both: a record with no userIdentity.arn (an AWS service
        # principal) carries no actor_account_id key at all, and must not read as
        # cross-account.
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "sts.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name == "AssumeRole" &&
          has(obs.labels.aws_account_id) &&
          obs.labels.aws_account_id in vars.tenant_accounts &&
          has(obs.labels.actor_account_id) &&
          obs.labels.actor_account_id != obs.labels.aws_account_id &&
          !(obs.actor in vars.cross_account_assume_role_actors)
    
      # --- S3 exposure ---------------------------------------------------------
      - id: s3-bucket-exposure-changed
        name: S3 bucket exposure control changed
        severity: high
        # A DELIBERATE OVER-TRIGGER. Whether the new policy grants public read is in
        # requestParameters.policy, which this projection must not read. So the rule
        # fires on the exposure-changing API surface rather than on a verdict. In a
        # regulated account these calls are rare and each is worth a look; the
        # alternative is a policy-document parser on the ingest hot path, fed
        # attacker-influenced JSON.
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "s3.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name in [
            "PutBucketPolicy", "DeleteBucketPolicy", "PutBucketAcl",
            "PutBucketPublicAccessBlock", "DeletePublicAccessBlock",
            "DeleteBucketPublicAccessBlock", "PutAccountPublicAccessBlock"
          ]
    
      # --- GuardDuty ------------------------------------------------------------
      - id: guardduty-detection-tampered
        name: GuardDuty detection suppressed, disabled or archived
        severity: critical
        # Critical rather than high: this is the only rule here whose subject is the
        # detection capability itself, so a true positive degrades every other
        # control in the account.
        #
        # SCOPE: these are GuardDuty MANAGEMENT calls, which is what GuardDuty
        # actually writes to CloudTrail. A GuardDuty FINDING arrives over
        # EventBridge in a different envelope and is not projectable today -- see
        # testdata/kusari/guardduty-eventbridge-envelope.json, which pins that as a
        # silent zero rather than leaving it to be found on the pilot.
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "guardduty.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name in [
            "DeleteDetector", "UpdateDetector", "CreateFilter", "UpdateFilter",
            "ArchiveFindings", "UpdateFindingsFeedback", "DeleteMembers",
            "DisassociateMembers", "DisableOrganizationAdminAccount",
            "StopMonitoringMembers", "DeletePublishingDestination"
          ]
    
      # --- IAM credentials and policy ------------------------------------------
      - id: iam-credential-or-policy-change
        name: IAM credential or policy change by a non-break-glass identity
        severity: high
        # Overlaps kusari-iam-change.yaml by design, and the overlap is not a
        # duplicate finding: Finding.ID hashes the bundle version, so the same event
        # produces one finding per bundle with distinct ids, distinct rule_ids, and
        # distinct windows. That is what lets the narrow IAM bundle be promoted to
        # warn on its own schedule while this broader one stays in shadow.
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "iam.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name in [
            "CreateAccessKey", "UpdateAccessKey", "AttachUserPolicy", "AttachRolePolicy",
            "AttachGroupPolicy", "PutUserPolicy", "PutRolePolicy", "PutGroupPolicy",
            "CreatePolicyVersion", "SetDefaultPolicyVersion",
            "CreateLoginProfile", "UpdateLoginProfile"
          ] &&
          !(obs.actor in vars.break_glass_actors)
    
      # --- Network egress -------------------------------------------------------
      - id: vpc-egress-rejected
        name: VPC Flow Log rejected an egress flow
        severity: low
        # One REJECT is noise, which is why severity is low and the signal that
        # matters is the stage-2 window below. The layer guard is what keeps this
        # rule off control-plane records, whose event_name is an API name.
        expression: |-
          obs.layer == "network_egress" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name == "REJECT"
    
    windows:
      # Stage 2 is declared here, never in CEL (§3, D2, D3). A decision fires on the
      # EDGE -- when an arriving finding takes the counter from below the threshold to
      # at or above it -- and the window is anchored on the ARRIVING finding's
      # timestamp, never on wall-clock, so a replay of an S3 backlog reproduces live.
    
      - id: iam-change-burst-10m
        over_rule: iam-credential-or-policy-change
        key: [tenant_id, actor]
        window: 10m
        threshold: 3
        severity: high
    
      - id: cross-account-assume-role-burst-30m
        over_rule: cross-account-assume-role
        key: [tenant_id, actor]
        window: 30m
        threshold: 2
        severity: high
    
      - id: vpc-reject-burst-5m
        over_rule: vpc-egress-rejected
        key: [tenant_id, "labels.source_ip"]
        window: 5m
        threshold: 20
        severity: medium
        # This window keys on a SOURCE-OBSERVATION label, which used to be a known
        # limit: a stored finding carried only the closed policy label set, so
        # source_ip was absent at warm-up. The effect was worse than the
        # "over-counts across addresses" originally recorded here -- every warmed
        # finding landed in a counter keyed `source_ip=`, which no live finding can
        # ever join, so warm-up contributed NOTHING and a restart MISSED the burst
        # it was warmed to catch. policy/convert.go now carries each window's keyed
        # label values onto the stored finding, and
        # TestWindows_WarmCollapsesWithoutTheKeyedLabels pins the old behaviour as
        # the mutation.
        #
        # It is keyed on source_ip because a window keyed on tenant alone cannot
        # distinguish one host scanning from twenty hosts each retrying once, which
        # is the entire question.
  kusari--endpoint-runtime.yaml: |
    # The Kusari endpoint-runtime threat bundle (Sentinel eBPF syscall stream).
    #
    # This reads the sentinel eBPF endpoint signal on model.LayerEndpointHost from
    # TWO producers that now share ONE aligned label contract (classification,
    # syscall, target):
    #   * the collector projection (collectors/ebpf ProjectEndpoint, Source
    #     "sentinel.ebpf.syscall_trace"), and
    #   * the LIVE stun-sentinel wire (apps/stun-sentinel/pkg/correlator/ingest.go
    #     toIngest, Source "stun-sentinel"), which now derives the same
    #     classification label from its syscall value.
    # Every rule source-gates on the union of those two sources, so it reads both
    # endpoint streams but never crosses the OTHER endpoint_host stream on the same
    # layer — the agent-nono Landlock evidence (Source "agent-nono-evidenced"),
    # whose landlock-denial rule gates on verification_status. Neither endpoint
    # syscall stream carries verification_status, and these rules gate on sources
    # "sentinel.ebpf.syscall_trace" / "stun-sentinel", so the endpoint_host streams
    # share a layer and never a rule.
    #
    # Mode is `shadow`: every rule emits and stores findings, nothing alerts, nothing
    # in the cluster is touched. Promotion to warn/enforce is a reviewed commit that
    # bumps `version`.
    #
    # # What the rules may read
    #
    # Only the sentinel eBPF endpoint label contract (collectors/ebpf/endpoint.go
    # ProjectEndpoint): classification, syscall, target, pod_name, namespace, node,
    # agent_role, service_account, pod_uid, provider, direction — plus obs.actor,
    # which is the keyed PSEUDONYM of the acting workload's service account (via
    # ActorHint) and supports EQUALITY and membership only.
    #
    # # Binding corrections applied (docs/EAP "Adversarial-review corrections")
    #
    #   * Every rule gates on the union
    #     (obs.source == "sentinel.ebpf.syscall_trace" || obs.source == "stun-sentinel"):
    #     the endpoint_host layer carries more than one projection, so the source gate
    #     is mandatory to stay off the agent-nono Landlock stream, and the union admits
    #     both the collector projection and the aligned live-sentinel wire.
    #   * Every label read is guarded with has(): a syscall event may carry a target
    #     or not (a file access does, a bare ptrace kprobe does not), so a bare read
    #     of an absent key would be a CEL fault degrading the whole bundle.
    #   * Identity is obs.actor against an actor_vars set, NEVER a label. The acting
    #     service account reaches obs.actor via ActorHint, pseudonymised at the store
    #     and at bundle load with the same key, so a cleartext allowlist would never
    #     match and every negative test would be vacuously true. Conform refuses a
    #     rule comparing obs.actor against a var absent from actor_vars.
    #
    # # Fixtures
    #
    # Every rule has positives and a negative under collectors/ebpf/endpoint_testdata/,
    # one detection class per file. The per-rule expectation table lives in
    # d2-signalloom/apps/signal-ingest/e2e/endpoint_expectations.go and is asserted
    # exactly by TestEndpointE2E_FixtureCorpusMatchesTheExpectationTable.
    
    id: kusari-endpoint-runtime
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    # Actor-identity sets, rewritten at load through the same keyed pseudonymiser
    # obs.actor is rewritten with. Conform refuses a rule comparing obs.actor against
    # a var absent from this list.
    actor_vars:
      - allowed_exec_actors
    
    vars:
      # Service accounts permitted to exec a new process without producing a finding.
      # A workload whose job is to run subprocesses lives here; an agent that should
      # only make API calls does not, so its exec is the signal. obs.actor is a
      # pseudonym, so the test is membership, never a string match.
      allowed_exec_actors:
        - "agent-trusted-sa"
    
      # Files whose open is high-signal on their own: credential stores and the
      # service-account token a workload could steal to impersonate itself elsewhere.
      sensitive_files:
        - "/etc/shadow"
        - "/etc/passwd"
        - "/root/.ssh/authorized_keys"
        - "/var/run/secrets/kubernetes.io/serviceaccount/token"
    
      # Syscalls that are high-signal regardless of actor: ptrace (process injection /
      # debugger attach) and the kernel capability check (privilege use). Both the
      # bare symbol and the x86_64 syscall-wrapper name are listed because the
      # normaliser carries whichever the kprobe was attached under.
      sensitive_syscalls:
        - "ptrace"
        - "__x64_sys_ptrace"
        - "cap_capable"
        - "capable"
    
    rules:
      # --- Sensitive-file open --------------------------------------------------
      - id: sensitive-file-open
        name: Open of a credential store or the service-account token
        severity: high
        # A file_access whose target is a credential store. target is the file the
        # workload opened; the sensitive set is a var, membership-tested.
        expression: |-
          (obs.source == "sentinel.ebpf.syscall_trace" || obs.source == "stun-sentinel") &&
          obs.layer == "endpoint_host" &&
          has(obs.labels.classification) && obs.labels.classification == "file_access" &&
          has(obs.labels.target) && obs.labels.target in vars.sensitive_files
    
      # --- Unexpected execve (identity-scoped) ----------------------------------
      - id: unexpected-execve
        name: Process exec by a workload not permitted to exec
        severity: high
        # An execve by a service account outside the allow-list. This is the one
        # identity-scoped rule: obs.actor is the pseudonymised service account, tested
        # against the actor_vars set, never a cleartext label.
        expression: |-
          (obs.source == "sentinel.ebpf.syscall_trace" || obs.source == "stun-sentinel") &&
          obs.layer == "endpoint_host" &&
          has(obs.labels.classification) && obs.labels.classification == "process_exec" &&
          !(obs.actor in vars.allowed_exec_actors)
    
      # --- Capability use / ptrace ----------------------------------------------
      - id: capability-or-ptrace
        name: ptrace or a kernel capability check
        severity: high
        # ptrace is process injection / debugger attach; cap_capable is the kernel
        # privilege-check hook. Both are high-signal host-runtime primitives, gated on
        # the syscall discriminator against a var set, independent of actor.
        # NOTE: this rule is collector-projection-only in practice until the live
        # stun-sentinel probes ptrace/capability syscalls — its only syscall values
        # today are openat, execve, evasive_syscall_burst and tcp_connect, none in
        # vars.sensitive_syscalls. The source gate still admits "stun-sentinel" so the
        # rule fires automatically once the sentinel grows those probes.
        expression: |-
          (obs.source == "sentinel.ebpf.syscall_trace" || obs.source == "stun-sentinel") &&
          obs.layer == "endpoint_host" &&
          has(obs.labels.syscall) && obs.labels.syscall in vars.sensitive_syscalls
    
    windows:
      # Stage 2 is declared here, never in CEL. A decision fires on the EDGE — when an
      # arriving finding takes the counter from below the threshold to at or above it —
      # anchored on the ARRIVING finding's timestamp, so a replay reproduces live.
    
      # One workload opening several credential stores in a short window is the shape
      # of credential sweeping, which a single open is not. Keyed on the actor
      # pseudonym, so it is per-workload-identity.
      - id: sensitive-file-open-burst
        over_rule: sensitive-file-open
        key: [tenant_id, actor]
        window: 5m
        threshold: 3
        severity: high
  kusari--gcp-admin.yaml: |
    # The Kusari GCP Cloud Audit admin-activity threat bundle.
    #
    # This stream reads only the gcpaudit projection (Source "gcp-cloud-audit",
    # model.LayerCloudControlPlane). Every rule gates on both source and layer
    # because the cloud_control_plane layer is shared by awslogs; without the source
    # gate an AWS event with a similar method label could cross-fire here.
    #
    # Identity is obs.actor through actor_vars, never a label. The GCP principal
    # email is routed through ActorHint and pseudonymised into obs.actor by the store
    # and bundle loader; principal_email must not be projected as a label. Therefore
    # identity tests are equality/membership only: `!(obs.actor in vars.X)`, never
    # startsWith/endsWith or any string parsing on obs.actor.
    #
    # Every label read is guarded with has(). A bare read of an absent label is a CEL
    # fault per observation and degrades the whole bundle.
    #
    # The bucket IAM rule is a deliberate over-trigger on the method surface:
    # allUsers/allAuthenticated lives in the request body, which this projection does
    # not read. The rule fires on storage.setIamPermissions and lets review decide
    # whether later streams add request-body nuance.
    
    id: kusari-gcp-admin
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    actor_vars:
      - iam_admins
      - sa_key_minters
      - storage_admins
      - logging_admins
    
    vars:
      # Break-glass IAM administrators permitted to change project IAM policy.
      iam_admins:
        - "iam-admin@controlplane.io"
    
      # Automation permitted to mint service-account keys.
      sa_key_minters:
        - "sa-key-bot@controlplane.io"
    
      # Storage administrators permitted to edit bucket IAM permissions.
      storage_admins:
        - "storage-admin@controlplane.io"
    
      # Logging administrators permitted to delete sinks.
      logging_admins:
        - "logging-admin@controlplane.io"
    
    rules:
      - id: iam-policy-binding-change
        name: IAM policy binding changed outside the admin allow-list
        severity: critical
        expression: |-
          obs.source == "gcp-cloud-audit" &&
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.method_name) && obs.labels.method_name.endsWith("SetIamPolicy") &&
          !(obs.actor in vars.iam_admins)
    
      - id: service-account-key-create
        name: Service-account key created outside the minter allow-list
        severity: high
        expression: |-
          obs.source == "gcp-cloud-audit" &&
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.method_name) && obs.labels.method_name.endsWith("CreateServiceAccountKey") &&
          !(obs.actor in vars.sa_key_minters)
    
      - id: bucket-iam-made-public
        name: Storage bucket IAM permissions changed outside the admin allow-list
        severity: high
        # DELIBERATE OVER-TRIGGER: public allUsers/allAuthenticated nuance is in the
        # request body; this projection sees the storage SetIamPermissions surface.
        expression: |-
          obs.source == "gcp-cloud-audit" &&
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.service_name) && obs.labels.service_name == "storage.googleapis.com" &&
          has(obs.labels.method_name) && obs.labels.method_name == "storage.setIamPermissions" &&
          !(obs.actor in vars.storage_admins)
    
      - id: logging-sink-delete
        name: Logging sink deleted outside the admin allow-list
        severity: high
        expression: |-
          obs.source == "gcp-cloud-audit" &&
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.service_name) && obs.labels.service_name == "logging.googleapis.com" &&
          has(obs.labels.method_name) && obs.labels.method_name.endsWith("DeleteSink") &&
          !(obs.actor in vars.logging_admins)
  kusari--iam-change.yaml: |
    # SLAWS first observation-policy bundle (proposal §4.2, §4.4, D6).
    #
    # Bundles are versioned files, Flux-reconciled into a ConfigMap and loaded at
    # boot by policy-engine from POLICY_BUNDLES_DIR. They are not registered over
    # the API: `POST /api/v1/policies/bundles` is a dry-run surface only and never
    # joins the boot-loaded set.
    #
    # Mode is `shadow`: findings are emitted and stored, nothing is warned on and
    # nothing is enforced. Promotion to warn, then enforce, is a reviewed commit
    # that bumps `version`.
    #
    # Two deviations from the proposal §4.2 sample, both deliberate:
    #
    #  1. Label access is guarded with `has(...)`. Bare `obs.labels.k` on an absent
    #     key is a CEL evaluation error, which this evaluator records as an
    #     evaluator fault. §4.1 makes `has()` the binding missing-key idiom, so an
    #     unlabelled CloudTrail record is a clean false here, not a fault.
    #  2. §4.2 lists `CreateAccessKey` inside the privilege-change rule. It is split
    #     into its own rule instead, so access-key creation carries its own rule_id
    #     and its own severity rather than being counted as a policy mutation. The
    #     two rules are therefore disjoint and one event produces one finding.
    #
    # Label keys are the binding contract in §2.3.
    
    id: kusari-iam-change
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    # The vars that hold ACTOR IDENTITIES. Each is rewritten at load through the
    # same keyed pseudonymiser obs.actor is rewritten with, because obs.actor is a
    # pseudonym by the time a rule evaluates and a cleartext list could never match
    # it. Omitting an entry here is a LOAD-TIME REFUSAL, not a silent miss: Conform
    # rejects any rule comparing obs.actor against a var absent from this list.
    # Without that gate the list would stay cleartext, `obs.actor in vars.X` would
    # never be true, and `!(obs.actor in vars.X)` would be always-true -- so the
    # break-glass identity would produce a finding on every record, identically on
    # the live and the replay path.
    actor_vars:
      - break_glass_actors
    
    vars:
      # Identities permitted to make privilege changes. Anything outside this list
      # making an IAM policy change is a finding. An empty list is rejected at load:
      # it would silently turn every break-glass action into a finding.
      break_glass_actors:
        - "arn:aws:iam::123456789012:user/break-glass"
    
    rules:
      - id: iam-priv-change
        name: IAM privilege change by a non-break-glass identity
        severity: high
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "iam.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name in ["CreatePolicyVersion", "AttachUserPolicy", "PutUserPolicy"] &&
          !(obs.actor in vars.break_glass_actors)
    
      - id: access-key-created
        name: Long-lived access key created by a non-break-glass identity
        severity: high
        expression: |-
          obs.layer == "cloud_control_plane" &&
          has(obs.labels.event_source) &&
          obs.labels.event_source == "iam.amazonaws.com" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name == "CreateAccessKey" &&
          !(obs.actor in vars.break_glass_actors)
    
      - id: vpc-reject
        name: VPC Flow Log rejected an egress flow
        severity: low
        expression: |-
          obs.layer == "network_egress" &&
          has(obs.labels.event_name) &&
          obs.labels.event_name == "REJECT"
    
    windows:
      # Stage 2 is declared here, never in CEL. A single IAM change is a finding;
      # three by the same actor inside ten minutes is a decision.
      - id: iam-change-burst
        over_rule: iam-priv-change
        key: [tenant_id, actor]
        window: 10m
        threshold: 3
        severity: high
  kusari--identity-auth.yaml: |
    # The Kusari IDENTITY & AUTHORIZATION threat bundle.
    #
    # The identity_authorization layer carries THREE projections that share a layer
    # but nothing else: SPIRE SVID issuance (collectors/spirea, Source "spire-agent"),
    # OpenBao audit (collectors/baoaudit, Source "openbao-audit", untouched here), and
    # SaaS login/authentication (collectors/workspacesaas, Source "<provider>.audit",
    # layer overridden to identity_authorization for login events). Every rule in this
    # bundle therefore source-gates so a spirea rule never reads a SaaS record and a
    # SaaS rule never reads a spirea or OpenBao record. See review H3.
    #
    #   * spirea rules gate obs.source == "spire-agent".
    #   * SaaS rules gate obs.source.endsWith(".audit"), which matches
    #     "<provider>.audit" and never "openbao-audit" (that ends "-audit", not
    #     ".audit"), plus obs.layer == "identity_authorization" so the SaaS login
    #     surface is read here and the application_saas surface (same collector, same
    #     source suffix) is left to application-saas.yaml.
    #
    # Mode is `shadow`: every rule emits and stores findings, nothing alerts.
    #
    # # What the rules may read
    #
    # spirea projection (collectors/spirea/collector.go convertToObservation):
    #   event_type ("spire_svid_issuance"), spiffe_id, trust_domain, svid_type,
    #   ttl_seconds, and optionally pod_name/namespace/service_account/sa_principal/
    #   node_name/serial_number/jwt_id/attestation_selector_type. obs.actor is the
    #   pseudonymised SPIFFE ID.
    # SaaS login projection (collectors/workspacesaas ToObservation + passthrough
    #   labels): provider, event_type, action, client_ip, risk_level, plus the
    #   passthrough labels this stream sets — mfa, geo, risk_reason, role_granted.
    #   obs.actor is the pseudonymised principal (primary email / UPN).
    #
    # # Binding corrections applied (docs/EAP "Adversarial-review corrections")
    #
    #   * Identity is obs.actor against an actor_vars set, NEVER a label. The SPIFFE
    #     ID and the SaaS principal reach obs.actor via ActorHint, pseudonymised at
    #     the store and at bundle load with the same key, so a cleartext allowlist
    #     would never match and every negative test would be vacuously true. Only
    #     allowed_spiffe_issuers and saas_privileged_grantors are identity sets, so
    #     only they are listed in actor_vars. trusted_domains and known_login_geos are
    #     attribute allowlists (trust domain, geography), compared against labels, not
    #     against the actor, so they stay cleartext.
    #   * Every label read is guarded with has(): a bare read of an absent key is a
    #     CEL fault that would degrade the whole bundle on one unlabelled record.
    #   * Every rule source-gates (and the SaaS rules additionally layer-gate), so a
    #     rule only ever reads the projection it was written for.
    #
    # # Attestation downgrade (collector gap now closed)
    #
    # The spirea collector now projects attestation_selector_type — the sorted,
    # distinct set of the SVID selectors' TYPE prefixes (k8s, unix, docker,
    # join_token, aws_iid, ...), joined with "+", and ONLY the type, never the
    # selector value. That classifies HOW the workload was attested without emitting a
    # workload identifier, so svid-attestation-downgrade can fire on a real downgrade:
    # an SVID attested by a type outside the required set (a `unix`-only SVID, uid/gid
    # forgeable in a shared PID namespace, where the estate requires `k8s`
    # API-server-verified pod identity). The event carries no separate attestation
    # "method" field, so none is projected; the selector type is the faithful signal
    # the source genuinely has. svid-foreign-trust-domain is KEPT alongside it: the
    # trust domain is the attestation-ROOT anomaly (a foreign federation) and the
    # selector type is the attestation-STRENGTH anomaly; they are different signals.
    #
    # # Fixtures
    #
    # collectors/spirea/testdata (spirea) and collectors/workspacesaas/testdata/login
    # (SaaS). Every rule has a positive fixture that fires it and a negative that does
    # not. The per-rule expectation table lives in
    # d2-signalloom/apps/signal-ingest/e2e/identity_expectations.go and is asserted by
    # TestIdentityAuthE2E_FixtureCorpusMatchesTheExpectationTable.
    
    id: kusari-identity-auth
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    # Actor-identity sets, rewritten at load through the same keyed pseudonymiser
    # obs.actor is rewritten with. Conform refuses a rule comparing obs.actor against
    # a var absent from this list.
    actor_vars:
      - allowed_spiffe_issuers
      - saas_privileged_grantors
    
    vars:
      # Full SPIFFE IDs an SVID is expected to be minted for. An issuance to any other
      # principal is the signal (a workload identity that should not exist, or one
      # minted on an unexpected path).
      allowed_spiffe_issuers:
        - "spiffe://kusari.dev/ns/tenant-demo/sa/agent-runner"
        - "spiffe://kusari.dev/ns/signalloom/sa/fleet-manager"
    
      # Trust domains the federation accepts. An SVID minted under any other trust
      # domain is a foreign/attestation-root anomaly. This is an attribute allowlist,
      # not an identity one, so it is NOT an actor_var.
      trusted_domains:
        - "kusari.dev"
    
      # Geographies logins are normally seen from. A login from any other geography is
      # a new-geo signal. Attribute allowlist, not an identity one.
      known_login_geos:
        - "GB"
        - "US"
    
      # SaaS principals sanctioned to grant admin roles. A grant by anyone else is the
      # signal. This IS an identity set, so it is an actor_var.
      saas_privileged_grantors:
        - "admin@corp.internal"
    
      # SPIRE attestor TYPES the estate requires a workload SVID to be attested under.
      # attestation_selector_type is the sorted "+"-joined set of the SVID selectors'
      # type prefixes; an SVID whose projected type is outside this set was attested by
      # a weaker path (attestation downgrade). This is an attribute allowlist (attestor
      # family), not an identity one, so it is NOT an actor_var. k8s is the
      # API-server-verified pod-identity attestor the Kusari demo workloads use.
      required_attestors:
        - "k8s"
    
    rules:
      # --- SPIRE: SVID minted for an unexpected principal -----------------------
      - id: svid-issued-unexpected-principal
        name: SPIRE SVID issued to a SPIFFE ID outside the expected set
        severity: high
        # The "unexpected SPIFFE path" signal. obs.actor is the pseudonymised SPIFFE
        # ID; membership against the pseudonymised allowlist is the only identity test
        # available and the only one that stays correct under pseudonymisation.
        expression: |-
          obs.source == "spire-agent" &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.event_type) && obs.labels.event_type == "spire_svid_issuance" &&
          !(obs.actor in vars.allowed_spiffe_issuers)
    
      # --- SPIRE: SVID minted under a foreign trust domain ----------------------
      - id: svid-foreign-trust-domain
        name: SPIRE SVID issued under a trust domain outside the federation
        severity: high
        # Stands in for attestation downgrade: the collector does not project SPIRE
        # selectors, so the attestation-root (trust domain) is the strongest available
        # signal. trust_domain is an attribute label, not the actor identity.
        expression: |-
          obs.source == "spire-agent" &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.event_type) && obs.labels.event_type == "spire_svid_issuance" &&
          has(obs.labels.trust_domain) &&
          !(obs.labels.trust_domain in vars.trusted_domains)
    
      # --- SPIRE: SVID attested under a weaker-than-required path ----------------
      - id: svid-attestation-downgrade
        name: SPIRE SVID issued under an attestor type outside the required set
        severity: high
        # The attestation-strength anomaly, distinct from svid-foreign-trust-domain
        # (attestation ROOT). attestation_selector_type is the sorted "+"-joined set of
        # the SVID selectors' type prefixes, projected by the collector from
        # event.Selectors; an "+"-joined set outside required_attestors means at least
        # one required attestor is missing (a `unix`-only SVID where `k8s` is required).
        # attestation_selector_type is an attribute label, not the actor identity, and
        # the has() guard skips selector-less records so the rule never faults on the
        # SVIDs that carry no attestation evidence.
        expression: |-
          obs.source == "spire-agent" &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.event_type) && obs.labels.event_type == "spire_svid_issuance" &&
          has(obs.labels.attestation_selector_type) &&
          !(obs.labels.attestation_selector_type in vars.required_attestors)
    
      # --- SaaS login: impossible travel ----------------------------------------
      - id: saas-login-impossible-travel
        name: SaaS login flagged as impossible travel
        severity: high
        # The provider (or a prior correlation) reports the login as impossible
        # travel. risk_reason is a projected passthrough label on the login event.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.risk_reason) && obs.labels.risk_reason == "impossible_travel"
    
      # --- SaaS login: new geography --------------------------------------------
      - id: saas-login-new-geo
        name: SaaS login from a geography outside the known set
        severity: medium
        # A login from a geography not previously seen for the estate. geo is an
        # attribute label; known_login_geos is an attribute allowlist.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.action) && obs.labels.action == "login" &&
          has(obs.labels.geo) &&
          !(obs.labels.geo in vars.known_login_geos)
    
      # --- SaaS login: MFA absent -----------------------------------------------
      - id: saas-login-mfa-absent
        name: SaaS login completed without MFA
        severity: high
        # A completed login whose MFA state is absent. Only login actions carry an mfa
        # state, so the rule scopes to action == "login" as well as the mfa label.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.action) && obs.labels.action == "login" &&
          has(obs.labels.mfa) && obs.labels.mfa == "absent"
    
      # --- SaaS: admin role granted by an unsanctioned principal ----------------
      - id: saas-admin-role-grant
        name: SaaS admin role granted by a principal outside the sanctioned set
        severity: critical
        # An admin-role grant is a privilege escalation; the signal is the grant being
        # performed by a principal not sanctioned to do so. Identity is obs.actor
        # against the pseudonymised grantor allowlist.
        expression: |-
          obs.source.endsWith(".audit") &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.action) && obs.labels.action == "admin_role_grant" &&
          !(obs.actor in vars.saas_privileged_grantors)
    
    windows:
      # Stage 2 is declared here, never in CEL. A decision fires on the EDGE — when an
      # arriving finding takes the counter from below the threshold to at or above it.
    
      # Repeated MFA-absent logins by one principal in a short window is the shape of
      # credential replay / stuffing rather than a single mis-prompted login.
      - id: mfa-absent-login-burst
        over_rule: saas-login-mfa-absent
        key: [tenant_id, actor]
        window: 10m
        threshold: 3
        severity: high
  kusari--k8s-audit.yaml: |
    # The Kusari Kubernetes kube-apiserver AUDIT threat bundle (reference vertical).
    #
    # This is the NEW k8s threat stream. It reads only the k8saudit-kube projection
    # (collectors/k8saudit, model.LayerKubernetes, Source "k8saudit-kube") and every
    # rule source-gates on it, so it never crosses the EXISTING identity-auth
    # k8saudit projection (api/audit, LayerIdentityAuth, Source "k8s-apiserver-audit")
    # which tracks delegation and is untouched. See collectors/k8saudit/contract_doc.go.
    #
    # Mode is `shadow`: every rule emits and stores findings, nothing alerts, nothing
    # in the cluster is touched. Promotion to warn/enforce is a reviewed commit that
    # bumps `version`.
    #
    # # What the rules may read
    #
    # Only the k8s label contract (collectors/k8saudit/contract_doc.go): verb,
    # resource, subresource, resource_kind, api_group, api_version, namespace, name,
    # decision, response_code, source_ip, audit_id, stage, reason, user_agent — plus
    # obs.actor, which is a keyed PSEUDONYM and so supports EQUALITY and membership
    # only (never startsWith / substring; it has no internal structure to read).
    #
    # # Binding corrections applied (docs/EAP "Adversarial-review corrections")
    #
    #   * Every rule gates on obs.source == "k8saudit-kube": LayerKubernetes could in
    #     principle carry more than one projection, so the source gate is mandatory.
    #   * Every rule requires stage == "ResponseComplete". The apiserver emits up to
    #     four stages per request; without this a single request double-counts across
    #     its stages. The projection emits all stages deliberately so this control is
    #     visible here and mutation-testable.
    #   * Identity is obs.actor against an actor_vars set, NEVER a label. The k8s user
    #     or service account reaches obs.actor via ActorHint, pseudonymised at the
    #     store and at bundle load with the same key, so a cleartext allowlist would
    #     never match and every negative test would be vacuously true. Anonymous is a
    #     pseudonymised actor_vars set (system:anonymous / system:unauthenticated),
    #     not a string match.
    #   * Every label read is guarded with has(): a bare read of an absent key is a
    #     CEL fault that would degrade the whole bundle on one unlabelled record.
    #
    # # Missing from the contract on purpose
    #
    # Pod security context (privileged, hostPath, hostPID, hostNetwork, hostIPC,
    # runAsUser, added capabilities) is NOT projected — it is the request body, not
    # an audit label, and admitting it would need allow-list keys this vertical does
    # not add. So privileged-pod-create fires on the pod-CREATE surface, a deliberate
    # over-trigger in the same spirit as awslogs' s3-bucket-exposure-changed. Reading
    # the spec is an admission-webhook source, a separate stream.
    #
    # # Fixtures
    #
    # Every rule has a positive fixture that fires it and a negative that does not,
    # under collectors/k8saudit/testdata/. The per-rule expectation table lives in
    # d2-signalloom/apps/signal-ingest/e2e/k8saudit_expectations.go and is asserted
    # by TestK8sAuditE2E_FixtureCorpusMatchesTheExpectationTable.
    
    id: kusari-k8s-audit
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    # Actor-identity sets, rewritten at load through the same keyed pseudonymiser
    # obs.actor is rewritten with. A var holding actors that is NOT named here would
    # keep its cleartext values, so `obs.actor in vars.X` could never be true and
    # every negative allowlist test would become always-true — the one inversion the
    # replay oracle cannot see. Conform refuses a rule comparing obs.actor against a
    # var absent from this list.
    actor_vars:
      - allowed_secret_readers
      - system_controllers
      - anonymous_principals
    
    vars:
      # Service accounts permitted to read secrets without producing a finding. A
      # controller that legitimately reads a token lives here; a human or workload
      # that should not does not.
      allowed_secret_readers:
        - "system:serviceaccount:kube-system:secret-reader"
    
      # Controllers permitted to mint service-account tokens. The kube-controller-
      # manager and the token controllers mint tokens constantly; a human or a
      # workload minting one is the signal.
      system_controllers:
        - "system:serviceaccount:kube-system:token-cleaner"
        - "system:serviceaccount:kube-system:generic-garbage-collector"
        - "system:kube-controller-manager"
    
      # The anonymous principals. A verb these actors were ALLOWED to perform is the
      # finding (anonymous-allowed); a forbidden one is the authorizer doing its job.
      anonymous_principals:
        - "system:anonymous"
        - "system:unauthenticated"
    
    rules:
      # --- Interactive access to a running workload -----------------------------
      - id: pods-exec-attach
        name: Interactive exec/attach/ephemeralcontainers into a pod
        severity: high
        # The classic interactive-shell-in-a-pod path. ephemeralcontainers is the
        # debug-container variant of the same capability.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "pods" &&
          has(obs.labels.subresource) &&
          obs.labels.subresource in ["exec", "attach", "ephemeralcontainers"]
    
      # --- Secret reads outside an allow-list -----------------------------------
      - id: secrets-read-outside-allowlist
        name: Secret get/list by a principal outside the allow-list
        severity: high
        # get and list only; watch is deliberately absent — informers watch secrets
        # constantly and would bury the signal. The allow-list is obs.actor, a
        # pseudonym, so the test is membership, never a string match.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "secrets" &&
          has(obs.labels.verb) && obs.labels.verb in ["get", "list"] &&
          !(obs.actor in vars.allowed_secret_readers)
    
      # --- Secret writes --------------------------------------------------------
      - id: secrets-write
        name: Secret create or update
        severity: medium
        # Writing a secret is a smaller set of events than reading one and is worth a
        # look in a regulated namespace regardless of actor, so there is no allow-list
        # here — promotion decides whether to narrow it.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "secrets" &&
          has(obs.labels.verb) && obs.labels.verb in ["create", "update"]
    
      # --- Pod create (privileged surface) --------------------------------------
      - id: privileged-pod-create
        name: Pod created (privileged/hostPath/hostPID surface)
        severity: high
        # A DELIBERATE OVER-TRIGGER. The security context that would make this a
        # privileged pod is in the request body, which this projection must not read
        # (see the bundle header). So the rule fires on the pod-CREATE surface, not on
        # a privileged verdict. The subresource guard keeps exec/attach/portforward
        # (which are also verb=create on pods) out of this rule — those are their own.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "pods" &&
          has(obs.labels.verb) && obs.labels.verb == "create" &&
          !has(obs.labels.subresource)
    
      # --- RBAC escalation ------------------------------------------------------
      - id: rbac-escalation
        name: RBAC binding created/patched or an escalation verb used
        severity: critical
        # Two shapes of the same concern: creating/patching a role binding (granting
        # privilege), and the escalation verbs themselves (bind/escalate/impersonate).
        # Critical because a true positive grants the actor more than they had.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          (
            (has(obs.labels.resource) &&
             obs.labels.resource in ["clusterrolebindings", "rolebindings"] &&
             has(obs.labels.verb) && obs.labels.verb in ["create", "update", "patch"])
            ||
            (has(obs.labels.verb) && obs.labels.verb in ["bind", "escalate", "impersonate"])
          )
    
      # --- Service-account token minting ----------------------------------------
      - id: serviceaccount-token-create
        name: Service-account token minted outside a system controller
        severity: high
        # serviceaccounts/token create is explicit token minting. The system
        # controllers that do it routinely are allow-listed via obs.actor; anyone else
        # is the signal (the account-takeover token-mint step).
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "serviceaccounts" &&
          has(obs.labels.subresource) && obs.labels.subresource == "token" &&
          has(obs.labels.verb) && obs.labels.verb == "create" &&
          !(obs.actor in vars.system_controllers)
    
      # --- Certificate signing request create + approve -------------------------
      - id: csr-create-approve
        name: CertificateSigningRequest created or approved
        severity: high
        # A create of a CSR, or an update of its approval subresource. Together these
        # are the cluster-credential-minting path through the certificates API.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "certificatesigningrequests" &&
          (
            (has(obs.labels.verb) && obs.labels.verb == "create")
            ||
            (has(obs.labels.subresource) && obs.labels.subresource == "approval")
          )
    
      # --- Admission webhook configuration create -------------------------------
      - id: webhookconfig-create
        name: Validating/Mutating webhook configuration created
        severity: high
        # A mutating or validating webhook config is cluster-wide interception of the
        # admission path; creating one is a high-leverage persistence/tamper primitive.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) &&
          obs.labels.resource in ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"] &&
          has(obs.labels.verb) && obs.labels.verb == "create"
    
      # --- Node proxy -----------------------------------------------------------
      - id: nodes-proxy
        name: nodes/proxy access
        severity: high
        # nodes/proxy reaches the kubelet API directly, bypassing the apiserver's
        # resource authorization on what runs on the node.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "nodes" &&
          has(obs.labels.subresource) && obs.labels.subresource == "proxy"
    
      # --- Pod port-forward -----------------------------------------------------
      - id: pods-portforward
        name: pods/portforward tunnel to a workload
        severity: medium
        # A port-forward is a tunnel from the operator's host straight to a pod port,
        # outside the cluster's network policy.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          has(obs.labels.resource) && obs.labels.resource == "pods" &&
          has(obs.labels.subresource) && obs.labels.subresource == "portforward"
    
      # --- Anonymous allowed ----------------------------------------------------
      - id: anonymous-allowed
        name: Verb by an anonymous principal that the authorizer ALLOWED
        severity: critical
        # system:anonymous / system:unauthenticated being ALLOWED a verb is almost
        # always a misconfigured RBAC binding to system:unauthenticated. decision is a
        # label; the actor is the pseudonymised anonymous set.
        expression: |-
          obs.source == "k8saudit-kube" &&
          obs.layer == "kubernetes" &&
          has(obs.labels.stage) && obs.labels.stage == "ResponseComplete" &&
          obs.actor in vars.anonymous_principals &&
          has(obs.labels.decision) && obs.labels.decision == "allow"
    
    windows:
      # Stage 2 is declared here, never in CEL. A decision fires on the EDGE — when an
      # arriving finding takes the counter from below the threshold to at or above it
      # — anchored on the ARRIVING finding's timestamp, so a replay reproduces live.
    
      # Repeated interactive access by one principal in a short window is the shape of
      # hands-on-keyboard activity rather than a single debugging session.
      - id: exec-burst
        over_rule: pods-exec-attach
        key: [tenant_id, actor]
        window: 5m
        threshold: 3
        severity: high
    
      # A principal reading many secrets quickly is credential sweeping, which one
      # read is not.
      - id: secret-read-burst
        over_rule: secrets-read-outside-allowlist
        key: [tenant_id, actor]
        window: 5m
        threshold: 3
        severity: high
  kusari--landlock-denial.yaml: |
    # Kusari verified Landlock denial containment policy.
    #
    # Mode is `shadow`: the stage-1 rule can ship without enabling the mode-gated
    # webhook alerter. Stage 2 still produces and stores its decision, and the
    # dedicated decision-to-stun dispatcher routes that decision to containment.
    #
    # The collector emits verification_status as uppercase `VERIFIED`, while the
    # original policy specification used lowercase `verified`. The explicit OR
    # accepts both producer and specification values without relying on optional
    # CEL string extensions.
    
    id: kusari-landlock-denial
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    rules:
      - id: landlock-verified-denial
        name: Verified in-kernel Landlock denial
        severity: high
        expression: |-
          obs.layer == "endpoint_host" &&
          has(obs.labels.verification_status) &&
          (obs.labels.verification_status == "verified" || obs.labels.verification_status == "VERIFIED") &&
          has(obs.labels.denial_reason) &&
          obs.labels.denial_reason != ""
    
    windows:
      # A single VERIFIED in-kernel Landlock denial is already high-signal, so the
      # first finding triggers containment. The five-minute per-tenant, per-agent
      # window debounces a burst from one agent down to one decision.
      - id: landlock-denial-burst
        over_rule: landlock-verified-denial
        key: [tenant_id, labels.agent_id]
        window: 5m
        threshold: 1
        severity: high
  kusari--network-egress.yaml: |
    # The Kusari live network-egress threat bundle (netebpf / stun-sentinel stream).
    #
    # This reads only the netebpf socket-trace projection (collectors/netebpf,
    # model.LayerNetworkEgress, Source "sentinel.ebpf.socket_trace") and every rule
    # source-gates on it, so it never crosses the OTHER network_egress projection on
    # the same layer — the awslogs VPC Flow Log stream (Source "aws:vpcflow"), whose
    # vpc-egress-rejected / vpc-reject rules gate on event_name == "REJECT". A netebpf
    # observation carries no event_name, so those rules cannot fire on it and these
    # rules cannot fire on a VPC Flow record; the two streams share a layer and never
    # a rule.
    #
    # Mode is `shadow`: every rule emits and stores findings, nothing alerts, nothing
    # in the cluster is touched. Promotion to warn/enforce is a reviewed commit that
    # bumps `version`.
    #
    # # What the rules may read
    #
    # Only the netebpf label contract (collectors/netebpf/collector.go flowToObservation):
    # source_ip, dst_ip, src_port, dst_port, bytes, classification, pod_uid,
    # service_account, agent_role, provider, spiffe_id, pod_name, namespace, and the
    # collector-side qname_entropy_bucket (the entropy class of the resolved DNS name's
    # leftmost label — never the name itself). The gap projection (Source
    # "sentinel.ebpf.gap_detector") carries type/node/gap_* and is deliberately not
    # read here: a telemetry gap is a coverage signal, not an egress finding.
    #
    # # Binding corrections applied (docs/EAP "Adversarial-review corrections")
    #
    #   * Every rule gates on obs.source == "sentinel.ebpf.socket_trace": the
    #     network_egress layer carries more than one projection, so the source gate is
    #     mandatory to stay off the VPC Flow stream.
    #   * Every label read is guarded with has(): a bare read of an absent key is a CEL
    #     fault that would degrade the whole bundle on one unlabelled record.
    #   * Destination novelty and the in-cluster resolver set are expressed as plain
    #     `vars` lists compared against the dst_ip label — NOT actor_vars. Identity is
    #     not the axis here, so there is no obs.actor comparison and no actor_vars; the
    #     windows key on the service_account label, a workload-topology scalar.
    #
    # # Fixtures
    #
    # Every rule has positives and a negative under collectors/netebpf/testdata/, one
    # detection class per file. The per-rule expectation table lives in
    # d2-signalloom/apps/signal-ingest/e2e/netegress_expectations.go and is asserted
    # exactly by TestNetEgressE2E_FixtureCorpusMatchesTheExpectationTable.
    
    id: kusari-network-egress
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    vars:
      # The in-cluster DNS resolver service addresses. A DNS query (dst_port 53) to
      # one of these is normal; a query to anything else is a workload talking to a
      # resolver outside the cluster, which is the off-cluster-resolver signal.
      cluster_resolvers:
        - "10.96.0.10"
    
      # Destinations a workload is expected to reach. A network_connect to a dst_ip
      # NOT in this set is egress to an unexpected destination. This is a plain label
      # allow-list (dst_ip is topology), never an actor comparison, so it needs no
      # actor_vars entry.
      expected_destinations:
        - "10.96.0.10"
        - "203.0.113.5"
        - "203.0.113.6"
        - "203.0.113.7"
        - "8.8.8.8"
        - "1.1.1.1"
    
    rules:
      # --- Direct-IP egress (no resolved domain) --------------------------------
      - id: direct-ip-egress
        name: Egress connection to a bare IP with no resolved DNS name
        severity: medium
        # A workload connecting straight to an IP with no preceding DNS resolution is
        # the shape of hard-coded C2 / an IP literal in config. qname_entropy_bucket
        # is "none" exactly when the collector saw no domain for the flow, which is
        # how "no name was resolved" is told apart from "a low-entropy name was".
        expression: |-
          obs.source == "sentinel.ebpf.socket_trace" &&
          obs.layer == "network_egress" &&
          has(obs.labels.classification) && obs.labels.classification == "network_connect" &&
          has(obs.labels.qname_entropy_bucket) && obs.labels.qname_entropy_bucket == "none"
    
      # --- Off-cluster resolver -------------------------------------------------
      - id: off-cluster-resolver
        name: DNS query to a resolver outside the cluster
        severity: medium
        # A workload sending DNS (dst_port 53) to a resolver that is not the cluster
        # resolver bypasses cluster DNS policy and is a common exfiltration / evasion
        # primitive. The cluster resolver set is a var, compared against dst_ip.
        expression: |-
          obs.source == "sentinel.ebpf.socket_trace" &&
          obs.layer == "network_egress" &&
          has(obs.labels.dst_port) && obs.labels.dst_port == "53" &&
          has(obs.labels.dst_ip) && !(obs.labels.dst_ip in vars.cluster_resolvers)
    
      # --- Egress to an unexpected destination ----------------------------------
      - id: unexpected-destination
        name: Egress connection to a destination outside the expected set
        severity: medium
        # A connect to a dst_ip that is not in the expected-destination allow-list.
        # Deliberately gated on classification == network_connect so a DNS query to an
        # off-cluster resolver (its own rule) does not also count here.
        expression: |-
          obs.source == "sentinel.ebpf.socket_trace" &&
          obs.layer == "network_egress" &&
          has(obs.labels.classification) && obs.labels.classification == "network_connect" &&
          has(obs.labels.dst_ip) && !(obs.labels.dst_ip in vars.expected_destinations)
    
      # --- DNS tunnel -----------------------------------------------------------
      - id: dns-tunnel
        name: High-entropy DNS query name (tunnelling)
        severity: high
        # A high-entropy leftmost DNS label is the signature of data tunnelled over
        # DNS (base32/base64/hex of ciphertext). Entropy is bucketed collector-side
        # (review M5) so the signal survives into an immutable segment without the
        # cleartext name. "high" is the top bucket; "medium"/"low" are normal names.
        expression: |-
          obs.source == "sentinel.ebpf.socket_trace" &&
          obs.layer == "network_egress" &&
          has(obs.labels.qname_entropy_bucket) && obs.labels.qname_entropy_bucket == "high"
    
    windows:
      # Stage 2 is declared here, never in CEL. A decision fires on the EDGE — when an
      # arriving finding takes the counter from below the threshold to at or above it —
      # anchored on the ARRIVING finding's timestamp, so a replay reproduces live.
    
      # One workload repeatedly connecting straight to bare IPs in a short window is
      # the shape of beaconing, which a single direct-IP connection is not. Keyed on
      # the service_account label (workload topology), not an actor pseudonym.
      - id: direct-ip-egress-burst
        over_rule: direct-ip-egress
        key: [tenant_id, "labels.service_account"]
        window: 5m
        threshold: 3
        severity: high
  kusari--openbao-audit.yaml: |
    # The Kusari OpenBao AUDIT threat bundle.
    #
    # This bundle reads only the OpenBao audit projection (collectors/baoaudit,
    # model.LayerIdentityAuth, Source "openbao-audit"). LayerIdentityAuth is shared
    # with the existing Kubernetes delegation projection, so every rule source-gates
    # on "openbao-audit" as well as the identity_authorization layer.
    #
    # Mode is `shadow`: every rule emits and stores findings, nothing alerts, nothing
    # in the cluster is touched. Promotion to warn/enforce is a reviewed commit that
    # bumps `version`.
    #
    # # What the rules may read
    #
    # Only the OpenBao projection labels: operation, accessor, role, path,
    # mount_point, event_type, namespace, service_account, spiffe_id, tenant_id —
    # plus obs.actor, which is a keyed PSEUDONYM and so supports EQUALITY and
    # membership only (never startsWith / substring; it has no internal structure to
    # read).
    #
    # # Binding corrections applied
    #
    #   * Every rule gates on obs.source == "openbao-audit": LayerIdentityAuth also
    #     carries the Kubernetes delegation projection, so the source gate is
    #     mandatory.
    #   * Identity is obs.actor against an actor_vars set, NEVER a label. The OpenBao
    #     SPIFFE ID, service account, role, or accessor reaches obs.actor via
    #     ActorHint, pseudonymised at the store and at bundle load with the same key.
    #   * root-token-use is a membership-is-the-signal rule: role:root being the
    #     actor is the detection, like anonymous-allowed in the k8s audit vertical.
    #   * Every label read is guarded with has(): a bare read of an absent key is a
    #     CEL fault that would degrade the whole bundle on one unlabelled record.
    #
    # # Missing from the contract on purpose
    #
    # Token policy breadth is in the request body, not in the projected labels. So
    # token-create-broad fires on the token-mint surface, a deliberate over-trigger
    # in the same spirit as k8s-audit privileged-pod-create. Reading policy breadth
    # is a richer OpenBao request-body projection, not this stream.
    #
    # # Fixtures
    #
    # Every rule has a positive fixture that fires it and a negative that does not,
    # under collectors/baoaudit/testdata/. The per-rule expectation table lives in
    # d2-signalloom/apps/signal-ingest/e2e/baoaudit_expectations.go and is asserted
    # by TestBaoAuditE2E_FixtureCorpusMatchesTheExpectationTable.
    
    id: kusari-openbao-audit
    tenant_id: kusari
    version: 1.0.0
    mode: shadow
    
    actor_vars:
      - root_principals
      - secret_read_automation
      - platform_admins
      - token_minters
    
    vars:
      # The OpenBao root token role. Use of this role is the signal, not an allow-list exception.
      root_principals:
        - "role:root"
    
      # Automation allowed to read KV secrets as part of synchronisation.
      secret_read_automation:
        - "spiffe://cluster.local/ns/kube-system/sa/secret-syncer"
    
      # Platform operators allowed to manage policies, mounts, and auth backends.
      platform_admins:
        - "spiffe://cluster.local/ns/kube-system/sa/platform-admin"
    
      # Controllers allowed to mint OpenBao tokens routinely.
      token_minters:
        - "spiffe://cluster.local/ns/kube-system/sa/token-minter"
    
    rules:
      # --- Root token use -------------------------------------------------------
      - id: root-token-use
        name: OpenBao root token use
        severity: critical
        # Membership is the signal: a root principal touching OpenBao is what the
        # rule records, independent of the specific operation.
        expression: |-
          obs.source == "openbao-audit" &&
          obs.layer == "identity_authorization" &&
          obs.actor in vars.root_principals
    
      # --- Secret reads outside automation -------------------------------------
      - id: secret-read
        name: OpenBao secret read outside automation
        severity: high
        # Stage 1 for the burst: a single read is a finding, repeated reads by one
        # actor become a stage-2 decision.
        expression: |-
          obs.source == "openbao-audit" &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.operation) && obs.labels.operation == "read" &&
          has(obs.labels.mount_point) && obs.labels.mount_point == "secret" &&
          !(obs.actor in vars.secret_read_automation)
    
      # --- Policy, mount, or auth backend changes ------------------------------
      - id: policy-or-mount-change
        name: OpenBao policy, mount, or auth backend changed outside platform admins
        severity: high
        # These sys paths are OpenBao's privilege-shaping surface. Platform admins
        # are allow-listed via obs.actor; everyone else is the signal.
        expression: |-
          obs.source == "openbao-audit" &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.mount_point) && obs.labels.mount_point == "sys" &&
          has(obs.labels.path) &&
          (obs.labels.path.startsWith("sys/policies/") ||
           obs.labels.path.startsWith("sys/mounts/") ||
           obs.labels.path.startsWith("sys/auth/")) &&
          has(obs.labels.operation) && obs.labels.operation in ["create", "update", "delete"] &&
          !(obs.actor in vars.platform_admins)
    
      # --- Token minting --------------------------------------------------------
      - id: token-create-broad
        name: OpenBao token minted outside token-minter automation
        severity: high
        # A DELIBERATE OVER-TRIGGER. The token policy breadth is in the request body,
        # which this projection does not read, so the rule fires on token creation.
        expression: |-
          obs.source == "openbao-audit" &&
          obs.layer == "identity_authorization" &&
          has(obs.labels.mount_point) && obs.labels.mount_point == "auth" &&
          has(obs.labels.path) && obs.labels.path.startsWith("auth/token/create") &&
          has(obs.labels.operation) && obs.labels.operation in ["create", "update"] &&
          !(obs.actor in vars.token_minters)
    
    windows:
      # A principal reading several secrets quickly is credential sweeping, which one
      # read is not.
      - id: secret-read-burst
        over_rule: secret-read
        key: [tenant_id, actor]
        window: 5m
        threshold: 3
        severity: high
