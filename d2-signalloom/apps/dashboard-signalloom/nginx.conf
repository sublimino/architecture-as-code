server {
  listen 8080;
  server_name _;
  resolver 10.96.0.10 valid=30s;
  root /usr/share/nginx/html;
  index index.html;

  # This server is always reached through the gateway on an external scheme and
  # port (https://dashboard.osramp.acme.local:30754), never on its own
  # http://…:8080. nginx builds absolute redirects from its OWN listen port and
  # scheme, so any redirect it generates would send the browser to
  # http://…:8080/… — a URL that does not exist off-cluster, giving
  # ERR_CONNECTION_REFUSED. Relative redirects carry no scheme or port, so they
  # stay on whatever origin the client actually used.
  absolute_redirect off;
  port_in_redirect off;

  # INVARIANT: no proxy prefix below may shadow a client-side route registered
  # in src/App.tsx. nginx matches proxy locations before `location /` reaches
  # try_files, so a prefix sharing a name with a SPA route means that page can
  # never render — the request is proxied to an API instead. API prefixes are
  # therefore namespaced under /api/ where no SPA route lives.
  # Enforced by d2-signalloom/test/dashboard-route-collisions.bats.

  location = /readyz {
    default_type text/plain;
    return 200 "ready";
  }

  location /dex/ {
    set $dex http://dex.inf-signalloom.svc.cluster.local:5556;
    proxy_pass $dex$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # KubeSec-AFM: proxy the full dashboard and all its assets.
  # AFM serves at /dashboard/ with Next.js assets at /dashboard/_next/.
  # The iframe in Signal Loom loads /dashboard/ directly (same-origin proxy).
  location /dashboard/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AFM API routes — used by the /afm/ prefix (Signal Loom native) and by
  # the iframed AFM frontend (which calls /clusters, /metrics, /health, /jobs
  # relative to the origin when it detects it's not on port 8000).
  location /afm/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    rewrite ^/afm(/.*) $1 break;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AFM API paths called by the iframed frontend (same-origin, no prefix).
  location /clusters {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /metrics/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /jobs {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhooks/ {
    set $afm http://afm-platform.fe-k8s-afm.svc.cluster.local:8000;
    proxy_pass $afm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api http://fe-signalloom-api.fe-signalloom.svc.cluster.local:8000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SuperCred demo: agent discovery, compliance + stun endpoints served by
  # fake-integration-proxy.
  #
  # This block used to be `location /supercred/`, which shared a name with the
  # `/supercred` SPA route in App.tsx: any redirect that added a trailing slash
  # landed the browser in this proxy instead of the React page, so the page
  # could not render at all.
  #
  # NOT /api/supercred/, despite that reading more naturally. The gateway's
  # signalloom-api HTTPRoute matches PathPrefix /api and sends it to
  # fe-signalloom-api — a longer prefix than the dashboard's own `/` route, so
  # anything under /api never reaches this nginx at all. A distinct root-level
  # prefix is the only split that is unambiguous at BOTH the gateway and here.
  # Enforced by d2-signalloom/test/dashboard-route-collisions.bats.
  location /supercred-api/ {
    set $proxy http://fake-integration-proxy.inf-signalloom.svc.cluster.local:8080;
    rewrite ^/supercred-api(/.*) $1 break;
    proxy_pass $proxy;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
