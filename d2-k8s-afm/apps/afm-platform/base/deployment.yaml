# Single-process production topology: FastAPI control plane + Z3 BMC engine
# + Next.js dashboard (static export served at /dashboard). Port 8000.
# No database — uses SQLite for job storage + in-memory cluster store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afm-platform
  namespace: fe-k8s-afm
  labels:
    app.kubernetes.io/name: afm-platform
    app.kubernetes.io/part-of: k8s-afm
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: afm-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: afm-platform
        app.kubernetes.io/part-of: k8s-afm
        app.kubernetes.io/component: platform
    spec:
      containers:
        - name: afm
          image: kubesec-afm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KUBESEC_DATA_DIR
              value: /app/data
            - name: KUBESEC_SAMPLES_DIR
              value: /app/backend/samples/clusters
            - name: KUBESEC_FRONTEND_DIST
              value: /app/frontend/out
            # Bounds CONCURRENT JOBS (the JobRunner ProcessPool) — it does NOT
            # bound the solver pool forked inside a single job. The collusion
            # phase of an escalation analysis sizes its own pool from
            # `mp.cpu_count()`, which reports the host's core count because it
            # does not read the cgroup CPU quota; on a 24-core host that forks
            # 24 Z3 processes into the 512Mi limit below and the pod is
            # OOMKilled, taking the in-memory cluster store with it.
            # Until that is fixed upstream in kubesec-afm, callers must pass
            # `{"check_pairs": false}` to POST /clusters/{id}/analysis/escalation
            # (see d2-k8s-afm/test/afm-live.bats). Raising the memory limit is
            # not a fix — the pool scales with host cores, not with the limit.
            - name: KUBESEC_MAX_WORKERS
              value: "1"
            # Open CORS for potential cross-D2 access from Signal Loom.
            - name: KUBESEC_CORS_ALLOW_ORIGIN_REGEX
              value: ".*"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
