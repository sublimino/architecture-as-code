apiVersion: v1
kind: Namespace
metadata: {name: agent-trust-platform, labels: {agent-trust.signalloom.io/boundary: platform, agent-trust.signalloom.io/platform: signalloom}}
---
apiVersion: v1
kind: Namespace
metadata: {name: agent-trust-tenant-acme-control, labels: {agent-trust.signalloom.io/boundary: tenant-control, agent-trust.signalloom.io/tenant: acme}}
---
apiVersion: v1
kind: Namespace
metadata: {name: agent-trust-tenant-northstar-control, labels: {agent-trust.signalloom.io/boundary: tenant-control, agent-trust.signalloom.io/tenant: northstar}}
---
apiVersion: v1
kind: Namespace
metadata: {name: agent-trust-acme-payments, labels: {agent-trust.signalloom.io/boundary: project, agent-trust.signalloom.io/tenant: acme, agent-trust.signalloom.io/project: payments}}
---
apiVersion: v1
kind: Namespace
metadata: {name: agent-trust-acme-risk, labels: {agent-trust.signalloom.io/boundary: project, agent-trust.signalloom.io/tenant: acme, agent-trust.signalloom.io/project: risk}}
---
apiVersion: v1
kind: Namespace
metadata: {name: agent-trust-northstar-investigations, labels: {agent-trust.signalloom.io/boundary: project, agent-trust.signalloom.io/tenant: northstar, agent-trust.signalloom.io/project: investigations}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-trust-planner, namespace: agent-trust-acme-payments}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-trust-triage, namespace: agent-trust-acme-payments}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-trust-risk-reader, namespace: agent-trust-acme-risk}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-trust-investigator, namespace: agent-trust-northstar-investigations}
---
apiVersion: v1
kind: Service
metadata: {name: agent-trust-triage, namespace: agent-trust-acme-payments}
spec: {selector: {app.kubernetes.io/name: agent-trust-triage}, ports: [{name: a2a, protocol: TCP, port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-trust-planner, namespace: agent-trust-acme-payments, labels: {app.kubernetes.io/name: agent-trust-planner, agent-trust.signalloom.io/runtime: "authenticated-a2a"}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: agent-trust-planner}}
  template:
    metadata: {labels: {app.kubernetes.io/name: agent-trust-planner, agent-trust.signalloom.io/runtime: "authenticated-a2a"}}
    spec:
      serviceAccountName: agent-trust-planner
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: planner
          image: signalloom-spire-helper:local
          imagePullPolicy: Never
          command: ["sh", "-c", "sleep 3600"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: spire-sockets, mountPath: /run/spire/sockets, readOnly: true}
            - {name: a2a-private, mountPath: /run/agent-trust, readOnly: true}
      volumes:
        - {name: spire-sockets, hostPath: {path: /run/spire/sockets, type: Directory}}
        - {name: a2a-private, secret: {secretName: agent-trust-a2a-private, defaultMode: 288}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-trust-risk-reader, namespace: agent-trust-acme-risk, labels: {app.kubernetes.io/name: agent-trust-risk-reader, agent-trust.signalloom.io/scaffold: "true"}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: agent-trust-risk-reader}}
  template:
    metadata: {labels: {app.kubernetes.io/name: agent-trust-risk-reader}}
    spec:
      serviceAccountName: agent-trust-risk-reader
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers: [{name: risk-reader, image: busybox:1.36, command: ["sh", "-c", "sleep 3600"], securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-trust-investigator, namespace: agent-trust-northstar-investigations, labels: {app.kubernetes.io/name: agent-trust-investigator, agent-trust.signalloom.io/scaffold: "true"}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: agent-trust-investigator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: agent-trust-investigator}}
    spec:
      serviceAccountName: agent-trust-investigator
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers: [{name: investigator, image: busybox:1.36, command: ["sh", "-c", "sleep 3600"], securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-trust-triage, namespace: agent-trust-acme-payments, labels: {app.kubernetes.io/name: agent-trust-triage, agent-trust.signalloom.io/runtime: "authenticated-a2a"}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: agent-trust-triage}}
  template:
    metadata: {labels: {app.kubernetes.io/name: agent-trust-triage, agent-trust.signalloom.io/runtime: "authenticated-a2a"}}
    spec:
      serviceAccountName: agent-trust-triage
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: triage
          image: signalloom-spire-helper:local
          imagePullPolicy: Never
          args: ["serve-a2a", "-address", "http://openbao.inf-bao.svc.cluster.local:8200", "-role", "agent-trust-planner", "-expected-subject", "spiffe://signalloom.demo/platform/signalloom/tenant/acme/project/payments/agent/planner"]
          ports: [{name: a2a, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /readyz, port: a2a}, initialDelaySeconds: 1, periodSeconds: 2, failureThreshold: 3}
          volumeMounts:
            - {name: spire-sockets, mountPath: /run/spire/sockets, readOnly: true}
            - {name: a2a-public, mountPath: /run/agent-trust, readOnly: true}
      volumes:
        - {name: spire-sockets, hostPath: {path: /run/spire/sockets, type: Directory}}
        - {name: a2a-public, configMap: {name: agent-trust-a2a-public, defaultMode: 292}}
