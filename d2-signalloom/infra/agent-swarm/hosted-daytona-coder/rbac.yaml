# The workspace manager needs RBAC to create/delete pods in the agents
# namespace for provisioning devcontainer workspaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hosted-daytona-coder
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: hosted-daytona-coder
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: signalloom
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hosted-daytona-coder
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: hosted-daytona-coder
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: signalloom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hosted-daytona-coder
subjects:
  - kind: ServiceAccount
    name: hosted-daytona-coder
    namespace: fe-signalloom-agents
