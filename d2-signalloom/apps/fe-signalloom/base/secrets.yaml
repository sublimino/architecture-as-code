# Demo-only credentials. Production secrets and external credential providers are
# deliberately out of scope for this TRL 2 Kind baseline.
apiVersion: v1
kind: Secret
metadata:
  name: discovery-portal-database
type: Opaque
# The Postgres credential (DATABASE_URL, POSTGRES_USER, POSTGRES_PASSWORD) is
# NOT here: scripts/postgres-superuser-secret.sh writes it to
# discovery-portal-database-credentials from the minted superuser password.
# IDENTITY_ENCRYPTION_KEY below is still a plaintext manifest value; see
# docs/signalloom/security-architecture-todos.md.
stringData:
  IDENTITY_ENCRYPTION_KEY: "01234567890123456789012345678901"
---
apiVersion: v1
kind: Secret
metadata:
  name: discovery-portal-storage
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: minio
  S3_SECRET_ACCESS_KEY: minio123
