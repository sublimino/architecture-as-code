# SuperCred demo agent — DELIBERATELY non-compliant.
#
# This agent pod is intentionally deployed WITHOUT a pod-level securityContext,
# without runAsNonRoot, and without capabilities drop. The compliance scan
# (demo step 3) discovers these gaps and marks the agent out-of-policy.
# The stun flow then revokes its OpenBao credentials and restricts it.
#
# Do NOT "fix" the missing securityContext — it is the demo's plot point.
apiVersion: v1
kind: Pod
metadata:
  name: agent-cardvault
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: signalloom-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: signalloom
    app.kubernetes.io/managed-by: signalloom-governor
    app.kubernetes.io/instance: cardvault
    signalloom.ai/agent: "true"
    signalloom.ai/agent-name: cardvault
    signalloom.ai/agent-type: supercred-demo
    signalloom.ai/framework: custom
    signalloom.ai/model: gpt-4o
    # signalloom.ai/state is DELIBERATELY NOT DECLARED HERE.
    #
    # It is runtime state, written by the stun path (supercred-demo.sh step 4
    # and the proxy's stun handler) and read by the dashboard
    # (fake-integration-proxy/server.py -> api/supercredState.ts). Declaring it
    # as a literal put it inside Flux's desired state, so an imperative change
    # to `stunned` was drift and the next reconcile of fe-signalloom/apps
    # reverted it to `idle` — measured, not theorised.
    #
    # The consequence was split-brain: credential revocation lives outside the
    # reconciled set and persisted, while the EVIDENCE of it was reverted, so
    # the dashboard reported a still-revoked agent as healthy. Mid-demo, with
    # an audience watching a second window, the agent flips back to idle while
    # the presenter explains it has been contained.
    #
    # kustomize-controller v1.9.4 exposes no per-field drift ignore
    # (.spec.driftDetection is absent from the CRD; .spec.ignore is source
    # paths, not fields), so the only correct fix is to not declare a
    # runtime-owned field in desired state at all.
    #
    # test/flux-dynamic-labels.bats enforces this. Do not re-add it.
    signalloom.ai/supercred: "true"
  annotations:
    signalloom.ai/agent-display-name: "Cardvault Agent"
    signalloom.ai/model-full: "openai/gpt-4o"
    signalloom.ai/description: "SuperCred demo — accesses credit card data via SPIFFE→OpenBao→BasicAuth chain."
    signalloom.ai/supercred-target: "cardvault.inf-signalloom.svc.cluster.local:8080"
spec:
  # NOTE: pod-level securityContext is INTENTIONALLY ABSENT.
  # The compliance scan checks for this and correctly flags it.
  containers:
    - name: agent
      image: ghcr.io/stefanprodan/podinfo:6.7.1
      ports:
        - name: http
          containerPort: 9898
      # NOTE: container-level securityContext is INTENTIONALLY ABSENT.
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
  volumes:
    - name: tmp
      emptyDir: {}
