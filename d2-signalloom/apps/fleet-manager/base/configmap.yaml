apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-config
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
data:
  fleet.yaml: |
    # ── aggregateRisk: AUTHORED DEMO DATA, NOT A COMPUTED FIGURE ──────────────
    #
    # The dashboard renders these as currency on the Fleet page, so they need to
    # be right in the sense of "deliberately chosen and reviewable", not in the
    # sense of "derived". They are declared here rather than calculated in Go on
    # purpose: this repository has NO fleet risk model. risk/ and tools/riskctl
    # implement FAIR over component CVE baselines, which is a different subject
    # entirely, and nothing anywhere maps an agent's riskClass to an ALE. A
    # number invented inside the topology handler would be a fabricated risk
    # figure presented to a bank audience with no way to review or change it
    # short of a rebuild.
    #
    # Provenance: these are the figures the repo's own Fleet page fixture already
    # used (FleetDemoPage.test.tsx:61) — adopted rather than invented, so the
    # live demo and the test fixture tell the same story.
    #
    # They are demo values and should be replaced when a real fleet risk model
    # exists. Editing them here changes the demo with no code change and no
    # rebuild: fleet-manager reads this ConfigMap at /etc/fleet/fleet.yaml.
    aggregateRisk:
      ale: 847000
      var95: 1200000
      trend: up
      previousAle: 650000
    # `name` is the human label the topology graph draws on each node. It falls
    # back to `id` when omitted, so it is not load-bearing — but "Card Vault"
    # reads better on a projector than "agent-cardvault".
    agents:
      - id: agent-cardvault
        name: Card Vault
        type: data-vault
        team: platform
        trustProfile: high
        riskClass: high
        gracePeriod: 0h
        dependencies: []
        namespace: fe-signalloom-agents
      - id: agent-txn-pipeline
        name: Transaction Pipeline
        type: data-pipeline
        team: payments
        trustProfile: medium
        riskClass: medium
        gracePeriod: 72h
        dependencies: [agent-cardvault]
        namespace: fe-signalloom-agents
      - id: agent-llm-classifier
        name: LLM Classifier
        type: llm-inference
        team: ml-ops
        trustProfile: high
        riskClass: high
        gracePeriod: 0h
        dependencies: [agent-txn-pipeline]
        namespace: fe-signalloom-agents
      - id: agent-api-gateway
        name: API Gateway
        type: api-gateway
        team: platform
        trustProfile: medium
        riskClass: medium
        gracePeriod: 24h
        dependencies: [agent-cardvault]
        namespace: fe-signalloom-agents
      - id: agent-monitor
        name: Fleet Monitor
        type: observability
        team: sre
        trustProfile: low
        riskClass: low
        gracePeriod: 0h
        dependencies: [agent-cardvault, agent-txn-pipeline, agent-llm-classifier, agent-api-gateway]
        namespace: fe-signalloom-agents
      # Kusari pilot agent. The id must be agent-kusari-agent: fleet-manager
      # strips the agent- prefix and selects pods on
      # signalloom.ai/agent-name=kusari-agent, which is the live pod's label
      # (the pod itself is named agent-kusari-<rs-hash>-<suffix>, so the
      # by-name lookup misses and the selector fallback resolves it).
      - id: agent-kusari-agent
        name: Kusari Agent
        type: supply-chain
        team: kusari
        trustProfile: low
        riskClass: high
        gracePeriod: 0h
        dependencies: []
        namespace: fe-signalloom-agents
  # ── identity.<agent-name> — the agent identity map ──────────────────────
  #
  # The single source of truth binding a signalloom.ai/agent-name label value
  # to the ServiceAccount the real agent is registered to run as. A pod's
  # labels are written by whoever creates it -- including hosted-daytona-coder,
  # which holds pod-create RBAC in fe-signalloom-agents
  # (d2-signalloom/infra/agent-swarm/hosted-daytona-coder/rolebinding.yaml) --
  # so a label match alone can never prove a pod is the real agent-name it
  # claims to be. Every place that resolves "which agent is this pod" from a
  # label checks the match here first:
  #
  #   - fleet-manager: agent_resolution.go (resolveAgentID), k8sclient.go
  #     (resolvePod), both reading this same ConfigMap's mounted files
  #     (identity_map.go, LoadAgentIdentityMap).
  #   - the ValidatingAdmissionPolicy at
  #     d2-agent-trust/policies/agent-identity-binding.yaml, which admits this
  #     ConfigMap as its params object and rejects CREATE/UPDATE of a pod in
  #     fe-signalloom-agents whose signalloom.ai/agent-name label names a
  #     registered agent but whose spec.serviceAccountName differs.
  #
  # One key per registered agent. Values are read verbatim (ConfigMap volume
  # mount materialises each key as a file; trailing whitespace is trimmed by
  # both readers), so there is exactly one authored list -- extending the map
  # to a new agent is one line here, never a change to Go, Python or CEL.
  # Values cross-checked against the live manifests in
  # d2-signalloom/infra/agent-swarm/*/service-account.yaml and deployment.yaml.
  identity.cardvault: agent-cardvault
  identity.kusari-agent: kusari-agent
  identity.agent-nono-evidenced: agent-nono-evidenced
  identity.agent-standard-baseline: agent-standard-baseline
