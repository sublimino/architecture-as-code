# FLUX ENVSUBST: YES — registry settings AND spec.inputs below are substituted
# by the tenants Kustomization, exactly as in tenants/base/infra.yaml. Both are
# ordinary string scalars in the same rendered manifest.
#
# spec.inputs used to ship as `[]`, with scripts/agent-trust-local.sh patching
# concrete values in at bring-up. That could not work on a cold cluster, and
# `inputs: []` was never the inert state it was taken for.
#
# flux-operator renders spec.resources with `Option("missingkey=error")` and,
# in BuildResourceSet, an empty input list does not mean "render nothing" —
# it means "render ONCE against a nil map":
#
#     if len(combinedInputs) == 0 {
#         object, err := BuildResource(tmpl, nil)
#
# so every `<< inputs.tag >>` below became a terminal build failure:
#
#     build failed: ... executing "resourceset" at <inputs>:
#       map has no entry for key "tenant"
#
# routed through stallWithTerminalError — Stalled=True, no requeue, no retry.
# The empty-set-means-deploy-nothing behaviour this file was relying on is real
# but the controller gates it on `len(obj.Spec.InputsFrom) > 0`; with inputsFrom
# unset it never applied here.
#
# The imperative repair also could not have held: this ResourceSet is delivered
# by the flux-system/tenants Kustomization, so `kubectl patch` of spec.inputs is
# drift against a field Flux owns and the reconciler is entitled to revert it.
# agent-trust-local.sh's snapshot-and-restore dance existed only to survive that
# revert. Declaring the inputs here removes the race rather than timing it: the
# object is buildable the moment it is applied, and every later reconcile
# reinforces the state instead of destroying it.
#
# Ordering is left to spec.dependsOn below, which already expresses it.
#
# The dedicated agent-trust-flux identity is intentionally separate from
# inf-bao's Flux identity. Namespace creation cannot be constrained with
# resourceNames: Kubernetes RBAC does not apply resourceNames to create, so its
# ClusterRole permits namespace discovery/create globally because Kubernetes
# cannot resourceName-limit create. Mutation and deletion are restricted to the
# six names owned by this slice.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: agent-trust
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: signalloom-infra
      namespace: flux-system
      ready: true
      readyExpr: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: inf-bao
      ready: true
      readyExpr: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  # One input set: this slice provisions a single platform tenant and its five
  # subordinate namespaces, all named literally in spec.resources below.
  # Values match what scripts/agent-trust-local.sh used to patch in; on local
  # the tokens resolve from flux-runtime-info to latest/local/local.
  inputs:
    - tenant: "agent-trust-platform"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "${ARTIFACT_SUBJECT_WORKFLOW}"
      artifactSubjectGitRef: "${ARTIFACT_SUBJECT_GIT_REF}"
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata: {name: agent-trust-platform, labels: {agent-trust.signalloom.io/boundary: platform, agent-trust.signalloom.io/platform: signalloom}}
    - apiVersion: v1
      kind: Namespace
      metadata: {name: agent-trust-tenant-acme-control, labels: {agent-trust.signalloom.io/boundary: tenant-control, agent-trust.signalloom.io/tenant: acme}}
    - apiVersion: v1
      kind: Namespace
      metadata: {name: agent-trust-tenant-northstar-control, labels: {agent-trust.signalloom.io/boundary: tenant-control, agent-trust.signalloom.io/tenant: northstar}}
    - apiVersion: v1
      kind: Namespace
      metadata: {name: agent-trust-acme-payments, labels: {agent-trust.signalloom.io/boundary: project, agent-trust.signalloom.io/tenant: acme, agent-trust.signalloom.io/project: payments}}
    - apiVersion: v1
      kind: Namespace
      metadata: {name: agent-trust-acme-risk, labels: {agent-trust.signalloom.io/boundary: project, agent-trust.signalloom.io/tenant: acme, agent-trust.signalloom.io/project: risk}}
    - apiVersion: v1
      kind: Namespace
      metadata: {name: agent-trust-northstar-investigations, labels: {agent-trust.signalloom.io/boundary: project, agent-trust.signalloom.io/tenant: northstar, agent-trust.signalloom.io/project: investigations}}
    - apiVersion: v1
      kind: ServiceAccount
      metadata: {name: agent-trust-flux, namespace: agent-trust-platform}
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: agent-trust-flux-namespaces}
      rules:
        - apiGroups: [""]
          resources: [namespaces]
          verbs: [get, list, watch, create]
        - apiGroups: [""]
          resources: [namespaces]
          resourceNames:
            - agent-trust-platform
            - agent-trust-tenant-acme-control
            - agent-trust-tenant-northstar-control
            - agent-trust-acme-payments
            - agent-trust-acme-risk
            - agent-trust-northstar-investigations
          verbs: [get, update, patch, delete]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: agent-trust-flux-namespaces}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-flux-namespaces}
      subjects: [{kind: ServiceAccount, name: agent-trust-flux, namespace: agent-trust-platform}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: agent-trust-flux-workloads}
      rules:
        - apiGroups: [""]
          resources: [configmaps, pods, secrets, serviceaccounts, services]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [apps]
          resources: [deployments, replicasets]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [networking.k8s.io]
          resources: [networkpolicies]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [rbac.authorization.k8s.io]
          resources: [roles, rolebindings]
          verbs: [get, list, watch, create, update, patch, delete]
        - apiGroups: [batch]
          resources: [cronjobs]
          verbs: [get, list, watch, create, update, patch, delete]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: agent-trust-flux, namespace: agent-trust-platform}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-flux-workloads}
      subjects: [{kind: ServiceAccount, name: agent-trust-flux, namespace: agent-trust-platform}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: agent-trust-flux, namespace: agent-trust-tenant-acme-control}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-flux-workloads}
      subjects: [{kind: ServiceAccount, name: agent-trust-flux, namespace: agent-trust-platform}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: agent-trust-flux, namespace: agent-trust-tenant-northstar-control}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-flux-workloads}
      subjects: [{kind: ServiceAccount, name: agent-trust-flux, namespace: agent-trust-platform}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: agent-trust-flux, namespace: agent-trust-acme-payments}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-flux-workloads}
      subjects: [{kind: ServiceAccount, name: agent-trust-flux, namespace: agent-trust-platform}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: agent-trust-flux, namespace: agent-trust-acme-risk}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-flux-workloads}
      subjects: [{kind: ServiceAccount, name: agent-trust-flux, namespace: agent-trust-platform}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: agent-trust-flux, namespace: agent-trust-northstar-investigations}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-flux-workloads}
      subjects: [{kind: ServiceAccount, name: agent-trust-flux, namespace: agent-trust-platform}]
    # Topology readers are bootstrap-owned. Keeping each Role and its binding
    # ahead of the OCI Kustomization prevents first-reconcile RoleBinding
    # admission from racing the referenced Role's creation.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: agent-trust-topology-reader, namespace: agent-trust-platform}
      rules: [{apiGroups: [""], resources: [pods], verbs: [list]}, {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [list]}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: agent-trust-topology-reader, namespace: agent-trust-tenant-acme-control}
      rules: [{apiGroups: [""], resources: [pods], verbs: [list]}, {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [list]}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: agent-trust-topology-reader, namespace: agent-trust-tenant-northstar-control}
      rules: [{apiGroups: [""], resources: [pods], verbs: [list]}, {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [list]}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: agent-trust-topology-reader, namespace: agent-trust-acme-payments}
      rules: [{apiGroups: [""], resources: [pods], verbs: [list]}, {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [list]}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: agent-trust-topology-reader, namespace: agent-trust-acme-risk}
      rules: [{apiGroups: [""], resources: [pods], verbs: [list]}, {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [list]}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: agent-trust-topology-reader, namespace: agent-trust-northstar-investigations}
      rules: [{apiGroups: [""], resources: [pods], verbs: [list]}, {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [list]}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: fake-proxy-agent-trust-topology-reader, namespace: agent-trust-platform}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-trust-topology-reader}
      subjects: [{kind: ServiceAccount, name: default, namespace: inf-signalloom}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: fake-proxy-agent-trust-topology-reader, namespace: agent-trust-tenant-acme-control}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-trust-topology-reader}
      subjects: [{kind: ServiceAccount, name: default, namespace: inf-signalloom}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: fake-proxy-agent-trust-topology-reader, namespace: agent-trust-tenant-northstar-control}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-trust-topology-reader}
      subjects: [{kind: ServiceAccount, name: default, namespace: inf-signalloom}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: fake-proxy-agent-trust-topology-reader, namespace: agent-trust-acme-payments}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-trust-topology-reader}
      subjects: [{kind: ServiceAccount, name: default, namespace: inf-signalloom}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: fake-proxy-agent-trust-topology-reader, namespace: agent-trust-acme-risk}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-trust-topology-reader}
      subjects: [{kind: ServiceAccount, name: default, namespace: inf-signalloom}]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: fake-proxy-agent-trust-topology-reader, namespace: agent-trust-northstar-investigations}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-trust-topology-reader}
      subjects: [{kind: ServiceAccount, name: default, namespace: inf-signalloom}]
    # ResourceSet-owned because the workload Kustomization intentionally cannot
    # create cluster-scoped RBAC. fake-integration-proxy may read labels from
    # exactly these six namespaces and no others.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: agent-trust-topology-namespaces}
      rules:
        - apiGroups: [""]
          resources: [namespaces]
          resourceNames:
            - agent-trust-platform
            - agent-trust-tenant-acme-control
            - agent-trust-tenant-northstar-control
            - agent-trust-acme-payments
            - agent-trust-acme-risk
            - agent-trust-northstar-investigations
          verbs: [get]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: fake-proxy-agent-trust-topology-namespaces}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-trust-topology-namespaces}
      subjects: [{kind: ServiceAccount, name: default, namespace: inf-signalloom}]
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata: {name: agent-trust, namespace: agent-trust-platform}
      spec:
        interval: 5m
        serviceAccountName: agent-trust-flux
        url: "oci://${REGISTRY_BASE}/signalloom/agent-trust"
        insecure: ${REGISTRY_INSECURE}
        ref: {tag: << inputs.tag >>}
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/acme-co/osramp/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: {name: agent-trust, namespace: agent-trust-platform}
      spec:
        serviceAccountName: agent-trust-flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef: {kind: OCIRepository, name: agent-trust}
        path: ./
        prune: true
    # This is ResourceSet-owned so teardown removes it with Agent Trust. It is
    # additive to inf-bao's policy and selects only the OpenBao destination;
    # existing same-namespace rules are untouched.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-agent-trust-openbao
        namespace: inf-bao
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: openbao
        policyTypes: [Ingress]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    agent-trust.signalloom.io/tenant: acme
                    agent-trust.signalloom.io/project: payments
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: agent-trust-planner
            ports:
              - protocol: TCP
                port: 8200
          - from:
              - namespaceSelector:
                  matchLabels:
                    agent-trust.signalloom.io/tenant: acme
                    agent-trust.signalloom.io/project: payments
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: agent-trust-triage
            ports:
              - protocol: TCP
                port: 8200
