# In-tenant RBAC for supercred-demo-runner.
#
# ONLY the fe-signalloom-scoped Role lives here. Everything cross-namespace --
# the ClusterRole, its binding, and the Roles in kube-system, inf-signalloom,
# inf-bao and fe-signalloom-agents -- is inline in the signalloom-infra
# ResourceSet (d2-osramp-fleet/tenants/local/signalloom.yaml).
#
# That split is forced, not stylistic. The signalloom-apps Flux Kustomization
# sets `targetNamespace: << inputs.tenant >>`, which rewrites the namespace of
# EVERY namespaced object it renders. A Role declared here with
# `namespace: inf-bao` would be silently relocated into fe-signalloom: it
# would apply cleanly, Flux would report Ready, and the demo would then fail
# at runtime with Forbidden on every OpenBao exec. The same reasoning is
# already recorded on the agent-inventory Role in the ResourceSet ("Agent
# inventory belongs outside the apps Kustomization because that Kustomization
# deliberately targets only << inputs.tenant >>").
#
# The namespace is deliberately omitted below so targetNamespace supplies it.
#
# Verb derivation for these rules is identical to the fe-signalloom-agents
# Role in the ResourceSet -- see there for the line-by-line justification.
# Both namespaces are granted because agents-cardvault.yaml declares
# `namespace: fe-signalloom-agents` while targetNamespace can land the pod in
# fe-signalloom instead, so supercred-demo.sh sweeps both candidates (L28-30)
# and teardown deletes from every one of them (L346-350).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supercred-demo-runner-agents
  labels:
    app.kubernetes.io/name: supercred-demo-runner
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supercred-demo-runner-agents
  labels:
    app.kubernetes.io/name: supercred-demo-runner
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: supercred-demo-runner-agents
subjects:
  - kind: ServiceAccount
    name: supercred-demo-runner
