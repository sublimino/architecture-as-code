# netassert network policy tests for the Signal Loom delivery slice.
#
# Validates that the deployed NetworkPolicies enforce the expected connectivity:
# - Dashboard ↔ API backend (allowed)
# - Dashboard → Dex (allowed — OIDC proxy)
# - Gateway → Dashboard (allowed — ingress)
# - Gateway → API (allowed — /api route)
# - API → PostgreSQL (allowed — persistence)
# - API → Redis (allowed — cache)
# - Agents → API (denied — agents namespace is isolated)
# - Agents → Dashboard (denied)
# - Agents → PostgreSQL (denied — no direct DB access)
# - Dashboard → PostgreSQL (denied — only API touches DB)
#
# Precondition: the Signal Loom slice is deployed (make demo-signalloom-up).
# Run: netassert run --config d2-signalloom/test/netassert-signalloom.yaml

# ── ALLOWED paths ────────────────────────────────────────────────────────────

# Dashboard → API backend (nginx /api proxy)
- name: dashboard-to-api-allowed
  type: k8s
  protocol: tcp
  targetPort: 8000
  timeoutSeconds: 30
  attempts: 3
  exitCode: 0
  src:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: fe-signalloom
      namespace: fe-signalloom

# Dashboard → Dex (OIDC discovery/auth/token)
- name: dashboard-to-dex-allowed
  type: k8s
  protocol: tcp
  targetPort: 5556
  timeoutSeconds: 30
  attempts: 3
  exitCode: 0
  src:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: dex
      namespace: inf-signalloom

# API → PostgreSQL (persistence)
- name: api-to-postgresql-allowed
  type: k8s
  protocol: tcp
  targetPort: 5432
  timeoutSeconds: 30
  attempts: 3
  exitCode: 0
  src:
    k8sResource:
      kind: deployment
      name: fe-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: postgresql
      namespace: inf-signalloom

# API → Redis (cache)
- name: api-to-redis-allowed
  type: k8s
  protocol: tcp
  targetPort: 6379
  timeoutSeconds: 30
  attempts: 3
  exitCode: 0
  src:
    k8sResource:
      kind: deployment
      name: fe-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: redis
      namespace: inf-signalloom

# API → MinIO (report storage)
- name: api-to-minio-allowed
  type: k8s
  protocol: tcp
  targetPort: 9000
  timeoutSeconds: 30
  attempts: 3
  exitCode: 0
  src:
    k8sResource:
      kind: deployment
      name: fe-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: minio
      namespace: inf-signalloom

# ── DENIED paths (negative tests) ───────────────────────────────────────────

# Agent pods MUST NOT reach the API backend directly
- name: agents-to-api-denied
  type: k8s
  protocol: tcp
  targetPort: 8000
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: pod
      name: agent-patsy
      namespace: fe-signalloom-agents
  dst:
    k8sResource:
      kind: deployment
      name: fe-signalloom
      namespace: fe-signalloom

# Agent pods MUST NOT reach the dashboard
- name: agents-to-dashboard-denied
  type: k8s
  protocol: tcp
  targetPort: 8080
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: pod
      name: agent-patsy
      namespace: fe-signalloom-agents
  dst:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom

# Agent pods MUST NOT reach PostgreSQL directly
- name: agents-to-postgresql-denied
  type: k8s
  protocol: tcp
  targetPort: 5432
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: pod
      name: agent-patsy
      namespace: fe-signalloom-agents
  dst:
    k8sResource:
      kind: deployment
      name: postgresql
      namespace: inf-signalloom

# Dashboard MUST NOT reach PostgreSQL directly (only via API)
- name: dashboard-to-postgresql-denied
  type: k8s
  protocol: tcp
  targetPort: 5432
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: postgresql
      namespace: inf-signalloom

# Dashboard MUST NOT reach Redis directly
- name: dashboard-to-redis-denied
  type: k8s
  protocol: tcp
  targetPort: 6379
  timeoutSeconds: 15
  attempts: 2
  exitCode: 1
  src:
    k8sResource:
      kind: deployment
      name: dashboard-signalloom
      namespace: fe-signalloom
  dst:
    k8sResource:
      kind: deployment
      name: redis
      namespace: inf-signalloom
