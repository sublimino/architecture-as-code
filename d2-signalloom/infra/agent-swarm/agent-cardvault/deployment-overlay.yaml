---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-cardvault
  namespace: fe-signalloom-agents
  labels:
    app.kubernetes.io/name: agent-cardvault
    app.kubernetes.io/component: agent
    signalloom.ai/agent: "true"
    signalloom.ai/role: "vault"
    signalloom.ai/harness: "go-vault"
    signalloom.ai/model: "deterministic"
    signalloom.ai/framework: "custom"
    signalloom.ai/tenant: "controlplane"
    signalloom.ai/project: "osramp"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-cardvault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-cardvault
        bao.controlplane.io/consumer: cardvault-agent
        signalloom.ai/agent: "true"
        # fleet-manager resolves fleet id agent-cardvault to this pod by
        # signalloom.ai/agent-name=cardvault (the id minus "agent-"; the pod
        # is named agent-cardvault-<rs>-<suffix>, so by-name misses). Without
        # it every stun of this pod answered 500 and the sentinel's freeze
        # went unrecorded (live, 2026-10-03). Pinned by
        # d2-signalloom/test/fleet-agent-resolution.bats.
        signalloom.ai/agent-name: cardvault
        signalloom.ai/role: "vault"
        signalloom.ai/harness: "go-vault"
        signalloom.ai/model: "deterministic"
        signalloom.ai/framework: "custom"
        signalloom.ai/tenant: "controlplane"
        signalloom.ai/project: "osramp"

    spec:
      serviceAccountName: agent-cardvault
      containers:
        - name: cardvault-agent
          # The tag `make demo-signalloom-supercred-images` builds and
          # kind-loads (scripts/supercred-images.sh DEMO_IMAGES). It was
          # :latest, which nothing builds, so a rebuild never reached this
          # pod (live, 2026-10-03). Pinned by
          # d2-signalloom/test/supercred-image-tags.bats. Same tag, so a
          # rebuild needs a rollout restart to be picked up.
          image: cardvault-agent:local
          imagePullPolicy: Never
          args:
            - --mode=run
            - --bao-addr=http://openbao.inf-bao.svc.cluster.local:8200
            - --bao-role=signalloom-cardvault-agent
            - --claim-url=
            - --interval=60s
          env:
            - name: BAO_ADDR
              value: "http://openbao.inf-bao.svc.cluster.local:8200"
            - name: BAO_ROLE
              value: "signalloom-cardvault-agent"
            - name: CLAIM_URL
              value: ""
            - name: INTERVAL
              value: "60s"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
        - name: openbao-agent
          image: openbao/openbao:2.1.0
          # bao directly, not the image's docker-entrypoint.sh: that script's
          # `id -u openbao` reads /etc/passwd inside this watched agent pod,
          # and the signalloom warden froze every fresh pod on it (live,
          # 2026-10-03). It runs as uid 100, so the script's chown/su-exec
          # branch has nothing to do here anyway. HOME keeps bao's home
          # lookup off the user database. Pinned by
          # d2-signalloom/test/agent-cardvault-sidecar-entrypoint.bats.
          command: ["bao", "agent", "-config=/etc/openbao/agent.hcl"]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spiffe-workload-api
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: openbao-agent-config
          configMap:
            name: agent-cardvault-openbao-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

