---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-k8s-reader-role
  labels:
    app.kubernetes.io/name: kagent-k8s-reader
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["pods", "services", "deployments", "namespaces", "nodes", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-k8s-reader-binding
  labels:
    app.kubernetes.io/name: kagent-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-k8s-reader-role
subjects:
  - kind: ServiceAccount
    name: kagent-k8s-reader
    namespace: fe-signalloom-agents
