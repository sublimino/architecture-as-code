#
# infra/kind/probe.yaml : in-pod network probe for the SLDC dual-cluster topology
#
# Applied to both clusters by scripts/dual-cluster-up.sh. The SLDC-P2-1
# required tests exec into `deploy/probe` in `default`. DNS and ICMP must be
# tested from INSIDE a pod: a host-side nslookup goes through the host
# resolver, never touches either CoreDNS, and gives a false green.
# busybox:1.36.1 is already present in the node image store, and it provides
# ping, nslookup, nc and wget.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: default
  labels:
    app.kubernetes.io/name: probe
    app.kubernetes.io/part-of: sldc-dual-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe
        app.kubernetes.io/part-of: sldc-dual-cluster
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      containers:
        - name: probe
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 3600 & wait $!; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"] # ICMP echo for the ping assertions
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
---
# kind-osramp's `default` namespace carries a `default-deny` NetworkPolicy
# (Ingress+Egress, empty podSelector), so without this the probe cannot even
# reach its own CoreDNS and every DNS assertion times out. Scope: the probe
# only, and only DNS to kube-dns plus anything on the bridge. An L3 ipBlock
# rule with no ports also admits ICMP under Cilium. It is inert on the hub,
# which has no default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sldc-probe-egress
  namespace: default
  labels:
    app.kubernetes.io/part-of: sldc-dual-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: probe
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 172.19.0.0/16
