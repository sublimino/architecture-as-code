apiVersion: v1
kind: Secret
metadata:
  name: dex-local-auth
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
type: Opaque
stringData:
  config.yaml: |
    issuer: https://dashboard.osramp.acme.local:30754/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    enablePasswordDB: true
    staticClients:
      - id: signalloom-dashboard
        name: Signalloom Dashboard Local
        public: true
        redirectURIs:
          - http://localhost:5173/callback
          - https://dashboard.osramp.acme.local:18443/callback
          - https://dashboard.osramp.acme.local:30754/callback
      - id: signalloom-api
        name: Signalloom Compatibility API Local
        secret: signalloom-api-local-only
        trustedPeers:
          - signalloom-dashboard
    staticPasswords:
      - email: demo-user@signalloom.local
        # bcrypt("demo-user") — local-demo credential only (see docs/signalloom).
        hash: $2b$10$NZGZWtWZgbrmmuDU5Bf.N.38ar7tskOwJ176v1qo5p3UWw1dlIE4C
        username: demo-user
        userID: demo-user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: signalloom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: signalloom-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
          livenessProbe:
            httpGet:
              # Dex serves endpoints under the issuer path (/dex); the bare
              # /healthz 404s once the issuer has a path, so probe a served path.
              path: /dex/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsGroup: 1001
      volumes:
        - name: config
          secret:
            secretName: dex-local-auth
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
