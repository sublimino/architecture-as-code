# Dedicated ServiceAccount for fleet-manager.
# The Deployment sets automountServiceAccountToken: true because the fleet-manager
# needs K8s API access to read/patch pod labels. RBAC is scoped to the minimum
# needed: get/list/patch pods in the agent namespace only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-manager
  namespace: fe-signalloom
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: supercred-demo
    app.kubernetes.io/part-of: signalloom

# ── Where the fe-signalloom-agents Role and RoleBinding went ─────────────────
#
# They used to be here. They now live at the END of the signalloom-infra
# ResourceSet in d2-osramp-fleet/tenants/local/signalloom.yaml, and moving them
# was a precondition of putting this directory under Flux at all. Two
# independent reasons, either one sufficient:
#
#   1. The signalloom-apps Kustomization that reconciles this directory sets
#      `targetNamespace: fe-signalloom`, which OVERRIDES the namespace a
#      manifest declares. A Role written for fe-signalloom-agents would be
#      applied to fe-signalloom instead — cleanly, with Flux reporting Ready,
#      while fleet-manager held no grant in the namespace the agents actually
#      run in. The same relocation already bit agents-cardvault.yaml and
#      supercred-demo-runner's cross-namespace Roles.
#
#   2. signalloom-apps reconciles as the namespace-scoped `flux` ServiceAccount,
#      which holds ClusterRole/admin but NOT `escalate` on roles. Creating a
#      RoleBinding makes the API server resolve its roleRef to run the
#      privilege-escalation check, and kustomize-controller server-dry-runs the
#      ENTIRE object set before applying any of it — so the roleRef lookup fails
#      against a Role that was never persisted and the whole set aborts. That
#      deadlock previously left fe-signalloom empty for six reconciles.
#
# The ResourceSet is applied by the cluster-admin flux-system ServiceAccount, so
# it binds with no escalation check and in any order. This ServiceAccount stays
# here: it is namespace-correct under targetNamespace and the Deployment needs
# it in the same namespace it runs in.
